        "422": { $ref: "#/components/responses/ValidationError" }

  /profiles/{id}/apply:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Profiles]
      summary: "Áp hồ sơ APPROVED cho các nhà (EXPERT-FR-015) — FARM_OWNER"
      description: |
        Mỗi zone của các nhà nhận các nhóm của hồ sơ, lịch sử ghi nguồn `PROFILE` (ngưỡng, hệ số mờ, tham số phát
        hiện); lịch loa chép vào mọi controller của zone; rồi mỗi zone một phiên bản cấu hình mới (ENV-FR-027), nên
        controller hiện `PENDING` tới khi heartbeat báo đã áp. Áp hệ số mờ thì đề xuất hệ số đang chờ của zone thành
        `SUPERSEDED`; mục duyệt đang chờ của Farm Owner trên ngưỡng hoặc hệ số mờ của zone chuyển `ADJUSTED` (EXPERT-FR-010).
        Hồ sơ DRAFT hoặc ARCHIVED → 409; nhà ngoài farm của hồ sơ → 400; Domain Expert, Farm
        Technician → 403. Audit `CONFIG_PROFILE_APPLIED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [house_ids]
              properties:
                house_ids: { type: array, minItems: 1, items: { type: string } }
      responses:
        "200":
          description: Phiên bản cấu hình mới của từng zone
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          profile_id: { type: string }
                          zones:
                            type: array
                            items:
                              type: object
                              properties:
                                zone_id: { type: string }
                                house_id: { type: string }
                                name: { type: string }
                                config_version: { type: integer }
        "400": { description: "Có nhà không thuộc farm của hồ sơ", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Hồ sơ không ở APPROVED", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /recommendations/rules:
    get:
      tags: [Recommendations]
      summary: "Luật khuyến nghị của farm (EXPERT-FR-016) — FARM_OWNER, DOMAIN_EXPERT của farm"
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Mới sửa trước
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/RecommendationRule" } }
                      meta: { $ref: "#/components/schemas/PageMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Recommendations]
      summary: "Viết luật khuyến nghị (EXPERT-FR-016) — DOMAIN_EXPERT, FARM_OWNER (farm có chuyên gia thì luật của Farm Owner chờ chuyên gia bật, BR-22)"
      description: |
        Luật thoả ở một nhà khi mỗi ngày trong `window_days` ngày gần nhất (1–30) đều có giá trị của `indicator` và
        đạt `comparison` (`GTE`: ≥ `value`, `LTE`: ≤ `value`); thiếu số của một ngày thì không thoả. `source` ghi luật lấy từ
        đâu (không tự viết luật). Chỉ số không hỗ trợ, cửa sổ hay `value` ngoài khoảng, hành động không hợp lệ → 400.
        Farm Technician → 403. Thiếu `source` → 422. Audit `RECOMMENDATION_RULE_CREATED`. Farm Owner trên farm có chuyên gia:
        luật lưu `active: false`, `pending_approval: true` và báo chuyên gia (`ref.kind = recommendation_rule`); farm chưa có
        chuyên gia thì luật của Farm Owner chạy như của chuyên gia.
        Sau khi khuyến nghị trước của luật và nhà đó được quyết định hoặc hết hạn, khuyến nghị mới chỉ mở khi mọi ngày
        của cửa sổ đều sau ngày đó (BR-42). Nhà đang dẫn dụ không có tỷ lệ chim về (BR-46); ngày chưa đánh giá không có
        số cảnh báo phun. Luật được chép vào khuyến nghị lúc mở (`rule_snapshot`), nên sửa luật sau đó không đổi khuyến
        nghị đã mở.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [farm_id]
                  properties: { farm_id: { type: string } }
                - $ref: "#/components/schemas/RecommendationRuleInput"
      responses:
        "201":
          description: Luật đã lưu, đang bật
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/RecommendationRule" }
        "400": { description: "Chỉ số hoặc so sánh không hỗ trợ, value hay cửa sổ ngoài khoảng, Work Order thiếu tiêu đề hoặc quá 200 ký tự, khoá hay giá trị tham số sai. Thiếu trường hoặc sai kiểu (source rỗng, action không phải object, action.type lạ, window_days không nguyên) là 422 của validator", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /recommendations/rules/effects:
    get:
      tags: [Recommendations]
      summary: "Hiệu quả theo luật (EXPERT-FR-019) — FARM_OWNER, DOMAIN_EXPERT của farm"
      description: "Mỗi luật: số khuyến nghị đã mở, đã chấp nhận (gồm đã đo), đã đo hiệu quả, đã cải thiện."
      parameters:
