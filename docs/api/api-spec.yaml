                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Ticket" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/status:
    put:
      tags: [Tickets]
      summary: "Technician cập nhật trạng thái ticket (TICKET-FR-007) — TECHNICIAN/ADMIN"
      description: |
        Chỉ cho chuyển đúng thứ tự: `NEW → IN_PROGRESS → AWAITING_FIELD_CONFIRMATION
        → CLOSED` (không nhảy cóc/lùi tuỳ tiện). Không cho chuyển `CLOSED` nếu
        `sat_checklist` chưa đạt đủ các mục bắt buộc khi ticket có buổi đến hiện trường:
        `INSTALLATION`/`MAINTENANCE`, hoặc ticket sự cố đã có `scheduled_visit_at`
        (TICKET-FR-010, Flow 9 bước 6b). Mục bắt buộc: Modbus, kết nối mạng, relay;
        `camera_rtsp_ok` chỉ bắt buộc khi Zone của ticket (hoặc cả farm, nếu ticket cấp
        farm) có Camera Node đang hoạt động. Ticket sự cố xử lý từ xa (không có lịch hẹn)
        đóng thẳng.

        Chỉ Technician **đang được gán** (hoặc Admin) mới đổi được — Technician
        khác cùng vùng xem được ticket nhưng nhận 403. Lần đầu chuyển
        `IN_PROGRESS` ghi `responded_at` (mốc SLA phản hồi, TICKET-FR-004b).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [status],
                properties:
                  {
                    status: { $ref: "#/components/schemas/TicketStatus" },
                    note: { type: string },
                  },
              }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Ticket" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          {
            description: "Chuyển trạng thái không hợp lệ",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          {
            description: "Checklist nghiệm thu (SAT) chưa đạt đủ 4 mục",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /tickets/{id}/cancel:
    put:
      tags: [Tickets]
      summary: "Farm Owner tự huỷ ticket của mình (Flow 9 case 6c / Flow 9b case 4a) — FARM_OWNER/ADMIN"
      description: "Khác /status ở chỗ không đòi SAT checklist — dùng khi Farm Owner đã tự khắc phục hoặc đổi ý không cần lắp nữa. Technician đang được gán nhận thông báo (kèm \"không cần đến hiện trường lúc …\" nếu còn lịch hẹn sắp tới)."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [reason],
                properties: { reason: { type: string } },
              }
      responses:
        "200":
          {
            description: "Đã huỷ (status=CLOSED)",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Ticket" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          {
            description: Ticket đã đóng,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /tickets/{id}/notes:
    post:
      tags: [Tickets]
      summary: Thêm ghi chú xử lý
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [content],
                properties: { content: { type: string } },
              }
      responses:
        "201":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Ticket" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/sat-checklist:
    put:
      tags: [Tickets]
      summary: "Cập nhật checklist nghiệm thu tại hiện trường (TICKET-FR-010) — TECHNICIAN được gán/ADMIN"
      description: "Chỉ cho ticket `INSTALLATION`/`MAINTENANCE` hoặc ticket sự cố đã hẹn đến hiện trường (có `scheduled_visit_at`); ticket khác → 400. Ticket đã đóng → 409."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                modbus_addresses_ok:
                  {
                    type: boolean,
                    description: "5 địa chỉ Modbus phản hồi đúng",
                  }
                camera_rtsp_ok: { type: boolean }
                lte_connection_ok: { type: boolean }
                relay_test_ok: { type: boolean }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Ticket" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/escalate:
    post:
      tags: [Tickets]
      summary: "Escalate thủ công lên Admin (TICKET-FR-009) — TECHNICIAN được gán/ADMIN"
      description: |
        Ghi `escalated_at`/`escalation_reason`, audit `TICKET_ESCALATED` và thông báo
        mọi Admin. **Không** bật `is_sla_breached` — escalate là xin hỗ trợ, cờ vượt
        hạn chỉ do job SLA đặt khi thật sự quá `sla_resolve_due_at`. Ticket đã đóng → 409.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { reason: { type: string } } }
      responses:
        "200":
          {
            description: "Đã escalate (escalated_at được ghi)",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Ticket" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets/{id}/scheduled-date:
    put:
      tags: [Tickets]
      summary: "Technician hẹn/dời giờ đến hiện trường kèm lý do (TICKET-FR-004b, Flow 9 bước 6b) — TECHNICIAN được gán/ADMIN"
      description: |
        - `INSTALLATION`/`MAINTENANCE`: dời lịch có sẵn (Farm Owner chọn lúc tạo / sinh từ lịch bảo trì).
        - Ticket sự cố/`OTHER`: chỉ hẹn được khi ticket đã tiếp nhận (`IN_PROGRESS` hoặc
          `AWAITING_FIELD_CONFIRMATION`) — Technician chẩn đoán từ xa trước (TICKET-FR-008),
          cần xuống hiện trường thì mới hẹn. Từ lúc có lịch hẹn, đóng ticket phải đủ SAT;
          xử lý được từ xa thì huỷ lịch bằng `DELETE` trên chính endpoint này.
        - Giờ hẹn trong khung 7:00–18:00 giờ Việt Nam (Asia/Ho_Chi_Minh), ở tương lai; ticket đã đóng → 409.
        Ghi note ("Hẹn đến hiện trường…" / "Dời lịch hẹn…") + audit `TICKET_VISIT_SCHEDULED`
        (lần đầu) / `TICKET_RESCHEDULED` (dời); Farm Owner và người tạo ticket nhận thông báo.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_visit_at, reason]
              properties:
                scheduled_visit_at: { type: string, format: date-time }
                reason: { type: string, example: "Trùng lịch lắp đặt farm khác" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Ticket" } }
        "400": { description: "Giờ hẹn không ở tương lai hoặc ngoài khung 7:00–18:00", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: "Không phải Technician đang được gán", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "409": { description: "Ticket đã đóng, hoặc ticket sự cố chưa được tiếp nhận (chưa IN_PROGRESS)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Tickets]
      summary: "Huỷ buổi đến hiện trường khi xử lý được từ xa (Flow 9 bước 6a) — TECHNICIAN được gán/ADMIN"
      description: |
        Xoá `scheduled_visit_at` nên ticket không còn bị đòi checklist nghiệm thu khi đóng.
        Chỉ áp dụng cho ticket **sự cố**: `INSTALLATION`/`MAINTENANCE` bắt buộc có buổi đến
        hiện trường nên chỉ dời được lịch (dùng `PUT`). Ghi note + audit `TICKET_VISIT_CANCELLED`,
        Farm Owner và người tạo ticket được thông báo.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, example: "Reset từ xa là hết lỗi, không cần xuống farm" } }
      responses:
        "200":
          description: Đã huỷ lịch hẹn
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Ticket" } }
        "400": { description: "Ticket lắp đặt/bảo trì — chỉ dời lịch, không huỷ", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Ticket đã đóng hoặc chưa hẹn đến hiện trường", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tickets/{id}/reassign-request:
    post:
      tags: [Tickets]
      summary: "Technician xin gán lại ticket kèm lý do (Flow 9 case 4a) — TECHNICIAN được gán"
      description: |
        Lịch hẹn của người cũ bị huỷ theo (Farm Owner được báo) — Technician mới tự hẹn lại.
        Ticket Router chọn Technician khác trong vùng (loại người xin và mọi người
        đã từng bị chuyển khỏi ticket này, bỏ qua người quá tải). Có người → ticket về `NEW` cho người mới xác nhận lại
        (hạn phản hồi tính lại từ lúc giao cho người mới, hạn xử lý giữ nguyên); không còn
        ai → `assigned_to` để trống (hàng đợi chung, `GET /tickets?unassigned=true`)
        và Admin được thông báo. Thread chat nhận tin hệ thống (TICKET-FR-017).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, example: "Farm ghi sai khu vực, thực tế ở Long An" } }
      responses:
        "200":
          description: "Ticket sau khi gán lại (assigned_to đã populate hoặc null)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Ticket" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tickets/{id}/messages:
    get:
      tags: [Tickets]
      summary: "Lịch sử chat của ticket (TICKET-FR-015) — FARM_OWNER/TECHNICIAN/ADMIN"
      description: |
        Trang 1 là tin mới nhất; trong mỗi trang tin xếp cũ → mới. Được đọc: Admin,
        Farm Owner/thành viên của farm, Technician đang phụ trách. Technician TỪNG
        phụ trách chỉ đọc được lịch sử tới tin hệ thống báo bàn giao và không
        `JOIN_TICKET_CHAT` được nữa (TICKET-FR-017). Technician khác cùng vùng
        không đọc được (Flow 23 case 6a).

        Realtime qua Socket.io: emit `JOIN_TICKET_CHAT { ticketId }` (ack
        `{ ok }`), `SEND_TICKET_MESSAGE { ticketId, content, clientMessageId }`
        (ack `{ ok, data: TicketMessage }`); server phát `TICKET_MESSAGE_NEW` và
        `TICKET_CHAT_ASSIGNEE_CHANGED` tới room `ticket:{ticketId}`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 } }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: "Cursor cuộn ngược: `created_at` của tin cũ nhất đang hiển thị. Dùng thay `page` để tin mới chen vào giữa 2 lần tải không làm lặp tin" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/TicketMessage" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tickets]
      summary: "Gửi tin nhắn (TICKET-FR-014/016) — dự phòng khi client không giữ WebSocket — FARM_OWNER/TECHNICIAN/ADMIN"
      description: |
        Chỉ gửi khi ticket chưa đóng (đã đóng → 409, kênh chỉ đọc). Technician chỉ
        gửi được khi đang là `assigned_to` (kiểm lại mỗi lần gửi). Gửi lại cùng
        `client_message_id` trả về tin đã lưu, không tạo trùng.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 2000 }
                client_message_id: { type: string, maxLength: 100 }
      responses:
        "201":
          description: Đã gửi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/TicketMessage" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Ticket đã đóng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /tickets/{id}/rating:
    post:
      tags: [Tickets]
      summary: "Farm Owner đánh giá mức hài lòng sau khi đóng ticket (TICKET-FR-011) — FARM_OWNER/ADMIN"
      description: |
        Ticket **đã huỷ** không đánh giá được (409) — không có việc nào được thực hiện để chấm điểm.
        Mỗi ticket chỉ chấm **một lần**; muốn sửa điểm phải qua Admin (để còn ghi audit).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [satisfaction_rating],
                properties:
                  {
                    satisfaction_rating:
                      { type: integer, minimum: 1, maximum: 5 },
                  },
              }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Ticket" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403":
          {
            description: "Chỉ người tạo ticket mới được đánh giá",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "409":
          {
            description: "Chỉ đánh giá được ticket đã đóng",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /tickets/{id}/admin-override:
    put:
      tags: [Tickets, Admin]
      summary: "Admin toàn quyền can thiệp ticket bất kỳ (TICKET-FR-005b) — chỉ ADMIN"
      description: |
        Không giới hạn ở SLA breach hay ticket của farm mình — Admin đổi được
        `assigned_to`/`priority`/`scheduled_visit_at`/`status` bất kỳ lúc nào,
        bỏ qua `ALLOWED_TRANSITIONS` thường áp dụng cho `PUT /tickets/:id/status`
        và không đòi SAT checklist khi đóng ticket lắp đặt. `reason` luôn được
        ghi vào `notes` của ticket.
        - `assigned_to` phải là Technician đang hoạt động **và phụ trách khu vực
          (`assigned_regions`) của farm** — người ngoài vùng sẽ bị chặn 403 khi mở
          chính ticket đó nên ticket thành mồ côi. Gửi `force: true` để vẫn gán;
          quyết định này được ghi `forcedOutOfRegion` vào audit log. `force` chỉ có
          tác dụng khi là boolean `true` (chuỗi `"true"`/`"1"` được ép về `true`,
          `"false"`/`"0"` về `false`).
        - Đổi `assigned_to` gửi thông báo cho **cả** Technician mới (nhận việc) lẫn người cũ
          (biết ticket đã chuyển đi); audit ghi `notifiedAssignee`.
        - Đổi `assigned_to` sang người khác mà **không** truyền `status` thì ticket
          quay về `NEW` để người mới xác nhận tiếp nhận; riêng ticket đang `CLOSED`
          bị chặn 409 — muốn mở lại phải nói rõ `status`, tránh ticket vừa `NEW`
          vừa còn `closed_at` và bị job SLA báo vi phạm. `assigned_at` chỉ đổi khi
          thật sự đổi người.
        - Khi thật sự đổi người: mốc tiếp nhận của người cũ bị bỏ — hạn phản hồi
          (`sla_response_due_at`) tính lại từ lúc giao cho người mới (hạn xử lý giữ
          nguyên); nếu Admin truyền luôn `status` đã tiếp nhận thì `responded_at` là lúc
          gán. Lịch hẹn của ticket sự cố (không phải `INSTALLATION`/`MAINTENANCE`) là cam
          kết của người cũ nên bị bỏ, trừ khi gửi kèm `scheduled_visit_at`; Farm Owner
          được báo nếu buổi hẹn đó còn ở tương lai.
        - Đổi `priority` thì tính lại `sla_response_due_at`/`sla_resolve_due_at`
          theo SLA của priority mới, mốc là `created_at` của ticket.
        - Mở lại ticket đã `CLOSED` thì gỡ `closed_at`.
        - `scheduled_visit_at` đặt được cho mọi loại ticket nhưng vẫn phải trong khung 7:00–18:00 giờ Việt Nam (Asia/Ho_Chi_Minh), ở tương lai;
          đổi giờ thì Farm Owner, người tạo và Technician đang giữ ticket nhận thông báo.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                assigned_to: { type: string, description: "Đổi Technician phụ trách" }
                priority: { type: string, enum: [P1, P2, P3] }
                scheduled_visit_at: { type: string, format: date-time, description: "trong khung 7:00–18:00 giờ Việt Nam (Asia/Ho_Chi_Minh), ở tương lai" }
                status: { $ref: "#/components/schemas/TicketStatus" }
                reason: { type: string, description: "Lý do can thiệp, ghi vào notes + audit_logs" }
                force: { type: boolean, default: false, description: "true = vẫn gán Technician ngoài khu vực phụ trách của farm" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Ticket" } }
        "400":
          description: "assigned_to không phải Technician đang hoạt động, hoặc không phụ trách khu vực của farm mà chưa gửi force: true; scheduled_visit_at không ở tương lai hoặc ngoài 7:00–18:00"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Header: `Authorization: Bearer <accessToken>` — accessToken lấy từ /auth/login, /auth/refresh, hoặc /auth/otp/verify"

  parameters:
    FarmId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string },
        description: Farm ObjectId,
      }
    HouseId:
      {
        name: houseId,
        in: path,
        required: true,
        schema: { type: string },
        description: House ObjectId,
      }
    ZoneId:
      {
        name: zoneId,
        in: path,
        required: true,
        schema: { type: string },
        description: Zone ObjectId,
      }
    ZoneIdPath:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string },
        description: Zone ObjectId,
      }
    NodeId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string },
        description: SensorNode ObjectId,
      }
    TrackId:
      { name: trackId, in: path, required: true, schema: { type: string }, description: AudioTrack ObjectId }
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    Page: { name: page, in: query, schema: { type: integer, default: 1 } }
    Limit:
      {
        name: limit,
        in: query,
        description: "Số bản ghi mỗi trang — mặc định 20, tối đa 100 (giá trị lớn hơn được kẹp về 100). Giá trị không phải số nguyên ≥ 1: các endpoint /admin/* trả 422, các danh sách khác dùng mặc định",
        schema: { type: integer, minimum: 1, default: 20, maximum: 100 },
      }
    TelemetryLimit:
      {
        name: limit,
        in: query,
        description: "Riêng lịch sử telemetry — mặc định 100, tối đa 1000",
        schema: { type: integer, minimum: 1, default: 100, maximum: 1000 },
      }

  responses:
    NotFound:
      description: Không tìm thấy
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    Forbidden:
      description: Không có quyền
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    Unauthorized:
      description: Chưa xác thực / token không hợp lệ
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    Conflict:
      description: Trùng lặp dữ liệu
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }

  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
        meta:
          type: object
          properties:
            {
              page: { type: integer },
              limit: { type: integer },
              total: { type: integer },
            }

    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string, example: "Không tìm thấy farm" }

    Role:
      type: string
      enum: [ADMIN, FARM_OWNER, DOMAIN_EXPERT, TECHNICIAN]
      description: "AUTH-FR-004 (v2.0.0). DOMAIN_EXPERT = chuyên gia nuôi yến do Primary Owner mời, phạm vi cả farm: chỉ đọc dữ liệu vận hành, kiểm chứng cảnh báo suy luận, chỉnh ngưỡng/hệ số/tham số phát hiện; không relay, ticket hay ghi thu hoạch (SRS mục 4.4)"

    SlaConfig:
      type: object
      description: "TICKET-FR-006, SLA-NFR-001 — SLA theo mức ưu tiên, lưu ở system_settings.sla_hours"
      properties:
        P1: { $ref: "#/components/schemas/SlaLevel" }
        P2: { $ref: "#/components/schemas/SlaLevel" }
        P3: { $ref: "#/components/schemas/SlaLevel" }

    SlaLevel:
      type: object
      properties:
        response_hours: { type: number, example: 0.5 }
        resolve_hours: { type: number, example: 4 }

    DeviceStatusSummary:
      type: object
      description: "Đếm SensorNode + CameraNode theo trạng thái (OPS-NFR-004, SYSTEM-FR-003)"
      properties:
        total: { type: integer }
        online: { type: integer }
        offline: { type: integer }
        pending: { type: integer }
        error: { type: integer }
        degraded: { type: integer }

    AuditLog:
      type: object
      description: "AUTH-FR-007 — collection audit_logs (SRS §8.2)"
      properties:
        _id: { type: string }
        actor_id:
          nullable: true
          description: "Populate { _id, full_name, email, role }; null nếu hệ thống tự thực hiện hoặc đăng nhập bằng email không tồn tại"
          type: object
          properties:
            _id: { type: string }
            full_name: { type: string }
            email: { type: string }
            role: { $ref: "#/components/schemas/Role" }
        action: { type: string, example: ACCOUNT_LOCKED }
        target_type: { type: string, example: user }
        target_id: { type: string, nullable: true }
        metadata: { type: object, description: "Chi tiết thay đổi, thường có before/after" }
        ip_address: { type: string, nullable: true, description: "IP client của request; null khi hệ thống tự thực hiện ngoài request (job nền, MQTT). Đặt TRUST_PROXY khi chạy sau proxy để có IP thật" }
        created_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        _id: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        assigned_regions:
          {
            type: array,
            items: { type: string },
            description: "chỉ dùng khi role=TECHNICIAN",
          }
        avatar_url: { type: string }
        is_active: { type: boolean }
        deactivated_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: "AUTH-FR-011 — thời điểm Admin khoá tài khoản",
          }
        deactivated_reason:
          {
            type: string,
            nullable: true,
            description: "AUTH-FR-011 — lý do bắt buộc khi khoá tài khoản, ghi cùng audit_logs",
          }
        telegram_linked: { type: boolean, description: "ALERT-FR-013 — tài khoản đã liên kết bot Telegram (chat id không trả ra API)" }
        notification_preferences:
          type: object
          properties:
            push: { type: boolean }
            telegram: { type: boolean }
            zalo: { type: boolean }
            sms: { type: boolean }
            quiet_hours:
              {
                type: object,
                properties: { start: { type: string }, end: { type: string } },
              }
        deletion_requested_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: "AUTH-FR-012 — đã yêu cầu xoá tài khoản, chờ Administrator xử lý",
          }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Farm:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        address: { type: string }
        region:
          {
            type: string,
            example: HCMC,
            description: "Khu vực địa lý — khớp users.assigned_regions để xác định Technician phụ trách (AUTH-FR-005c)",
          }
        coordinates:
          {
            type: object,
            properties: { lat: { type: number }, lng: { type: number } },
          }
        owner_id: { type: string, description: Primary Owner }
        owner:
          type: object
          description: "Chỉ có ở GET /farms/:id — tên/email Primary Owner (tra thêm từ users, không đổi owner_id)"
          properties: { full_name: { type: string }, email: { type: string, format: email } }
        members:
          type: array
          description: "GET /farms/:id với DOMAIN_EXPERT chỉ trả bản ghi của chính người đó (không lộ email thành viên khác)"
          items:
            type: object
            properties:
              user_id: { type: string }
              is_primary: { type: boolean }
              role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT], description: "FARM_OWNER = đồng sở hữu; DOMAIN_EXPERT = chuyên gia nuôi yến, cả farm (v2.0.0)" }
              joined_at: { type: string, format: date-time }
              full_name: { type: string, description: "Chỉ có ở GET /farms/:id" }
              email: { type: string, format: email, description: "Chỉ có ở GET /farms/:id" }
        is_deleted: { type: boolean }
        created_at: { type: string, format: date-time }

    Invitation:
      type: object
      description: AUTH-FR-010, Flow 12 — lời mời thành viên farm, hết hạn sau 7 ngày nếu không phản hồi
      properties:
        _id: { type: string }
        farm_id: { type: string }
        invited_email: { type: string, format: email }
        invited_role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT] }
        invited_by: { type: string }
        token: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED] }
        expires_at: { type: string, format: date-time }
        responded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    House:
      type: object
      properties:
        _id: { type: string }
        farm_id: { type: string }
        name: { type: string }
        floors: { type: integer }
        description: { type: string }
        created_at: { type: string, format: date-time }

    Thresholds:
      type: object
      properties:
        temp_min: { type: number, example: 26 }
        temp_max: { type: number, example: 31 }
        humidity_min: { type: number, example: 75 }
        humidity_max: { type: number, example: 95 }
        light_max: { type: number, example: 0.2 }
        nh3_max: { type: number, example: 25 }
        co2_max: { type: number, example: 1500 }

    FuzzyTuning:
      type: object
      description: "ENV-FR-021 — hệ số bộ điều khiển mờ trên ESP32; tên field = key MQTT config/update"
      properties:
        fuzzy_humidity_band: { type: number, minimum: 2, maximum: 20, example: 8, description: "%RH — độ rộng vùng chuyển tiếp độ ẩm" }
        fuzzy_temp_band: { type: number, minimum: 1, maximum: 10, example: 4, description: "°C — độ rộng vùng nóng" }
        fuzzy_fan_dry_level: { type: number, minimum: 0, maximum: 100, example: 40, description: "% — mức quạt khi nóng mà khô" }
        fuzzy_window_sec: { type: integer, minimum: 60, maximum: 600, example: 120, description: "giây — cửa sổ time-proportioning" }
        fuzzy_input_filter: { type: boolean, example: true, description: "ENV-FR-022 — lọc median+Kalman đầu vào bộ mờ (tắt để so sánh A/B)" }

    DetectionTuning:
      type: object
      description: "EXPERT-FR-008 — tham số phát hiện theo Zone. Khoảng hợp lệ là giới hạn kỹ thuật, không phải khuyến nghị nuôi yến. 5 tham số đầu: tên field = key MQTT config/update"
      properties:
        noise_margin_db: { type: number, minimum: 5, maximum: 30, example: 15, description: "dB — ồn cao hơn mức nền của giờ đó bao nhiêu thì tính (NOISE_ANOMALY)" }
        noise_min_sec: { type: integer, minimum: 5, maximum: 15, example: 10, description: "giây ồn trong cửa sổ 15 giây (NOISE_ANOMALY)" }
        pump_dry_on_sec: { type: integer, minimum: 120, maximum: 900, example: 300, description: "giây bơm BẬT cộng dồn trước khi xét (PUMP_DRY)" }
        pump_dry_min_rise_pct: { type: number, minimum: 0.5, maximum: 10, example: 2, description: "%RH — độ ẩm phải tăng tối thiểu (PUMP_DRY)" }
        speaker_drop_pct: { type: integer, minimum: 30, maximum: 90, example: 70, description: "% — mức âm giảm so với nền (SPEAKER_FAILURE)" }
        return_rate_drop_pct: { type: number, minimum: 5, maximum: 50, example: 20, description: "% — tỷ lệ chim về giảm so với trung bình kỳ trước (backend dùng)" }

    MetricForecast:
      type: object
      nullable: true
      properties:
        history: { type: array, items: { type: object, properties: { timestamp: { type: string, format: date-time }, value: { type: number } } } }
        forecast: { type: array, items: { type: object, properties: { timestamp: { type: string, format: date-time }, value: { type: number } } } }
        alpha: { type: number }
        beta: { type: number }
        mae30: { type: number, nullable: true }
        mae60: { type: number, nullable: true }

    Zone:
      type: object
      properties:
        _id: { type: string }
        house_id: { type: string }
        farm_id: { type: string, readOnly: true, description: "Farm của House chứa Zone — server tự điền, không đổi được (SRS v1.23.0)" }
        name: { type: string }
        floor: { type: integer }
        thresholds: { $ref: "#/components/schemas/Thresholds" }
        threshold_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_at: { type: string, format: date-time }
              old_values: { type: object }
              new_values: { type: object }
        fuzzy_tuning: { $ref: "#/components/schemas/FuzzyTuning" }
        fuzzy_tuning_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_by_role: { $ref: "#/components/schemas/Role" }
              changed_at: { type: string, format: date-time }
              old_values: { type: object }
              new_values: { type: object }
        detection_tuning: { $ref: "#/components/schemas/DetectionTuning" }
        detection_tuning_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_by_role: { $ref: "#/components/schemas/Role" }
              changed_at: { type: string, format: date-time }
              old_values: { type: object }
              new_values: { type: object }
        created_at: { type: string, format: date-time }

    RelayUsage:
      type: object
      properties:
        on_hours: { type: number }
        switches: { type: integer }
        since_service_hours: { type: number }
        since_service_switches: { type: integer }
        last_ticket_id: { type: string }

    ZoneHealthReport:
      type: object
      description: "EXPERT-FR-005/006 — số liệu sức khỏe của 1 Zone trong 1 kỳ + kết luận của Domain Expert"
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        generated_at: { type: string, format: date-time }
        metrics:
          type: object
          properties:
            sample_count: { type: integer }
            temp_in_range_pct: { type: number, nullable: true }
            humidity_in_range_pct: { type: number, nullable: true }
            auto_mode_pct: { type: number, nullable: true, description: "ANALYTICS-FR-011" }
            misting_switches: { type: integer }
            ventilation_switches: { type: integer }
            alerts_by_type: { type: object, additionalProperties: { type: integer }, description: "{ <AlertType>: số cảnh báo phát sinh trong kỳ }" }
            avg_return_rate: { type: number, nullable: true, description: "null khi chưa có dữ liệu đếm chim" }
            nh3_avg: { type: number, nullable: true }
            nh3_max: { type: number, nullable: true }
            co2_avg: { type: number, nullable: true }
            co2_max: { type: number, nullable: true }
        expert_conclusion:
          type: object
          nullable: true
          properties:
            text: { type: string }
            by: { type: object, properties: { _id: { type: string }, full_name: { type: string } } }
            at: { type: string, format: date-time }

    RelayOverrideLog:
      type: object
      description: "ENV-FR-019 — một lần can thiệp tay 1 relay"
      properties:
        _id: { type: string }
        node_id: { type: string }
        zone_id: { type: string }
        farm_id: { type: string }
        relay: { type: string, enum: [misting, ventilation, speaker] }
        state: { type: boolean, description: "Trạng thái được ép" }
        started_by:
          type: object
          description: "Chỉ tên — không trả email (Domain Expert đọc được route này)"
          properties: { _id: { type: string }, full_name: { type: string } }
        started_by_role: { $ref: "#/components/schemas/Role" }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        end_reason: { type: string, enum: [EXPIRED, CLEARED_EARLY, REPLACED], nullable: true }

    RelayStates:
      type: object
      description: "Guide v3.3 §8-9: IN1=misting, IN2=speaker (loa ru), IN3=ventilation. IN4 để dự phòng (SRS v2.0.0 bỏ sưởi)"
      properties:
        misting: { type: boolean }
        speaker: { type: boolean }
        ventilation: { type: boolean }

    AudioTrack:
      type: object
      description: "ENV-FR-013c — bài trong danh mục web của 1 thiết bị (SRS §8.2 audio_tracks)"
      properties:
        _id: { type: string }
        node_id: { type: string }
        track_number: { type: integer, description: "Khớp file trên thẻ SD: 2 = 0002.mp3" }
        display_name: { type: string }
        file_url: { type: string, description: "URL MinIO ký tạm 1 giờ, chỉ để nghe trên web" }
        file_size_bytes: { type: integer }
        synced_to_sd: { type: boolean, description: "Technician tự đánh dấu sau khi chép tay vào thẻ SD" }
        uploaded_by: { type: string }
        uploaded_at: { type: string, format: date-time }

    SensorNode:
      type: object
      properties:
        relay_usage:
          type: object
          description: "TICKET-FR-018 (v1.24.0) — giờ chạy + số lần đóng cắt thật của bơm/quạt"
          properties:
            misting: { $ref: "#/components/schemas/RelayUsage" }
            ventilation: { $ref: "#/components/schemas/RelayUsage" }
            counted_until: { type: string, format: date-time }
        _id: { type: string }
        device_id: { type: string, example: node_001 }
        zone_id: { type: string }
        firmware_version: { type: string }
        last_heartbeat: { type: string, format: date-time }
        status:
          {
            type: string,
            enum: [PENDING, ONLINE, OFFLINE, ERROR, DEGRADED],
            description: "PENDING = Technician đã khai báo qua Web Console nhưng thiết bị chưa gửi heartbeat đầu tiên (Flow 1)",
          }
        rssi: { type: number }
        relay_states: { $ref: "#/components/schemas/RelayStates" }
        control_mode: { type: string, enum: [AUTO, MANUAL] }
        override_expiry: { type: string, format: date-time }
        speaker_schedule:
          type: object
          properties:
            enabled: { type: boolean }
            windows:
              {
                type: array,
                items:
                  {
                    type: object,
                    properties:
                      { start: { type: string }, end: { type: string } },
                  },
              }
        audio:
          type: object
          properties:
            current_track: { type: integer }
            volume: { type: integer, minimum: 0, maximum: 30 }
            playing: { type: boolean }
            loop: { type: boolean }
        registered_at: { type: string, format: date-time }
        ota_pending:
          type: object
          nullable: true
          description: "TICKET-FR-008 — OTA đã gửi, chờ heartbeat báo đúng version"
          properties:
            version: { type: string }
            url: { type: string }
            requested_at: { type: string, format: date-time }
            requested_by: { type: string }
        ota_failed:
          type: object
          nullable: true
          description: "OTA quá 30 phút chưa xác nhận — thiết bị vẫn chạy running_version (đã rollback)"
          properties:
            version: { type: string }
            failed_at: { type: string, format: date-time }
            running_version: { type: string }
        registered_by: { type: string, nullable: true }
        activation_overdue_at: { type: string, format: date-time, nullable: true, description: "Flow 1 case 8a — PENDING quá 15 phút chưa có heartbeat" }
        decommissioned_at: { type: string, format: date-time, nullable: true, description: "FARM-FR-008 — đã gỡ khỏi hệ thống; cảnh báo còn mở của nó được đóng theo" }
        decommission_reason: { type: string, nullable: true }
        replaced_by: { type: string, nullable: true, description: "Node mới lắp thay" }

    CameraNode:
      type: object
      properties:
        _id: { type: string }
        device_id: { type: string }
        zone_id: { type: string }
        rtsp_url: { type: string }
        status:
          {
            type: string,
            enum: [PENDING, ONLINE, OFFLINE, ERROR, DEGRADED],
            description: "PENDING = Technician đã khai báo qua Web Console nhưng thiết bị chưa gửi heartbeat đầu tiên (Flow 1)",
          }
        last_heartbeat: { type: string, format: date-time }
        model_version: { type: string }
        registered_at: { type: string, format: date-time }
        registered_by: { type: string, nullable: true }
        activation_overdue_at: { type: string, format: date-time, nullable: true, description: "Flow 1 case 8a — PENDING quá 15 phút chưa có heartbeat" }
        decommissioned_at: { type: string, format: date-time, nullable: true, description: "FARM-FR-008 — đã gỡ khỏi hệ thống" }
        decommission_reason: { type: string, nullable: true }
        replaced_by: { type: string, nullable: true, description: "Node mới lắp thay" }

    Telemetry:
      type: object
      properties:
        _id: { type: string }
        node_id: { type: string }
        zone_id: { type: string }
        timestamp: { type: string, format: date-time }
        temperature:
          { type: number, nullable: true, description: "°C, từ ES35-SW" }
        humidity:
          { type: number, nullable: true, description: "%RH, từ ES35-SW" }
        light_lux:
          { type: number, nullable: true, description: "lux, từ ES-ALS-02" }
        nh3_ppm:
          { type: number, nullable: true, description: "ppm, từ ES-NH3-01" }
        co2_ppm:
          { type: number, nullable: true, description: "ppm, từ ES-CO2-01" }
        sound_db:
          { type: number, nullable: true, description: "dB, từ ES-NOISE-01" }
        misting_pct: { type: number, nullable: true, description: "% phun do bộ điều khiển mờ tính (firmware ≥ 1.1.0)" }
        ventilation_pct: { type: number, nullable: true, description: "% quạt do bộ điều khiển mờ tính (firmware ≥ 1.1.0)" }
        misting_on: { type: boolean, nullable: true, description: "Relay phun sương lúc lấy mẫu" }
        ventilation_on: { type: boolean, nullable: true, description: "Relay quạt lúc lấy mẫu" }
        is_anomaly: { type: boolean }

    AlertType:
      type: string
      enum:
        - THRESHOLD_BREACH
        - PREDATOR_DETECTED
        - NODE_OFFLINE
        - SPEAKER_FAILURE
        - PUMP_DRY
        - NOISE_ANOMALY
        - POWER_OUTAGE
        - LOW_RETURN_RATE
        - EDGE_AI_DEGRADED
        - SENSOR_FAULT
        - RS485_BUS_FAILURE
        - SENSOR_ANOMALY
        - FORECAST_BREACH

    Alert:
      type: object
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string, nullable: true }
        node_id: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/AlertType" }
        severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        title: { type: string }
        message: { type: string }
        snapshot_url: { type: string, nullable: true }
        metadata: { type: object }
        status: { type: string, enum: [ACTIVE, ACKNOWLEDGED, RESOLVED] }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true, description: "Lần gần nhất sự cố còn được ghi nhận (cập nhật tối đa 1 lần/phút) — ALERT-FR-008" }
        occurrence_count: { type: integer, minimum: 1, description: "Số lần sự cố được ghi nhận lại trong khi alert còn mở (thay vì tạo alert trùng)" }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true, description: "Sự cố hết (THRESHOLD_BREACH tự đóng sau 5 phút không vượt ngưỡng, NODE_OFFLINE tự đóng khi thiết bị kết nối lại), hoặc thiết bị đã được gỡ khỏi hệ thống (FARM-FR-008). Alert đã đóng tự xoá sau 180 ngày." }
        acknowledged_by: { type: string, nullable: true }
        acknowledgement_note: { type: string, nullable: true }
        expert_verdict:
          type: object
          nullable: true
          description: "EXPERT-FR-003 — kết quả kiểm chứng của Domain Expert; không có = chờ kiểm chứng"
          properties:
            result: { type: string, enum: [CONFIRMED, REJECTED] }
            note: { type: string, nullable: true }
            by: { type: string }
            at: { type: string, format: date-time }

    TicketType:
      type: string
      enum:
        [
          SENSOR_FAULT,
          RS485_BUS_FAILURE,
          ACTUATOR_FAILURE,
          NODE_OFFLINE,
          EDGE_AI_DEGRADED,
          POWER_OUTAGE,
          SPEAKER_FAILURE,
          PREDATOR_DETECTED,
          INSTALLATION,
          MAINTENANCE,
          OTHER,
        ]
    TicketStatus:
      type: string
      enum: [NEW, IN_PROGRESS, AWAITING_FIELD_CONFIRMATION, CLOSED]

    Ticket:
      type: object
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string, nullable: true }
        alert_id: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/TicketType" }
        priority: { type: string, enum: [P1, P2, P3] }
        status: { $ref: "#/components/schemas/TicketStatus" }
        assigned_to: { type: string, nullable: true }
        scheduled_visit_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: "Giờ đến hiện trường (TICKET-FR-004b), 7:00–18:00 giờ VN. INSTALLATION/MAINTENANCE có từ lúc tạo; ticket sự cố chỉ có khi Technician hẹn xuống sau khi chẩn đoán từ xa (Flow 9 bước 6b)",
          }
        sla_response_due_at: { type: string, format: date-time, nullable: true }
        sla_resolve_due_at: { type: string, format: date-time, nullable: true }
        is_sla_breached: { type: boolean }
        responded_at: { type: string, format: date-time, nullable: true, description: "Technician xác nhận tiếp nhận (lần đầu IN_PROGRESS)" }
        is_sla_response_breached: { type: boolean, description: "Quá sla_response_due_at mà vẫn NEW" }
        assigned_at: { type: string, format: date-time, nullable: true, description: "Lúc giao cho Technician hiện tại — mốc tính KPI phản hồi" }
        escalated_at: { type: string, format: date-time, nullable: true, description: "TICKET-FR-009 — Technician xin Admin can thiệp (khác vượt hạn SLA)" }
        escalation_reason: { type: string, nullable: true }
        previous_assignees:
          type: array
          description: "TICKET-FR-017 — Technician từng phụ trách; chỉ đọc chat tới mốc `until`"
          items:
            type: object
            properties:
              user_id: { type: string }
              until: { type: string, format: date-time }
        last_message_at: { type: string, format: date-time, nullable: true }
        sat_checklist:
          type: object
          description: "TICKET-FR-010 — bắt buộc đủ 4 mục trước khi đóng ticket có buổi đến hiện trường (lắp đặt/bảo trì, hoặc sự cố đã có scheduled_visit_at)"
          properties:
            modbus_addresses_ok: { type: boolean }
            camera_rtsp_ok: { type: boolean }
            lte_connection_ok: { type: boolean }
            relay_test_ok: { type: boolean }
        notes:
          type: array
          items:
            type: object
            properties:
              {
                author_id: { type: string },
                content: { type: string },
                created_at: { type: string, format: date-time },
              }
        satisfaction_rating:
          { type: integer, minimum: 1, maximum: 5, nullable: true }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

    TicketMessage:
      type: object
      description: "TICKET-FR-014..017 — tin nhắn chat trong ticket"
      properties:
        _id: { type: string }
        ticket_id: { type: string }
        content: { type: string }
        author_id: { type: string, nullable: true }
        author_name: { type: string, nullable: true }
        role: { type: string, enum: [FARM_OWNER, TECHNICIAN, ADMIN, SYSTEM] }
        is_system: { type: boolean }
        client_message_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    MaintenanceSchedule:
      type: object
      description: "TICKET-FR-013 — lịch bảo trì định kỳ theo Farm"
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string, nullable: true }
        description: { type: string }
        interval_days: { type: integer }
        next_due_at: { type: string, format: date-time }
        is_active: { type: boolean }
        created_by: { type: string }
        last_ticket_id: { type: string, nullable: true }
        last_generated_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ProvisionedDevice:
      type: object
      description: "FARM-FR-003 — thiết bị trong kho (không bao giờ trả secret_key/hash)"
      properties:
        _id: { type: string }
        device_id: { type: string }
        kind: { type: string, enum: [SENSOR, CAMERA] }
        claimed_at: { type: string, format: date-time, nullable: true }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    TicketRoutingConfig:
      type: object
      required: [max_open_tickets_per_technician]
      properties:
        max_open_tickets_per_technician: { type: integer, minimum: 1, maximum: 100, example: 10 }

    HarvestStatus:
      type: string
      enum: [DRAFT, ARCHIVED]

    HarvestBatch:
      type: object
      description: MARKET-FR-001..005 — Harvest Batch (đợt thu hoạch), tự gắn env/flock snapshot lúc tạo
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string }
        created_by: { type: string }
        trace_code:
          {
            type: string,
            description: "UUID dùng làm mã QR truy xuất nguồn gốc (MARKET-FR-004)",
          }
        harvest_date: { type: string, format: date-time }
        nest_count: { type: integer }
        weight_grams: { type: number }
        nest_type: { type: string, enum: [RAW, CLEANED, PREMIUM] }
        product_images: { type: array, items: { type: string } }
        env_snapshot:
          type: object
          description: "MARKET-FR-002 — trung bình môi trường 7 ngày trước thu hoạch"
          properties:
            avg_temperature: { type: number, nullable: true }
            avg_humidity: { type: number, nullable: true }
            avg_light_lux: { type: number, nullable: true }
            avg_nh3_ppm: { type: number, nullable: true }
            avg_co2_ppm: { type: number, nullable: true }
            telemetry_range:
              {
                type: object,
                properties:
                  {
                    from: { type: string, format: date-time },
                    to: { type: string, format: date-time },
                  },
              }
            insufficient_data:
              {
                type: boolean,
                description: "true khi Zone chưa đủ dữ liệu 7 ngày (Flow 7 case 3a)",
              }
        flock_snapshot:
          type: object
          description: "MARKET-FR-003 — return rate trung bình 30 ngày (rỗng cho tới khi module VISION có dữ liệu thật)"
          properties:
            avg_return_rate_30d: { type: number, nullable: true }
            estimated_population: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/HarvestStatus" }
        is_deleted: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

