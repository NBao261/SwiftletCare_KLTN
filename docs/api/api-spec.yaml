openapi: 3.0.3

info:
  title: SwiftletCare API
  version: 1.0.0
  description: |
    REST API cho hệ thống SwiftletCare (giám sát/điều khiển môi trường nhà yến,
    đếm chim, cảnh báo, kiểm chứng của chuyên gia, ghi nhận thu hoạch).
    Xem `SwiftletCare_SRS.md` §9.

    **Lưu ý:** SRS §9.0 quy ước base path `/api/v1`, nhưng code thực tế
    (`backend/src/config/app.ts`) hiện mount route trực tiếp ở root (vd
    `/auth/login`, không phải `/api/v1/auth/login`) — file này mô tả đúng
    path THẬT ĐANG CHẠY, không phải path lý thuyết trong SRS. Khi backend
    đổi sang có prefix `/api/v1`, cập nhật lại `servers` bên dưới.

    **Response envelope** dùng chung cho mọi endpoint:
    `{ success: boolean, data?, meta?: {page,limit,total}, error?: {code,message} }`.

    **Mã lỗi dùng chung cho mọi endpoint đã đăng nhập (SRS v2.1.3–2.1.4):**
    - `429 RATE_LIMITED` (SEC-NFR-004) — API đã đăng nhập: 300 request/phút **mỗi tài
      khoản** (chưa đăng nhập: theo IP). `POST /auth/login`, `/auth/reset-password`,
      `PUT /auth/password`, `POST /invitations/{token}/create-account`: 10 lần **sai**/15 phút
      theo IP; `/auth/forgot-password`: 10 lần/15 phút theo IP; `/auth/refresh`: 30/phút theo IP. Kèm header `Retry-After` và
      `error.details.retryAfterSec`; response có `X-RateLimit-Limit` / `X-RateLimit-Remaining`.
    - `403 PASSWORD_CHANGE_REQUIRED` (AUTH-FR-005c) — tài khoản đang giữ mật khẩu tạm do
      Admin cấp (`must_change_password`): mọi route trả mã này, trừ `PUT /auth/password` và
      `POST /auth/logout`. Client nên chuyển sang màn đổi mật khẩu.

    **Trạng thái triển khai (cập nhật sau khi hoàn thành các module nghiệp vụ
    Farm Owner — yêu cầu ở Report 3 `docs/reports/report3-srs.md`, chỗ còn thiếu ở `docs/reports/README.md`):**
    Auth, Farms, Devices, Telemetry, Alerts, Analytics, Harvests, HealthReports
    đều có logic thật phía sau. Module ticket (ticket, chat, SLA, gán ticket, lịch
    bảo trì định kỳ) đã gỡ theo Report 3 §8: cảnh báo chưa ai xác nhận được gửi lại
    (ALERT-FR-015), bảo trì bơm/quạt là cảnh báo `MAINTENANCE_DUE` (ALERT-FR-016).

    **Phạm vi SRS v2 (sau Review 1) — file này đã theo phạm vi mới:**
    - Role `DOMAIN_EXPERT` thay `FARM_OPERATOR`: chuyên gia nuôi yến do Primary Owner
      mời, phạm vi cả farm (không còn `zone_ids`, không còn
      `PUT /farms/{id}/members/{userId}`). Chỉ đọc dữ liệu vận hành; sửa ngưỡng, hệ số
      mờ và tham số phát hiện; kiểm chứng cảnh báo suy luận; viết kết luận. Không
      relay/loa, ghi thu hoạch hay xác nhận cảnh báo.
    - Không còn `/marketplace/*`; chỉ ghi nhận thu hoạch (`/harvests`).
    - Relay chỉ còn `misting`, `speaker`, `ventilation` (bỏ `heating`).
    - NH3/CO2 chỉ cảnh báo (`THRESHOLD_BREACH` mức MEDIUM, không gửi lại);
      loại cảnh báo `NOISE_ANOMALY` thay `BIRD_PANIC`.
    - Mới: `PUT /alerts/{id}/verdict`, `GET /alerts/verdict-stats`,
      `PUT /farms/zones/{zoneId}/detection-tuning`,
      `GET /devices/sensor-nodes/{id}/relay-overrides`, `GET /analytics/autonomy`,
      `/health-reports`, `/auth/telegram/link`.
    - Đếm chim phía backend: `GET /analytics/bird-count/buckets` (số đếm 5 phút); nút AI
      gửi heartbeat như ESP32, `vision/alert` nhận `EDGE_AI_DEGRADED`; danh sách camera
      không còn trả `rtsp_url`.
    - Hộp thông báo trong ứng dụng: `/notifications` (+ sự kiện Socket.io
      `NOTIFICATION_NEW` tới chính người nhận).
    - Live stream: `GET /devices/camera-nodes/{id}/stream-token`, `POST /internal/stream-auth` (MediaMTX).
    - SRS v2.1.8 — camera đếm chim gắn **nhà yến (House)**, không gắn Zone: đăng ký bằng `house_id`,
      `/analytics/bird-count/*?houseId=` (`zoneId` cũ vẫn nhận, quy ra House chứa Zone), mới
      `GET /analytics/bird-count/current`, `PUT /farms/houses/{houseId}/bird-count-tuning`,
      `GET /alerts?houseId=`; Socket.io `JOIN_HOUSE` → room `house:<id>` nhận `BIRD_COUNT_UPDATE`,
      trạng thái camera, cảnh báo của cả nhà. MQTT của nút AI: `swiftletcare/{farm}/{house}/heartbeat|vision/bird-count|vision/alert`.

servers:
  - url: http://localhost:3000
    description: Local dev (docker-compose mongodb + emqx)

tags:
  - name: Auth
    description: "AUTH-FR-002..004/009/012 (đăng nhập/JWT/quên-đặt lại mật khẩu/yêu cầu xoá tài khoản). Không có đăng ký công khai và không đăng nhập bằng OTP (Report 3 §1.2, §8): Admin tạo tài khoản Farm Owner và Technician (AUTH-FR-005c), co-owner và Domain Expert tạo tài khoản từ link lời mời (`POST /invitations/{token}/create-account`, AUTH-FR-010)"
  - name: Admin
    description: AUTH-FR-005c/007/011/012, OPS-NFR-004 (quản lý tài khoản, khoá/mở khoá, xử lý yêu cầu xoá, tạo Technician và cấp lại mật khẩu tạm, dashboard trạng thái node toàn hệ thống) — mọi endpoint chỉ ADMIN
  - name: System
    description: SYSTEM-FR-001..003 (Module SYSTEM §5.11 — xem audit log, ngưỡng mặc định hệ thống, tổng quan sức khỏe hệ thống) — mọi endpoint chỉ ADMIN
  - name: Farms
    description: FARM-FR-001..002/007, AUTH-FR-005/010 (farm/house/zone/member/invitation)
  - name: Devices
    description: FARM-FR-003..007, ENV-FR-006/015..018, VISION-FR-013 (sensor/camera node, relay control, token xem live stream)
  - name: Internal
    description: Dịch vụ nội bộ gọi backend (MediaMTX hỏi quyền stream) — không mở ra Internet
  - name: Telemetry
    description: "ENV-FR-001..005 — Farm Owner, Domain Expert của farm; Technician, Administrator → 403 (Report 3 §2.4, FARM-FR-009)"
  - name: Alerts
    description: ALERT-FR-001/002/006/007/008/009/014, EXPERT-FR-003 (Alert Engine — dedup, quiet hours, danh sách, xác nhận, kiểm chứng và bằng chứng của cảnh báo suy luận)
  - name: ExpertActivity
    description: "EXPERT-FR-009 — lịch sử quyết định của Domain Expert trên một farm (và của Farm Owner khi farm chưa có chuyên gia, BR-22); chỉ Farm Owner và Domain Expert của farm"
  - name: Analytics
    description: "ANALYTICS-FR-001..005, VISION-FR-008..011 (biểu đồ môi trường, so sánh đa Zone, đếm chim/return-rate — chờ dữ liệu thật từ module VISION) — Farm Owner, Domain Expert của farm; Technician, Administrator → 403 (Report 3 §2.4, FARM-FR-009)"
  - name: Harvests
    description: "HARVEST-FR-001..005 (ghi nhận thu hoạch — tự gắn env/flock snapshot + trace code; Marketplace đã bỏ ở SRS v2.0.0) — ghi: Farm Owner; đọc: Farm Owner, Domain Expert; Technician, Administrator → 403 (Report 3 §2.4)"
  - name: HealthReports
    description: "EXPERT-FR-005/006 (báo cáo sức khỏe Zone do hệ thống tự tổng hợp + kết luận của Domain Expert); ANALYTICS-FR-012…014, EXPERT-FR-012/013 (trạng thái sức khỏe ngày theo nhà yến, chấm độc lập BR-31, CSV, độ khớp) — FARM_OWNER, DOMAIN_EXPERT; Technician, Administrator → 403"
  - name: Notifications
    description: EXPERT-FR-006/007 (hộp thông báo trong ứng dụng của chính người gọi — mọi role đã đăng nhập)


security:
  - bearerAuth: []

paths:
  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập (email/password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Đăng nhập thành công — refreshToken trả qua httpOnly cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Tài khoản bị Admin khoá (AUTH-FR-011, Flow 19 bước 4). Chỉ trả sau
            khi mật khẩu đúng — sai mật khẩu vẫn là 401, không lộ trạng thái khoá.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                error:
                  code: ACCOUNT_DISABLED
                  message: "Tài khoản đã bị khoá. Lý do: Vi phạm điều khoản sử dụng"
                  details: { reason: "Vi phạm điều khoản sử dụng" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới Access Token bằng refreshToken cookie
      security: []
      responses:
        "200":
          description: Access token mới
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      {
                        data:
                          {
                            type: object,
                            properties: { accessToken: { type: string } },
                          },
                      }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất — thu hồi refreshToken hiện tại
      responses:
        "200":
          {
            description: Đã đăng xuất,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: "Quên mật khẩu — gửi mã đặt lại (AUTH-FR-009, Flow 11 bước 6)"
      security: []
      description: |
        Luôn trả 200 kể cả khi email không tồn tại, để không lộ thông tin tài
        khoản (Flow 11 case 1a). Mã có TTL 15 phút, dùng 1 lần. Dev hiện chỉ
        log ra console (`[DEV RESET]`), chưa nối SMTP/Zalo thật.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email],
                properties: { email: { type: string, format: email } },
              }
      responses:
        "200":
          {
            description: "Nếu email tồn tại, mã đặt lại đã được gửi",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: "Đặt mật khẩu mới bằng mã đã nhận (AUTH-FR-009, Flow 11 bước 7)"
      security: []
      description: |
        Đổi mật khẩu thành công sẽ thu hồi TOÀN BỘ refresh token cũ của user
        (đá khỏi mọi thiết bị khác đang đăng nhập), không chỉ chặn đăng nhập mới.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, newPassword]
              properties:
                email: { type: string, format: email }
                token:
                  {
                    type: string,
                    description: "Mã 6 số nhận được từ /auth/forgot-password",
                  }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          {
            description: Đã đổi mật khẩu,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "400":
          {
            description: Mã đặt lại không đúng hoặc đã hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/password:
    put:
      tags: [Auth]
      summary: "Đổi mật khẩu khi đang đăng nhập — mọi role (AUTH-FR-005c)"
      description: |
        Cách duy nhất để bỏ mật khẩu tạm do Admin cấp (`must_change_password` → `false`);
        route này vẫn gọi được khi các route khác đang trả 403 `PASSWORD_CHANGE_REQUIRED`.
        Thu hồi refresh token của mọi thiết bị khác, **giữ** phiên hiện tại (refresh token
        đọc từ cookie, hoặc `refreshToken` trong body cho mobile). Sai mật khẩu hiện tại
        trả 400 (không phải 401, để client không tưởng token hết hạn). Tính vào giới hạn
        10 lần sai/15 phút theo IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, description: "Phải khác mật khẩu hiện tại" }
                refreshToken: { type: string, description: "Chỉ mobile — phiên cần giữ lại" }
      responses:
        "200": { description: Đã đổi mật khẩu, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "400":
          description: "INVALID_CURRENT_PASSWORD — mật khẩu hiện tại sai; PASSWORD_UNCHANGED — mật khẩu mới trùng mật khẩu cũ"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/notification-preferences:
    put:
      tags: [Auth]
      summary: "Cấu hình kênh nhận thông báo + giờ im lặng (ALERT-FR-005/006/013)"
      description: |
        `telegram` chỉ có tác dụng khi tài khoản đã liên kết bot (`POST /auth/telegram/link`).
        Zalo/SMS nằm ngoài phạm vi (Report 3 §8): trường lạ gửi lên bị bỏ qua.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                push: { type: boolean }
                telegram: { type: boolean }
                quiet_hours:
                  type: object
                  properties:
                    {
                      start: { type: string, example: "22:00" },
                      end: { type: string, example: "06:00" },
                    }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/User" } },
                            },
                          ],
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/telegram/link:
    post:
      tags: [Auth]
      summary: "Tạo mã liên kết bot Telegram (ALERT-FR-013)"
      description: |
        Trả deep link `https://t.me/<bot>?start=<mã>`; mã dùng một lần, sống 10 phút. Người
        dùng mở link, Telegram gửi `/start <mã>` cho bot, backend lưu chat id và từ đó gửi
        cảnh báo qua Telegram theo cùng luật với push (người nhận, mức độ, giờ im lặng).
        Chỉ liên kết được trong chat riêng với bot (gửi mã trong nhóm bị từ chối); một chat chỉ
        gắn với một tài khoản.
        503 khi máy chủ chưa cấu hình `TELEGRAM_BOT_TOKEN`/`TELEGRAM_BOT_USERNAME`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          deep_link: { type: string, example: "https://t.me/swiftletcare_bot?start=4f1c…" }
                          expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "Chưa cấu hình bot Telegram", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      tags: [Auth]
      summary: "Hủy liên kết Telegram (ALERT-FR-013)"
      responses:
        "200": { description: Đã hủy liên kết, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/delete-request:
    post:
      tags: [Auth]
      summary: "Yêu cầu xoá tài khoản/dữ liệu cá nhân (AUTH-FR-012, PRIV-NFR-003)"
      description: |
        Chỉ ĐÁNH DẤU `deletion_requested_at` — việc xoá thật (kèm quy tắc
        cascade chuyển Primary Owner / xoá mềm Farm) do Administrator xử lý
        trong ≤ 30 ngày (Flow 19): `PUT /admin/delete-requests/{id}/complete` hoặc
        `.../reject`. Admin được báo ngay, và được nhắc lại một lần khi yêu cầu đã
        chờ ≥ 23 ngày.
      responses:
        "200":
          {
            description: Đã ghi nhận yêu cầu,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          {
            description: Đã có yêu cầu xoá trước đó đang chờ xử lý,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
    delete:
      tags: [Auth]
      summary: "Huỷ yêu cầu xoá tài khoản đang chờ (AUTH-FR-012)"
      description: "User đổi ý trước khi Admin xử lý. Audit `DELETION_CANCELLED`, Admin được báo."
      responses:
        "200": { description: Đã huỷ yêu cầu, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "Chưa có yêu cầu xoá nào để huỷ"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  # ── ADMIN ─────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: "Danh sách tài khoản, lọc theo role/trạng thái, tìm theo tên/email/SĐT (AUTH-FR-011) — chỉ ADMIN"
      parameters:
        - { name: role, in: query, schema: { $ref: "#/components/schemas/Role" } }
        - name: status
          in: query
          description: "`inactive` = đang bị khoá; `deleted` = đã xoá theo yêu cầu (AUTH-FR-012, cũng `is_active=false` nhưng không mở khoá được)"
          schema: { type: string, enum: [active, inactive, deleted] }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Tìm trong full_name, email, phone — không phân biệt hoa/thường" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{id}/status:
    put:
      tags: [Admin]
      summary: "Khoá/mở khoá tài khoản (AUTH-FR-011, Flow 19) — chỉ ADMIN"
      description: |
        Bắt buộc `reason` khi khoá (`is_active=false`); không bắt buộc khi mở
        khoá. Middleware `authenticate` chặn ngay request kế tiếp của user này
        dù access token còn hạn — không cần đợi token hết hạn tự nhiên.
        Admin không tự khoá được chính mình, nhờ vậy hệ thống luôn còn ít nhất
        1 Admin đang hoạt động (Flow 19 case 2a).

        Khi khoá: thu hồi mọi refresh token và ngắt các kết nối Socket.io đang
        mở của user (kết nối mới bằng access token còn hạn cũng bị từ chối).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
                  description: "Chuỗi \"true\"/\"false\"/\"1\"/\"0\" cũng được chấp nhận và ép về boolean trước khi xử lý"
                reason: { type: string, description: "Bắt buộc khi is_active=false" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/User" }
        "400":
          description: "Thiếu reason khi khoá tài khoản, hoặc Admin tự khoá chính mình"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/delete-requests:
    get:
      tags: [Admin]
      summary: "Danh sách yêu cầu xoá tài khoản đang chờ xử lý (AUTH-FR-012) — chỉ ADMIN"
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/delete-requests/{id}/complete:
    put:
      tags: [Admin]
      summary: "Xác nhận hoàn tất xử lý xoá tài khoản (AUTH-FR-012, Flow 19 bước 7-8) — chỉ ADMIN"
      description: |
        Cascade: Farm mà user là Primary Owner còn thành viên khác → chuyển
        `owner_id` cho người có `joined_at` sớm nhất; hết thành viên → xoá mềm
        Farm. Gỡ user khỏi `members` của các Farm khác nếu chỉ là thành viên
        thường. Anonymize email/phone/full_name, không xoá document (giữ FK
        cho lịch sử farm/audit). Xử lý xong thì gỡ `deletion_requested_at` —
        tài khoản rời khỏi `GET /admin/delete-requests` và không xử lý lại được.

        Mỗi Farm được chuyển chủ/xoá mềm có 1 bản ghi audit riêng
        (`FARM_OWNERSHIP_TRANSFERRED`, `FARM_SOFT_DELETED`) và chủ mới cùng người bị
        xoá nhận thông báo; kết nối Socket.io của user bị ngắt. Cũng dọn các liên
        kết trỏ tới user: cho hết hạn (`EXPIRED`) các lời mời đang chờ user đã gửi, đặt `deleted_at`
        (tài khoản đã xoá không khoá/mở khoá lại được, 409). Audit `ACCOUNT_DELETED`
        ghi `farmsTransferred`, `farmsDeleted`. Nếu lỗi giữa chừng
        (Mongo standalone, không transaction) thì gọi lại được: farm đã xử lý xong
        không bị xử lý lần nữa.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: "Đã xử lý xong (anonymized)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "400":
          description: "Người dùng chưa gửi yêu cầu xoá / yêu cầu đã được xử lý / Admin tự xử lý tài khoản của chính mình"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/delete-requests/{id}/reject:
    put:
      tags: [Admin]
      summary: "Từ chối yêu cầu xoá tài khoản (AUTH-FR-012) — chỉ ADMIN"
      description: |
        VD còn nghĩa vụ lưu hồ sơ. Tài khoản giữ nguyên, rời hàng đợi
        `GET /admin/delete-requests`; người yêu cầu được báo kèm lý do. Audit
        `DELETION_REJECTED`. Admin không tự xử lý yêu cầu của chính mình.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: "Bắt buộc, gửi lại cho người yêu cầu" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "400":
          description: "Người dùng chưa gửi yêu cầu xoá, hoặc Admin tự xử lý yêu cầu của chính mình"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/technicians:
    post:
      tags: [Admin]
      summary: "Admin tự tạo tài khoản Technician (AUTH-FR-005c, Flow 16) — chỉ ADMIN"
      description: |
        `password` là mật khẩu tạm: tài khoản tạo ra có `must_change_password=true`,
        Technician phải đổi (`PUT /auth/password`) trước khi dùng các API khác (403
        `PASSWORD_CHANGE_REQUIRED`). Technician làm việc trên mọi farm (FARM-FR-009) nên không
        có khu vực phụ trách; `assigned_regions` gửi lên bị bỏ qua.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, description: "Mật khẩu tạm" }
                full_name: { type: string }
                phone:
                  type: string
                  description: "Tuỳ chọn. 0 + 9 số hoặc +84 + 9 số; khoảng trắng, dấu chấm, gạch ngang được bỏ trước khi kiểm tra"
                  example: "0912 345 678"
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/technicians/{id}/password:
    put:
      tags: [Admin]
      summary: "Cấp mật khẩu tạm mới cho Technician (AUTH-FR-005c) — chỉ ADMIN"
      description: |
        Dùng khi Technician quên mật khẩu (email chưa nối SMTP thật) hoặc tài khoản nghi bị
        lộ. Backend sinh mật khẩu ngẫu nhiên 12 ký tự, trả **đúng 1 lần** trong
        `data.temporary_password`; thu hồi mọi phiên, ngắt socket, đặt
        `must_change_password=true`. Audit `TECHNICIAN_PASSWORD_RESET` (không ghi mật khẩu).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          technician: { $ref: "#/components/schemas/User" }
                          temporary_password: { type: string, example: "q3Zx8_Lm0aPw" }
        "400":
          description: "Tài khoản không phải Technician"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Tài khoản đã bị xoá theo yêu cầu"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  # ── SYSTEM ────────────────────────────────────────────────────────────────
  /admin/provisioned-devices:
    post:
      tags: [Admin]
      summary: "Nhập thiết bị vào kho, cấp secretKey để in nhãn (FARM-FR-003) — chỉ ADMIN"
      description: |
        `secret_key` (dạng XXXX-XXXX-XXXX) chỉ trả về **đúng 1 lần** trong response
        này — backend chỉ lưu SHA-256, không xem lại được. Technician nhập cặp
        `{device_id, secret_key}` khi onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, kind]
              properties:
                device_id: { type: string, example: node_101 }
                kind: { type: string, enum: [SENSOR, CAMERA] }
      responses:
        "201":
          description: Đã cấp
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { device_id: { type: string }, kind: { type: string }, secret_key: { type: string, example: "K7QM-3XPA-9RTD" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Admin]
      summary: "Danh sách kho thiết bị (FARM-FR-003) — chỉ ADMIN"
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [SENSOR, CAMERA] } }
        - { name: claimed, in: query, schema: { type: string, enum: ["true", "false"] }, description: "Đã/chưa kích hoạt" }
        - { name: revoked, in: query, schema: { type: string, enum: ["true", "false"] }, description: "Đã/chưa bị thu hồi" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/ProvisionedDevice" } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/provisioned-devices/{id}/revoke:
    put:
      tags: [Admin]
      summary: "Thu hồi thiết bị trong kho (FARM-FR-003) — chỉ ADMIN"
      description: |
        Mất/lộ nhãn, hàng lỗi. Từ đó kích hoạt bị từ chối: nhập đúng secretKey thì 409 "đã
        bị thu hồi", sai key vẫn chỉ là 400 "mã không đúng" (không lộ thiết bị nào bị thu
        hồi). Thiết bị đang chạy ở một farm phải gỡ trước (`.../decommission`) — thu hồi
        không tắt được thiết bị đang hoạt động. Thu hồi là trạng thái cuối. Audit
        `DEVICE_PROVISION_REVOKED`.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string }, description: "_id trong kho (không phải device_id)" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/ProvisionedDevice" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Thiết bị đang hoạt động ở một farm, hoặc đã bị thu hồi"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/provisioned-devices/{id}/rotate-key:
    post:
      tags: [Admin]
      summary: "Cấp secretKey mới để in lại nhãn (FARM-FR-003) — chỉ ADMIN"
      description: |
        Chỉ thiết bị CHƯA kích hoạt và chưa bị thu hồi: thiết bị đã kích hoạt lưu secretKey
        trong NVS (mở khu AP-mode nâng cao — FARM-FR-003c), đổi ở backend là hai bên lệch
        nhau. Key cũ hết dùng được ngay; key mới trả **đúng 1 lần**. Audit
        `DEVICE_PROVISION_KEY_ROTATED`.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { device_id: { type: string }, kind: { type: string }, secret_key: { type: string, example: "K7QM-3XPA-9RTD" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Thiết bị đã kích hoạt hoặc đã bị thu hồi"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /system/audit-logs:
    get:
      tags: [System]
      summary: "Xem/lọc Audit Log toàn hệ thống (SYSTEM-FR-001) — chỉ ADMIN"
      description: |
        Các action đang được ghi: LOGIN, LOGIN_FAILED, PASSWORD_RESET,
        ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, DELETION_REQUESTED, ACCOUNT_DELETED,
        FARM_OWNERSHIP_TRANSFERRED, FARM_SOFT_DELETED, USER_CREATED,
        THRESHOLD_UPDATED, DEFAULT_THRESHOLDS_UPDATED,
        RELAY_OVERRIDE, RELAY_OVERRIDE_CLEARED, SPEAKER_SCHEDULE_UPDATED,
        AUDIO_TRACK_UPLOADED/SYNC_UPDATED/SELECTED/DELETED, DEVICE_REGISTERED, DEVICE_REASSIGNED, DEVICE_COMMAND_SENT.
        Mỗi bản ghi có `ip_address` của request gây ra hành động (rỗng nếu do hệ
        thống tự thực hiện).
      parameters:
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string, example: LOGIN_FAILED } }
        - { name: targetType, in: query, schema: { type: string, example: user } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK (mới nhất trước)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/settings/default-thresholds:
    get:
      tags: [System]
      summary: "Xem ngưỡng mặc định hệ thống (SYSTEM-FR-002, ENV-FR-007) — chỉ ADMIN"
      description: Chưa từng cấu hình thì trả giá trị gốc (khớp firmware Config.h).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Thresholds" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [System]
      summary: "Chỉnh ngưỡng mặc định hệ thống (SYSTEM-FR-002) — chỉ ADMIN"
      description: |
        Gửi 1 phần hoặc cả 7 trường, phần còn lại giữ nguyên. Đây là nguồn
        Farm Owner dùng khi "Reset về mặc định" 1 Zone (ENV-FR-020) — KHÔNG tự
        áp xuống các Zone đang chạy. Mọi thay đổi ghi audit log. Mỗi giá trị phải nằm
        trong khoảng đo của cảm biến tương ứng (nhiệt −40..125°C, ẩm 0..100%,
        ánh sáng ≤ 200.000 lux, NH3 ≤ 500 ppm, CO2 ≤ 5000 ppm), nếu không 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Thresholds" }
      responses:
        "200":
          description: Giá trị sau khi cập nhật
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Thresholds" } }
        "400":
          description: "min >= max, giá trị âm, hoặc kết quả sau khi gộp với giá trị hiện tại vượt khoảng đo cảm biến"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/health-overview:
    get:
      tags: [System]
      summary: "Tổng quan sức khỏe hệ thống (SYSTEM-FR-003) — chỉ ADMIN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          farms:
                            type: object
                            properties:
                              total: { type: integer }
                          zones: { type: object, properties: { total: { type: integer } } }
                          devices: { $ref: "#/components/schemas/DeviceStatusSummary" }
                          users:
                            type: object
                            properties:
                              total: { type: integer }
                              active: { type: integer }
                              inactive: { type: integer, description: "Đang bị khoá (không gồm tài khoản đã xoá)" }
                              deleted: { type: integer, description: "Đã xoá theo yêu cầu (AUTH-FR-012)" }
                              byRole:
                                type: object
                                additionalProperties:
                                  type: object
                                  properties:
                                    active: { type: integer }
                                    inactive: { type: integer }
                                    deleted: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── FARMS ─────────────────────────────────────────────────────────────────
  /farms:
    get:
      tags: [Farms]
      summary: Danh sách farm của user hiện tại
      description: |
        - FARM_OWNER, DOMAIN_EXPERT: các farm mình sở hữu hoặc là thành viên (Domain Expert chỉ thấy bản ghi thành viên của chính mình)
        - TECHNICIAN: mọi farm, chỉ cấu trúc (`members` rỗng) — để chọn House→Zone khi setup thiết bị (FARM-FR-009)
        - ADMIN: rỗng — Administrator không thấy farm nào (Report 3 §2.4)
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        { $ref: "#/components/schemas/Farm" },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
    post:
      tags: [Farms]
      summary: Tạo farm mới — FARM_OWNER
      description: |
        - Người tạo là Primary Owner (FARM-FR-001). Role khác → 403: Administrator không
          quản lý farm (Report 3 §2.4).
        - `coordinates` **bắt buộc** (FARM-FR-001, A-5): một farm là một địa điểm, có thời tiết
          của tọa độ đó. Nhà yến ở nơi khác thì tạo farm khác. Thiếu hoặc ngoài khoảng → 422.
          Chỉ lưu `lat`, `lng` (số); trường khác trong `coordinates` bị bỏ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, coordinates]
              properties:
                name: { type: string }
                address: { type: string }
                coordinates: { $ref: "#/components/schemas/Coordinates" }
      responses:
        "201":
          {
            description: Đã tạo,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /farms/{id}:
    parameters: [{ $ref: "#/components/parameters/FarmId" }]
    get:
      tags: [Farms]
      summary: Chi tiết farm
      description: |
        Farm Owner của farm: đủ `members` và `owner`. Domain Expert: chỉ bản ghi thành viên của mình.
        Technician: mọi farm, `members` rỗng, không có `owner` (FARM-FR-009). Administrator → 403.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Farms]
      summary: Cập nhật farm — FARM_OWNER của farm
      description: |
        Role khác FARM_OWNER → 403 (Report 3 §2.4: Administrator không quản lý farm).
        `coordinates` không bắt buộc gửi; gửi thì cùng kiểm tra như lúc tạo (422 nếu thiếu
        `lat`/`lng` hoặc ngoài khoảng).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                address: { type: string }
                coordinates: { $ref: "#/components/schemas/Coordinates" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Farms]
      summary: Xóa mềm farm — chỉ Primary Owner
      description: |
        Role khác FARM_OWNER → 403; Farm Owner không phải Primary Owner → 403 (FARM-FR-001).
        Farm chỉ bị ẩn (`is_deleted`), dữ liệu lịch sử giữ nguyên. Kéo theo:
        mọi cảnh báo đang mở của farm được đóng (`RESOLVED`) để không bị gửi lại
        (ALERT-FR-015), và lời mời còn chờ hết hạn.
      responses:
        "200":
          {
            description: Đã xóa,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }

  /farms/{id}/members:
    post:
      tags: [Farms]
      summary: "Mời đồng sở hữu (FARM_OWNER) hoặc Domain Expert (AUTH-FR-005/010, EXPERT-FR-001, Flow 12) — chỉ Primary Owner"
      description: |
        Tạo một Invitation PENDING (hết hạn sau 7 ngày); email chưa có tài khoản thì
        đăng ký xong tự động accept và tài khoản mang đúng `role` được mời.
        - `role` mặc định `FARM_OWNER`. `DOMAIN_EXPERT` là chuyên gia nuôi yến, phạm vi luôn là cả farm
          (SRS v2.0.0 bỏ `zone_ids`).
        - 1 email = 1 role: email đã là tài khoản role khác (Technician, Admin, hoặc
          Farm Owner ↔ Domain Expert) → 409, cần dùng email khác.
        - Ghi audit `FARM_MEMBER_INVITED`.
      parameters: [{ $ref: "#/components/parameters/FarmId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email],
                properties:
                  {
                    email: { type: string, format: email },
                    role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT], default: FARM_OWNER },
                  },
              }
      responses:
        "201":
          {
            description: Đã tạo lời mời,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/Invitation" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          {
            description: "Đã là thành viên, đã có lời mời PENDING gửi tới email này, hoặc email đã là tài khoản role khác",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /farms/{id}/members/{userId}:
    delete:
      tags: [Farms]
      summary: Gỡ thành viên khỏi farm (Flow 12 bước 5) — chỉ Primary Owner, không thể tự gỡ chính mình
      parameters:
        - { $ref: "#/components/parameters/FarmId" }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          {
            description: Đã gỡ,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          {
            description: Không thể gỡ Primary Owner,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
