      summary: "Cập nhật ngưỡng qua device (tương đương PUT /farms/zones/:zoneId/thresholds), publish MQTT config/update — FARM_OWNER/DOMAIN_EXPERT/TECHNICIAN/ADMIN"
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
