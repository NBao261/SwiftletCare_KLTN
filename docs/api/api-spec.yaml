            description: Không phải thành viên farm này,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /invitations/{token}:
    parameters:
      [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Farms]
      summary: Xem trước lời mời qua token (AUTH-FR-010, Flow 12 bước 3) — không cần đăng nhập, dùng để hiển thị tên farm trước khi accept/decline
      security: []
      responses:
        "200":
          description: OK — thông tin xem trước lời mời
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          invitation: { $ref: "#/components/schemas/Invitation" }
                          farm:
                            type: object
                            nullable: true
                            description: "null khi farm của lời mời đã bị xoá"
                            properties:
                              _id: { type: string }
                              name: { type: string }
                              address: { type: string }
                          userExists:
                            type: boolean
                            description: "Email được mời đã có tài khoản chưa. true: đăng nhập rồi gọi /invitations/{token}/accept; false: hiện form tên + mật khẩu gọi /invitations/{token}/create-account"
        "404":
          {
            description: Lời mời không tồn tại,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /invitations/{token}/accept:
    post:
      tags: [Farms]
      summary: Chấp nhận lời mời (Flow 12 bước 3a) — yêu cầu đăng nhập bằng đúng email được mời
      parameters:
        [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          {
            description: Đã chấp nhận,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "403":
          {
            description: Đăng nhập sai email được mời,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          {
            description: Lời mời đã accept/decline/hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /invitations/{token}/create-account:
    post:
      tags: [Farms]
      summary: "Tạo tài khoản từ link lời mời (AUTH-FR-010) — người được mời chưa có tài khoản; công khai"
      description: |
        Thay cho đăng ký công khai (đã bỏ, Report 3 §1.2). E-mail và role lấy từ lời mời, người
        nhận chỉ đặt tên và mật khẩu; tài khoản mới vào ngay farm của lời mời và lời mời chuyển
        sang `ACCEPTED`. Email đã có tài khoản thì đăng nhập rồi gọi `/invitations/{token}/accept`
        (`GET /invitations/{token}` trả `userExists` để client chọn đúng luồng). Giới hạn 10 lần
        **sai**/15 phút theo IP.
      security: []
      parameters:
        [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, password]
              properties:
                full_name: { type: string, minLength: 1 }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Đã tạo tài khoản và tham gia farm — đăng nhập bằng `POST /auth/login`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "404":
          {
            description: Token sai, hoặc farm của lời mời đã bị xoá,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "409":
          {
            description: "Lời mời đã accept/decline/hết hạn, hoặc email đã có tài khoản (đăng nhập rồi accept)",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: "Quá nhiều lần sai (RATE_LIMITED)" }

  /invitations/{token}/decline:
    post:
      tags: [Farms]
      summary: Từ chối lời mời (Flow 12 case 3c) — link công khai, không cần đăng nhập
      parameters:
        [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          {
            description: Đã từ chối,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          {
            description: Lời mời đã accept/decline/hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

