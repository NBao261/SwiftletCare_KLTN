  /farms/zones/{zoneId}/thresholds:
    put:
      tags: [Farms]
      summary: Cập nhật ngưỡng cảnh báo/điều khiển của Zone (ENV-FR-006, lưu lịch sử ENV-FR-009)
      description: |
        Kiểm tra từng cặp min<max và khoảng đo của từng cảm biến (nhiệt −40..125°C,
        ẩm 0..100%, ánh sáng ≤ 200.000 lux, NH3 ≤ 500 ppm, CO2 ≤ 5000 ppm) — 400 nếu vi phạm.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Thresholds" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Zone" } },
                            },
                          ],
