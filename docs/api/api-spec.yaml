      description: "Báo Farm Owner và hiện trong lịch sử hoạt động chuyên gia (EXPERT-FR-009). Hồ sơ không ở DRAFT, hoặc hai lần duyệt cùng lúc (lần sau) → 409. Audit `CONFIG_PROFILE_APPROVED`."
      responses:
