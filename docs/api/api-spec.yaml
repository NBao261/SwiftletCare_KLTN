                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/SensorNode" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/sensor-nodes/{id}/thresholds:
    put:
      tags: [Devices]
      summary: "Cập nhật ngưỡng qua device (tương đương PUT /farms/zones/:zoneId/thresholds), publish MQTT config/update — FARM_OWNER/DOMAIN_EXPERT (Technician, Admin → 403)"
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Thresholds" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }

  /devices/sensor-nodes/{id}/speaker-schedule:
    put:
      tags: [Devices]
      summary: "Lịch loa ru của thiết bị (ENV-FR-013b, BR-07), chỉ FARM_OWNER — publish MQTT config/update"
      description: |
        Cập nhật từng phần `speaker_schedule` / `audio.volume` / `audio.current_track`
        rồi publish ngay `config/update` (kèm ngưỡng hiện hành của Zone) xuống ESP32;
        thiết bị lưu NVS. Thiết bị offline lúc này sẽ nhận lại khi reconnect
        (heartbeat `justConnected`).

        Giới hạn firmware: tối đa **2 khung giờ, theo giờ tròn** (`HH:00`, `end` tối
        đa `24:00`). Gửi 1 khung thì khung thứ 2 bị xoá. Tắt lịch dùng
        `enabled: false`. Đổi `volume`/`track` giữa lúc đang phát áp dụng từ khung
        giờ kế tiếp. Ghi audit `SPEAKER_SCHEDULE_UPDATED`.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                windows:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start: { type: string, pattern: "^([01][0-9]|2[0-3]):00$", example: "05:00" }
                      end: { type: string, pattern: "^(([01][0-9]|2[0-3]):00|24:00)$", example: "07:00" }
                volume: { type: integer, minimum: 0, maximum: 30 }
                track: { type: integer, minimum: 1, description: "Số file trên thẻ SD (1 = 0001.mp3)" }
      responses:
        "200":
          {
            description: "OK — trả SensorNode đã cập nhật",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "400": { description: "Khung giờ có giờ bắt đầu không trước giờ kết thúc" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị đã được gỡ bỏ khỏi hệ thống (FARM-FR-008) — không nhận lệnh nữa" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes/{id}/relay-override:
    delete:
      tags: [Devices]
      summary: "Tắt Manual Override sớm của 1 relay hoặc mọi relay (ENV-FR-018, BR-20), chỉ FARM_OWNER"
      description: |
        Không có `relayName`: đặt `control_mode=AUTO`, xoá `override_expiry`, publish MQTT `relay/command`
        `{action:"clear_override"}` để ESP32 trả mọi relay về điều khiển tự động; đóng mọi lịch sử còn mở.
        Có `relayName`: chỉ đóng lịch sử của relay đó và publish `{action:"clear_override", relayName}`;
        thiết bị còn relay khác đang can thiệp tay thì vẫn `MANUAL`. Gọi khi thiết bị đang AUTO, hoặc relay
        được chọn không đang can thiệp tay, thì không làm gì (200, không publish, không ghi audit).
        Ghi audit `RELAY_OVERRIDE_CLEARED`.
        Hạn riêng từng relay phía thiết bị (BR-20) làm cùng firmware G-07: firmware chưa đọc `relayName`
        thì huỷ mọi relay và báo AUTO qua `relay/status`, backend đóng phần còn lại theo trạng thái đó.
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - { name: relayName, in: query, schema: { type: string, enum: [misting, speaker, ventilation] }, description: "Chỉ huỷ relay này; bỏ trống = huỷ mọi relay" }
      responses:
        "200":
          {
            description: OK,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị đã được gỡ bỏ khỏi hệ thống (FARM-FR-008) — không nhận lệnh nữa" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes/{id}/audio-tracks:
    get:
      tags: [Devices]
      summary: "Danh mục file loa ru của thiết bị (ENV-FR-013c(b)) — mọi role có quyền Zone"
      description: "`file_url` là URL MinIO ký tạm 1 giờ, chỉ để nghe bản gốc trên web — DFPlayer phát file trên thẻ SD."
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            { properties: { data: { type: array, items: { $ref: "#/components/schemas/AudioTrack" } } } },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Devices]
      summary: "Upload file .mp3 vào danh mục loa ru (ENV-FR-013c(a)) — TECHNICIAN"
      description: |
        Lưu bản gốc lên MinIO + tạo bản ghi `synced_to_sd=false`. Web KHÔNG ghi được
        file xuống thẻ SD (DFPlayer không có lệnh ghi) — Technician tự chép file với
        tên `000N.mp3` (N = `track_number`) rồi đánh dấu qua `sync-status`.
        Chỉ nhận `.mp3` (`audio/mpeg`), tối đa 10MB (SRS §12.4). Ghi audit `AUDIO_TRACK_UPLOADED`.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, track_number, display_name]
              properties:
                file: { type: string, format: binary }
                track_number: { type: integer, minimum: 1, maximum: 255, description: "2 = 0002.mp3 trên thẻ SD" }
                display_name: { type: string, maxLength: 100 }
      responses:
        "201":
          {
            description: Đã upload,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            { properties: { data: { $ref: "#/components/schemas/AudioTrack" } } },
                          ],
                      },
                  },
              },
          }
        "400": { description: "Không phải .mp3, thiếu file, hoặc vượt 10MB" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Trùng `track_number` trên thiết bị, hoặc thiết bị đã gỡ (không còn ở hiện trường để chép file)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes/{id}/audio-tracks/{trackId}:
    delete:
      tags: [Devices]
      summary: "Xoá bài khỏi danh mục web (không xoá file trên thẻ SD) — TECHNICIAN"
      description: |
        Bài đã chép vào thẻ SD và đang là `speaker_track` của thiết bị (còn hoạt động) thì
        trả 409 — thiết bị vẫn phát số đó mà web mất dấu là bài nào; chọn bài khác hoặc
        đánh dấu chưa chép trước. Thiết bị đã gỡ thì xoá tự do (dọn danh mục).
      parameters: [{ $ref: "#/components/parameters/NodeId" }, { $ref: "#/components/parameters/TrackId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Bài đang được phát theo lịch (đã chép SD và là bài được chọn)" }

  /devices/sensor-nodes/{id}/audio-tracks/{trackId}/sync-status:
    put:
      tags: [Devices]
      summary: "Đánh dấu đã/chưa chép file vào thẻ SD (ENV-FR-013c(a)) — TECHNICIAN"
      parameters: [{ $ref: "#/components/parameters/NodeId" }, { $ref: "#/components/parameters/TrackId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [synced_to_sd], properties: { synced_to_sd: { type: boolean } } }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            { properties: { data: { $ref: "#/components/schemas/AudioTrack" } } },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị đã gỡ khỏi hệ thống" }

  /devices/sensor-nodes/{id}/audio-tracks/{trackId}/select:
    put:
      tags: [Devices]
      summary: "Đặt bài làm speaker_track mặc định cho lịch phát (ENV-FR-013c(b)) — FARM_OWNER"
      description: "Chặn (400) nếu `synced_to_sd=false`. Publish MQTT `config/update` (kèm ngưỡng + lịch hiện hành). Ghi audit `AUDIO_TRACK_SELECTED`."
      parameters: [{ $ref: "#/components/parameters/NodeId" }, { $ref: "#/components/parameters/TrackId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } },
          }
        "400": { description: "Bài chưa được chép vào thẻ SD" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị đã được gỡ bỏ khỏi hệ thống (FARM-FR-008) — không nhận lệnh nữa" }

  /devices/sensor-nodes/{id}/audio-tracks/{trackId}/play-now:
    post:
      tags: [Devices]
      summary: "Phát thử bài ngay trên loa, bỏ qua lịch (ENV-FR-013c(c)) — FARM_OWNER"
      description: |
        Publish MQTT `audio/command` `{action:"play", track}`. Firmware bật nguồn amply,
        phát 1 lần, tự dừng sau tối đa 5 phút (`FORCE_PLAY_MAX_MS`) rồi quay về lịch.
        Manual Override relay loa (ENV-FR-016) vẫn được ưu tiên cho nguồn amply.
      parameters: [{ $ref: "#/components/parameters/NodeId" }, { $ref: "#/components/parameters/TrackId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } },
          }
        "400": { description: "Bài chưa được chép vào thẻ SD" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị không ONLINE, hoặc đã được gỡ bỏ khỏi hệ thống (FARM-FR-008)" }

  /devices/sensor-nodes/{id}/audio/stop:
    post:
      tags: [Devices]
      summary: "Dừng phát thử (ENV-FR-013c(c)) — FARM_OWNER"
      description: "Publish MQTT `audio/command` `{action:'stop'}`; nếu đang trong khung giờ thì thiết bị phát lại bài theo lịch."
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Thiết bị không ONLINE, hoặc đã được gỡ bỏ khỏi hệ thống (FARM-FR-008)" }

  /devices/sensor-nodes/{id}/relay-overrides:
    get:
      tags: [Devices]
      summary: "Lịch sử can thiệp tay của thiết bị (ENV-FR-019) — FARM_OWNER/DOMAIN_EXPERT (Technician, Admin → 403)"
      description: |
        Mỗi lần ép 1 relay là 1 bản ghi, mới nhất trước. `ended_at = null` là đang override.
        `end_reason`: `EXPIRED` (hết hạn), `CLEARED_EARLY` (tắt sớm, gỡ thiết bị, hoặc thiết
        bị khởi động lại), `REPLACED` (bấm lại cùng relay trước khi hết hạn).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/RelayOverrideLog" } }
                      meta:
                        type: object
                        properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/sensor-nodes/{id}/relay:
    post:
      tags: [Devices]
      summary: "Điều khiển relay — Manual Override (ENV-FR-016..018), chỉ FARM_OWNER"
      description: |
        Publish MQTT `relay/command` tới ESP32, đặt `control_mode=MANUAL` và
        `override_expiry = now + durationMs`. Technician, Administrator, Domain Expert → 403
        (Report 3 §2.4). Gọi lại cùng trạng thái
        để gia hạn override (Flow 13 case 4a).

        BR-08: bật bơm (`relayName=misting`, `state=true`) 1–30 phút — quá 30 phút → 422; tắt bơm, quạt,
        loa 1 phút – 24 giờ. ENV-FR-016: bật bơm khi Zone đang có `SENSOR_FAULT`, `RS485_BUS_FAILURE` hoặc
        `MISTING_INEFFECTIVE` còn hiệu lực (`ACTIVE`, `ACKNOWLEDGED`) phải gửi `confirmed: true`, thiếu thì
        409 `CONFIRMATION_REQUIRED`, `error.details` là danh sách các cảnh báo đó để app hiện cho người dùng;
        lịch sử can thiệp ghi `alert_confirmed` (ENV-FR-019).
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relayName, state]
              properties:
                relayName:
                  {
                    type: string,
                    enum: [misting, speaker, ventilation],
                  }
                state: { type: boolean }
                durationMs:
                  {
                    type: integer,
                    minimum: 60000,
                    maximum: 86400000,
                    default: 1800000,
                    description: "Thời gian override trước khi tự trả về AUTO (mặc định 30 phút, từ 1 phút tới 24 giờ; bật bơm tối đa 30 phút — BR-08)",
                  }
                confirmed:
                  {
                    type: boolean,
                    description: "ENV-FR-016 — Farm Owner xác nhận bật bơm dù Zone đang có cảnh báo cảm biến/phun sương",
                  }
      responses:
        "200":
          {
            description: Đã publish lệnh,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/SensorNode" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          {
            description: relayName không hợp lệ,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "CONFIRMATION_REQUIRED — bật bơm khi Zone có cảnh báo cảm biến/phun sương mà chưa xác nhận; hoặc thiết bị đã gỡ"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiError"
                  - properties:
                      error:
                        type: object
                        properties:
                          code: { type: string, example: CONFIRMATION_REQUIRED }
                          message: { type: string }
                          details:
                            type: array
                            items:
                              type: object
                              properties:
                                _id: { type: string }
                                type: { type: string, enum: [SENSOR_FAULT, RS485_BUS_FAILURE, MISTING_INEFFECTIVE] }
                                title: { type: string }
                                created_at: { type: string, format: date-time }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/camera-nodes/register:
    post:
      tags: [Devices]
      summary: "Đăng ký camera đếm chim (nút AI) vào nhà yến — FARM_OWNER (farm của mình)/TECHNICIAN (FARM-FR-004, MF-10)"
      description: |
        Giống sensor node: bắt buộc `secret_key` của thiết bị loại CAMERA trong kho. SRS v2.1.8: camera lắp ở
        cửa ra vào của cả nhà yến nên gắn House (`house_id`). `zone_id` là cách gửi cũ (trước v2.1.8), được quy
        ra House chứa Zone; cần một trong hai. Technician đăng ký được ở mọi farm và các Farm Owner
        của farm nhận thông báo trong app (FARM-FR-009).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, secret_key]
              properties:
                {
                  device_id: { type: string, example: cam_001 },
                  secret_key: { type: string, example: DEMO-CAM-0001 },
                  house_id: { type: string },
                  zone_id: { type: string, deprecated: true, description: "Cách gửi cũ — quy ra House chứa Zone" },
                  rtsp_url: { type: string },
                }
      responses:
        "201":
          {
            description: Đã đăng ký,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/CameraNode" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/camera-nodes:
    get:
      tags: [Devices]
      summary: Danh sách camera đếm chim
      description: "Camera của 1 nhà yến (`houseId`; `zoneId` cũ được quy ra House chứa Zone), không truyền thì mọi nhà user được xem. Không trả `rtsp_url` (chứa mật khẩu camera — chỉ nút AI cần)."
      parameters:
        - { name: houseId, in: query, schema: { type: string } }
        - name: zoneId
          in: query
          deprecated: true
          schema: { type: string }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        {
                                          $ref: "#/components/schemas/CameraNode",
                                        },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }

  /devices/sensor-nodes/{id}/decommission:
    post:
      tags: [Devices]
      summary: "Gỡ bỏ thiết bị, giữ lịch sử dữ liệu (FARM-FR-008) — FARM_OWNER (farm của mình)/TECHNICIAN"
      description: |
        Không xoá document: telemetry/alert cũ tham chiếu `node_id` nên vẫn truy
        vấn được. Thiết bị bị ẩn khỏi danh sách/thống kê, heartbeat/telemetry từ
        `device_id` này bị bỏ qua, lệnh relay/ngưỡng/dời zone trả 409.

        Thiết bị **đang ONLINE** phải gửi kèm `force: true` (409 nếu
        thiếu) — gỡ một thiết bị còn sống là mất giám sát cả Zone. Cảnh báo còn mở
        của nó được đóng theo, các Farm Owner nhận thông báo trong app khi người gỡ là
        Technician (FARM-FR-009), và trong **24 giờ** vẫn
        khôi phục lại được qua `/restore`.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: "Hỏng nguồn, thu hồi về kho" }
                force: { type: boolean, description: "Bắt buộc khi thiết bị đang ONLINE — xác nhận chấp nhận mất giám sát của Zone" }
      responses:
        "200":
          description: "Đã gỡ (decommissioned_at được gán)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SensorNode" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/sensor-nodes/{id}/restore:
    post:
      tags: [Devices]
      summary: "Khôi phục thiết bị vừa gỡ nhầm, trong 24 giờ (FARM-FR-008) — FARM_OWNER (farm của mình)/TECHNICIAN"
      description: |
        Xoá `decommissioned_at` và cờ `activation_overdue_at`, đưa thiết bị về
        `OFFLINE` — hoặc `PENDING` nếu nó chưa từng gửi heartbeat lần nào (vẫn
        đang chờ kích hoạt, để job kích hoạt quá hạn tiếp tục theo dõi) và cho nó xuất hiện lại trong danh sách/thống kê. Cảnh báo đã đóng
        lúc gỡ **không** mở lại — nếu sự cố còn, `deviceOffline.job` sẽ sinh cảnh báo mới.

        Từ chối 409 khi: thiết bị chưa bị gỡ, đã quá 24 giờ, `device_id` đã được đăng
        ký lại cho bản ghi khác, hoặc thiết bị thay thế vẫn đang hoạt động.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, example: "Gỡ nhầm thiết bị" } }
      responses:
        "200":
          description: Đã khôi phục
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SensorNode" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/camera-nodes/{id}/counting-ring:
    put:
      tags: [Devices]
      summary: "Vẽ vòng đếm chim của 1 camera (VISION-FR-018) — DOMAIN_EXPERT của farm chứa camera; FARM_OWNER khi farm chưa có chuyên gia (BR-22)"
      description: |
        Farm Owner trên farm đã có Domain Expert → 403. Thay đổi của Domain Expert báo trong app cho mọi
        Farm Owner và vào lịch sử hoạt động (EXPERT-FR-009).
        Vòng khép kín quanh miệng lỗ ra vào (`docs/bird-counting-plan.md` 3.3 ý 7, 19.8), các đỉnh
        `[x, y]` theo tỉ lệ khung hình 0–1, theo thứ tự quanh vòng; 3–12 đỉnh (12 là giới hạn kỹ thuật
        chống nhập nhầm). `into_ring_is_exit`: true khi trong vòng là phía ngoài trời (camera trong nhà).
        Lưu `counting_ring` + `counting_ring_history` (người sửa, role, giá trị cũ/mới) và audit
        `COUNTING_RING_UPDATED`, rồi publish MQTT `swiftletcare/{farmId}/{houseId}/config/update`
        `{ deviceId, counting_ring: { points, into_ring_is_exit } }` cho nút AI; nút AI vừa kết nối lại
        (heartbeat `justConnected` hoặc từ OFFLINE) được gửi lại. Broker chưa kết nối thì vẫn lưu,
        `ring_delivered=false`. Đổi vòng thì số đếm trước và sau không so được với nhau. Farm Owner
        chỉ xem (trong `GET /devices/camera-nodes`).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CountingRing" }
      responses:
        "200":
          description: Đã lưu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/CameraNode"
                          - properties:
                              ring_delivered: { type: boolean, description: "Lệnh đã tới broker; false = nút AI nhận khi kết nối lại" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Camera đã gỡ khỏi hệ thống", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/camera-nodes/{id}/stream-token:
    get:
      tags: [Devices]
      summary: "Token xem live stream của 1 camera (VISION-FR-013) — FARM_OWNER/DOMAIN_EXPERT của farm chứa camera"
      description: |
        Video không đi qua backend: trình duyệt mở WebRTC (WHEP) tới MediaMTX ở đường `path`,
        gửi `token` trong header `Authorization: Bearer <token>` (hoặc `?token=`). MediaMTX hỏi
        `POST /internal/stream-auth`, token chỉ hợp lệ cho đúng `path` đó và hết hạn sau `expires_in`
        giây (chỉ cần còn hạn lúc mở kết nối; kết nối lại thì xin token mới). Token này không dùng
        được làm access token. Technician/Admin không xem live stream (Report 3 §2.4).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          path: { type: string, example: cam-cam-zone1-01, description: "cam-<device_id>" }
                          token: { type: string }
                          expires_in: { type: integer, example: 60 }
        "400": { description: "device_id của camera không dùng được làm tên stream (ký tự lạ hoặc kết thúc bằng -raw)" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "Máy chủ video chưa được cấu hình (STREAM_TOKEN_SECRET trống)" }

  /internal/stream-auth:
    post:
      tags: [Internal]
      summary: "MediaMTX hỏi quyền đẩy/xem stream (HTTP authentication của MediaMTX) — dịch vụ nội bộ"
      description: |
        Không dùng JWT người dùng; reverse proxy chặn `/internal` từ bên ngoài.
        `publish` và đọc hình gốc `cam-<id>-raw`: chỉ với `password` = STREAM_PUBLISH_SECRET (pipeline).
        `read` đường `cam-<id>`: token của `GET /devices/camera-nodes/{id}/stream-token`, lấy từ
        `token` (header Bearer), `query` (`token=`) hoặc `password`. Hành động khác bị từ chối.
        Trả 401 cả khi client RTSP hỏi lần đầu chưa kèm mật khẩu, để nó gửi lại kèm mật khẩu.
      security: []
      parameters:
        - { name: key, in: query, required: true, schema: { type: string }, description: STREAM_AUTH_KEY }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [publish, read, playback, api, metrics, pprof] }
                path: { type: string, example: cam-cam-zone1-01 }
                user: { type: string }
                password: { type: string }
                token: { type: string }
                query: { type: string }
                protocol: { type: string }
                ip: { type: string }
                id: { type: string }
      responses:
        "200": { description: Được phép }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /devices/camera-nodes/{id}/restore:
    post:
      tags: [Devices]
      summary: "Khôi phục Camera Node vừa gỡ nhầm, trong 24 giờ (FARM-FR-008) — FARM_OWNER (farm của mình)/TECHNICIAN"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string } }
      responses:
        "200":
          description: Đã khôi phục
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/CameraNode" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/sensor-nodes/{id}/replace:
    post:
      tags: [Devices]
      summary: "Thay thiết bị hỏng bằng thiết bị mới cùng Zone (FARM-FR-008) — FARM_OWNER (farm của mình)/TECHNICIAN"
      description: |
        Đăng ký thiết bị mới (cần `secret_key` như onboarding, trạng thái PENDING)
        vào đúng Zone của thiết bị cũ, chép lịch loa/âm lượng, rồi gỡ thiết bị cũ
        với `replaced_by` trỏ sang node mới. Sai `secret_key` thì thiết bị cũ giữ nguyên.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_device_id, secret_key, reason]
              properties:
                new_device_id: { type: string, example: node_002 }
                secret_key: { type: string, example: DEMO-NODE-0002 }
                reason: { type: string, example: "Cảm biến NH3 chết" }
      responses:
        "201":
          description: Đã thay
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { oldNode: { $ref: "#/components/schemas/SensorNode" }, newNode: { $ref: "#/components/schemas/SensorNode" } } } }
        "400": { description: "Mã kích hoạt không đúng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/sensor-nodes/{id}/reassign-zone:
    put:
      tags: [Devices]
      summary: "Dời thiết bị đang kết nối sang Zone/Farm khác (FARM-FR-007b, Flow 21 nhánh A) — FARM_OWNER/TECHNICIAN"
      description: |
        Farm Owner chỉ dời trong farm của mình: Zone nguồn hoặc đích thuộc farm khác → 403
        (FARM-FR-007); Administrator → 403 (Report 3 §2.4).
        Publish `config/reassign` (kèm `deviceId`) lên topic của Zone CŨ — thiết bị
        lưu identity mới rồi kết nối lại theo topic mới. Kiểm quyền trên cả Zone
        nguồn lẫn Zone đích; cảnh báo còn mở của thiết bị ở Zone cũ được đóng; audit
        `DEVICE_REASSIGNED`; người dời là Technician (mọi farm, FARM-FR-009) thì các Farm Owner của
        farm nguồn và đích nhận thông báo trong app. Chỉ khi thiết bị `ONLINE` (đang kết nối) —
        mất kết nối thì cần nhánh AP-mode (chưa hỗ trợ) nên trả 409. Dời về chính
        Zone đang ở trả 400. `meta.commandDelivered=false` khi backend chưa kết nối broker.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newZoneId]
              properties: { newZoneId: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/SensorNode" }
                      meta: { type: object, properties: { commandDelivered: { type: boolean } } }
        "400": { description: "Zone đích trùng Zone hiện tại" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị đã gỡ, hoặc không ONLINE" }

  /devices/sensor-nodes/{id}/commands:
    post:
      tags: [Devices]
      summary: "Xử lý từ xa: khởi động lại / đẩy lại ngưỡng / OTA firmware (FARM-FR-013, Flow 15) — chỉ TECHNICIAN"
      description: |
        Technician gửi được tới thiết bị của mọi farm; mỗi lệnh được audit và báo trong app cho các
        Farm Owner của farm (FARM-FR-009, 013).
        Chỉ gửi được khi thiết bị `ONLINE` (409 nếu không). Cả 3 lệnh publish lên topic
        `swiftletcare/{farmId}/{houseId}/{zoneId}/config/update` (§9.2):
        - `PUSH_CONFIG`: toàn bộ cấu hình hiện hành — ngưỡng, hệ số mờ, tham số phát
          hiện của Zone và lịch/âm lượng/bài loa của thiết bị (cùng gói thiết bị nhận
          khi vừa kết nối lại), kèm `deviceId`
        - `RESTART`: `{ "command": "RESTART" }`
        - `OTA`: `{ "command": "OTA", "ota": { version, url, sha256 } }` — URL phải
          là HTTPS và host nằm trong `OTA_ALLOWED_HOSTS` (sha256 do chính người gửi
          đặt nên không thay được việc khoá nguồn firmware); node lưu
          `ota_pending`, heartbeat báo đúng `firmware_version` mới thì ghi audit
          `DEVICE_OTA_SUCCEEDED` (Flow 15 bước 5); quá 30 phút chưa xác nhận thì
          chuyển sang `ota_failed` (thiết bị đã rollback) và báo người gửi

        **Firmware xử lý `command` từ bản 1.4.0**: thiết bị đang báo `firmware_version`
        cũ hơn thì RESTART/OTA trả **501** (lên 1.4.0 lần đầu bằng ElegantOTA trong LAN
        hoặc USB); PUSH_CONFIG dùng được với mọi bản vì firmware đã hiểu payload ngưỡng.
        Firmware 1.4.0 tải file, kiểm sha256 rồi mới khởi động vào bản mới; bản mới phải
        kết nối được MQTT trong 10 phút, nếu không bootloader quay về bản cũ (Flow 15 bước 5a).
        Mỗi lệnh được ghi audit `DEVICE_COMMAND_SENT`.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, enum: [RESTART, PUSH_CONFIG, OTA] }

                ota:
                  type: object
                  description: "Bắt buộc khi command=OTA"
                  properties:
                    version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$", example: "1.4.1", description: "Không có tiền tố \"v\" — phải khớp đúng FIRMWARE_VERSION thiết bị báo về" }
                    url: { type: string, example: "https://fw.swiftletcare.vn/esp32-1.4.1.bin" }
                    sha256: { type: string, example: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
      responses:
        "202":
          description: Đã gửi lệnh
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SensorNode" } }
        "400": { description: "URL firmware không phải HTTPS/không thuộc OTA_ALLOWED_HOSTS", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Thiết bị PENDING/OFFLINE/ERROR hoặc đã gỡ, hoặc đang chạy đúng version OTA", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "501": { description: "RESTART/OTA tới thiết bị chạy firmware trước 1.4.0 (chưa xử lý `command`)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "503": { description: "Backend chưa kết nối MQTT broker — lệnh chưa rời backend, `ota_pending` KHÔNG được ghi", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /devices/camera-nodes/{id}/decommission:
    post:
      tags: [Devices]
      summary: "Gỡ bỏ Camera Node, giữ lịch sử (FARM-FR-008) — FARM_OWNER (farm của mình)/TECHNICIAN"
      description: |
        Cùng quy tắc với `POST /devices/sensor-nodes/{id}/decommission`: không xoá
        document nên dữ liệu cũ tham chiếu `node_id` vẫn truy vấn được, thiết bị
        bị ẩn khỏi danh sách/thống kê.

        Camera **đang ONLINE** phải gửi kèm `force: true` (409 nếu
        thiếu) — gỡ một camera còn sống là mất giám sát hình ảnh của Zone. Cảnh báo
        còn mở của nó được đóng theo, Farm Owner nhận thông báo, và trong **24 giờ**
        vẫn khôi phục lại được qua `/restore`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: "Hỏng nguồn, thu hồi về kho" }
                force: { type: boolean, description: "Bắt buộc khi camera đang ONLINE — xác nhận chấp nhận mất giám sát của Zone" }
      responses:
        "200":
          description: "Đã gỡ (decommissioned_at được gán)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/CameraNode" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/system-status:
    get:
      tags: [Devices, Admin]
      summary: "Trạng thái toàn bộ node hệ thống (OPS-NFR-004) — chỉ ADMIN"
      description: |
        Khác `GET /devices/sensor-nodes`/`camera-nodes` (luôn giới hạn theo
        quyền Farm của user) — endpoint này liệt kê TẤT CẢ SensorNode/CameraNode
        trong hệ thống kèm đếm theo status (gộp cả 2 loại), phục vụ trang Admin
        "Trạng thái hệ thống" (`SystemNodeStatus` bên frontend). Chỉ tính thiết bị
        của Farm chưa xoá mềm — cùng phạm vi với `devices` của
        `GET /system/health-overview`, để số liệu hai nơi khớp nhau.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          summary: { $ref: "#/components/schemas/DeviceStatusSummary" }
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                _id: { type: string }
                                device_id: { type: string }
                                type: { type: string, enum: [sensor, camera] }
                                status:
                                  {
                                    type: string,
                                    enum: [PENDING, ONLINE, OFFLINE],
                                  }
                                last_heartbeat: { type: string, format: date-time, nullable: true }
                                rssi: { type: number, nullable: true, description: "Chỉ có với sensor" }
                                firmware_version: { type: string, nullable: true, example: "1.2.0", description: "Chỉ có với sensor" }
                                registered_at: { type: string, format: date-time }
                                zone_id: { type: string }
                                farm_id: { type: string }
                                farm_name: { type: string }
                                house_name: { type: string }
                                floor: { type: integer, example: 1 }
                                zone_name: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

