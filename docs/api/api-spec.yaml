  /tickets/{id}/status:
    put:
      tags: [Tickets]
      summary: "Technician cập nhật trạng thái ticket (TICKET-FR-007) — TECHNICIAN/ADMIN"
      description: |
        Chỉ cho chuyển đúng thứ tự: `NEW → IN_PROGRESS → AWAITING_FIELD_CONFIRMATION
        → CLOSED` (không nhảy cóc/lùi tuỳ tiện). Với ticket `INSTALLATION`/
        `MAINTENANCE`, không cho chuyển `CLOSED` nếu `sat_checklist` chưa đạt
        đủ 4 mục (TICKET-FR-010).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [status],
                properties:
                  {
                    status: { $ref: "#/components/schemas/TicketStatus" },
                    note: { type: string },
