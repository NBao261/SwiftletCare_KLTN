openapi: 3.0.3

info:
  title: SwiftletCare API
  version: 1.0.0
  description: |
    REST API cho hệ thống SwiftletCare (giám sát/điều khiển môi trường nhà yến,
    đếm chim, cảnh báo, ticket, marketplace). Xem `SwiftletCare_SRS.md` §9.

    **Lưu ý:** SRS §9.0 quy ước base path `/api/v1`, nhưng code thực tế
    (`backend/src/config/app.ts`) hiện mount route trực tiếp ở root (vd
    `/auth/login`, không phải `/api/v1/auth/login`) — file này mô tả đúng
    path THẬT ĐANG CHẠY, không phải path lý thuyết trong SRS. Khi backend
    đổi sang có prefix `/api/v1`, cập nhật lại `servers` bên dưới.

    **Response envelope** dùng chung cho mọi endpoint:
    `{ success: boolean, data?, meta?: {page,limit,total}, error?: {code,message} }`.

    **Trạng thái triển khai:** endpoint thuộc các tag ghi "(stub)" (Alerts,
    Analytics, Harvests, Marketplace, Tickets, Sales) hiện trả
    `501 { success:false, error:{code:"NOT_IMPLEMENTED"} }` —
    request/response schema mô tả là *hợp đồng dự kiến* theo SRS, chưa có
    logic thật phía sau. Xem `backend/README.md` mục "Module → phạm vi".

servers:
  - url: http://localhost:3000
    description: Local dev (docker-compose mongodb + emqx)

tags:
  - name: Auth
    description: AUTH-FR-001..008
  - name: Farms
    description: FARM-FR-001..002, AUTH-FR-005/005b (farm/house/zone/member/sales-staff)
  - name: Devices
    description: FARM-FR-003..006, ENV-FR-016..018 (sensor/camera node, relay control)
  - name: Telemetry
    description: ENV-FR-001..005
  - name: Alerts
    description: ALERT-FR-001..009 (stub)
  - name: Analytics
    description: ANALYTICS-FR-001..005, VISION-FR-008..011 (stub)
  - name: Harvests
    description: MARKET-FR-001..005 (stub)
  - name: Marketplace
    description: MARKET-FR-006..013 (stub)
  - name: Tickets
    description: TICKET-FR-001..012 (stub)
  - name: Sales
    description: SALES-FR-001..010 — Giai đoạn 2, stretch (stub)

security:
  - bearerAuth: []

paths:
  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                full_name: { type: string }
                phone: { type: string }
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties: { data: { $ref: '#/components/schemas/User' } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập (email/password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Đăng nhập thành công — refreshToken trả qua httpOnly cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới Access Token bằng refreshToken cookie
      security: []
      responses:
        '200':
          description: Access token mới
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties: { data: { type: object, properties: { accessToken: { type: string } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất — thu hồi refreshToken hiện tại
      responses:
        '200': { description: Đã đăng xuất, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccess' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Gửi OTP về email (dev hiện chỉ log ra console, chưa nối SMTP/Zalo thật)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '200': { description: Đã gửi (hoặc im lặng nếu email không tồn tại), content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccess' } } } }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Xác thực OTP, trả accessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties: { email: { type: string, format: email }, otp: { type: string } }
      responses:
        '200':
          description: OTP hợp lệ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - properties:
                      data:
                        type: object
                        properties: { accessToken: { type: string }, user: { $ref: '#/components/schemas/User' } }
        '400': { description: OTP sai hoặc hết hạn, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  # ── FARMS ─────────────────────────────────────────────────────────────────
  /farms:
    get:
      tags: [Farms]
      summary: Danh sách farm của user hiện tại
      description: |
        - FARM_OWNER: các farm mình sở hữu hoặc là thành viên
        - TECHNICIAN: các farm có `region` nằm trong `assigned_regions` của mình (để chọn Farm→House→Zone khi onboarding — Flow 1 bước 2)
        - ADMIN: tất cả
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/Farm' } } } }] } } } }
    post:
      tags: [Farms]
      summary: Tạo farm mới (người tạo trở thành Primary Owner) — FARM_OWNER/ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name: { type: string }
                address: { type: string }
                region: { type: string, example: HCMC, description: "Khu vực để định tuyến Technician phụ trách — nên nhập, nếu bỏ trống thì không Technician nào lắp đặt/xử lý ticket được cho farm này" }
                coordinates: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/Farm' } } }] } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /farms/{id}:
    parameters: [{ $ref: '#/components/parameters/FarmId' }]
    get:
      tags: [Farms]
      summary: Chi tiết farm
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/Farm' } } }] } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Farms]
      summary: Cập nhật farm (owner/member)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                address: { type: string }
                coordinates: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/Farm' } } }] } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Farms]
      summary: Xóa mềm farm — chỉ Primary Owner
      responses:
        '200': { description: Đã xóa, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /farms/{id}/members:
    post:
      tags: [Farms]
      summary: Mời thành viên Farm Owner khác (AUTH-FR-005) — chỉ Primary Owner, người được mời phải đã có tài khoản
      parameters: [{ $ref: '#/components/parameters/FarmId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '201': { description: Đã thêm thành viên, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/Farm' } } }] } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Email chưa có tài khoản, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /farms/{id}/sales-staff:
    parameters: [{ $ref: '#/components/parameters/FarmId' }]
    post:
      tags: [Farms]
      summary: Mời Sales Staff vào farm (AUTH-FR-005b) — chỉ Primary Owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '201': { description: Đã gán Sales Staff, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Farms]
      summary: Danh sách Sales Staff của farm
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccess' } } } }

  /farms/{id}/houses:
    parameters: [{ $ref: '#/components/parameters/FarmId' }]
    post:
      tags: [Farms]
      summary: Tạo House trong farm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties: { name: { type: string }, floors: { type: integer }, description: { type: string } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/House' } } }] } } } }
    get:
      tags: [Farms]
      summary: Danh sách House của farm
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/House' } } } }] } } } }

  /farms/houses/{houseId}/zones:
    parameters: [{ $ref: '#/components/parameters/HouseId' }]
    post:
      tags: [Farms]
      summary: Tạo Zone trong house
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, floor: { type: integer } } }
      responses:
        '201': { description: Đã tạo, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/Zone' } } }] } } } }
    get:
      tags: [Farms]
      summary: Danh sách Zone của house
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/Zone' } } } }] } } } }

  /farms/zones/{zoneId}/thresholds:
    put:
      tags: [Farms]
      summary: Cập nhật ngưỡng cảnh báo/điều khiển của Zone (ENV-FR-006, lưu lịch sử ENV-FR-009)
      parameters: [{ $ref: '#/components/parameters/ZoneId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Thresholds' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/Zone' } } }] } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ── DEVICES ───────────────────────────────────────────────────────────────
  /devices/sensor-nodes/register:
    post:
      tags: [Devices]
      summary: "Đăng ký ESP32 Sensor Node vào 1 Zone — chỉ TECHNICIAN/ADMIN (FARM-FR-003)"
      description: |
        Bước 3-4 của Flow 1 (Web Console Onboarding). **Farm Owner không gọi được
        endpoint này** (403) — theo mô hình "công ty vận hành, khách hàng chỉ dùng",
        việc lắp đặt/kích hoạt thiết bị do Technician thực hiện tại hiện trường.

        Technician chỉ đăng ký được cho Farm thuộc `assigned_regions` của mình.
        Node tạo ra ở trạng thái `PENDING`, chỉ chuyển `ONLINE` khi thiết bị gửi
        heartbeat đầu tiên (Flow 1 bước 8).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, zone_id]
              properties: { device_id: { type: string, example: node_001 }, zone_id: { type: string } }
      responses:
        '201': { description: "Đã đăng ký (status=PENDING)", content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/SensorNode' } } }] } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /devices/sensor-nodes:
    get:
      tags: [Devices]
      summary: Danh sách ESP32 Sensor Node
      parameters:
        - name: zoneId
          in: query
          schema: { type: string }
          description: Lọc theo Zone
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/SensorNode' } } } }] } } } }

  /devices/sensor-nodes/{id}:
    get:
      tags: [Devices]
      summary: Chi tiết Sensor Node (FARM-FR-006 — firmware version, uptime, RSSI)
      parameters: [{ $ref: '#/components/parameters/NodeId' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/SensorNode' } } }] } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/sensor-nodes/{id}/thresholds:
    put:
      tags: [Devices]
      summary: Cập nhật ngưỡng qua device (tương đương PUT /farms/zones/:zoneId/thresholds), publish MQTT config/update
      parameters: [{ $ref: '#/components/parameters/NodeId' }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Thresholds' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ApiSuccess' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices/sensor-nodes/{id}/relay:
    post:
      tags: [Devices]
      summary: "Điều khiển relay — Manual Override (ENV-FR-016..018), FARM_OWNER/TECHNICIAN/ADMIN"
      description: |
        Publish MQTT `relay/command` tới ESP32, đặt `control_mode=MANUAL` và
        `override_expiry = now + durationMs`. Farm Owner dùng để vận hành hằng ngày,
        Technician dùng khi khắc phục sự cố (RACI mục 4.4). Gọi lại cùng trạng thái
        để gia hạn override (Flow 13 case 4a).
      parameters: [{ $ref: '#/components/parameters/NodeId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relayName, state]
              properties:
                relayName: { type: string, enum: [misting, speaker, ventilation, heating] }
                state: { type: boolean }
                durationMs: { type: integer, default: 1800000, description: "Thời gian override trước khi tự trả về AUTO (mặc định 30 phút)" }
      responses:
        '200': { description: Đã publish lệnh, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/SensorNode' } } }] } } } }
        '400': { description: relayName không hợp lệ, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /devices/camera-nodes/register:
    post:
      tags: [Devices]
      summary: "Đăng ký Raspberry Pi Camera Node — chỉ TECHNICIAN/ADMIN (FARM-FR-004, Flow 1b)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, zone_id]
              properties: { device_id: { type: string }, zone_id: { type: string }, rtsp_url: { type: string } }
      responses:
        '201': { description: Đã đăng ký, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/CameraNode' } } }] } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /devices/camera-nodes:
    get:
      tags: [Devices]
      summary: Danh sách Camera Node
      parameters:
        - name: zoneId
          in: query
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/CameraNode' } } } }] } } } }

  # ── TELEMETRY ─────────────────────────────────────────────────────────────
  /telemetry/zones/{id}/latest:
    get:
      tags: [Telemetry]
      summary: Giá trị cảm biến mới nhất của Zone (ENV-FR-004)
      parameters: [{ $ref: '#/components/parameters/ZoneIdPath' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { $ref: '#/components/schemas/Telemetry' } } }] } } } }
        '404': { description: Chưa có dữ liệu, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /telemetry/zones/{id}/history:
    get:
      tags: [Telemetry]
      summary: Lịch sử telemetry (ANALYTICS-FR-001)
      parameters:
        - { $ref: '#/components/parameters/ZoneIdPath' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/ApiSuccess' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/Telemetry' } } } }] } } } }

  # ── ALERTS (stub) ─────────────────────────────────────────────────────────
  /alerts:
    get:
      tags: [Alerts]
      summary: Danh sách cảnh báo (phân trang, filter)
      responses: { '501': { $ref: '#/components/responses/NotImplemented' } }

  /alerts/{id}:
    get:
      tags: [Alerts]
      summary: Chi tiết cảnh báo
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '501': { $ref: '#/components/responses/NotImplemented' } }

  /alerts/{id}/acknowledge:
    put:
      tags: [Alerts]
      summary: Xác nhận cảnh báo (ALERT-FR-009)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string } } }
      responses: { '501': { $ref: '#/components/responses/NotImplemented' } }

  # ── ANALYTICS (stub) ──────────────────────────────────────────────────────
  /analytics/bird-count/daily:
    get:
      tags: [Analytics]
      summary: Thống kê đếm chim hàng ngày
      parameters: [{ name: zoneId, in: query, required: true, schema: { type: string } }]
      responses: { '501': { $ref: '#/components/responses/NotImplemented' } }

  /analytics/bird-count/trends:
    get:
      tags: [Analytics]
      summary: Xu hướng đàn chim (VISION-FR-010)
      parameters: [{ name: zoneId, in: query, required: true, schema: { type: string } }]
      responses: { '501': { $ref: '#/components/responses/NotImplemented' } }

  /analytics/correlation:
    get:
      tags: [Analytics]
      summary: Tương quan môi trường vs return rate
      parameters: [{ name: zoneId, in: query, required: true, schema: { type: string } }]
      responses: { '501': { $ref: '#/components/responses/NotImplemented' } }

  # ── HARVESTS (stub) ───────────────────────────────────────────────────────
  /harvests:
    post:
      tags: [Harvests]
      summary: Tạo Harvest Batch (auto-attach env/flock snapshot — MARKET-FR-001/002/003)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [zone_id, harvest_date]
              properties: { zone_id: { type: string }, harvest_date: { type: string, format: date-time } }
      responses: { '501': { $ref: '#/components/responses/NotImplemented' } }
    get:
      tags: [Harvests]
      summary: Danh sách Harvest Batch của farm
      responses: { '501': { $ref: '#/components/responses/NotImplemented' } }

  /harvests/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Harvests]
      summary: Chi tiết Harvest Batch
      responses: { '501': { $ref: '#/components/responses/NotImplemented' } }
    put:
      tags: [Harvests]
