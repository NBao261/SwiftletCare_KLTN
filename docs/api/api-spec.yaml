openapi: 3.0.3

info:
  title: SwiftletCare API
  version: 1.0.0
  description: |
    REST API cho hệ thống SwiftletCare (giám sát/điều khiển môi trường nhà yến,
    đếm chim, cảnh báo, ticket, marketplace). Xem `SwiftletCare_SRS.md` §9.

    **Lưu ý:** SRS §9.0 quy ước base path `/api/v1`, nhưng code thực tế
    (`backend/src/config/app.ts`) hiện mount route trực tiếp ở root (vd
    `/auth/login`, không phải `/api/v1/auth/login`) — file này mô tả đúng
    path THẬT ĐANG CHẠY, không phải path lý thuyết trong SRS. Khi backend
    đổi sang có prefix `/api/v1`, cập nhật lại `servers` bên dưới.

    **Response envelope** dùng chung cho mọi endpoint:
    `{ success: boolean, data?, meta?: {page,limit,total}, error?: {code,message} }`.

    **Trạng thái triển khai (cập nhật sau khi hoàn thành các module nghiệp vụ
    Farm Owner — xem `SwiftletCare_SRS.md` cột "Trạng thái Backend" ở mục 5):**
    Auth, Farms, Devices, Telemetry, Alerts, Analytics, Harvests, Marketplace,
    Tickets đã có logic thật phía sau (không còn stub). Riêng module **Sales**
    (tag `Sales`, Giai đoạn 2 — SALES-FR-001..016) vẫn là stub, trả
    `501 { success:false, error:{code:"NOT_IMPLEMENTED"} }`; schema mô tả ở đó
    là *hợp đồng dự kiến* theo SRS, chưa cài đặt vì không bắt buộc nghiệm thu
    KLTN (SRS §2.4).

servers:
  - url: http://localhost:3000
    description: Local dev (docker-compose mongodb + emqx)

tags:
  - name: Auth
    description: AUTH-FR-001..003/004/005/005b/009/010/012 (đăng ký/đăng nhập/JWT/quên-đặt lại mật khẩu/lời mời/yêu cầu xoá tài khoản)
  - name: Admin
    description: AUTH-FR-005c/007/011/012, TICKET-FR-005b, OPS-NFR-004 (quản lý tài khoản, khoá/mở khoá, xử lý yêu cầu xoá, tạo Technician/Sales Staff, can thiệp ticket toàn quyền, dashboard trạng thái node toàn hệ thống) — mọi endpoint chỉ ADMIN
  - name: System
    description: SYSTEM-FR-001..003 (Module SYSTEM §5.11 — xem audit log, ngưỡng mặc định hệ thống, tổng quan sức khỏe hệ thống) — mọi endpoint chỉ ADMIN
  - name: Farms
    description: FARM-FR-001..002/007, AUTH-FR-005/005b/010 (farm/house/zone/member/sales-staff/invitation)
  - name: Devices
    description: FARM-FR-003..007, ENV-FR-006/015..018 (sensor/camera node, relay control)
  - name: Telemetry
    description: ENV-FR-001..005
  - name: Alerts
    description: ALERT-FR-001/002/006/007/008/009 (Alert Engine — dedup, quiet hours, danh sách, xác nhận)
  - name: Analytics
    description: ANALYTICS-FR-001..005, VISION-FR-008..011 (biểu đồ môi trường, so sánh đa Zone, đếm chim/return-rate — chờ dữ liệu thật từ module VISION)
  - name: Harvests
    description: MARKET-FR-001..005 (Harvest Batch — tự gắn env/flock snapshot + trace code)
  - name: Marketplace
    description: MARKET-FR-006..013 (Nest Listing, Traceability Card, truy xuất nguồn gốc, liên hệ)
  - name: Tickets
    description: TICKET-FR-001..004b/006/007/009..012 (tạo/định tuyến/SLA/SAT checklist/KPI)
  - name: Sales
    description: SALES-FR-001..016 — Giai đoạn 2, stretch (stub, chưa cài đặt)

security:
  - bearerAuth: []

paths:
  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                full_name: { type: string }
                phone: { type: string }
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập (email/password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Đăng nhập thành công — refreshToken trả qua httpOnly cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Tài khoản bị Admin khoá (AUTH-FR-011, Flow 19 bước 4). Chỉ trả sau
            khi mật khẩu đúng — sai mật khẩu vẫn là 401, không lộ trạng thái khoá.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                error:
                  code: ACCOUNT_DISABLED
                  message: "Tài khoản đã bị khoá. Lý do: Vi phạm điều khoản sử dụng"
                  details: { reason: "Vi phạm điều khoản sử dụng" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới Access Token bằng refreshToken cookie
      security: []
      responses:
        "200":
          description: Access token mới
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      {
                        data:
                          {
                            type: object,
                            properties: { accessToken: { type: string } },
                          },
                      }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất — thu hồi refreshToken hiện tại
      responses:
        "200":
          {
            description: Đã đăng xuất,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Gửi OTP về email (dev hiện chỉ log ra console, chưa nối SMTP/Zalo thật)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email],
                properties: { email: { type: string, format: email } },
              }
      responses:
        "200":
          {
            description: Đã gửi (hoặc im lặng nếu email không tồn tại),
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Xác thực OTP, trả accessToken
      description: |
        Tài khoản bị Admin khoá cũng bị chặn ở đây giống `/auth/login`, trả 403
        `ACCOUNT_DISABLED` kèm `details.reason` (AUTH-FR-011, Flow 19 bước 4).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                {
                  email: { type: string, format: email },
                  otp: { type: string },
                }
      responses:
        "200":
          description: OTP hợp lệ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          {
                            accessToken: { type: string },
                            user: { $ref: "#/components/schemas/User" },
                          }
        "400":
          {
            description: OTP sai hoặc hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: "Quên mật khẩu — gửi mã đặt lại (AUTH-FR-009, Flow 11 bước 6)"
      security: []
      description: |
        Luôn trả 200 kể cả khi email không tồn tại, để không lộ thông tin tài
        khoản (Flow 11 case 1a). Mã có TTL 15 phút, dùng 1 lần. Dev hiện chỉ
        log ra console (`[DEV RESET]`), chưa nối SMTP/Zalo thật.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email],
                properties: { email: { type: string, format: email } },
              }
      responses:
        "200":
          {
            description: "Nếu email tồn tại, mã đặt lại đã được gửi",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: "Đặt mật khẩu mới bằng mã đã nhận (AUTH-FR-009, Flow 11 bước 7)"
      security: []
      description: |
        Đổi mật khẩu thành công sẽ thu hồi TOÀN BỘ refresh token cũ của user
        (đá khỏi mọi thiết bị khác đang đăng nhập), không chỉ chặn đăng nhập mới.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, newPassword]
              properties:
                email: { type: string, format: email }
                token:
                  {
                    type: string,
                    description: "Mã 6 số nhận được từ /auth/forgot-password",
                  }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          {
            description: Đã đổi mật khẩu,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "400":
          {
            description: Mã đặt lại không đúng hoặc đã hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/notification-preferences:
    put:
      tags: [Auth]
      summary: "Cấu hình kênh nhận thông báo + giờ im lặng (ALERT-FR-005/006)"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                push: { type: boolean }
                zalo: { type: boolean }
                sms: { type: boolean }
                quiet_hours:
                  type: object
                  properties:
                    {
                      start: { type: string, example: "22:00" },
                      end: { type: string, example: "06:00" },
                    }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/User" } },
                            },
                          ],
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/delete-request:
    post:
      tags: [Auth]
      summary: "Yêu cầu xoá tài khoản/dữ liệu cá nhân (AUTH-FR-012, PRIV-NFR-003)"
      description: |
        Chỉ ĐÁNH DẤU `deletion_requested_at` — việc xoá thật (kèm quy tắc
        cascade chuyển Primary Owner / xoá mềm Farm) do Administrator xử lý
        trong ≤ 30 ngày (Flow 19), **chưa có endpoint xử lý phía Admin**.
      responses:
        "200":
          {
            description: Đã ghi nhận yêu cầu,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          {
            description: Đã có yêu cầu xoá trước đó đang chờ xử lý,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  # ── ADMIN ─────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: "Danh sách tài khoản, lọc theo role/trạng thái (AUTH-FR-011) — chỉ ADMIN"
      parameters:
        - { name: role, in: query, schema: { $ref: "#/components/schemas/Role" } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{id}/status:
    put:
      tags: [Admin]
      summary: "Khoá/mở khoá tài khoản (AUTH-FR-011, Flow 19) — chỉ ADMIN"
      description: |
        Bắt buộc `reason` khi khoá (`is_active=false`); không bắt buộc khi mở
        khoá. Middleware `authenticate` chặn ngay request kế tiếp của user này
        dù access token còn hạn — không cần đợi token hết hạn tự nhiên.
        Admin không tự khoá được chính mình, nhờ vậy hệ thống luôn còn ít nhất
        1 Admin đang hoạt động (Flow 19 case 2a).

        Khi khoá: thu hồi mọi refresh token và ngắt các kết nối Socket.io đang
        mở của user (kết nối mới bằng access token còn hạn cũng bị từ chối). Nếu
        user là Technician còn ticket đang giao, response kèm
        `meta.openTickets` (số ticket chưa đóng) để Admin gán lại bằng
        `PUT /tickets/{id}/admin-override`.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
                  description: "Chuỗi \"true\"/\"false\"/\"1\"/\"0\" cũng được chấp nhận và ép về boolean trước khi xử lý"
                reason: { type: string, description: "Bắt buộc khi is_active=false" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "400":
          description: "Thiếu reason khi khoá tài khoản, hoặc Admin tự khoá chính mình"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/delete-requests:
    get:
      tags: [Admin]
      summary: "Danh sách yêu cầu xoá tài khoản đang chờ xử lý (AUTH-FR-012) — chỉ ADMIN"
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/delete-requests/{id}/complete:
    put:
      tags: [Admin]
      summary: "Xác nhận hoàn tất xử lý xoá tài khoản (AUTH-FR-012, Flow 19 bước 7-8) — chỉ ADMIN"
      description: |
        Cascade: Farm mà user là Primary Owner còn thành viên khác → chuyển
        `owner_id` cho người có `joined_at` sớm nhất; hết thành viên → xoá mềm
        Farm. Gỡ user khỏi `members` của các Farm khác nếu chỉ là thành viên
        thường. Anonymize email/phone/full_name, không xoá document (giữ FK
        cho lịch sử ticket/farm). Xử lý xong thì gỡ `deletion_requested_at` —
        tài khoản rời khỏi `GET /admin/delete-requests` và không xử lý lại được.

        Còn ticket đang mở (được giao cho user, do user tạo, hoặc thuộc Farm sẽ
        bị xoá mềm) thì trả 409 `HAS_OPEN_TICKETS` kèm `error.details.openTickets`
        (Flow 19 bước 7c) — xử lý xong ticket rồi gọi lại, hoặc gửi `force: true`
        để vẫn xoá. Mỗi Farm được chuyển chủ/xoá mềm có 1 bản ghi audit riêng
        (`FARM_OWNERSHIP_TRANSFERRED`, `FARM_SOFT_DELETED`) và chủ mới cùng người bị
        xoá nhận thông báo; kết nối Socket.io của user bị ngắt. Cũng dọn các liên
        kết trỏ tới user: xoá `SalesAssignment` của Sales Staff bị xoá, từ chối
        (`REJECTED`, kèm lý do) các đề xuất Sales Staff đang chờ do hoặc về user đó,
        cho hết hạn (`EXPIRED`) các lời mời đang chờ user đã gửi, đặt `deleted_at`
        (tài khoản đã xoá không khoá/mở khoá lại được, 409). Audit `ACCOUNT_DELETED`
        ghi `farmsTransferred`, `farmsDeleted`, `salesAssignmentsRemoved`, `forced`. Nếu lỗi giữa chừng
        (Mongo standalone, không transaction) thì gọi lại được: farm đã xử lý xong
        không bị xử lý lần nữa.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: "true = bỏ qua cảnh báo ticket đang mở và vẫn xoá"
      responses:
        "200":
          description: "Đã xử lý xong (anonymized)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "400":
          description: "Người dùng chưa gửi yêu cầu xoá / yêu cầu đã được xử lý / Admin tự xử lý tài khoản của chính mình"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "HAS_OPEN_TICKETS — user còn ticket đang mở, kèm `error.details.openTickets`; gửi `force: true` để vẫn xoá"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/technicians:
    post:
      tags: [Admin]
      summary: "Admin tự tạo tài khoản Technician + gán khu vực phụ trách (AUTH-FR-005c, Flow 16) — chỉ ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name, assigned_regions]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                full_name: { type: string }
                phone: { type: string }
                assigned_regions:
                  type: array
                  items: { type: string }
                  example: ["HCMC", "Long An"]
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/technicians/{id}/regions:
    put:
      tags: [Admin]
      summary: "Điều chỉnh khu vực phụ trách của Technician (AUTH-FR-005c, Flow 21 case 4a-x) — chỉ ADMIN"
      description: |
        Thay toàn bộ `assigned_regions` (giá trị được trim + bỏ trùng). Có hiệu
        lực ngay ở request kế tiếp của Technician, không cần đăng nhập lại.
        Lưu ý: phải ghi khớp đúng `farms.region` (VD `HCMC` ≠ `Hồ Chí Minh`).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigned_regions]
              properties:
                assigned_regions:
                  type: array
                  minItems: 1
                  items: { type: string }
                  example: ["HCMC", "Long An"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "400":
          description: "Tài khoản không phải Technician"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/farms/{farmId}/sales-staff/{salesStaffId}:
    delete:
      tags: [Admin]
      summary: "Gỡ Sales Staff khỏi 1 farm (Flow 16 case 1e) — chỉ ADMIN"
      description: |
        Chỉ xoá bản ghi gán (`SalesAssignment`). Tài khoản Sales Staff (có thể
        còn gán ở farm khác) và Order/Product đã tạo trước đó giữ nguyên.
      parameters:
        - { name: farmId, in: path, required: true, schema: { type: string } }
        - { name: salesStaffId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Đã gỡ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccess" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "Sales Staff này không được gán vào farm"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/sales-staff:
    post:
      tags: [Admin]
      summary: "Admin tự tạo tài khoản Sales Staff + gán thẳng vào Farm (AUTH-FR-005c, Flow 16 bước 1a) — chỉ ADMIN"
      description: |
        Đường chính thức để có Sales Staff (từ SRS v1.16.0, Sales Staff là nhân
        sự phía công ty). Đường phụ là duyệt đề xuất của Farm Owner qua
        `/admin/sales-staff-requests`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name, farm_ids]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                full_name: { type: string }
                phone: { type: string }
                farm_ids: { type: array, items: { type: string } }
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/sales-staff-requests:
    get:
      tags: [Admin]
      summary: "Danh sách đề xuất thêm / yêu cầu gỡ Sales Staff từ Farm Owner (AUTH-FR-005d) — chỉ ADMIN"
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED] } }
        - name: type
          in: query
          description: "ADD gồm cả đề xuất tạo trước khi có field `type`"
          schema: { type: string, enum: [ADD, REMOVE] }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK (populate farm_id, requested_by, sales_staff_id — chỉ với REMOVE —, reviewed_by)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/SalesAssignmentRequest" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/sales-staff-requests/{id}/decision:
    put:
      tags: [Admin]
      summary: "Duyệt hoặc từ chối đề xuất Sales Staff (AUTH-FR-005d, Flow 16) — chỉ ADMIN"
      description: |
        - `APPROVED`: email chưa có tài khoản thì tạo tài khoản SALES_STAFF với
          mật khẩu ngẫu nhiên và gửi mã đặt lại mật khẩu (luồng AUTH-FR-009;
          dev chỉ log `[DEV RESET]` ra console); sau đó tạo `SalesAssignment`
          với `requested_via` trỏ về đề xuất này.
        - `REJECTED`: bắt buộc `reason`, lưu vào `review_note` để Farm Owner xem.
        - Đề xuất `type=REMOVE` (Farm Owner yêu cầu gỡ, Flow 16 bước 1e):
          `APPROVED` chỉ xoá `SalesAssignment` của farm đó (không đụng tài khoản
          Sales Staff), coi như xong nếu đã gỡ từ trước; `REJECTED` giữ nguyên
          phân công và cũng bắt buộc `reason`.

        Nhận quyền xử lý nguyên tử TRƯỚC khi tạo/xoá bất cứ thứ gì: hai Admin xử
        lý đồng thời cùng một đề xuất (dù cùng hay khác quyết định) thì chỉ 1
        người thành công và chạm vào tài khoản/phân công, người còn lại nhận 409
        mà không để lại tác dụng phụ. Nếu bước thực thi lỗi (VD email thuộc tài
        khoản không phải Sales Staff, farm đã bị xoá) thì đề xuất được trả về
        `PENDING` để xử lý lại hoặc từ chối; các điều kiện biết trước (farm còn
        tồn tại, email không thuộc tài khoản khác role) được kiểm tra TRƯỚC khi
        nhận quyền xử lý nên không để lại dấu vết. Đề xuất kẹt ở `APPROVED` mà chưa
        có tác dụng nào (tiến trình chết giữa chừng) được duyệt lại sau 60 giây để
        làm nốt phần còn thiếu; trong 60 giây đó người thứ hai nhận 409. Farm Owner
        nhận thông báo kết quả (kèm lý do nếu bị từ chối).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [APPROVED, REJECTED] }
                reason: { type: string, description: "Bắt buộc khi REJECTED" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SalesAssignmentRequest" } }
        "400":
          description: "Từ chối mà thiếu reason"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Đề xuất đã được xử lý trước đó, hoặc email thuộc tài khoản không phải Sales Staff"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── SYSTEM ────────────────────────────────────────────────────────────────
  /system/audit-logs:
    get:
      tags: [System]
      summary: "Xem/lọc Audit Log toàn hệ thống (SYSTEM-FR-001) — chỉ ADMIN"
      description: |
        Các action đang được ghi: LOGIN, LOGIN_FAILED, PASSWORD_RESET,
        ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, DELETION_REQUESTED, ACCOUNT_DELETED,
        FARM_OWNERSHIP_TRANSFERRED, FARM_SOFT_DELETED, USER_CREATED,
        TECHNICIAN_REGIONS_UPDATED, THRESHOLD_UPDATED, DEFAULT_THRESHOLDS_UPDATED,
        RELAY_OVERRIDE, RELAY_OVERRIDE_CLEARED, SPEAKER_SCHEDULE_UPDATED,
        AUDIO_TRACK_UPLOADED/SYNC_UPDATED/SELECTED/DELETED, DEVICE_REGISTERED, DEVICE_REASSIGNED, TICKET_ADMIN_OVERRIDE,
        SALES_STAFF_REQUEST_APPROVED/REJECTED, SALES_STAFF_UNASSIGNED.
        Mỗi bản ghi có `ip_address` của request gây ra hành động (rỗng nếu do hệ
        thống tự thực hiện).
      parameters:
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string, example: LOGIN_FAILED } }
        - { name: targetType, in: query, schema: { type: string, example: user } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK (mới nhất trước)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/settings/default-thresholds:
    get:
      tags: [System]
      summary: "Xem ngưỡng mặc định hệ thống (SYSTEM-FR-002, ENV-FR-007) — chỉ ADMIN"
      description: Chưa từng cấu hình thì trả giá trị gốc (khớp firmware Config.h).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Thresholds" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [System]
      summary: "Chỉnh ngưỡng mặc định hệ thống (SYSTEM-FR-002) — chỉ ADMIN"
      description: |
        Gửi 1 phần hoặc cả 7 trường, phần còn lại giữ nguyên. Đây là nguồn
        Farm Owner dùng khi "Reset về mặc định" 1 Zone (ENV-FR-020) — KHÔNG tự
        áp xuống các Zone đang chạy. Mọi thay đổi ghi audit log. Mỗi giá trị phải nằm
        trong khoảng đo của cảm biến tương ứng (nhiệt −40..125°C, ẩm 0..100%,
        ánh sáng ≤ 200.000 lux, NH3 ≤ 500 ppm, CO2 ≤ 5000 ppm), nếu không 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Thresholds" }
      responses:
        "200":
          description: Giá trị sau khi cập nhật
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Thresholds" } }
        "400":
          description: "min >= max, giá trị âm, hoặc kết quả sau khi gộp với giá trị hiện tại vượt khoảng đo cảm biến"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/settings/sla:
    get:
      tags: [System]
      summary: "Xem SLA theo mức ưu tiên (TICKET-FR-006, SLA-NFR-001) — chỉ ADMIN"
      description: Chưa cấu hình thì trả giá trị đề xuất trong SRS (P1 0.5/4h, P2 4/24h, P3 24/72h).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SlaConfig" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [System]
      summary: "Chỉnh SLA theo mức ưu tiên (TICKET-FR-006) — chỉ ADMIN"
      description: |
        Gửi 1 phần hoặc cả 3 mức, phần còn lại giữ nguyên. Áp dụng cho ticket
        tạo MỚI và cho ticket được Admin đổi priority; ticket cũ giữ hạn đã tính.
        Job nền so `sla_resolve_due_at` mỗi 2 phút để đánh dấu vượt hạn
        (TICKET-FR-009, SLA-NFR-002).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaConfig" }
      responses:
        "200":
          description: Giá trị sau khi cập nhật
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SlaConfig" } }
        "400":
          description: "Giá trị ≤ 0, hoặc hạn phản hồi muộn hơn hạn xử lý"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/health-overview:
    get:
      tags: [System]
      summary: "Tổng quan sức khỏe hệ thống (SYSTEM-FR-003) — chỉ ADMIN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          farms: { type: object, properties: { total: { type: integer } } }
                          zones: { type: object, properties: { total: { type: integer } } }
                          devices: { $ref: "#/components/schemas/DeviceStatusSummary" }
                          openTickets:
                            type: object
                            description: Ticket chưa CLOSED theo priority
                            properties:
                              total: { type: integer }
                              P1: { type: integer }
                              P2: { type: integer }
                              P3: { type: integer }
                          users:
                            type: object
                            properties:
                              total: { type: integer }
                              active: { type: integer }
                              inactive: { type: integer }
                              byRole:
                                type: object
                                additionalProperties:
                                  type: object
                                  properties:
                                    active: { type: integer }
                                    inactive: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── FARMS ─────────────────────────────────────────────────────────────────
  /farms:
    get:
      tags: [Farms]
      summary: Danh sách farm của user hiện tại
      description: |
        - FARM_OWNER: các farm mình sở hữu hoặc là thành viên
        - TECHNICIAN: các farm có `region` nằm trong `assigned_regions` của mình (để chọn Farm→House→Zone khi onboarding — Flow 1 bước 2)
        - ADMIN: tất cả
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        { $ref: "#/components/schemas/Farm" },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
    post:
      tags: [Farms]
      summary: Tạo farm mới (người tạo trở thành Primary Owner) — FARM_OWNER/ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name: { type: string }
                address: { type: string }
