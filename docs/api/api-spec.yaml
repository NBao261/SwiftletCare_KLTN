  /farms/zones/{zoneId}/fuzzy-tuning:
    put:
      tags: [Farms]
      summary: "Chỉnh hệ số bộ điều khiển mờ của Zone (ENV-FR-021) — FARM_OWNER/DOMAIN_EXPERT"
      description: |
        Gửi 1 hoặc nhiều trong 4 hệ số; server gộp với giá trị hiện tại, kiểm tra khoảng
        (400 nếu vi phạm hoặc không có khoá hợp lệ nào), lưu `fuzzy_tuning_history`, ghi audit
        `FUZZY_TUNING_UPDATED` rồi publish MQTT `config/update` (4 key `fuzzy_*`) để mọi ESP32
        trong Zone áp dụng ngay — không cần nạp lại firmware. Khoá lạ bị bỏ qua.
        Technician, Administrator → 403 (Report 3 §2.4). Lịch sử ghi `source=MANUAL`.
        EXPERT-FR-010 — farm có Domain Expert mà Farm Owner sửa: thay đổi vẫn áp dụng ngay và mở
        (hoặc cập nhật, giữ giá trị gốc) 1 mục duyệt `PENDING_REVIEW` cho chuyên gia; chuyên gia sửa
        cùng nhóm thì mục đang chờ đóng `ADJUSTED`. Farm chưa có chuyên gia: không mở mục duyệt.
        Mọi lần sửa hệ số (Farm Owner hay Domain Expert) đều chuyển đề xuất `PROPOSED` của Zone sang
        `SUPERSEDED` (EXPERT-FR-011), để duyệt đề xuất cũ không ghi đè chỉnh sửa vừa làm.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FuzzyTuning" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Zone" }
        "400":
          description: "Hệ số ngoài khoảng hợp lệ / không phải số / body không có hệ số nào"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "Role không được sửa hệ số (TECHNICIAN, ADMIN) hoặc không có quyền trên Zone này"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /farms/houses/{houseId}/bird-count-tuning:
    put:
      tags: [Farms]
      summary: "Chỉnh mức giảm tỷ lệ chim về của nhà yến (EXPERT-FR-008, SRS v2.1.8) — DOMAIN_EXPERT; FARM_OWNER khi farm chưa có chuyên gia (BR-22)"
      description: |
        Farm Owner trên farm đã có Domain Expert → 403. Thay đổi của Domain Expert báo trong app cho mọi
        Farm Owner và vào lịch sử hoạt động (EXPERT-FR-009).
        Chim ra vào ở cửa của cả nhà yến nên số đếm, tỷ lệ chim về và cảnh báo `LOW_RETURN_RATE` tính theo
        House; mức giảm cho phép đặt ở đây (mặc định 20%, khoảng 5–50%). Lưu `bird_count_tuning_history`,
        ghi audit `BIRD_COUNT_TUNING_UPDATED`. Backend dùng, không gửi xuống thiết bị.
      parameters: [{ name: houseId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BirdCountTuning" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/House" }
        "400": { description: "Ngoài khoảng 5–50 / không phải số / body không có tham số nào" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /farms/houses/{houseId}/health-levels:
    get:
      tags: [Farms]
      summary: "Mức chỉ số sức khỏe của nhà yến (ANALYTICS-FR-012, BR-28) — FARM_OWNER, DOMAIN_EXPERT"
      parameters: [{ name: houseId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: "Mức đang dùng (thiếu trường nào thì là mặc định) kèm mặc định"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthLevels" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Farms]
      summary: "Đặt mức chỉ số sức khỏe của nhà yến (ANALYTICS-FR-012, BR-28) — DOMAIN_EXPERT; FARM_OWNER khi farm chưa có chuyên gia (BR-22)"
      description: |
        Farm Owner trên farm đã có Domain Expert → 403. Gửi 1 hoặc nhiều mức; server gộp với giá trị
        hiện tại rồi kiểm khoảng BR-28 (50–100 %, 0,5–12 giờ, 1–10 đợt) và thứ tự (mức CLEAR không được
        nhẹ hơn mức SLIGHT) — vi phạm hoặc không có khoá hợp lệ nào → 400. Mức đàn chim là
        `return_rate_drop_pct` (`PUT /farms/houses/{houseId}/bird-count-tuning`): SLIGHT từ một nửa,
        CLEAR từ đúng mức đó. Ghi audit `HEALTH_LEVELS_UPDATED`; thay đổi của Domain Expert báo trong app
        cho mọi Farm Owner và vào lịch sử hoạt động (EXPERT-FR-009). Áp từ lần đánh giá kế tiếp.
      parameters: [{ name: houseId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealthLevels" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthLevels" }
        "400": { description: "Ngoài khoảng / CLEAR nhẹ hơn SLIGHT / không phải số / body không có mức nào", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /farms/zones/{zoneId}/detection-tuning:
    put:
      tags: [Farms]
      summary: "Chỉnh tham số phát hiện của Zone (EXPERT-FR-008) — DOMAIN_EXPERT; FARM_OWNER khi farm chưa có chuyên gia (BR-22)"
      description: |
        Farm Owner trên farm đã có Domain Expert → 403. Thay đổi của Domain Expert báo trong app cho mọi
        Farm Owner và vào lịch sử hoạt động (EXPERT-FR-009).
        Gửi 1 hoặc nhiều trong 5 tham số; server gộp với giá trị hiện tại, kiểm tra khoảng
        (400 nếu vi phạm hoặc không có khoá hợp lệ nào), lưu `detection_tuning_history`
        (người sửa, role, thời điểm, cũ/mới), ghi audit `DETECTION_TUNING_UPDATED` rồi publish
        MQTT `config/update` với 5 tham số chạy trên ESP32 (firmware ≥ 1.3.0 kẹp lại và lưu
        NVS). "Về mặc định" = gửi lại bộ giá trị mặc định. Farm Owner xem qua `GET /farms/zones/{zoneId}`.
        SRS v2.1.8: mức giảm tỷ lệ chim về (`return_rate_drop_pct`) chuyển sang House —
        `PUT /farms/houses/{houseId}/bird-count-tuning`; gửi khoá này ở đây bị bỏ qua như khoá lạ.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DetectionTuning" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Zone" }
        "400":
          description: "Tham số ngoài khoảng hợp lệ / không phải số / body không có tham số nào"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /farms/zones/{zoneId}/fuzzy-tuning/apply-suggestion:
    post:
      tags: [Farms]
      summary: "Áp gợi ý hệ số của hệ thống (ANALYTICS-FR-010, EXPERT-FR-011) — DOMAIN_EXPERT; FARM_OWNER khi farm chưa có chuyên gia (BR-22)"
      description: |
        Server tính gợi ý hiện tại (như `GET /analytics/control/suggestion`) rồi áp ngay như ENV-FR-021,
        lịch sử ghi `source=SUGGESTION_APPROVED`. Farm Owner trên farm đã có Domain Expert → 403, hệ số
        giữ nguyên — phải gửi đề xuất (`POST /expert-activity/proposals`). Không có gợi ý (dữ liệu ít, mô
        hình kém, hệ số hiện tại đã tốt) → 409 kèm lý do. Đề xuất `PROPOSED` của Zone chuyển `SUPERSEDED`.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      responses:
        "200":
          description: Zone sau khi áp gợi ý
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Zone" }
        "403": { description: "Không có quyền trên Zone, hoặc Farm Owner trên farm đã có Domain Expert", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Hiện không có gợi ý — message nêu lý do", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /farms/zones/{zoneId}/thresholds:
    put:
      tags: [Farms]
      summary: "Cập nhật ngưỡng cảnh báo/điều khiển của Zone (ENV-FR-006, lưu lịch sử ENV-FR-009) — FARM_OWNER/DOMAIN_EXPERT"
      description: |
        Kiểm tra từng cặp min<max và khoảng đo của từng cảm biến (nhiệt −40..125°C,
        ẩm 0..100%, ánh sáng ≤ 200.000 lux, NH3 ≤ 500 ppm, CO2 ≤ 5000 ppm) — 400 nếu vi phạm.
        Technician, Administrator → 403 (Report 3 §2.4).
        EXPERT-FR-010 — farm có Domain Expert mà Farm Owner sửa: thay đổi vẫn áp dụng ngay và mở
        (hoặc cập nhật, giữ giá trị gốc) 1 mục duyệt `PENDING_REVIEW` cho chuyên gia; chuyên gia sửa
        cùng nhóm thì mục đang chờ đóng `ADJUSTED`. Farm chưa có chuyên gia: không mở mục duyệt.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Thresholds" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Zone" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }

  /farms/zones/{zoneId}/thresholds/reset:
    put:
      tags: [Farms]
      summary: "Reset ngưỡng của Zone về mặc định hệ thống (ENV-FR-020, Flow 22 nhánh B) — FARM_OWNER/DOMAIN_EXPERT"
      description: |
        Technician, Administrator → 403 (Report 3 §2.4).
        Ghi đè cả 7 ngưỡng của Zone bằng `system_settings.default_thresholds` hiện
        hành (chưa cấu hình thì dùng giá trị gốc khớp firmware), thêm 1 bản ghi
        `threshold_history` với `source=RESET_TO_DEFAULT`, publish `config/update`
        xuống thiết bị và ghi audit log `THRESHOLD_UPDATED`.
        EXPERT-FR-010 — farm có Domain Expert mà Farm Owner sửa: thay đổi vẫn áp dụng ngay và mở
        (hoặc cập nhật, giữ giá trị gốc) 1 mục duyệt `PENDING_REVIEW` cho chuyên gia; chuyên gia sửa
        cùng nhóm thì mục đang chờ đóng `ADJUSTED`. Farm chưa có chuyên gia: không mở mục duyệt.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      responses:
        "200":
          description: Zone sau khi reset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Zone" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── DEVICES ───────────────────────────────────────────────────────────────
  /devices/sensor-nodes/register:
    post:
      tags: [Devices]
      summary: "Đăng ký ESP32 Sensor Node vào 1 Zone — FARM_OWNER/TECHNICIAN (FARM-FR-003, MF-10)"
      description: |
        Farm Owner tự setup thiết bị ở farm của mình (MF-10): Zone thuộc farm khác → 403
        (FARM-FR-007). Technician hỗ trợ; Administrator, Domain Expert → 403 (Report 3 §2.4).

        Technician đăng ký được ở mọi farm, không cần là thành viên (FARM-FR-009); mỗi lần
        Technician đăng ký, các Farm Owner của farm nhận một thông báo trong app.
        Phải nhập đúng cặp `{device_id, secret_key}` in trên nhãn thiết bị (do Admin
        cấp qua `POST /admin/provisioned-devices`, không phân biệt hoa/thường).
        Node tạo ra ở trạng thái `PENDING`, chỉ chuyển `ONLINE` khi thiết bị gửi
        heartbeat đầu tiên (Flow 1 bước 8). Quá 15 phút chưa có heartbeat thì node
        được gắn `activation_overdue_at` và người đăng ký nhận thông báo (case 8a).
        Thiết bị đã gỡ (FARM-FR-008) đăng ký lại được — bản ghi cũ đổi tên, giữ lịch sử.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, zone_id, secret_key]
              properties:
                {
                  device_id: { type: string, example: node_002 },
                  zone_id: { type: string },
                  secret_key: { type: string, example: DEMO-NODE-0002, description: "In trên nhãn thiết bị (seed dev: node_002 / DEMO-NODE-0002)" },
                }
      responses:
        "201":
          {
            description: "Đã đăng ký (status=PENDING)",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/SensorNode" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          description: "Mã kích hoạt không đúng (sai secret_key hoặc device_id không có trong kho) — Flow 1 case 3a"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "\"Thiết bị đã thuộc về Farm khác\" hoặc \"device_id đã được đăng ký\" trong cùng Farm"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes:
    get:
      tags: [Devices]
      summary: Danh sách ESP32 Sensor Node
      description: "Thiết bị của các farm user là thành viên; Technician: mọi farm (FARM-FR-009); Administrator: rỗng."
      parameters:
        - name: zoneId
          in: query
          schema: { type: string }
          description: Lọc theo Zone
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        {
                                          $ref: "#/components/schemas/SensorNode",
                                        },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }

  /devices/sensor-nodes/{id}:
    get:
      tags: [Devices]
      summary: Chi tiết Sensor Node (FARM-FR-006 — firmware version, uptime, RSSI)
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
