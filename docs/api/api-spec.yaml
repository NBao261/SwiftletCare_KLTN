openapi: 3.0.3

info:
  title: SwiftletCare API
  version: 1.0.0
  description: |
    REST API cho hệ thống SwiftletCare (giám sát/điều khiển môi trường nhà yến,
    đếm chim, cảnh báo, kiểm chứng của chuyên gia, ghi nhận thu hoạch, ticket).
    Xem `SwiftletCare_SRS.md` §9.

    **Lưu ý:** SRS §9.0 quy ước base path `/api/v1`, nhưng code thực tế
    (`backend/src/config/app.ts`) hiện mount route trực tiếp ở root (vd
    `/auth/login`, không phải `/api/v1/auth/login`) — file này mô tả đúng
    path THẬT ĐANG CHẠY, không phải path lý thuyết trong SRS. Khi backend
    đổi sang có prefix `/api/v1`, cập nhật lại `servers` bên dưới.

    **Response envelope** dùng chung cho mọi endpoint:
    `{ success: boolean, data?, meta?: {page,limit,total}, error?: {code,message} }`.

    **Trạng thái triển khai (cập nhật sau khi hoàn thành các module nghiệp vụ
    Farm Owner — xem `SwiftletCare_SRS.md` cột "Trạng thái Backend" ở mục 5):**
    Auth, Farms, Devices, Telemetry, Alerts, Analytics, Harvests, HealthReports,
    Tickets đều có logic thật phía sau.

    **Phạm vi SRS v2 (sau Review 1) — file này đã theo phạm vi mới:**
    - Role `DOMAIN_EXPERT` thay `FARM_OPERATOR`: chuyên gia nuôi yến do Primary Owner
      mời, phạm vi cả farm (không còn `zone_ids`, không còn
      `PUT /farms/{id}/members/{userId}`). Chỉ đọc dữ liệu vận hành; sửa ngưỡng, hệ số
      mờ và tham số phát hiện; kiểm chứng cảnh báo suy luận; viết kết luận. Không
      relay/loa, ticket, ghi thu hoạch hay xác nhận cảnh báo.
    - Không còn `/marketplace/*`; chỉ ghi nhận thu hoạch (`/harvests`).
    - Relay chỉ còn `misting`, `speaker`, `ventilation` (bỏ `heating`).
    - NH3/CO2 chỉ cảnh báo (`THRESHOLD_BREACH` mức MEDIUM, không sinh ticket);
      loại cảnh báo `NOISE_ANOMALY` thay `BIRD_PANIC`.
    - Mới: `PUT /alerts/{id}/verdict`, `GET /alerts/verdict-stats`,
      `PUT /farms/zones/{zoneId}/detection-tuning`,
      `GET /devices/sensor-nodes/{id}/relay-overrides`, `GET /analytics/autonomy`,
      `/health-reports`, `/auth/telegram/link`.
    - Chưa có trong file này (thuộc đợt đếm chim): `GET /analytics/bird-count/buckets`,
      stream token của camera.

servers:
  - url: http://localhost:3000
    description: Local dev (docker-compose mongodb + emqx)

tags:
  - name: Auth
    description: AUTH-FR-001..003/004/005/009/010/012 (đăng ký/đăng nhập/JWT/quên-đặt lại mật khẩu/lời mời/yêu cầu xoá tài khoản)
  - name: Admin
    description: AUTH-FR-005c/007/011/012, TICKET-FR-005b, OPS-NFR-004 (quản lý tài khoản, khoá/mở khoá, xử lý yêu cầu xoá, tạo Technician, can thiệp ticket toàn quyền, dashboard trạng thái node toàn hệ thống) — mọi endpoint chỉ ADMIN
  - name: System
    description: SYSTEM-FR-001..003 (Module SYSTEM §5.11 — xem audit log, ngưỡng mặc định hệ thống, tổng quan sức khỏe hệ thống) — mọi endpoint chỉ ADMIN
  - name: Farms
    description: FARM-FR-001..002/007, AUTH-FR-005/010 (farm/house/zone/member/invitation)
  - name: Devices
    description: FARM-FR-003..007, ENV-FR-006/015..018 (sensor/camera node, relay control)
  - name: Telemetry
    description: ENV-FR-001..005
  - name: Alerts
    description: ALERT-FR-001/002/006/007/008/009 (Alert Engine — dedup, quiet hours, danh sách, xác nhận)
  - name: Analytics
    description: ANALYTICS-FR-001..005, VISION-FR-008..011 (biểu đồ môi trường, so sánh đa Zone, đếm chim/return-rate — chờ dữ liệu thật từ module VISION)
  - name: Harvests
    description: MARKET-FR-001..005 (ghi nhận thu hoạch — tự gắn env/flock snapshot + trace code; Marketplace đã bỏ ở SRS v2.0.0)
  - name: HealthReports
    description: EXPERT-FR-005/006 (báo cáo sức khỏe Zone do hệ thống tự tổng hợp + kết luận của Domain Expert)
  - name: Tickets
    description: TICKET-FR-001..004b/006/007/009..012 (tạo/định tuyến/SLA/SAT checklist/KPI)

security:
  - bearerAuth: []

paths:
  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                full_name: { type: string }
                phone: { type: string }
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập (email/password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Đăng nhập thành công — refreshToken trả qua httpOnly cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Tài khoản bị Admin khoá (AUTH-FR-011, Flow 19 bước 4). Chỉ trả sau
            khi mật khẩu đúng — sai mật khẩu vẫn là 401, không lộ trạng thái khoá.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                error:
                  code: ACCOUNT_DISABLED
                  message: "Tài khoản đã bị khoá. Lý do: Vi phạm điều khoản sử dụng"
                  details: { reason: "Vi phạm điều khoản sử dụng" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới Access Token bằng refreshToken cookie
      security: []
      responses:
        "200":
          description: Access token mới
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      {
                        data:
                          {
                            type: object,
                            properties: { accessToken: { type: string } },
                          },
                      }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất — thu hồi refreshToken hiện tại
      responses:
        "200":
          {
            description: Đã đăng xuất,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/otp/send:
    post:
      tags: [Auth]
      summary: Gửi OTP về email (dev hiện chỉ log ra console, chưa nối SMTP/Zalo thật)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email],
                properties: { email: { type: string, format: email } },
              }
      responses:
        "200":
          {
            description: Đã gửi (hoặc im lặng nếu email không tồn tại),
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Xác thực OTP, trả accessToken
      description: |
        Tài khoản bị Admin khoá cũng bị chặn ở đây giống `/auth/login`, trả 403
        `ACCOUNT_DISABLED` kèm `details.reason` (AUTH-FR-011, Flow 19 bước 4).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                {
                  email: { type: string, format: email },
                  otp: { type: string },
                }
      responses:
        "200":
          description: OTP hợp lệ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          {
                            accessToken: { type: string },
                            user: { $ref: "#/components/schemas/User" },
                          }
        "400":
          {
            description: OTP sai hoặc hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: "Quên mật khẩu — gửi mã đặt lại (AUTH-FR-009, Flow 11 bước 6)"
      security: []
      description: |
        Luôn trả 200 kể cả khi email không tồn tại, để không lộ thông tin tài
        khoản (Flow 11 case 1a). Mã có TTL 15 phút, dùng 1 lần. Dev hiện chỉ
        log ra console (`[DEV RESET]`), chưa nối SMTP/Zalo thật.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email],
                properties: { email: { type: string, format: email } },
              }
      responses:
        "200":
          {
            description: "Nếu email tồn tại, mã đặt lại đã được gửi",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: "Đặt mật khẩu mới bằng mã đã nhận (AUTH-FR-009, Flow 11 bước 7)"
      security: []
      description: |
        Đổi mật khẩu thành công sẽ thu hồi TOÀN BỘ refresh token cũ của user
        (đá khỏi mọi thiết bị khác đang đăng nhập), không chỉ chặn đăng nhập mới.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, newPassword]
              properties:
                email: { type: string, format: email }
                token:
                  {
                    type: string,
                    description: "Mã 6 số nhận được từ /auth/forgot-password",
                  }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          {
            description: Đã đổi mật khẩu,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "400":
          {
            description: Mã đặt lại không đúng hoặc đã hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/notification-preferences:
    put:
      tags: [Auth]
      summary: "Cấu hình kênh nhận thông báo + giờ im lặng (ALERT-FR-005/006/013)"
      description: |
        `telegram` chỉ có tác dụng khi tài khoản đã liên kết bot (`POST /auth/telegram/link`).
        `zalo`/`sms` còn trong schema nhưng nằm ngoài phạm vi SRS v2.0.0 — không có kênh
        thật phía sau.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                push: { type: boolean }
                telegram: { type: boolean }
                zalo: { type: boolean, deprecated: true }
                sms: { type: boolean, deprecated: true }
                quiet_hours:
                  type: object
                  properties:
                    {
                      start: { type: string, example: "22:00" },
                      end: { type: string, example: "06:00" },
                    }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/User" } },
                            },
                          ],
                      },
                  },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/telegram/link:
    post:
      tags: [Auth]
      summary: "Tạo mã liên kết bot Telegram (ALERT-FR-013)"
      description: |
        Trả deep link `https://t.me/<bot>?start=<mã>`; mã dùng một lần, sống 10 phút. Người
        dùng mở link, Telegram gửi `/start <mã>` cho bot, backend lưu chat id và từ đó gửi
        cảnh báo qua Telegram theo cùng luật với push (người nhận, mức độ, giờ im lặng).
        Chỉ liên kết được trong chat riêng với bot (gửi mã trong nhóm bị từ chối); một chat chỉ
        gắn với một tài khoản.
        503 khi máy chủ chưa cấu hình `TELEGRAM_BOT_TOKEN`/`TELEGRAM_BOT_USERNAME`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          deep_link: { type: string, example: "https://t.me/swiftletcare_bot?start=4f1c…" }
                          expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "Chưa cấu hình bot Telegram", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      tags: [Auth]
      summary: "Hủy liên kết Telegram (ALERT-FR-013)"
      responses:
        "200": { description: Đã hủy liên kết, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/delete-request:
    post:
      tags: [Auth]
      summary: "Yêu cầu xoá tài khoản/dữ liệu cá nhân (AUTH-FR-012, PRIV-NFR-003)"
      description: |
        Chỉ ĐÁNH DẤU `deletion_requested_at` — việc xoá thật (kèm quy tắc
        cascade chuyển Primary Owner / xoá mềm Farm) do Administrator xử lý
        trong ≤ 30 ngày (Flow 19), **chưa có endpoint xử lý phía Admin**.
      responses:
        "200":
          {
            description: Đã ghi nhận yêu cầu,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          {
            description: Đã có yêu cầu xoá trước đó đang chờ xử lý,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  # ── ADMIN ─────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: "Danh sách tài khoản, lọc theo role/trạng thái (AUTH-FR-011) — chỉ ADMIN"
      parameters:
        - { name: role, in: query, schema: { $ref: "#/components/schemas/Role" } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/users/{id}/status:
    put:
      tags: [Admin]
      summary: "Khoá/mở khoá tài khoản (AUTH-FR-011, Flow 19) — chỉ ADMIN"
      description: |
        Bắt buộc `reason` khi khoá (`is_active=false`); không bắt buộc khi mở
        khoá. Middleware `authenticate` chặn ngay request kế tiếp của user này
        dù access token còn hạn — không cần đợi token hết hạn tự nhiên.
        Admin không tự khoá được chính mình, nhờ vậy hệ thống luôn còn ít nhất
        1 Admin đang hoạt động (Flow 19 case 2a).

        Khi khoá: thu hồi mọi refresh token và ngắt các kết nối Socket.io đang
        mở của user (kết nối mới bằng access token còn hạn cũng bị từ chối). Nếu
        user là Technician còn ticket đang giao, response kèm
        `meta.openTickets` (số ticket chưa đóng) và `meta.openTicketIds` (id của
        chúng, tối đa 100) để Admin gán lại bằng
        `PUT /tickets/{id}/admin-override`. Khoá tài khoản KHÔNG tự gán lại
        ticket: người đó vẫn phụ trách khu vực, việc gán lại là quyết định của
        Admin (khác với khi gỡ hẳn khu vực — xem
        `PUT /admin/technicians/{id}/regions`).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
                  description: "Chuỗi \"true\"/\"false\"/\"1\"/\"0\" cũng được chấp nhận và ép về boolean trước khi xử lý"
                reason: { type: string, description: "Bắt buộc khi is_active=false" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/User" }
                      meta:
                        type: object
                        description: Chỉ có khi việc gỡ khu vực làm ticket phải điều phối lại
                        properties:
                          rerouted:
                            type: array
                            items:
                              type: object
                              properties:
                                ticketId: { type: string }
                                from: { type: string }
                                to: { type: string }
                          unassigned:
                            type: array
                            description: Ticket về hàng đợi chung vì không còn Technician phù hợp
                            items: { type: string }
        "400":
          description: "Thiếu reason khi khoá tài khoản, hoặc Admin tự khoá chính mình"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/delete-requests:
    get:
      tags: [Admin]
      summary: "Danh sách yêu cầu xoá tài khoản đang chờ xử lý (AUTH-FR-012) — chỉ ADMIN"
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/delete-requests/{id}/complete:
    put:
      tags: [Admin]
      summary: "Xác nhận hoàn tất xử lý xoá tài khoản (AUTH-FR-012, Flow 19 bước 7-8) — chỉ ADMIN"
      description: |
        Cascade: Farm mà user là Primary Owner còn thành viên khác → chuyển
        `owner_id` cho người có `joined_at` sớm nhất; hết thành viên → xoá mềm
        Farm. Gỡ user khỏi `members` của các Farm khác nếu chỉ là thành viên
        thường. Anonymize email/phone/full_name, không xoá document (giữ FK
        cho lịch sử ticket/farm). Xử lý xong thì gỡ `deletion_requested_at` —
        tài khoản rời khỏi `GET /admin/delete-requests` và không xử lý lại được.

        Còn ticket đang mở (được giao cho user, do user tạo, hoặc thuộc Farm sẽ
        bị xoá mềm) thì trả 409 `HAS_OPEN_TICKETS` kèm `error.details.openTickets`
        (Flow 19 bước 7c) — xử lý xong ticket rồi gọi lại, hoặc gửi `force: true`
        để vẫn xoá. Mỗi Farm được chuyển chủ/xoá mềm có 1 bản ghi audit riêng
        (`FARM_OWNERSHIP_TRANSFERRED`, `FARM_SOFT_DELETED`) và chủ mới cùng người bị
        xoá nhận thông báo; kết nối Socket.io của user bị ngắt. Cũng dọn các liên
        kết trỏ tới user: cho hết hạn (`EXPIRED`) các lời mời đang chờ user đã gửi, đặt `deleted_at`
        (tài khoản đã xoá không khoá/mở khoá lại được, 409). User là **Technician**:
        gỡ hết `assigned_regions` rồi điều phối lại ticket đang giao cho họ như khi gỡ
        khu vực (người khác trong vùng, về `NEW`; không còn ai thì hàng đợi chung + báo
        Admin; audit `TICKET_REROUTED` với `reason: ACCOUNT_DELETED`) — không để ticket
        nằm lại với tài khoản đã ẩn danh. Audit `ACCOUNT_DELETED`
        ghi `farmsTransferred`, `farmsDeleted`, `ticketsRerouted`, `forced`. Nếu lỗi giữa chừng
        (Mongo standalone, không transaction) thì gọi lại được: farm đã xử lý xong
        không bị xử lý lần nữa.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
                  description: "true = bỏ qua cảnh báo ticket đang mở và vẫn xoá"
      responses:
        "200":
          description: "Đã xử lý xong (anonymized)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "400":
          description: "Người dùng chưa gửi yêu cầu xoá / yêu cầu đã được xử lý / Admin tự xử lý tài khoản của chính mình"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "HAS_OPEN_TICKETS — user còn ticket đang mở, kèm `error.details.openTickets`; gửi `force: true` để vẫn xoá"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/technicians:
    post:
      tags: [Admin]
      summary: "Admin tự tạo tài khoản Technician + gán khu vực phụ trách (AUTH-FR-005c, Flow 16) — chỉ ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, full_name, assigned_regions]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                full_name: { type: string }
                phone: { type: string }
                assigned_regions:
                  type: array
                  items: { type: string }
                  example: ["HCMC", "Long An"]
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/technicians/{id}/regions:
    put:
      tags: [Admin]
      summary: "Điều chỉnh khu vực phụ trách của Technician (AUTH-FR-005c, Flow 21 case 4a-x) — chỉ ADMIN"
      description: |
        Thay toàn bộ `assigned_regions` (giá trị được trim + bỏ trùng). Có hiệu
        lực ngay ở request kế tiếp của Technician, không cần đăng nhập lại.
        Lưu ý: phải ghi khớp đúng `farms.region` (VD `HCMC` ≠ `Hồ Chí Minh`).

        Khu vực bị gỡ khỏi danh sách: ticket đang mở ở khu vực đó mà Technician
        này đang được gán sẽ **tự điều phối lại** — quyền trên ticket đi theo
        `assigned_regions` nên nếu để nguyên, chính người được gán sẽ bị chặn
        403 trên việc của mình. Ticket được chuyển cho Technician khác trong
        khu vực (trả về `NEW` để người mới xác nhận tiếp nhận, lịch hẹn cũ bị
        huỷ trừ ticket `INSTALLATION`/`MAINTENANCE`), hoặc về hàng đợi chung
        nếu không còn ai. Response kèm `meta.rerouted`
        (`[{ticketId, from, to}]`) và `meta.unassigned` (`[ticketId]`).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigned_regions]
              properties:
                assigned_regions:
                  type: array
                  minItems: 1
                  items: { type: string }
                  example: ["HCMC", "Long An"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "400":
          description: "Tài khoản không phải Technician"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── SYSTEM ────────────────────────────────────────────────────────────────
  /admin/provisioned-devices:
    post:
      tags: [Admin]
      summary: "Nhập thiết bị vào kho, cấp secretKey để in nhãn (FARM-FR-003) — chỉ ADMIN"
      description: |
        `secret_key` (dạng XXXX-XXXX-XXXX) chỉ trả về **đúng 1 lần** trong response
        này — backend chỉ lưu SHA-256, không xem lại được. Technician nhập cặp
        `{device_id, secret_key}` khi onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, kind]
              properties:
                device_id: { type: string, example: node_101 }
                kind: { type: string, enum: [SENSOR, CAMERA] }
      responses:
        "201":
          description: Đã cấp
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { device_id: { type: string }, kind: { type: string }, secret_key: { type: string, example: "K7QM-3XPA-9RTD" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Admin]
      summary: "Danh sách kho thiết bị (FARM-FR-003) — chỉ ADMIN"
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [SENSOR, CAMERA] } }
        - { name: claimed, in: query, schema: { type: string, enum: ["true", "false"] }, description: "Đã/chưa kích hoạt" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/ProvisionedDevice" } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /system/audit-logs:
    get:
      tags: [System]
      summary: "Xem/lọc Audit Log toàn hệ thống (SYSTEM-FR-001) — chỉ ADMIN"
      description: |
        Các action đang được ghi: LOGIN, LOGIN_FAILED, PASSWORD_RESET,
        ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, DELETION_REQUESTED, ACCOUNT_DELETED,
        FARM_OWNERSHIP_TRANSFERRED, FARM_SOFT_DELETED, USER_CREATED,
        TECHNICIAN_REGIONS_UPDATED, THRESHOLD_UPDATED, DEFAULT_THRESHOLDS_UPDATED,
        RELAY_OVERRIDE, RELAY_OVERRIDE_CLEARED, SPEAKER_SCHEDULE_UPDATED,
        AUDIO_TRACK_UPLOADED/SYNC_UPDATED/SELECTED/DELETED, DEVICE_REGISTERED, DEVICE_REASSIGNED, TICKET_ADMIN_OVERRIDE.
        Mỗi bản ghi có `ip_address` của request gây ra hành động (rỗng nếu do hệ
        thống tự thực hiện).
      parameters:
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string, example: LOGIN_FAILED } }
        - { name: targetType, in: query, schema: { type: string, example: user } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK (mới nhất trước)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/settings/default-thresholds:
    get:
      tags: [System]
      summary: "Xem ngưỡng mặc định hệ thống (SYSTEM-FR-002, ENV-FR-007) — chỉ ADMIN"
      description: Chưa từng cấu hình thì trả giá trị gốc (khớp firmware Config.h).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Thresholds" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [System]
      summary: "Chỉnh ngưỡng mặc định hệ thống (SYSTEM-FR-002) — chỉ ADMIN"
      description: |
        Gửi 1 phần hoặc cả 7 trường, phần còn lại giữ nguyên. Đây là nguồn
        Farm Owner dùng khi "Reset về mặc định" 1 Zone (ENV-FR-020) — KHÔNG tự
        áp xuống các Zone đang chạy. Mọi thay đổi ghi audit log. Mỗi giá trị phải nằm
        trong khoảng đo của cảm biến tương ứng (nhiệt −40..125°C, ẩm 0..100%,
        ánh sáng ≤ 200.000 lux, NH3 ≤ 500 ppm, CO2 ≤ 5000 ppm), nếu không 422.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Thresholds" }
      responses:
        "200":
          description: Giá trị sau khi cập nhật
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Thresholds" } }
        "400":
          description: "min >= max, giá trị âm, hoặc kết quả sau khi gộp với giá trị hiện tại vượt khoảng đo cảm biến"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/settings/sla:
    get:
      tags: [System]
      summary: "Xem SLA theo mức ưu tiên (TICKET-FR-006, SLA-NFR-001) — chỉ ADMIN"
      description: Chưa cấu hình thì trả giá trị đề xuất trong SRS (P1 0.5/4h, P2 4/24h, P3 24/72h).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SlaConfig" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [System]
      summary: "Chỉnh SLA theo mức ưu tiên (TICKET-FR-006) — chỉ ADMIN"
      description: |
        Gửi 1 phần hoặc cả 3 mức, phần còn lại giữ nguyên. Áp dụng cho ticket
        tạo MỚI và cho ticket được Admin đổi priority; ticket cũ giữ hạn đã tính.
        Sau khi gộp phải giữ đúng thứ tự ưu tiên: hạn phản hồi và hạn xử lý của P1 ≤ P2
        ≤ P3 (được bằng nhau) — mức gấp hơn mà hạn dài hơn thì trả 400.
        Job nền so `sla_resolve_due_at` mỗi 2 phút để đánh dấu vượt hạn
        (TICKET-FR-009, SLA-NFR-002).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaConfig" }
      responses:
        "200":
          description: Giá trị sau khi cập nhật
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SlaConfig" } }
        "400":
          description: "Giá trị ≤ 0, hoặc hạn phản hồi muộn hơn hạn xử lý"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/settings/ticket-routing:
    get:
      tags: [System]
      summary: "Ngưỡng quá tải của Ticket Router (TICKET-FR-005) — chỉ ADMIN"
      description: "Technician có ≥ N ticket chưa đóng không được Router gán thêm. Mặc định 10."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/TicketRoutingConfig" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [System]
      summary: "Chỉnh ngưỡng quá tải của Ticket Router (TICKET-FR-005) — chỉ ADMIN"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketRoutingConfig" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/TicketRoutingConfig" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/health-overview:
    get:
      tags: [System]
      summary: "Tổng quan sức khỏe hệ thống (SYSTEM-FR-003) — chỉ ADMIN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          farms: { type: object, properties: { total: { type: integer } } }
                          zones: { type: object, properties: { total: { type: integer } } }
                          devices: { $ref: "#/components/schemas/DeviceStatusSummary" }
                          openTickets:
                            type: object
                            description: >-
                              Ticket chưa CLOSED theo priority, chỉ tính Farm chưa xoá mềm —
                              cùng phạm vi với farms/zones/devices ở trên (ticket của Farm đã
                              xoá được đóng ngay lúc xoá farm nên không còn tồn tại ở đây)
                            properties:
                              total: { type: integer }
                              P1: { type: integer }
                              P2: { type: integer }
                              P3: { type: integer }
                          users:
                            type: object
                            properties:
                              total: { type: integer }
                              active: { type: integer }
                              inactive: { type: integer }
                              byRole:
                                type: object
                                additionalProperties:
                                  type: object
                                  properties:
                                    active: { type: integer }
                                    inactive: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── FARMS ─────────────────────────────────────────────────────────────────
  /farms:
    get:
      tags: [Farms]
      summary: Danh sách farm của user hiện tại
      description: |
        - FARM_OWNER: các farm mình sở hữu hoặc là thành viên
        - TECHNICIAN: các farm có `region` nằm trong `assigned_regions` của mình (để chọn Farm→House→Zone khi onboarding — Flow 1 bước 2)
        - ADMIN: tất cả
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        { $ref: "#/components/schemas/Farm" },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
    post:
      tags: [Farms]
      summary: Tạo farm mới (người tạo trở thành Primary Owner) — FARM_OWNER/ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address]
              properties:
                name: { type: string }
                address: { type: string }
                region:
                  {
                    type: string,
                    example: HCMC,
                    description: "Khu vực để định tuyến Technician phụ trách — nên nhập, nếu bỏ trống thì không Technician nào lắp đặt/xử lý ticket được cho farm này",
                  }
                coordinates:
                  {
                    type: object,
                    properties:
                      { lat: { type: number }, lng: { type: number } },
                  }
      responses:
        "201":
          {
            description: Đã tạo,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }

  /farms/{id}:
    parameters: [{ $ref: "#/components/parameters/FarmId" }]
    get:
      tags: [Farms]
      summary: Chi tiết farm
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Farms]
      summary: Cập nhật farm (owner/member)
      description: |
        `region` chỉ Primary Owner/Admin được đổi (FARM-FR-001) vì nó quyết định
        Technician nào phụ trách farm và ticket được giao cho ai. Đổi `region`
        thì ticket đang mở của farm **tự điều phối lại** sang Technician của khu
        vực mới (hoặc về hàng đợi chung + báo Admin nếu chưa có ai phụ trách khu
        vực đó) — để nguyên thì người đang được gán bị chặn 403 trên chính
        ticket của mình.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                address: { type: string }
                region:
                  type: string
                  description: "Khu vực điều phối, phải khớp đúng `users.assigned_regions` của Technician (VD `HCMC`); chỉ Primary Owner/Admin đổi được"

                coordinates:
                  {
                    type: object,
                    properties:
                      { lat: { type: number }, lng: { type: number } },
                  }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Farms]
      summary: Xóa mềm farm — chỉ Primary Owner
      description: |
        Farm chỉ bị ẩn (`is_deleted`), dữ liệu lịch sử giữ nguyên. Kéo theo:
        mọi cảnh báo đang mở của farm được đóng (`RESOLVED`), và mọi **ticket
        đang mở cũng bị đóng** kèm `cancelled_at` + ghi chú "farm đã bị xoá",
        Technician đang giữ ticket được thông báo. Lý do: farm đã xoá thì không
        ai mở được ticket của nó nữa (kể cả Admin), nhưng nếu để mở, chúng vẫn
        chiếm suất quá tải của Technician trong Ticket Router và vẫn cộng vào
        `/system/health-overview` cùng tỉ lệ đúng SLA.
      responses:
        "200":
          {
            description: Đã xóa,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }

  /farms/{id}/members:
    post:
      tags: [Farms]
      summary: "Mời đồng sở hữu (FARM_OWNER) hoặc Domain Expert (AUTH-FR-005/010, EXPERT-FR-001, Flow 12) — chỉ Primary Owner"
      description: |
        Tạo một Invitation PENDING (hết hạn sau 7 ngày); email chưa có tài khoản thì
        đăng ký xong tự động accept và tài khoản mang đúng `role` được mời.
        - `role` mặc định `FARM_OWNER`. `DOMAIN_EXPERT` là chuyên gia nuôi yến, phạm vi luôn là cả farm
          (SRS v2.0.0 bỏ `zone_ids`).
        - 1 email = 1 role: email đã là tài khoản role khác (Technician, Admin, hoặc
          Farm Owner ↔ Domain Expert) → 409, cần dùng email khác.
        - Ghi audit `FARM_MEMBER_INVITED`.
      parameters: [{ $ref: "#/components/parameters/FarmId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email],
                properties:
                  {
                    email: { type: string, format: email },
                    role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT], default: FARM_OWNER },
                  },
              }
      responses:
        "201":
          {
            description: Đã tạo lời mời,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/Invitation" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          {
            description: "Đã là thành viên, đã có lời mời PENDING gửi tới email này, hoặc email đã là tài khoản role khác",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

