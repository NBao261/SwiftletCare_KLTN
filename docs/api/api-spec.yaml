        - { name: houseId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, ACCEPTED, REJECTED, EXPIRED, MEASURED] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Mới mở trước; `rule_id` kèm `name` và `action` của luật
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }
                      meta: { $ref: "#/components/schemas/PageMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /recommendations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Recommendations]
      summary: "Một khuyến nghị kèm bằng chứng (EXPERT-FR-017)"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Recommendation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /recommendations/{id}/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Recommendations]
      summary: "Chấp nhận khuyến nghị OPEN (EXPERT-FR-018, SM-21) — FARM_OWNER"
      description: |
        Hành động `WORK_ORDER`: mở đúng một Work Order sửa chữa (nguồn `RECOMMENDATION`, `recommendation_id`) cho thợ đang
        trực của nhà (MF-02). Hành động `PARAMETER_CHANGE`: sửa ngưỡng hoặc hệ số mờ của mọi zone trong nhà như Farm Owner
        tự sửa, farm có chuyên gia thì mỗi zone có một mục duyệt (MF-05, EXPERT-FR-010), id ở `review_ids`. Khuyến nghị
        không còn OPEN (đã quyết định, hết hạn) → 409; lỗi khi thực hiện thì khuyến nghị mở lại. Audit `RECOMMENDATION_ACCEPTED`.
      responses:
        "200":
          description: Khuyến nghị ACCEPTED
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Recommendation" }
        "400": { description: "Nhà chưa có zone, hoặc giá trị không hợp với ngưỡng/hệ số hiện tại của một zone (kiểm mọi zone trước, không zone nào bị sửa, khuyến nghị vẫn OPEN)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Khuyến nghị không còn mở", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /recommendations/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Recommendations]
      summary: "Từ chối khuyến nghị OPEN kèm lý do (EXPERT-FR-018, SM-21) — FARM_OWNER"
      description: "Thiếu lý do → 422. Không còn OPEN → 409. Audit `RECOMMENDATION_REJECTED`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, maxLength: 1000 } }
      responses:
        "200":
          description: Khuyến nghị REJECTED
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Recommendation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Khuyến nghị không còn mở", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /internal/stream-auth:
    post:
      tags: [Internal]
      summary: "MediaMTX hỏi quyền đẩy/xem stream (HTTP authentication của MediaMTX) — dịch vụ nội bộ"
      description: |
        Không dùng JWT người dùng; reverse proxy chặn `/internal` từ bên ngoài.
        `publish` và đọc hình gốc `cam-<id>-raw`: với tài khoản riêng của nút AI (`user` = mã thiết bị, `password` = mật khẩu
        broker của chính nó, camera đang dùng, mục kho chưa thu hồi) chỉ cho `cam-<mã>` và `cam-<mã>-raw`; hoặc với
        `password` = STREAM_PUBLISH_SECRET (dùng chung, giữ tới khi mọi nút AI đã cài lại bằng mã cài đặt).
        `read` đường `cam-<id>`: token của `GET /devices/camera-nodes/{id}/stream-token`, lấy từ
        `token` (header Bearer), `query` (`token=`) hoặc `password`. Hành động khác bị từ chối.
        Trả 401 cả khi client RTSP hỏi lần đầu chưa kèm mật khẩu, để nó gửi lại kèm mật khẩu.
      security: []
      parameters:
        - { name: key, in: query, required: true, schema: { type: string }, description: STREAM_AUTH_KEY }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [publish, read, playback, api, metrics, pprof] }
                path: { type: string, example: cam-cam-zone1-01 }
                user: { type: string }
                password: { type: string }
                token: { type: string }
                query: { type: string }
                protocol: { type: string }
                ip: { type: string }
                id: { type: string }
      responses:
        "200": { description: Được phép }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /internal/mqtt-auth:
    post:
      tags: [Internal]
      summary: "EMQX xác thực thiết bị và service account (HTTP authentication của EMQX) — dịch vụ nội bộ"
      description: |
        Không dùng JWT người dùng; reverse proxy chặn `/internal` từ bên ngoài (Report 4 §7.2, NFR-10 d).
        Thiết bị: `username` là device ID trong kho, `password` là broker secret, chưa thu hồi. Backend:
        `MQTT_USERNAME`, `MQTT_PASSWORD`. Luôn trả 200 với `result`, vì EMQX đọc kết quả từ thân phản hồi;
        không phân biệt thiết bị không có trong kho với sai mật khẩu.
      security: []
      parameters:
        - { name: key, in: query, required: true, schema: { type: string }, description: MQTT_AUTH_KEY }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: node_101 }
                password: { type: string }
      responses:
        "200":
          description: Kết quả xác thực
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: string, enum: [allow, deny] }
                  is_superuser: { type: boolean, enum: [false] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/camera-nodes/{id}/restore:
    post:
      tags: [Devices]
      summary: "Khôi phục Camera Node vừa gỡ nhầm, trong 24 giờ (FARM-FR-008) — FARM_OWNER (farm của mình)"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string } }
      responses:
        "200":
          description: Đã khôi phục
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/CameraNode" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/sensor-nodes/{id}/replace:
    post:
      tags: [Devices]
      summary: "Thay thiết bị hỏng bằng thiết bị mới cùng Zone (FARM-FR-008) — FARM_OWNER (farm của mình)"
      description: |
        Đăng ký thiết bị mới (cần `secret_key` như onboarding, trạng thái PENDING)
        vào đúng Zone của thiết bị cũ, chép lịch loa/âm lượng, rồi gỡ thiết bị cũ
        với `replaced_by` trỏ sang node mới. Sai `secret_key` thì thiết bị cũ giữ nguyên.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_device_id, secret_key, reason]
              properties:
                new_device_id: { type: string, example: node_002 }
                secret_key: { type: string, example: DEMO-NODE-0002 }
                reason: { type: string, example: "Cảm biến NH3 chết" }
      responses:
        "201":
          description: Đã thay
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { oldNode: { $ref: "#/components/schemas/SensorNode" }, newNode: { $ref: "#/components/schemas/SensorNode" } } } }
        "400": { description: "Mã kích hoạt không đúng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/sensor-nodes/{id}/reassign-zone:
    put:
      tags: [Devices]
      summary: "Dời thiết bị sang Zone/Farm khác (FARM-FR-007b, Flow 21 nhánh A) — FARM_OWNER"
      description: |
        Farm Owner chỉ dời trong farm của mình: Zone nguồn hoặc đích thuộc farm khác → 403
        (FARM-FR-007); Administrator → 403 (Report 3 §2.4).
        Chỉ đổi Zone trong cơ sở dữ liệu rồi publish lại `config` (retained) của Zone mới lên topic
        của thiết bị, thiết bị offline nhận khi kết nối lại; thiết bị không biết farm, house, zone (D3). Kiểm quyền trên cả Zone
        nguồn lẫn Zone đích; cảnh báo còn mở của thiết bị ở Zone cũ được đóng; audit
        `DEVICE_REASSIGNED`. Dời về chính Zone đang ở trả 400.
        `meta.commandDelivered=false` khi backend chưa kết nối broker.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newZoneId]
              properties: { newZoneId: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/SensorNode" }
                      meta: { type: object, properties: { commandDelivered: { type: boolean } } }
        "400": { description: "Zone đích trùng Zone hiện tại" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị đã gỡ, hoặc không ONLINE" }

  /devices/sensor-nodes/{id}/commands:
    post:
      tags: [Devices]
      summary: "Xử lý từ xa: khởi động lại / đẩy lại ngưỡng / OTA firmware (FARM-FR-013, Flow 15) — ADMIN; FARM_OWNER, FARM_TECHNICIAN chỉ RESTART"
      description: |
        Administrator gửi được mọi lệnh tới thiết bị của mọi farm mà không là thành viên (FARM-FR-009).
        Farm Owner chỉ `RESTART` thiết bị của farm mình; Farm Technician chỉ `RESTART` thiết bị ở nhà được
        giao; `PUSH_CONFIG` hay `OTA` của họ → 403 (FARM-FR-013). Domain Expert → 403. Mỗi lệnh được audit;
        lệnh của Administrator hoặc Farm Technician được báo trong app cho các Farm Owner của farm.
        Chỉ gửi được khi thiết bị `ONLINE` (409 nếu không). Topic theo thiết bị (Report 4 §7.2):
        - `PUSH_CONFIG`: publish lại `swiftletcare/dev/{deviceId}/config` (retained) — ngưỡng, hệ số mờ,
          tham số phát hiện của Zone và lịch/âm lượng/bài loa của thiết bị
        - `RESTART`: phong bì `{ commandId, type: "RESTART", issuedAt, payload: {} }` lên `…/cmd`
        - `OTA`: phong bì `type: "OTA"`, `payload: { version, url, sha256 }` lên `…/cmd` — URL phải
          là HTTPS, chứng chỉ do Let's Encrypt cấp (firmware kiểm bằng CA) và host nằm trong `OTA_ALLOWED_HOSTS` (sha256 do chính người gửi
          đặt nên không thay được việc khoá nguồn firmware); node lưu
          `ota_pending`, heartbeat báo đúng `firmware_version` mới thì ghi audit
          `DEVICE_OTA_SUCCEEDED` (Flow 15 bước 5); quá 30 phút chưa xác nhận thì
          chuyển sang `ota_failed` (thiết bị đã rollback) và báo người gửi

        **Firmware xử lý `command` từ bản 1.4.0**: thiết bị đang báo `firmware_version`
        cũ hơn thì RESTART/OTA trả **501** (lên 1.4.0 lần đầu bằng ElegantOTA trong LAN
        hoặc USB); PUSH_CONFIG dùng được với mọi bản vì firmware đã hiểu payload ngưỡng.
        Firmware 1.4.0 tải file, kiểm sha256 rồi mới khởi động vào bản mới; bản mới phải
        kết nối được MQTT trong 10 phút, nếu không bootloader quay về bản cũ (Flow 15 bước 5a).
        Mỗi lệnh được ghi audit `DEVICE_COMMAND_SENT`.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: { type: string, enum: [RESTART, PUSH_CONFIG, OTA] }

                ota:
                  type: object
                  description: "Bắt buộc khi command=OTA"
                  properties:
                    version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$", example: "1.4.1", description: "Không có tiền tố \"v\" — phải khớp đúng FIRMWARE_VERSION thiết bị báo về" }
                    url: { type: string, example: "https://fw.swiftletcare.vn/esp32-1.4.1.bin" }
                    sha256: { type: string, example: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" }
      responses:
        "202":
          description: Đã gửi lệnh
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SensorNode" } }
        "400": { description: "URL firmware không phải HTTPS/không thuộc OTA_ALLOWED_HOSTS", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Thiết bị PENDING/OFFLINE/ERROR hoặc đã gỡ, đang chạy đúng version OTA, hoặc OTA tới thiết bị đang trong một đợt cập nhật firmware chưa xong", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "501": { description: "RESTART/OTA tới thiết bị chạy firmware trước 1.4.0 (chưa xử lý `command`)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "503": { description: "Backend chưa kết nối MQTT broker — lệnh chưa rời backend, `ota_pending` KHÔNG được ghi", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /devices/camera-nodes/{id}/decommission:
    post:
      tags: [Devices]
      summary: "Gỡ bỏ Camera Node, giữ lịch sử (FARM-FR-008) — FARM_OWNER (farm của mình)"
      description: |
        Cùng quy tắc với `POST /devices/sensor-nodes/{id}/decommission`: không xoá
        document nên dữ liệu cũ tham chiếu `node_id` vẫn truy vấn được, thiết bị
        bị ẩn khỏi danh sách/thống kê.

        Camera **đang ONLINE** phải gửi kèm `force: true` (409 nếu
        thiếu) — gỡ một camera còn sống là mất giám sát hình ảnh của Zone. Cảnh báo
        còn mở của nó được đóng theo, Farm Owner nhận thông báo, và trong **24 giờ**
        vẫn khôi phục lại được qua `/restore`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: "Hỏng nguồn, thu hồi về kho" }
                force: { type: boolean, description: "Bắt buộc khi camera đang ONLINE — xác nhận chấp nhận mất giám sát của Zone" }
      responses:
        "200":
          description: "Đã gỡ (decommissioned_at được gán)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/CameraNode" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/system-status:
    get:
      tags: [Devices, Admin]
      summary: "Trạng thái toàn bộ node hệ thống (OPS-NFR-004) — chỉ ADMIN"
      description: |
        Khác `GET /devices/sensor-nodes`/`camera-nodes` (luôn giới hạn theo
        quyền Farm của user) — endpoint này liệt kê TẤT CẢ SensorNode/CameraNode
        trong hệ thống kèm đếm theo status (gộp cả 2 loại), phục vụ trang Admin
        "Trạng thái hệ thống" (`SystemNodeStatus` bên frontend). Chỉ tính thiết bị
        của Farm chưa xoá mềm — cùng phạm vi với `devices` của
        `GET /system/health-overview`, để số liệu hai nơi khớp nhau.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          summary: { $ref: "#/components/schemas/DeviceStatusSummary" }
                          nodes:
                            type: array
                            items:
                              type: object
                              properties:
                                _id: { type: string }
                                device_id: { type: string }
                                type: { type: string, enum: [sensor, camera] }
                                status:
                                  {
                                    type: string,
                                    enum: [PENDING, ONLINE, OFFLINE],
                                  }
                                last_heartbeat: { type: string, format: date-time, nullable: true }
                                rssi: { type: number, nullable: true, description: "Chỉ có với sensor" }
                                firmware_version: { type: string, nullable: true, example: "1.2.0", description: "Chỉ có với sensor" }
                                registered_at: { type: string, format: date-time }
                                simulated: { type: boolean, description: "SYSTEM-FR-004 — thiết bị của bộ giả lập; mọi màn hình phải ghi rõ" }
                                zone_id: { type: string }
                                farm_id: { type: string }
                                farm_name: { type: string }
                                house_name: { type: string }
                                floor: { type: integer, example: 1 }
                                zone_name: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── TELEMETRY ─────────────────────────────────────────────────────────────
  /telemetry/zones/{id}/latest:
    get:
      tags: [Telemetry]
      summary: Giá trị cảm biến mới nhất của Zone (ENV-FR-004)
      description: "Zone chưa có số đo nào → 200 với `data: null` (trạng thái rỗng, không phải lỗi)."
      parameters: [{ $ref: "#/components/parameters/ZoneIdPath" }]
      responses:
        "200":
          {
            description: "OK — `data` là bản ghi mới nhất, hoặc null khi Zone chưa có số đo",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      allOf:
                                        [{ $ref: "#/components/schemas/Telemetry" }],
                                      nullable: true,
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }

  /telemetry/zones/{id}/history:
    get:
      tags: [Telemetry]
      summary: Lịch sử telemetry (ANALYTICS-FR-001)
      parameters:
        - { $ref: "#/components/parameters/ZoneIdPath" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/TelemetryLimit" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        {
                                          $ref: "#/components/schemas/Telemetry",
                                        },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }

  # ── ALERTS ────────────────────────────────────────────────────────────────
  /alerts:
    get:
      tags: [Alerts]
      summary: "Danh sách cảnh báo (ALERT-FR-007) — phân trang, filter"
      description: |
        Mỗi dòng không kèm ảnh (không có `onsite_checks[].photo_url`, `site_cause.photo_urls`, cũng không có khoá
        MinIO): ảnh xem ở `GET /alerts/{id}`. Kiểm tra tại chỗ chưa trả lời có `observation: null` như chi tiết.
        Farm Owner chỉ thấy cảnh báo của farm mình (owner/member). Domain Expert thấy
        cảnh báo của farm được mời (chỉ đọc + kiểm chứng). Administrator thấy **cảnh báo
        thiết bị** của mọi farm (`NODE_OFFLINE`, `EDGE_AI_DEGRADED`, `SENSOR_FAULT`,
        `RS485_BUS_FAILURE`, `UNEXPECTED_RESTART`, `SPEAKER_FAILURE`, `MISTING_INEFFECTIVE`,
        `ACTUATOR_FAULT`, `CONFIG_MISMATCH`, `MAINTENANCE_DUE` —
        Report 3 §2.4, FARM-FR-009), giao với bộ lọc `type`. Farm Technician thấy cảnh báo của các nhà được giao
        (cảnh báo của zone trong nhà và cảnh báo của nhà, AUTH-FR-013); với thợ, `farmId` của farm khác cho danh sách rỗng,
        vai trò khác nhận 403. `houseId`/`zoneId` ngoài phạm vi → 403 với mọi vai trò.
        Gửi cảnh báo tới thợ theo ca trực là G-21.
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
        - { name: houseId, in: query, schema: { type: string }, description: "Cảnh báo của một nhà yến: cảnh báo cả nhà (camera đếm chim) và cảnh báo của các Zone trong nhà (ALERT-FR-007). Nhà ngoài phạm vi → 403, như `zoneId`" }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/AlertType" } }
        - name: verdict
          in: query
          description: >-
            EXPERT-FR-003 — chỉ cảnh báo suy luận (NOISE_ANOMALY, SENSOR_ANOMALY, FORECAST_BREACH, LOW_RETURN_RATE):
            `any` = tất cả, `pending` = chưa kiểm chứng, `confirmed` / `rejected` = theo kết luận. Kèm `type` không
            phải loại suy luận → 400.
          schema: { type: string, enum: [any, pending, confirmed, rejected] }
        - {
            name: status,
            in: query,
            description: "`DISMISSED` — cảnh báo suy luận bị bác bỏ, không còn hiệu lực (ALERT-FR-007)",
            schema: { type: string, enum: [ACTIVE, ACKNOWLEDGED, DISMISSED, RESOLVED] },
          }
        - {
            name: open,
            in: query,
            description: "`true` — chỉ cảnh báo còn hiệu lực (ACTIVE, ACKNOWLEDGED), tách khỏi DISMISSED và RESOLVED (ALERT-FR-007); đi kèm `status` thì `status` thắng",
            schema: { type: string, enum: ["true"] },
          }
        - {
            name: severity,
            in: query,
            schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] },
          }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Alert" },
                        }
                      meta:
                        type: object
                        properties:
                          {
                            page: { type: integer },
                            limit: { type: integer },
                            total: { type: integer },
                            unreadCount:
                              {
                                type: integer,
                                description: "Số cảnh báo ACTIVE (chờ xác nhận) của bộ lọc, bỏ qua `status` và `open` (ALERT-FR-007); không phải trạng thái đã đọc",
                              },
                          }

  /alerts/verdict-stats:
    get:
      tags: [Alerts]
      summary: "Tỷ lệ cảnh báo suy luận được xác nhận theo từng loại (EXPERT-FR-003)"
      description: |
        Căn cứ để Domain Expert chỉnh tham số phát hiện (EXPERT-FR-008). `confirmedPct`
        tính trên số đã kiểm chứng; `null` khi chưa kiểm chứng cảnh báo nào của loại đó.
        `byRole` tách số xác nhận / bác bỏ theo vai trò người kết luận (Farm Owner kết luận
        khi farm chưa có chuyên gia, BR-22).
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { $ref: "#/components/schemas/AlertType" }
                            confirmed: { type: integer }
                            rejected: { type: integer }
                            pending: { type: integer }
                            confirmedPct: { type: integer, nullable: true }
                            byRole:
                              type: object
                              properties:
                                DOMAIN_EXPERT: { type: object, properties: { confirmed: { type: integer }, rejected: { type: integer } } }
                                FARM_OWNER: { type: object, properties: { confirmed: { type: integer }, rejected: { type: integer } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /alerts/{id}:
    get:
      tags: [Alerts]
      summary: Chi tiết cảnh báo
      description: "Cùng phạm vi với danh sách: Administrator chỉ mở được cảnh báo thiết bị (loại khác → 403); Farm Technician chỉ cảnh báo của nhà được giao (nhà khác → 403)."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Alert" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alerts/{id}/evidence:
    get:
      tags: [Alerts]
      summary: "Bằng chứng của một cảnh báo suy luận (ALERT-FR-014, EXPERT-FR-003) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        Hệ thống trình bày dữ liệu, không tự kết luận.
        - `NOISE_ANOMALY`, `SENSOR_ANOMALY`, `FORECAST_BREACH`: cửa sổ `created_at ± 30 phút`; mẫu
          telemetry của zone (nhiệt độ, độ ẩm, NH3, CO2, tiếng ồn), số đếm 5 phút của nhà chứa zone,
          cảnh báo thiết bị đang mở của zone.
        - `LOW_RETURN_RATE`: ngày của phiên (`metadata.sessionDate`); % thời gian trong ngưỡng của từng
          zone trong nhà, `NOISE_ANOMALY` và cảnh báo thiết bị của nhà trong ngày đó.

        Nguồn không có dữ liệu trong cửa sổ (VD nút AI offline) có `status: missing`, không trả 0.
        `earlier_verdicts`: tối đa 10 cảnh báo trước cùng loại, cùng zone/nhà, đã có kết luận.
        `onsite_checks`: yêu cầu kiểm tra tại chỗ và quan sát của Farm Technician (EXPERT-FR-021).
        Loại không phải suy luận → 400; không có quyền trên farm → 403 (Technician, Administrator).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/AlertEvidence" }
        "400": { description: "Cảnh báo không thuộc loại suy luận", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alerts/{id}/acknowledge:
    put:
      tags: [Alerts]
      summary: "Xác nhận cảnh báo (ALERT-FR-009, 018) — FARM_OWNER; FARM_TECHNICIAN ở nhà được giao"
      description: |
        Farm Owner, và Farm Technician trên cảnh báo của nhà được giao (nhà khác → 403); Domain Expert,
        Administrator → 403 (Report 3 §2.4). Chỉ xác nhận được cảnh báo còn `status=ACTIVE` (khác → 409);
        lưu người, thời điểm, ghi chú (giữ làm dữ liệu đánh giá model AI, VD "Báo động giả"). Xác nhận
        trước `escalation_min` (15 phút) thì không leo thang lên Farm Owner (ALERT-FR-017).

        `cause` (ALERT-FR-018, tuỳ chọn): nguyên nhân tìm thấy tại chỗ của cảnh báo thiết bị, lưu ở
        `site_cause`. Nguyên nhân bắt buộc khi đóng Work Order (`POST /work-orders/{id}/done`), không bắt
        buộc ở đây.

        Xác nhận `MAINTENANCE_DUE` theo mốc mặc định (tải chưa có kế hoạch, không có `details.plan_id`) = đã bảo
        trì: đếm lại `since_service_*` của các tải trong `metadata.loads` từ 0 và chuyển cảnh báo sang `RESOLVED`
        (ALERT-FR-016, BR-16). `MAINTENANCE_DUE` của một kế hoạch bảo trì (có `details.plan_id`) chỉ chuyển
        `ACKNOWLEDGED`, không đếm lại: nó đóng khi Farm Owner duyệt Work Order phòng ngừa (OPS-FR-008).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
                cause: { $ref: "#/components/schemas/SiteCause" }
      responses:
        "200":
          {
            description: Đã xác nhận,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Alert" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409":
          {
            description: Cảnh báo này đã được xác nhận trước đó,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /alerts/{id}/verdict:
    put:
      tags: [Alerts]
      summary: "Xác nhận/bác bỏ một cảnh báo suy luận (EXPERT-FR-003) — DOMAIN_EXPERT; FARM_OWNER khi farm chưa có chuyên gia (BR-22)"
      description: |
        Chỉ áp cho `NOISE_ANOMALY`, `SENSOR_ANOMALY`, `FORECAST_BREACH`, `LOW_RETURN_RATE`
        (loại khác → 400). Ghi lại được; lưu người, vai trò, thời điểm, ghi chú. Farm Owner
        trên farm đã có Domain Expert → 403. `REJECTED` bắt buộc có `note` (422).

        Tác động lên `status` (Report 3 §6.1, SM-01):
        - `REJECTED` khi `ACTIVE`/`ACKNOWLEDGED` → `DISMISSED`, trạng thái cũ lưu ở `previous_status`;
          cảnh báo không còn hiệu lực, lần gặp lại cùng sự cố chỉ tăng `occurrence_count`, không thông báo;
        - đổi sang `CONFIRMED` khi `DISMISSED` → về `previous_status` và báo lại như cảnh báo mới: thợ đang trực của
          nhà và Farm Owner (ALERT-FR-017); Farm Owner coi như đã được báo nên không bị leo thang thêm lần nữa (BR-40);
          `routing.technician_id` giữ thợ được định tuyến lúc tạo (MTTA/MTTR theo thợ);
        - `CONFIRMED` trên cảnh báo còn hiệu lực, hoặc mọi kết luận trên cảnh báo `RESOLVED` → giữ nguyên.

        Ghi audit `ALERT_VERDICT_SET`; kết luận của Domain Expert báo trong app cho mọi Farm Owner (EXPERT-FR-009).

        `needs_visit: true` cùng `CONFIRMED` (BR-39, OPS-FR-001): mở một Work Order sửa chữa cho cảnh báo,
        giao thợ đang trực của nhà (nhà không có thợ thì Farm Owner xử lý); cảnh báo đã có Work Order đang
        mở thì không mở thêm. `needs_visit` cùng `REJECTED` → 422.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [CONFIRMED, REJECTED] }
                note: { type: string, maxLength: 1000, description: "Bắt buộc khi `result = REJECTED`" }
                needs_visit: { type: boolean, default: false, description: "Cần thợ tới nhà: mở Work Order (BR-39)" }
      responses:
        "200":
          description: Đã ghi kết quả kiểm chứng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Alert" }
        "400": { description: "Cảnh báo không thuộc loại suy luận", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: "Không có quyền trên farm, hoặc Farm Owner trên farm đã có Domain Expert (BR-22)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /alerts/{id}/onsite-check:
    post:
      tags: [Alerts]
      summary: "Trả lời yêu cầu kiểm tra tại chỗ của một cảnh báo suy luận (EXPERT-FR-021) — FARM_TECHNICIAN ở nhà được giao"
      description: |
        Khi một cảnh báo suy luận (`NOISE_ANOMALY`, `SENSOR_ANOMALY`, `FORECAST_BREACH`, `LOW_RETURN_RATE`)
        được tạo ở nhà có Farm Technician, backend tạo đúng một yêu cầu kiểm tra cho thợ đang trực
        (`onsite_checks[0]`, thông báo trong ứng dụng); nhà không có thợ thì không có yêu cầu và chuyên gia
        kết luận trên dữ liệu.

        Thợ được giao nhà ghi điều quan sát được, kèm ảnh tuỳ chọn (`multipart/form-data`, field `photo`,
        JPEG/PNG/WebP ≤ 5 MB). Câu trả lời nằm trong `onsite_checks` của cảnh báo và trong bằng chứng
        (`GET /alerts/{id}/evidence`), trước khi chuyên gia kết luận. `SENSOR_ANOMALY` được trả lời
        `SENSOR_DIRTY_OR_FAULTY` thì mở ngay một Work Order sửa chữa (BR-39).

        Thợ nhà khác → 403; Farm Owner, Domain Expert, Administrator → 403. Cảnh báo không có yêu cầu
        kiểm tra, hoặc yêu cầu đã được trả lời → 409.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [observation]
              properties:
                observation: { $ref: "#/components/schemas/OnsiteObservation" }
                note: { type: string, maxLength: 1000 }
                photo: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [observation]
              properties:
                observation: { $ref: "#/components/schemas/OnsiteObservation" }
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Đã ghi quan sát
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Alert" }
        "400": { description: "Ảnh không phải JPEG/PNG/WebP hoặc quá 5 MB", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Không có yêu cầu kiểm tra, hoặc đã trả lời", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── WORK ORDERS ───────────────────────────────────────────────────────────
  /work-orders:
    get:
      tags: [WorkOrders]
      summary: "Danh sách Work Order (OPS-FR-001…004) — FARM_OWNER, DOMAIN_EXPERT (đọc), FARM_TECHNICIAN (nhà được giao)"
      description: |
        Mới mở trước. Farm Owner, Domain Expert: Work Order của các farm mình; Farm Technician: Work Order
        của các nhà được giao (`farmId` khác cho danh sách rỗng; `houseId` không được giao → 403). Administrator → 403.
        `assigneeId=me` = Work Order giao cho chính người gọi.
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: houseId, in: query, schema: { type: string } }
        - { name: alertId, in: query, schema: { type: string }, description: "Work Order của một cảnh báo (mở từ màn chi tiết cảnh báo)" }
        - { name: assigneeId, in: query, schema: { type: string }, description: "id người được giao, hoặc `me`" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/WorkOrderStatus" } }
        - { name: open, in: query, schema: { type: string, enum: ["true", "false"] }, description: "`true` = chưa đóng/huỷ (OPEN, IN_PROGRESS, VERIFYING, AWAITING_APPROVAL)" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/WorkOrder" } }
                      meta: { $ref: "#/components/schemas/PageMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [WorkOrders]
      summary: "Farm Owner mở tay một Work Order sửa chữa (OPS-FR-001) — chỉ FARM_OWNER"
      description: |
        Giao thợ đang trực của nhà (AUTH-FR-014; nhà không có thợ thì để trống, Farm Owner xử lý). Có
        `alert_id` thì cảnh báo phải thuộc nhà đó; cảnh báo đã có Work Order đang mở → 409.
        Farm Technician, Domain Expert, Administrator → 403. Ghi audit `WORK_ORDER_OPENED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [house_id, title]
              properties:
                house_id: { type: string }
                title: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                alert_id: { type: string }
      responses:
        "201":
          description: Đã mở
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/WorkOrder" }
        "400": { description: "Cảnh báo không thuộc nhà này", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Cảnh báo đã có Work Order đang mở", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /work-orders/metrics:
    get:
      tags: [WorkOrders]
      summary: "MTTA, MTTR theo nhà và theo thợ (OPS-FR-009, BR-40) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        Tính trên cảnh báo tạo trong `[from, to)` của farm (hoặc của nhà):
        - MTTA = trung bình (`acknowledged_at` − `created_at`) của cảnh báo đã xác nhận;
        - MTTR = trung bình (lúc Work Order của cảnh báo đóng, không có thì `resolved_at` − `created_at`)
          của cảnh báo đã đóng; báo động giả không tính: cảnh báo `DISMISSED`, hoặc đã bị chuyên gia bác bỏ
          (`expert_verdict.result: REJECTED`) rồi được job tự đóng.

        Theo thợ: cảnh báo được định tuyến tới thợ đó (`routing.technician_id`). Mục tiêu nội bộ để
        xác nhận là `escalation_min` (15 phút) cho mọi mức (BR-40) — số báo cáo, không phải cam kết.
        `on_time_maintenance_rate` (BR-40): % Work Order phòng ngừa mở (đến hạn) trong khoảng đã đóng trước điểm
        đến hạn cộng `maintenance_grace_days` (7 ngày). Mẫu số chỉ gồm Work Order đã đóng hoặc đã quá hạn chót; cái
        còn trong hạn chưa tính, cái `CANCELLED` không tính; `null` khi không còn Work Order nào để tính. Phút, làm tròn
        1 chữ số; không có mẫu thì `null`. Farm Technician, Administrator → 403.
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string } }
        - { name: houseId, in: query, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/OpsMetrics" }
        "400": { description: "`from` không trước `to`", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /work-orders/{id}:
    get:
      tags: [WorkOrders]
      summary: "Chi tiết Work Order — FARM_OWNER, DOMAIN_EXPERT, FARM_TECHNICIAN (nhà được giao)"
      description: "`photo_urls` là URL tạm (1 giờ) của ảnh. Thợ nhà khác, Administrator → 403."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/WorkOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /work-orders/{id}/start:
    post:
      tags: [WorkOrders]
      summary: "Bắt đầu làm (OPS-FR-002) — FARM_TECHNICIAN ở nhà được giao, FARM_OWNER"
      description: "`OPEN` → `IN_PROGRESS`. Trạng thái khác → 409; thợ nhà khác → 403."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/WorkOrderOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WorkOrderWrongState" }

  /work-orders/{id}/done:
    post:
      tags: [WorkOrders]
      summary: "Báo đã làm xong, kèm việc đã làm, nguyên nhân và ảnh (OPS-FR-002, ALERT-FR-018) — FARM_TECHNICIAN ở nhà được giao, FARM_OWNER"
      description: |
        `IN_PROGRESS` → `VERIFYING`: hệ thống kiểm điều kiện của cảnh báo giữ phục hồi `recovery_verify_min`
        (10 phút, BR-41) sau lúc báo xong rồi chuyển `AWAITING_APPROVAL`:
        - `MISTING_INEFFECTIVE`: độ ẩm của controller trên `humidity_min` của zone (OPS-FR-003);
        - `SENSOR_FAULT`, `RS485_BUS_FAILURE`: telemetry đủ số đo của cả 5 cảm biến;
        - `ACTUATOR_FAULT`, `SPEAKER_FAILURE`, `UNEXPECTED_RESTART`: chưa có dữ liệu nào cho thấy phục hồi (chưa biết
          mức dòng bình thường firmware học được; loa chỉ được báo một lần khi hỏng; khởi động lại không bao giờ tự đóng)
          → lượt kiểm kế tiếp chuyển `AWAITING_APPROVAL` kèm ghi chú "chưa có dữ liệu để kiểm phục hồi", Farm Owner kiểm
          tại chỗ khi duyệt;
        - loại khác: cảnh báo đã đóng (vượt ngưỡng về ngưỡng, thiết bị online lại…).
        `SENSOR_FAULT`, `RS485_BUS_FAILURE` được controller báo lại sau lúc báo xong, hoặc có cảnh báo mới của cùng sự
        cố lúc đang kiểm hay chờ duyệt → trở lại `IN_PROGRESS` (rời chờ duyệt thì Farm Owner cũng được báo).
        `MISTING_INEFFECTIVE` được gửi lại trong lúc firmware còn chốt ngừng phun không tính là quay lại. Work Order không gắn cảnh báo, và Work Order
        `PREVENTIVE` (dù gắn `MAINTENANCE_DUE`), chuyển thẳng `AWAITING_APPROVAL` (không có dữ liệu phục hồi để kiểm).
        Work Order `PREVENTIVE` cần mọi mục checklist đã có kết quả (OPS-FR-007), thiếu → 422.

        `cause` bắt buộc với Work Order của `MISTING_INEFFECTIVE`, `ACTUATOR_FAULT`, `SENSOR_FAULT`,
        `RS485_BUS_FAILURE`, `SPEAKER_FAILURE` (thiếu → 422); nguyên nhân và ảnh lưu cả vào cảnh báo
        (`site_cause`). Ảnh: `multipart/form-data`, field `photos`, JPEG/PNG/WebP, mỗi ảnh ≤ 5 MB, tối đa
        5 ảnh cho cả Work Order (tính cả ảnh của lần báo xong trước khi bị mở lại; vượt → 400). Trạng thái
        khác → 409; thợ nhà khác → 403.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cause: { $ref: "#/components/schemas/SiteCause" }
                work_note: { type: string, maxLength: 2000 }
                photos: { type: array, maxItems: 5, items: { type: string, format: binary } }
          application/json:
            schema:
              type: object
              properties:
                cause: { $ref: "#/components/schemas/SiteCause" }
                work_note: { type: string, maxLength: 2000 }
      responses:
        "200": { $ref: "#/components/responses/WorkOrderOk" }
        "400": { description: "Ảnh không phải JPEG/PNG/WebP hoặc quá 5 MB", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WorkOrderWrongState" }
        "422": { description: "Thiếu nguyên nhân của cảnh báo thiết bị (ALERT-FR-018), hoặc Work Order phòng ngừa còn mục checklist chưa ghi (OPS-FR-007)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /work-orders/{id}/approve:
    post:
      tags: [WorkOrders]
      summary: "Duyệt, đóng Work Order và cảnh báo của nó (OPS-FR-004) — chỉ FARM_OWNER"
      description: "`AWAITING_APPROVAL` → `CLOSED`; cảnh báo còn mở được đóng. Work Order sửa chữa có kết quả `REPAIRED`. Work Order `PREVENTIVE` có kết quả `DONE` và là một lần ghi bảo trì (OPS-FR-008): bộ đếm của tải về 0 (kế hoạch theo giờ chạy hoặc số lần đóng cắt), điểm đến hạn kế tiếp = lúc duyệt + `interval` ngày (kế hoạch theo lịch; hiệu chuẩn là ngày hiệu chuẩn kế tiếp), một dòng trong `records` của kế hoạch, kế hoạch về `SCHEDULED` khi không còn Work Order phòng ngừa nào đang mở. Trạng thái khác → 409. Ghi audit `WORK_ORDER_APPROVED`."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { $ref: "#/components/responses/WorkOrderOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WorkOrderWrongState" }

  /work-orders/{id}/reopen:
    post:
      tags: [WorkOrders]
      summary: "Mở lại kèm ghi chú (OPS-FR-004) — chỉ FARM_OWNER"
      description: "`AWAITING_APPROVAL` → `IN_PROGRESS`, báo người được giao. Thiếu `note` → 422; trạng thái khác → 409. Ghi audit `WORK_ORDER_REOPENED`."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: string, maxLength: 1000 } } }
      responses:
        "200": { $ref: "#/components/responses/WorkOrderOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WorkOrderWrongState" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /work-orders/{id}/cancel:
    post:
      tags: [WorkOrders]
      summary: "Huỷ kèm lý do (OPS-FR-004) — chỉ FARM_OWNER"
      description: "`OPEN`, `IN_PROGRESS`, `VERIFYING` → `CANCELLED` (huỷ từ `VERIFYING` là lối ra khi điều kiện không phục hồi theo cách hệ thống đo được); cảnh báo của nó không đổi. Work Order `PREVENTIVE` không huỷ được (409): kế hoạch còn đến hạn chỉ rời `DUE` khi ghi bảo trì hoặc khi Farm Owner xoá kế hoạch (`DELETE /maintenance/plans/{id}` huỷ luôn Work Order phòng ngừa của nó), nếu huỷ thì lượt kiểm kế tiếp sẽ mở lại. Thiếu `reason` → 422; trạng thái khác → 409. Ghi audit `WORK_ORDER_CANCELLED`."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, maxLength: 1000 } } }
      responses:
        "200": { $ref: "#/components/responses/WorkOrderOk" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WorkOrderWrongState" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /work-orders/{id}/reassign:
    post:
      tags: [WorkOrders]
      summary: "Giao lại cho một thợ của nhà (OPS-FR-004) — chỉ FARM_OWNER"
      description: "`OPEN`, `IN_PROGRESS`; người nhận phải là Farm Technician đang được giao nhà và còn hoạt động (khác → 400); trạng thái khác → 409. Báo người mới. Ghi audit `WORK_ORDER_REASSIGNED`."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [assignee_id], properties: { assignee_id: { type: string } } }
      responses:
        "200": { $ref: "#/components/responses/WorkOrderOk" }
        "400": { description: "Người nhận không phải thợ của nhà", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WorkOrderWrongState" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── MAINTENANCE ───────────────────────────────────────────────────────────
  /maintenance/plans:
    get:
      tags: [Maintenance]
      summary: "Danh sách kế hoạch bảo trì (OPS-FR-005) — FARM_OWNER, DOMAIN_EXPERT, FARM_TECHNICIAN (nhà được giao)"
      description: "Farm Owner, Domain Expert: kế hoạch của các farm mình; Farm Technician: của các nhà được giao; `houseId` ngoài phạm vi → 403. `RETIRED` chỉ hiện khi lọc `state=RETIRED`. Administrator → 403."
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: houseId, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/MaintenancePlanState" } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/MaintenancePlan" } }
                      meta: { $ref: "#/components/schemas/PageMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Maintenance]
      summary: "Tạo kế hoạch bảo trì (OPS-FR-005) — chỉ FARM_OWNER"
      description: |
        Chu kỳ do Farm Owner nhập theo khuyến cáo của nhà sản xuất hoặc người nuôi (`source`); hệ thống không tự đặt
        chu kỳ. `PUMP`, `FAN` đi với `RUN_HOURS` (giờ chạy) hoặc `SWITCHES` (số lần đóng cắt), áp cho bơm hoặc quạt
        của mọi controller trong nhà; `SENSOR`, `NOZZLE`, `CALIBRATION` đi với `CALENDAR` (`interval` tính bằng ngày).
        Kết hợp khác, `interval` ≤ 0, hoặc `interval` theo lịch lớn tới mức ngày đến hạn không biểu diễn được → 422. Mỗi nhà một kế hoạch cho mỗi loại thiết bị (OPS-FR-005: hai kế
        hoạch bơm dùng chung một bộ đếm): nhà đã có kế hoạch chưa xoá cho `equipment` này → 409. Kế hoạch mới ở
        `SCHEDULED`; kế hoạch theo lịch có điểm đến hạn đầu là hôm nay cộng `interval` ngày (Report 3 §6.20) và
        đến hạn ở lượt 07:00 giờ VN của ngày chứa điểm đến hạn. Farm Technician, Domain Expert, Administrator → 403.
        Ghi audit `MAINTENANCE_PLAN_CREATED`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenancePlanInput" }
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/MaintenancePlan" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Nhà đã có kế hoạch cho loại thiết bị này", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /maintenance/plans/{id}:
    put:
      tags: [Maintenance]
      summary: "Sửa khoảng, checklist, nguồn, ghi chú của kế hoạch (OPS-FR-005) — chỉ FARM_OWNER"
      description: "Không đổi được `house_id`, `equipment`, `basis`. Kế hoạch `RETIRED` → 409. Kế hoạch theo lịch tính lại điểm đến hạn từ lần bảo trì gần nhất (hoặc ngày tạo). Ghi audit `MAINTENANCE_PLAN_UPDATED`."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                interval: { type: number, exclusiveMinimum: true, minimum: 0 }
                checklist_template: { type: array, minItems: 1, maxItems: 30, items: { type: string, maxLength: 200 } }
                source: { type: string, maxLength: 300 }
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/MaintenancePlan" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Kế hoạch đã xoá (RETIRED)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Maintenance]
      summary: "Xoá kế hoạch: chuyển RETIRED, không đến hạn nữa (OPS-FR-005) — chỉ FARM_OWNER"
      description: "Lịch sử bảo trì giữ lại. Work Order phòng ngừa chưa làm xong (`OPEN`, `IN_PROGRESS`) của kế hoạch bị huỷ (`CANCELLED`); cái đã báo xong (`AWAITING_APPROVAL`) vẫn chờ Farm Owner duyệt. `MAINTENANCE_DUE` của kế hoạch không còn Work Order nào đang mở thì chuyển `RESOLVED`. Ghi audit `MAINTENANCE_PLAN_RETIRED` (số Work Order đã huỷ, số cảnh báo đã đóng)."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/MaintenancePlan" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /maintenance/plans/{id}/comments:
    post:
      tags: [Maintenance]
      summary: "Góp ý cho kế hoạch (Report 3 §2.4) — chỉ DOMAIN_EXPERT"
      description: "Chuyên gia góp ý chu kỳ hoặc checklist; Farm Owner được báo trong ứng dụng. Không sửa kế hoạch."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 1000 } } }
      responses:
        "201":
          description: Đã ghi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/MaintenancePlan" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /maintenance/due:
    get:
      tags: [Maintenance]
      summary: "Kế hoạch đang đến hạn hoặc quá hạn (OPS-FR-006) — FARM_OWNER, DOMAIN_EXPERT, FARM_TECHNICIAN (nhà được giao)"
      description: "Kế hoạch `DUE` và `OVERDUE`, quá hạn trước, kèm Work Order phòng ngừa đang mở (`open_work_orders`). `houseId` ngoài phạm vi → 403. Phân trang: mặc định 100 dòng (mỗi nhà có tối đa một kế hoạch cho mỗi loại thiết bị nên một trang thường đủ), tối đa 100."
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: houseId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/MaintenancePlan" } }
                      meta: { $ref: "#/components/schemas/PageMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /work-orders/{id}/checklist:
    put:
      tags: [WorkOrders]
      summary: "Ghi kết quả một mục checklist của Work Order phòng ngừa (OPS-FR-007) — FARM_TECHNICIAN ở nhà được giao, FARM_OWNER"
      description: |
        Chỉ Work Order `PREVENTIVE` đang `IN_PROGRESS`; khác → 409. `DEFECT` mở một Work Order sửa chữa cho nhà
        (origin `CHECKLIST`, OPS-FR-001), ghi lại ở mục đó; ghi lại cùng mục thì thay kết quả và ghi chú (gửi ghi
        chú trống là bỏ ghi chú cũ), không mở thêm Work Order sửa chữa, kể cả hai lần ghi `DEFECT` gửi gần nhau. Ảnh tuỳ chọn (`multipart/form-data`, field `photo`, JPEG/PNG/WebP ≤ 5 MB). Báo xong
        (`POST /work-orders/{id}/done`) cần mọi mục đã có kết quả (BR-41), thiếu → 422.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [item_index, result]
              properties:
                item_index: { type: integer, minimum: 0 }
                result: { type: string, enum: [OK, DEFECT] }
                note: { type: string, maxLength: 1000 }
                photo: { type: string, format: binary }
          application/json:
            schema:
              type: object
              required: [item_index, result]
              properties:
                item_index: { type: integer, minimum: 0 }
                result: { type: string, enum: [OK, DEFECT] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200": { $ref: "#/components/responses/WorkOrderOk" }
        "400": { description: "`item_index` ngoài checklist, hoặc ảnh sai định dạng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/WorkOrderWrongState" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── ANALYTICS ─────────────────────────────────────────────────────────────
  /analytics/env/summary:
    get:
      tags: [Analytics]
      summary: "Biểu đồ lịch sử môi trường theo khoảng thời gian (ANALYTICS-FR-001)"
      description: >-
        Chuỗi thời gian đã gom nhóm theo bucket (tối đa 120 điểm) + min/max/avg từng chỉ số, kèm thời tiết
        ngoài trời theo giờ của farm cùng mốc bucket để đặt cạnh số đo trong nhà (ANALYTICS-FR-013).
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - {
            name: range,
            in: query,
            schema:
              { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          bucketMs: { type: integer }
                          series: { type: array, items: { type: object } }
                          stats: { type: object, nullable: true }
                          outdoor:
                            type: array
                            description: >-
                              ANALYTICS-FR-013 — thời tiết ngoài trời (Open-Meteo) của farm chứa Zone, gom theo
                              cùng `bucketMs` với `series`: nhiệt, ẩm trung bình, mưa cộng dồn. Một bản ghi giờ H là
                              số liệu của [H, H + 1 giờ) và chỉ có khi giờ đó đã qua, nên mảng bắt đầu từ đầu giờ chứa
                              `from` (khoảng 1h vẫn có giờ đã qua gần nhất); mỗi điểm phủ max(`bucketMs`, 1 giờ) kể
                              từ `timestamp`. Rỗng khi farm không có toạ độ hoặc chưa lấy được thời tiết. Chỉ để hiển
                              thị (C-6).
                            items:
                              type: object
                              properties:
                                timestamp: { type: string, format: date-time }
                                temperature: { type: number, nullable: true }
                                humidity: { type: number, nullable: true }
                                precipitation_mm: { type: number, nullable: true, description: "null khi cả bucket không có số mưa (không ghi 0)" }
        "400":
          {
            description: "range không hợp lệ",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /analytics/autonomy:
    get:
      tags: [Analytics]
      summary: "Tỷ lệ thời gian tự động của Zone (ANALYTICS-FR-011)"
      description: |
        % thời gian trong khoảng mà không relay nào của Zone bị can thiệp tay, tính từ lịch
        sử override (ENV-FR-019): các khoảng chồng nhau chỉ tính một lần, override đang mở
        tính tới hiện tại. Override diễn ra trước khi có lịch sử không được tính.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          auto_mode_pct: { type: number, nullable: true, example: 94.8 }
                          manual_minutes: { type: integer }
                          override_count: { type: integer }
        "400": { description: "range không hợp lệ", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /analytics/control/performance:
    get:
      tags: [Analytics]
      summary: "Hiệu quả bộ điều khiển mờ của Zone (ANALYTICS-FR-008)"
      description: |
        Chỉ tính mẫu telemetry có `misting_pct` (firmware ≥ 1.1.0). `series`: độ ẩm, nhiệt độ,
        % phun, % quạt trung bình theo bucket (tối đa 120 điểm). `stats` (null khi chưa có dữ
        liệu): % mẫu nằm trong ngưỡng hiện tại của Zone, % phun/quạt trung bình, số lần relay
        đóng cắt/giờ (null khi dữ liệu < 15 phút). `tuning_changes`: các lần chỉnh hệ số trong khoảng.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          bucketMs: { type: integer }
                          thresholds:
                            type: object
                            properties:
                              humidity_min: { type: number }
                              humidity_max: { type: number }
                              temp_min: { type: number }
                              temp_max: { type: number }
                          fuzzy_tuning: { $ref: "#/components/schemas/FuzzyTuning" }
                          tuning_changes:
                            type: array
                            items:
                              type: object
                              properties:
                                changed_at: { type: string, format: date-time }
                                new_values: { $ref: "#/components/schemas/FuzzyTuning" }
                          series:
                            type: array
                            items:
                              type: object
                              properties:
                                timestamp: { type: string, format: date-time }
                                humidity: { type: number, nullable: true }
                                temperature: { type: number, nullable: true }
                                misting_pct: { type: number, nullable: true }
                                ventilation_pct: { type: number, nullable: true }
                          stats:
                            type: object
                            nullable: true
                            properties:
                              sampleCount: { type: integer }
                              humidityInRangePct: { type: number, nullable: true }
                              temperatureInRangePct: { type: number, nullable: true }
                              mistingAvgPct: { type: number, nullable: true }
                              ventilationAvgPct: { type: number, nullable: true }
                              mistingSwitchesPerHour: { type: number, nullable: true }
                              ventilationSwitchesPerHour: { type: number, nullable: true }
                          service_limits:
                            type: object
                            description: "ALERT-FR-016 — mốc bảo trì mặc định theo thời gian chạy (quá mốc → cảnh báo MAINTENANCE_DUE), chỉ cho tải chưa có kế hoạch bảo trì của nhà"
                            properties:
                              misting: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
                              ventilation: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
                          relay_usage:
                            type: array
                            description: "Giờ chạy / số lần đóng cắt từ lần bảo trì trước, theo thiết bị"
                            items:
                              type: object
                              properties:
                                device_id: { type: string }
                                simulated: { type: boolean, description: "SYSTEM-FR-004 — controller của bộ giả lập" }
                                misting: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
                                ventilation: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
        "400":
          description: "range không hợp lệ"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /analytics/forecast:
    get:
      tags: [Analytics]
      summary: "Dự báo độ ẩm/nhiệt độ 60 phút tới (ANALYTICS-FR-009)"
      description: |
        Holt trend tắt dần trên 6 giờ gần nhất gom 5 phút; α, β chọn bằng tìm lưới; `mae30`/`mae60`
        = sai số tuyệt đối trung bình đánh giá lùi. Mỗi chỉ số là null khi < 2 giờ dữ liệu hoặc mẫu mới
        nhất cũ hơn 15 phút. `predicted` = chỉ số hiện còn trong ngưỡng nhưng dự báo vượt trong 60 phút.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          horizonMinutes: { type: integer, example: 60 }
                          bucketMinutes: { type: integer, example: 5 }
                          humidity: { $ref: "#/components/schemas/MetricForecast" }
                          temperature: { $ref: "#/components/schemas/MetricForecast" }
                          thresholds: { type: object }
                          predicted:
                            type: object
                            nullable: true
                            properties:
                              metric: { type: string, enum: [humidity, temperature] }
                              direction: { type: string, enum: [above, below] }
                              limit: { type: number }
                              value: { type: number }
                              minutesAhead: { type: integer }

  /analytics/control/suggestion:
    get:
      tags: [Analytics]
      summary: "Gợi ý hệ số logic mờ từ mô hình học trên dữ liệu thật (ANALYTICS-FR-010)"
      description: |
        Hồi quy Δh(10') = a·%phun + b·%quạt + c·(T−T̄) + d trên ≤ 14 ngày, mô phỏng 24 giờ gần nhất với
        120 bộ hệ số. CHỈ đề xuất, không ghi gì. `suggestion` null kèm `reason` khi < 3 ngày dữ liệu,
        R² < 0.3, phun sương không làm tăng ẩm, hoặc hệ số hiện tại đã gần tốt nhất.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          current: { $ref: "#/components/schemas/FuzzyTuning" }
                          suggestion: { allOf: [{ $ref: "#/components/schemas/FuzzyTuning" }], nullable: true }
                          reason: { type: string, nullable: true }
                          predicted:
                            type: object
                            properties:
                              inRangeNow: { type: number }
                              inRangeSuggested: { type: number }
                              mistingNow: { type: number }
                              mistingSuggested: { type: number }
                          model:
                            type: object
                            nullable: true
                            properties:
                              r2: { type: number }
                              samples: { type: integer }
                              days: { type: number }

  /analytics/env/compare:
    get:
      tags: [Analytics]
      summary: "So sánh môi trường nhiều Zone cùng lúc (ANALYTICS-FR-005, tối đa 6 zone)"
      parameters:
        - {
            name: zoneIds,
            in: query,
            required: true,
            schema: { type: string },
            description: "Danh sách zoneId phân tách bởi dấu phẩy, VD zoneId1,zoneId2",
          }
        - {
            name: range,
            in: query,
            schema:
              { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          zones:
                            type: array
                            items:
                              type: object
                              properties:
                                {
                                  zoneId: { type: string },
                                  zoneName: { type: string },
                                  thresholds:
                                    { $ref: "#/components/schemas/Thresholds" },
                                  metrics: { type: object, nullable: true },
                                }
        "400":
          {
            description: "Thiếu zoneId hoặc vượt quá 6 zone",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /analytics/bird-count/daily:
    get:
      tags: [Analytics]
      summary: "Thống kê đếm chim hàng ngày (VISION-FR-008/010)"
      description: |
        Mỗi ngày là 1 ngày theo giờ Việt Nam (`session_date` của bản ghi phiên — phiên sáng
        05:30 VN là 22:30 UTC hôm trước); `from`/`to` đổi sang ngày giờ VN, tính cả hai đầu.
        Số của cả nhà yến (cộng mọi camera của nhà), xem `BirdCountDay`. Ngày không có tin nào thì không có dòng.
        Trả `records: []` kèm `note` khi chưa có dữ liệu — không phải lỗi truy vấn.
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Nhà yến (SRS v2.1.8 — đếm chim theo House). Cần houseId hoặc zoneId" }
        - { name: zoneId, in: query, deprecated: true, schema: { type: string }, description: "Cách gửi cũ — quy ra House chứa Zone" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          records: { type: array, items: { $ref: "#/components/schemas/BirdCountDay" } }
                          note: { type: string, nullable: true }
        "422": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /analytics/bird-count/current:
    get:
      tags: [Analytics]
      summary: "Số đếm chim hôm nay của nhà yến khi mở trang (VISION-FR-012)"
      description: |
        Hôm nay theo giờ Việt Nam, cả hai phiên, cộng mọi camera của nhà. Frontend gọi khi mở trang, gửi socket
        `JOIN_HOUSE { houseId }` rồi cập nhật bằng `BIRD_COUNT_UPDATE` (room `house:<houseId>`), sự kiện mang
        **cùng con số**: `{ houseId, sessionDate, sessionType, entryCount, exitCount, netCount, returnRate (null được), timestamp }`
        với entry/exit/net là của phiên vừa có tin. Cùng room còn có `DEVICE_STATUS_CHANGE` của camera và `ALERT_NEW`
        của cảnh báo cả nhà (EDGE_AI_DEGRADED, LOW_RETURN_RATE). Nhà chưa có tin hôm nay → các số 0, `return_rate: null`,
        `updated_at: null`. Quyền như các API analytics khác (thành viên farm chứa nhà).
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Nhà yến (SRS v2.1.8 — đếm chim theo House). Cần houseId hoặc zoneId" }
        - { name: zoneId, in: query, deprecated: true, schema: { type: string }, description: "Cách gửi cũ — quy ra House chứa Zone" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/BirdCountDay"
                          - properties:
                              house_id: { type: string }
                              updated_at: { type: string, format: date-time, nullable: true, description: "Tin mới nhất trong ngày" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /analytics/bird-count/trends:
    get:
      tags: [Analytics]
      summary: "Xu hướng đàn chim + cảnh báo giảm > 20% (VISION-FR-009/011, ANALYTICS-FR-002)"
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Nhà yến (SRS v2.1.8 — đếm chim theo House). Cần houseId hoặc zoneId" }
        - { name: zoneId, in: query, deprecated: true, schema: { type: string }, description: "Cách gửi cũ — quy ra House chứa Zone" }
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          days: { type: integer }
                          records: { type: array, items: { $ref: "#/components/schemas/BirdCountDay" } }
                          flock_trend:
                            type: object
                            description: |
                              ANALYTICS-FR-002 — trung bình số chim ra buổi sáng (ra − vào của phiên sáng) theo tuần (từ thứ
                              Hai, giờ VN) và theo tháng trong khoảng `days`, kèm % đổi so với kỳ liền trước; ngày thiếu
                              phiên (VISION-FR-020) không tính. Muốn đủ trung bình tháng thì gửi `days` dài hơn (vd 90).
                              Tuần, tháng đầu của khoảng có thể chỉ có vài ngày (xem `days` của kỳ) nhưng vẫn là mốc so
                              sánh của kỳ sau.
                            properties:
                              weekly: { type: array, items: { $ref: "#/components/schemas/FlockPeriod" } }
                              monthly: { type: array, items: { $ref: "#/components/schemas/FlockPeriod" } }
                          avg_return_rate: { type: number, nullable: true }
                          latest_return_rate: { type: number, nullable: true }
                          drop_percent: { type: number, nullable: true }
                          drop_threshold_pct: { type: number, description: "return_rate_drop_pct của nhà yến (EXPERT-FR-008, PUT /farms/houses/{houseId}/bird-count-tuning), mặc định 20" }
                          is_significant_drop: { type: boolean }

  /analytics/bird-count/buckets:
    get:
      tags: [Analytics]
      summary: "Số chim ra/vào theo khoảng 5 phút (VISION-FR-017)"
      description: |
        Cộng dồn mọi camera của nhà yến theo `bucket_start`, cả ngoài 2 phiên sáng/chiều. Dùng cho
        biểu đồ theo giờ và bối cảnh ±30 phút khi Domain Expert kiểm chứng cảnh báo (EXPERT-FR-003).
        Mặc định 24 giờ gần nhất; khoảng tối đa 7 ngày. Dữ liệu giữ 90 ngày.
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Nhà yến (SRS v2.1.8 — đếm chim theo House). Cần houseId hoặc zoneId" }
        - { name: zoneId, in: query, deprecated: true, schema: { type: string }, description: "Cách gửi cũ — quy ra House chứa Zone" }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: "Mặc định `to` − 24 giờ" }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "Mặc định hiện tại (không gồm mốc này)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          buckets: { type: array, items: { $ref: "#/components/schemas/BirdCountBucket" } }
        "400": { description: "from không trước to, hoặc khoảng quá 7 ngày" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }   # from/to không đọc được thành ngày, thiếu houseId/zoneId

  /analytics/energy:
    get:
      tags: [Analytics]
      summary: "Điện năng ước tính của bơm và quạt của 1 nhà theo tháng (ANALYTICS-FR-017, BR-45)"
      description: |
        Σ điện áp × dòng đo × thời gian: mỗi mẫu telemetry lúc relay BẬT và có dòng đo được tính tới mẫu kế tiếp
        của cùng controller (khoảng quá 30 giây là mất kết nối, không tính, Report 3 §4.5). Tính theo `zone_id` ghi
        trên từng mẫu: controller dời sang nhà khác thì điện đã dùng vẫn thuộc nhà cũ. Mẫu gửi bù (đo lúc mất mạng)
        mang zone lúc backend nhận, nên mẫu đo ở nhà cũ mà gửi bù sau khi đã dời controller offline sang nhà mới thì
        tính cho nhà mới. Điện áp theo tải DC demo của board
        nhóm: bơm 5 V, quạt 12 V (A-9); tải nguồn lưới chưa hỗ trợ. Tải không có dòng đo trong tháng → `null`
        ("not available"). Là số ước tính, không phải công tơ. **Lệch BR-45 đã biết:** BR-45 chỉ tính tải chạy khi
        dòng trên 50 % dòng bình thường, nhưng backend chưa biết mức đã học của firmware nên mọi mẫu relay BẬT có
        dòng đều được cộng. Telemetry giữ 90 ngày (BR-36) nên mặc định là 90 ngày gần nhất; khoảng làm tròn ra
        trọn ngày giờ VN, tối đa 366 ngày. Quyền: FARM_OWNER, DOMAIN_EXPERT (đọc), FARM_TECHNICIAN ở nhà được giao.
      parameters:
        - { name: houseId, in: query, required: true, schema: { type: string, format: objectId } }
        - { name: from, in: query, schema: { type: string, anyOf: [{ format: date }, { format: date-time }] }, description: "Mặc định `to` − 90 ngày; chỉ có ngày (`YYYY-MM-DD`) là đầu ngày giờ VN" }
        - { name: to, in: query, schema: { type: string, anyOf: [{ format: date }, { format: date-time }] }, description: "Mặc định hiện tại (không gồm mốc này); chỉ có ngày (`YYYY-MM-DD`) là đầu ngày giờ VN; ngày giờ phải có `Z` hoặc offset, khác → 422" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          supply_voltage: { type: object, properties: { misting: { type: number, example: 5 }, ventilation: { type: number, example: 12 } } }
                          estimated: { type: boolean, example: true }
                          months: { type: array, items: { $ref: "#/components/schemas/EnergyMonth" } }
                          total:
                            type: object
                            properties:
                              misting_kwh: { type: number, nullable: true }
                              ventilation_kwh: { type: number, nullable: true }
                              total_kwh: { type: number, nullable: true }
        "400": { description: "from không trước to, hoặc khoảng quá 366 ngày" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /analytics/correlation:
    get:
      tags: [Analytics]
      summary: "Tương quan môi trường của Zone vs return rate của nhà yến chứa Zone, theo ngày (ANALYTICS-FR-003)"
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          days: { type: integer }
                          points:
                            type: array
                            items:
                              type: object
                              properties:
                                {
                                  date: { type: string },
                                  avg_temperature: { type: number },
                                  max_temperature: { type: number },
                                  avg_humidity: { type: number },
                                  return_rate: { type: number, nullable: true },
                                }
                          note: { type: string, nullable: true }

  # ── HARVESTS ──────────────────────────────────────────────────────────────
  /harvests:
    post:
      tags: [Harvests]
      summary: "Tạo Harvest Batch (HARVEST-FR-001..004) — FARM_OWNER; FARM_TECHNICIAN ở nhà được giao (Domain Expert chỉ xem qua GET)"
      description: |
        Lô của Farm Owner có `status: CONFIRMED` ngay và đóng chu kỳ thu hoạch của zone (HARVEST-FR-007, xem
        `GET /harvests/cycles`); lô của Farm Technician (chỉ ở zone của nhà được giao, nhà khác → 403) là `DRAFT`,
        chờ Farm Owner xác nhận (`POST /harvests/{id}/confirm`, HARVEST-FR-006).
        Tự động gắn `env_snapshot` (trung bình môi trường 7 ngày trước thu
        hoạch — HARVEST-FR-002) và `flock_snapshot` (return rate 30 ngày —
        HARVEST-FR-003), sinh `trace_code` (UUID) làm mã định danh mẻ. Nếu
        Zone chưa đủ dữ liệu telemetry/bird-count, snapshot trả về
        `insufficient_data: true` thay vì số liệu sai lệch.
        Kiểm hợp lệ (HARVEST-FR-001), sai → 422: `harvest_date` là ngày ISO 8601 không sau
        hôm nay theo giờ Việt Nam; `nest_count` số nguyên ≥ 1; `weight_grams` số > 0;
        `nest_type` thuộc `RAW|CLEANED|PREMIUM`; `product_images` là mảng chuỗi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [zone_id, harvest_date, nest_count, weight_grams, nest_type]
              properties:
                zone_id: { type: string }
                harvest_date: { type: string, format: date-time, description: "Không sau hôm nay (giờ VN)" }
                nest_count: { type: integer, minimum: 1, example: 50 }
                weight_grams: { type: number, exclusiveMinimum: true, minimum: 0, example: 350.5 }
                nest_type:
                  {
                    type: string,
                    enum: [RAW, CLEANED, PREMIUM],
                    description: "thô/tinh",
                  }
                product_images: { type: array, items: { type: string } }
      responses:
        "201":
          {
            description: "Đã tạo (status=CONFIRMED với Farm Owner, DRAFT với Farm Technician)",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      $ref: "#/components/schemas/HarvestBatch",
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Harvests]
      summary: "Danh sách Harvest Batch (farm mình sở hữu/thành viên, hoặc lọc theo farmId); Farm Technician chỉ lô của nhà được giao"
      parameters: [{ name: farmId, in: query, schema: { type: string } }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        {
                                          $ref: "#/components/schemas/HarvestBatch",
                                        },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }

  /harvests/cycles:
    get:
      tags: [Harvests]
      summary: "Chu kỳ thu hoạch theo zone (HARVEST-FR-007, ANALYTICS-FR-004) — FARM_OWNER, DOMAIN_EXPERT; FARM_TECHNICIAN chỉ nhà được giao"
      description: |
        Chu kỳ của một zone chạy từ lần thu hoạch đã xác nhận trước (hoặc lúc đăng ký controller đầu tiên của zone)
        tới lần thu hoạch đã xác nhận kế tiếp (BR-43). Zone chưa có controller, hoặc controller đăng ký từ lần thu
        hoạch đầu trở đi (sổ sản lượng các mùa trước): lần thu hoạch đầu chỉ là mốc bắt đầu, không đóng chu kỳ nào
        (chu kỳ đó không có ngày bắt đầu). Các lô đã xác nhận của cùng zone, cùng ngày (giờ VN) là một
        lần thu hoạch: sản lượng là tổng số tổ, tổng cân nặng. Chu kỳ đóng có so sánh với chu kỳ trước và cùng kỳ
        năm trước (chu kỳ của zone có ngày đóng trong ±30 ngày của một năm trước; không có thì `null` kèm lý do),
        tỷ lệ ngày `GOOD`, tỷ lệ chim về trung bình, thời gian trong ngưỡng của zone và độ đủ (dưới 80 % số ngày
        được đánh giá thì `incomplete`). Chu kỳ chưa đóng có `status: OPEN`. Lọc theo `zoneId`, `houseId` hoặc
        `farmId`; sắp theo `start_date` giảm dần (danh sách chu kỳ đóng của một zone là xu hướng sản lượng).
      parameters:
        - { name: zoneId, in: query, schema: { type: string, format: objectId } }
        - { name: houseId, in: query, schema: { type: string, format: objectId } }
        - { name: farmId, in: query, schema: { type: string, format: objectId } }
        - { name: status, in: query, schema: { type: string, enum: [OPEN, CLOSED, CONCLUDED] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/HarvestCycle" } }
                      meta: { type: object, properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /harvests/cycles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: objectId } }
    get:
      tags: [Harvests]
      summary: "Chi tiết một chu kỳ thu hoạch — FARM_OWNER, DOMAIN_EXPERT; FARM_TECHNICIAN chỉ nhà được giao"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HarvestCycle" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /harvests/cycles/{id}/conclusion:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: objectId } }
    put:
      tags: [Harvests]
      summary: "Kết luận mùa vụ (EXPERT-FR-020) — chỉ DOMAIN_EXPERT"
      description: |
        Ghi kết luận và khuyến nghị cho mùa sau trên một chu kỳ đã đóng; chu kỳ chuyển `CONCLUDED`, sửa lại vẫn
        `CONCLUDED`. Chuyên gia viết thì mỗi Farm Owner nhận một thông báo trong ứng dụng (EXPERT-FR-009). Chu kỳ
        `OPEN` → 409; Farm Owner (kể cả khi farm chưa có chuyên gia: BR-22 không cho viết kết luận khi không có
        chuyên gia) và Farm Technician → 403. Audit `HARVEST_CYCLE_CONCLUDED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
                recommendations: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Chu kỳ sau khi kết luận
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HarvestCycle" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Chu kỳ chưa đóng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /harvests/{id}/photo:
    parameters:
      [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      tags: [Harvests]
      summary: Đặt ảnh của lô (HARVEST-FR-001)
      description: |
        Một ảnh JPEG, PNG hoặc WebP tối đa 5 MB ở trường `photo` (multipart); ảnh mới thay ảnh cũ. Farm Owner, hoặc Farm
        Technician với lô DRAFT do chính mình nhập (HARVEST-FR-005). Trả lô kèm `photo_url`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/HarvestBatch" } }
        "400": { description: "Không phải ảnh JPEG/PNG/WebP hoặc quá 5 MB", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: "Domain Expert, thợ không được giao nhà hoặc lô không phải DRAFT của mình", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { description: "Thiếu trường `photo`", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /harvests/{id}:
    parameters:
      [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Harvests]
      summary: Chi tiết Harvest Batch
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      $ref: "#/components/schemas/HarvestBatch",
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Harvests]
      summary: "Cập nhật Harvest Batch (HARVEST-FR-005) — FARM_OWNER mọi lô; FARM_TECHNICIAN chỉ lô DRAFT của mình"
      description: "Sửa số liệu ghi nhận của mẻ; env/flock snapshot chỉ chụp một lần lúc tạo, không sửa qua đây. Farm Technician sửa lô đã CONFIRMED hoặc lô của người khác → 403. Trường gửi lên kiểm như lúc tạo (HARVEST-FR-001): `nest_count` < 1, `weight_grams` ≤ 0, `nest_type` lạ → 422."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nest_count: { type: integer, minimum: 1 }
                weight_grams: { type: number, exclusiveMinimum: true, minimum: 0 }
                nest_type: { type: string, enum: [RAW, CLEANED, PREMIUM] }
                product_images: { type: array, items: { type: string } }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      $ref: "#/components/schemas/HarvestBatch",
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Harvests]
      summary: "Xóa mềm Harvest Batch (HARVEST-FR-005) — FARM_OWNER mọi lô; FARM_TECHNICIAN chỉ lô DRAFT của mình"
      description: "Xoá lô đã xác nhận thì chu kỳ nó đóng gộp vào chu kỳ sau (Report 3 §6.13); sửa số tổ, cân nặng của lô đã xác nhận (PUT) thì số liệu chu kỳ được tính lại."
      responses:
        "200":
          {
            description: Đã xoá,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /harvests/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Harvests]
      summary: "Xác nhận lô do Farm Technician nhập (HARVEST-FR-006) — FARM_OWNER của farm"
      description: |
        `DRAFT` → `CONFIRMED`, ghi `confirmed_by`, `confirmed_at`, audit `HARVEST_CONFIRMED`. Lô đã xác nhận
        → 409; Farm Technician, Domain Expert → 403. Xác nhận đóng chu kỳ thu hoạch của zone (HARVEST-FR-007,
        BR-43): các lô đã xác nhận của cùng zone, cùng ngày (giờ VN) là một lần thu hoạch.
      responses:
        "200":
          description: Lô sau khi xác nhận
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HarvestBatch" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Lô đã được xác nhận", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  # ── HEALTH REPORTS ────────────────────────────────────────────────────────
  /health-reports:
    get:
      tags: [HealthReports]
      summary: "Danh sách báo cáo sức khỏe theo nhà yến (EXPERT-FR-005) — FARM_OWNER, DOMAIN_EXPERT; FARM_TECHNICIAN chỉ nhà được giao (Report 3 §2.4)"
      description: |
        Báo cáo theo nhà yến, mỗi Zone một mục (G-11 phần b). Job tạo theo lịch BR-33: `DAILY` ngay sau
        đánh giá ngày (sau kiểm tra tỷ lệ chim về 19:15), `WEEKLY` thứ Hai 06:00 (7 ngày trước đó),
        `MONTHLY` ngày 1 lúc 06:00 (tháng trước), giờ VN; `CUSTOM` do người dùng tạo (`POST`). Báo cáo tuần,
        tháng tạo xong báo trong ứng dụng cho Farm Owner và Domain Expert của farm (thông báo kind `health_report`,
        không kèm trạng thái ngày); báo cáo ngày không có thông báo riêng vì thông báo "ngày đã sẵn sàng" của
        đánh giá ngày đi cùng lúc; báo cáo theo yêu cầu không báo. Mới nhất trước. Danh sách chỉ có phần tóm tắt (không có `zone_sections`,
        `days`).

        Báo cáo tuần theo Zone kiểu cũ đã được chuyển vào báo cáo nhà `WEEKLY` cùng kỳ (`npm run migrate:zone-reports`,
        G-32) và không còn tham số `zoneId`.
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Một trong houseId, farmId là bắt buộc (400 nếu thiếu)" }
        - { name: farmId, in: query, schema: { type: string }, description: "Mọi nhà của farm; Farm Technician: chỉ các nhà được giao" }
        - { name: kind, in: query, schema: { type: string, enum: [DAILY, WEEKLY, MONTHLY, CUSTOM] } }
        - { name: from, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN — báo cáo có kỳ kết thúc từ ngày này" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN — báo cáo có kỳ bắt đầu tới ngày này" }
        - { name: hasConclusion, in: query, schema: { type: boolean }, description: "true: chỉ báo cáo đã có kết luận; false: chỉ báo cáo chưa có (số \"báo cáo chờ kết luận\" của chuyên gia = meta.total). Không gửi: mọi báo cáo" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/HouseHealthReportSummary" }
                      meta:
                        type: object
                        properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } }
        "400": { description: "Thiếu houseId và farmId / from sau to", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [HealthReports]
      summary: "Tạo báo cáo theo yêu cầu cho khoảng bất kỳ tới 31 ngày (EXPERT-FR-005) — FARM_OWNER, DOMAIN_EXPERT; FARM_TECHNICIAN ở nhà được giao"
      description: |
        Tạo và lưu báo cáo `CUSTOM` của 1 nhà cho các ngày `from`…`to` (giờ VN, tính cả 2 đầu). Cùng nhà và
        cùng khoảng đã có báo cáo `CUSTOM` thì tính lại và trả bản đó (200), không tạo bản thứ hai.
        Không gửi thông báo (người tạo đang xem).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [houseId, from, to]
              properties:
                houseId: { type: string }
                from: { type: string, format: date, description: "'YYYY-MM-DD' giờ VN" }
                to: { type: string, format: date, description: "'YYYY-MM-DD' giờ VN, không sau hôm nay" }
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthReport" }
        "200":
          description: Đã có báo cáo cùng khoảng — trả bản đã tính lại
        "400": { description: "from sau to / quá 31 ngày / to sau hôm nay", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /health-reports/days:
    get:
      tags: [HealthReports]
      summary: "Trạng thái sức khỏe các ngày của nhà yến (ANALYTICS-FR-012, BR-31) — FARM_OWNER, DOMAIN_EXPERT; FARM_TECHNICIAN chỉ nhà được giao (farmId: chỉ các nhà được giao)"
      description: |
        Mỗi nhà mỗi ngày (giờ VN) một bản ghi, do job đánh giá tạo sau kiểm tra tỷ lệ chim về (19:15,
        BR-21) và tính lại khi dữ liệu trễ hoặc kết luận cảnh báo đổi trong 7 ngày (SM-17). Mới nhất trước.
        **BR-31 (Report 3 4.2.14):** mọi ngày có đủ trạng thái, lý do, chỉ số, bằng chứng và điểm của
        người khác, kể cả ngày người gọi còn `PENDING`: người chấm xem trạng thái rồi mới chấm.
        Khoảng tối đa 31 ngày (400). `myRatingState` lọc theo trạng thái chấm
        của chính người gọi (vd `PENDING`: các ngày còn phải chấm, cho màn "ngày cần chấm" và hàng đợi việc).
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Một trong houseId, farmId là bắt buộc (400 nếu thiếu cả hai)" }
        - { name: farmId, in: query, schema: { type: string }, description: "Mọi nhà của farm" }
        - { name: from, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định to − 6 ngày" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định hôm nay" }
        - { name: myRatingState, in: query, schema: { type: string, enum: [PENDING, RATED, SKIPPED, EXPIRED] }, description: "Chỉ các ngày người gọi đang ở trạng thái chấm này (SM-18)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/HouseHealthDay" } }
        "400": { description: "Thiếu houseId và farmId / from sau to / quá 31 ngày", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /health-reports/days.csv:
    get:
      tags: [HealthReports]
      summary: "CSV chỉ số theo ngày (EXPERT-FR-013) — FARM_OWNER, DOMAIN_EXPERT; FARM_TECHNICIAN chỉ nhà được giao"
      description: |
        1 dòng mỗi nhà × ngày: tên nhà, ngày, trạng thái chấm của người gọi, giá trị và mức của 4 chỉ số,
        tỷ lệ chim về, trạng thái, lý do, điểm của từng người chấm (tên, vai trò), thời tiết. Không có id
        nội bộ. Mọi dòng có đủ cột, kể cả ngày người gọi còn `PENDING` (BR-31). UTF-8 có BOM để Excel đọc
        đúng tiếng Việt. Tiêu đề cột, trạng thái, mức và lý do (in từ `HealthReason`) theo `lang`. Cùng
        tham số và giới hạn với `GET /health-reports/days`.
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Một trong houseId, farmId là bắt buộc (400 nếu thiếu cả hai)" }
        - { name: farmId, in: query, schema: { type: string }, description: "Mọi nhà của farm" }
        - { name: from, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định to − 6 ngày" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định hôm nay" }
        - { name: lang, in: query, schema: { type: string, enum: [vi, en], default: vi }, description: "Ngôn ngữ của file" }
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
        "400": { description: "Thiếu houseId và farmId / from sau to / quá 31 ngày", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /health-reports/days/{dayId}:
    get:
      tags: [HealthReports]
      summary: "Chi tiết 1 ngày (ANALYTICS-FR-012) — đủ trạng thái như danh sách (BR-31)"
      parameters: [{ name: dayId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthDay" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health-reports/days/{dayId}/rating:
    post:
      tags: [HealthReports]
      summary: "Chấm trạng thái ngày theo quan sát của mình (EXPERT-FR-012) — chỉ người chấm: FARM_OWNER, FARM_TECHNICIAN của nhà"
      description: |
        **Người chấm (BR-31, Report 3 4.2.0):** Farm Owner chấm những ngày có mặt ở nhà; Farm Technician
        được giao nhà chấm mỗi ngày (nhà khác hoặc đã bị gỡ khỏi nhà → 403, AUTH-FR-013). Domain Expert và
        Administrator nhận 403: chuyên gia xem các ngày lệch thay vì chấm (`GET /health-reports/disagreements`).
        Điểm và ảnh chụp đánh giá (`current_status`, `current_reasons` và mức từng nguồn lúc ghi) được lưu
        trong một lệnh ghi; người chấm đã thấy trạng thái này trước khi chấm (BR-31). Ảnh chụp không bao giờ đổi; NFR-14 chỉ dùng ảnh chụp.
        Mỗi người chấm riêng; chấm được tới hết 7 ngày sau ngày đó (Report 3 §4.5). Ghi audit
        `HEALTH_DAY_RATED`.
      parameters: [{ name: dayId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: string, enum: [GOOD, WATCH, ACTION] }
                note: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Đã lưu; trả ngày đầy đủ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthDay" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "RATING_CLOSED — người gọi đã chấm, đã bỏ qua, hoặc ngày đã quá 7 ngày (SM-18)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /health-reports/days/{dayId}/skip:
    post:
      tags: [HealthReports]
      summary: "Bỏ qua chấm ngày này (EXPERT-FR-012, BR-31) — chỉ người chấm: FARM_OWNER, FARM_TECHNICIAN của nhà"
      description: |
        Farm Owner bỏ qua những ngày không ra nhà yến (Farm Technician cũng bỏ qua được). Domain Expert và Administrator nhận 403. Hiện trạng thái cho người gọi; lần bỏ qua không tính vào NFR-14 (SM-18 `PENDING → SKIPPED`).
        Ghi audit `HEALTH_DAY_SKIPPED`.
      parameters: [{ name: dayId, in: path, required: true, schema: { type: string } }]
      responses:
        "201":
          description: Đã bỏ qua; trả ngày đầy đủ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthDay" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "RATING_CLOSED — người gọi đã chấm, đã bỏ qua, hoặc ngày đã quá 7 ngày (SM-18)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /health-reports/days/{dayId}/rating/note:
    patch:
      tags: [HealthReports]
      summary: "Thêm ghi chú vào điểm đã chấm (SM-18 RATED → RATED) — điểm không đổi; chỉ người chấm: FARM_OWNER, FARM_TECHNICIAN của nhà"
      parameters: [{ name: dayId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
