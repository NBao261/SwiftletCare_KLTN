  # ── ALERTS ────────────────────────────────────────────────────────────────
  /alerts:
    get:
      tags: [Alerts]
      summary: "Danh sách cảnh báo (ALERT-FR-007) — phân trang, filter"
      description: |
        Farm Owner chỉ thấy cảnh báo của farm mình (owner/member). Domain Expert thấy
        cảnh báo của farm được mời (chỉ đọc + kiểm chứng). Technician thấy **cảnh báo
        thiết bị** của mọi farm (`NODE_OFFLINE`, `EDGE_AI_DEGRADED`, `SENSOR_FAULT`,
        `RS485_BUS_FAILURE`, `UNEXPECTED_RESTART`, `SPEAKER_FAILURE`, `MISTING_INEFFECTIVE`,
        `ACTUATOR_FAULT`, `CONFIG_MISMATCH`, `MAINTENANCE_DUE` —
        Report 3 §1.3, FARM-FR-009), giao với bộ lọc `type`. Administrator: rỗng.
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
        - { name: houseId, in: query, schema: { type: string }, description: "Cảnh báo của cả nhà yến (camera đếm chim)" }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/AlertType" } }
        - name: verdict
          in: query
          description: "EXPERT-FR-003 — `pending` = cảnh báo suy luận (NOISE_ANOMALY, SENSOR_ANOMALY, FORECAST_BREACH, LOW_RETURN_RATE) chưa được kiểm chứng"
          schema: { type: string, enum: [pending, confirmed, rejected] }
        - {
            name: status,
            in: query,
            description: "`DISMISSED` — cảnh báo suy luận bị bác bỏ, không còn hiệu lực (ALERT-FR-007)",
            schema: { type: string, enum: [ACTIVE, ACKNOWLEDGED, DISMISSED, RESOLVED] },
          }
        - {
            name: severity,
            in: query,
            schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] },
          }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Alert" },
                        }
                      meta:
                        type: object
                        properties:
                          {
                            page: { type: integer },
                            limit: { type: integer },
                            total: { type: integer },
                            unreadCount:
                              {
                                type: integer,
                                description: "Số cảnh báo ACTIVE (ALERT-FR-007)",
                              },
                          }

  /alerts/verdict-stats:
    get:
      tags: [Alerts]
      summary: "Tỷ lệ cảnh báo suy luận được xác nhận theo từng loại (EXPERT-FR-003)"
      description: |
        Căn cứ để Domain Expert chỉnh tham số phát hiện (EXPERT-FR-008). `confirmedPct`
        tính trên số đã kiểm chứng; `null` khi chưa kiểm chứng cảnh báo nào của loại đó.
        `byRole` tách số xác nhận / bác bỏ theo vai trò người kết luận (Farm Owner kết luận
        khi farm chưa có chuyên gia, BR-22).
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { $ref: "#/components/schemas/AlertType" }
                            confirmed: { type: integer }
                            rejected: { type: integer }
                            pending: { type: integer }
                            confirmedPct: { type: integer, nullable: true }
                            byRole:
                              type: object
                              properties:
                                DOMAIN_EXPERT: { type: object, properties: { confirmed: { type: integer }, rejected: { type: integer } } }
                                FARM_OWNER: { type: object, properties: { confirmed: { type: integer }, rejected: { type: integer } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /alerts/{id}:
    get:
      tags: [Alerts]
      summary: Chi tiết cảnh báo
      description: "Cùng phạm vi với danh sách: Technician chỉ mở được cảnh báo thiết bị (loại khác → 403); Administrator → 403."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Alert" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alerts/{id}/evidence:
    get:
      tags: [Alerts]
      summary: "Bằng chứng của một cảnh báo suy luận (ALERT-FR-014, EXPERT-FR-003) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        Hệ thống trình bày dữ liệu, không tự kết luận.
        - `NOISE_ANOMALY`, `SENSOR_ANOMALY`, `FORECAST_BREACH`: cửa sổ `created_at ± 30 phút`; mẫu
          telemetry của zone (nhiệt độ, độ ẩm, NH3, CO2, tiếng ồn), số đếm 5 phút của nhà chứa zone,
          cảnh báo thiết bị đang mở của zone.
        - `LOW_RETURN_RATE`: ngày của phiên (`metadata.sessionDate`); % thời gian trong ngưỡng của từng
          zone trong nhà, `NOISE_ANOMALY` và cảnh báo thiết bị của nhà trong ngày đó.

        Nguồn không có dữ liệu trong cửa sổ (VD nút AI offline) có `status: missing`, không trả 0.
        `earlier_verdicts`: tối đa 10 cảnh báo trước cùng loại, cùng zone/nhà, đã có kết luận.
        Loại không phải suy luận → 400; không có quyền trên farm → 403 (Technician, Administrator).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/AlertEvidence" }
        "400": { description: "Cảnh báo không thuộc loại suy luận", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alerts/{id}/acknowledge:
    put:
      tags: [Alerts]
      summary: "Xác nhận cảnh báo (ALERT-FR-009) — chỉ FARM_OWNER (Domain Expert chỉ đọc và kiểm chứng)"
      description: "Chỉ `FARM_OWNER`; Technician, Administrator chỉ xem cảnh báo → 403 (Report 3 §2.4). Chỉ xác nhận được cảnh báo còn `status=ACTIVE`; ghi chú được giữ làm dữ liệu đánh giá chất lượng model AI (VD \"Báo động giả\"). Xác nhận `MAINTENANCE_DUE` = đã bảo trì: đếm lại `since_service_*` của các tải trong `metadata.loads` từ 0 và chuyển cảnh báo sang `RESOLVED` (ALERT-FR-016, BR-16)."
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string } } }
      responses:
        "200":
          {
            description: Đã xác nhận,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Alert" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          {
            description: Cảnh báo này đã được xác nhận trước đó,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /alerts/{id}/verdict:
    put:
      tags: [Alerts]
      summary: "Xác nhận/bác bỏ một cảnh báo suy luận (EXPERT-FR-003) — DOMAIN_EXPERT; FARM_OWNER khi farm chưa có chuyên gia (BR-22)"
      description: |
        Chỉ áp cho `NOISE_ANOMALY`, `SENSOR_ANOMALY`, `FORECAST_BREACH`, `LOW_RETURN_RATE`
        (loại khác → 400). Ghi lại được; lưu người, vai trò, thời điểm, ghi chú. Farm Owner
        trên farm đã có Domain Expert → 403. `REJECTED` bắt buộc có `note` (422).

        Tác động lên `status` (Report 3 §6.1, SM-01):
        - `REJECTED` khi `ACTIVE`/`ACKNOWLEDGED` → `DISMISSED`, trạng thái cũ lưu ở `previous_status`;
          cảnh báo không còn hiệu lực, lần gặp lại cùng sự cố chỉ tăng `occurrence_count`, không thông báo;
        - đổi sang `CONFIRMED` khi `DISMISSED` → về `previous_status` và báo lại Farm Owner;
        - `CONFIRMED` trên cảnh báo còn hiệu lực, hoặc mọi kết luận trên cảnh báo `RESOLVED` → giữ nguyên.

        Ghi audit `ALERT_VERDICT_SET`; kết luận của Domain Expert báo trong app cho mọi Farm Owner (EXPERT-FR-009).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [CONFIRMED, REJECTED] }
                note: { type: string, maxLength: 1000, description: "Bắt buộc khi `result = REJECTED`" }
      responses:
        "200":
          description: Đã ghi kết quả kiểm chứng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Alert" }
        "400": { description: "Cảnh báo không thuộc loại suy luận", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { description: "Không có quyền trên farm, hoặc Farm Owner trên farm đã có Domain Expert (BR-22)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── ANALYTICS ─────────────────────────────────────────────────────────────
  /analytics/env/summary:
    get:
      tags: [Analytics]
      summary: "Biểu đồ lịch sử môi trường theo khoảng thời gian (ANALYTICS-FR-001)"
      description: Chuỗi thời gian đã gom nhóm theo bucket (tối đa 120 điểm) + min/max/avg từng chỉ số.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - {
            name: range,
            in: query,
            schema:
              { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          bucketMs: { type: integer }
                          series: { type: array, items: { type: object } }
                          stats: { type: object, nullable: true }
        "400":
          {
            description: "range không hợp lệ",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /analytics/autonomy:
    get:
      tags: [Analytics]
      summary: "Tỷ lệ thời gian tự động của Zone (ANALYTICS-FR-011)"
      description: |
        % thời gian trong khoảng mà không relay nào của Zone bị can thiệp tay, tính từ lịch
        sử override (ENV-FR-019): các khoảng chồng nhau chỉ tính một lần, override đang mở
        tính tới hiện tại. Override diễn ra trước khi có lịch sử không được tính.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          auto_mode_pct: { type: number, nullable: true, example: 94.8 }
                          manual_minutes: { type: integer }
                          override_count: { type: integer }
        "400": { description: "range không hợp lệ", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /analytics/control/performance:
    get:
      tags: [Analytics]
      summary: "Hiệu quả bộ điều khiển mờ của Zone (ANALYTICS-FR-008)"
      description: |
        Chỉ tính mẫu telemetry có `misting_pct` (firmware ≥ 1.1.0). `series`: độ ẩm, nhiệt độ,
        % phun, % quạt trung bình theo bucket (tối đa 120 điểm). `stats` (null khi chưa có dữ
        liệu): % mẫu nằm trong ngưỡng hiện tại của Zone, % phun/quạt trung bình, số lần relay
        đóng cắt/giờ (null khi dữ liệu < 15 phút). `tuning_changes`: các lần chỉnh hệ số trong khoảng.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          bucketMs: { type: integer }
                          thresholds:
                            type: object
                            properties:
                              humidity_min: { type: number }
                              humidity_max: { type: number }
                              temp_min: { type: number }
                              temp_max: { type: number }
                          fuzzy_tuning: { $ref: "#/components/schemas/FuzzyTuning" }
                          tuning_changes:
                            type: array
                            items:
                              type: object
                              properties:
                                changed_at: { type: string, format: date-time }
                                new_values: { $ref: "#/components/schemas/FuzzyTuning" }
                          series:
                            type: array
                            items:
                              type: object
                              properties:
                                timestamp: { type: string, format: date-time }
                                humidity: { type: number, nullable: true }
                                temperature: { type: number, nullable: true }
                                misting_pct: { type: number, nullable: true }
                                ventilation_pct: { type: number, nullable: true }
                          stats:
                            type: object
                            nullable: true
                            properties:
                              sampleCount: { type: integer }
                              humidityInRangePct: { type: number, nullable: true }
                              temperatureInRangePct: { type: number, nullable: true }
                              mistingAvgPct: { type: number, nullable: true }
                              ventilationAvgPct: { type: number, nullable: true }
                              mistingSwitchesPerHour: { type: number, nullable: true }
                              ventilationSwitchesPerHour: { type: number, nullable: true }
                          service_limits:
                            type: object
                            description: "ALERT-FR-016 — mốc bảo trì theo thời gian chạy (quá mốc → cảnh báo MAINTENANCE_DUE)"
                            properties:
                              misting: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
                              ventilation: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
                          relay_usage:
                            type: array
                            description: "Giờ chạy / số lần đóng cắt từ lần bảo trì trước, theo thiết bị"
                            items:
                              type: object
                              properties:
                                device_id: { type: string }
                                misting: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
                                ventilation: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
        "400":
          description: "range không hợp lệ"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /analytics/forecast:
    get:
      tags: [Analytics]
      summary: "Dự báo độ ẩm/nhiệt độ 60 phút tới (ANALYTICS-FR-009)"
      description: |
        Holt trend tắt dần trên 6 giờ gần nhất gom 5 phút; α, β chọn bằng tìm lưới; `mae30`/`mae60`
        = sai số tuyệt đối trung bình đánh giá lùi. Mỗi chỉ số là null khi < 2 giờ dữ liệu hoặc mẫu mới
        nhất cũ hơn 15 phút. `predicted` = chỉ số hiện còn trong ngưỡng nhưng dự báo vượt trong 60 phút.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          horizonMinutes: { type: integer, example: 60 }
                          bucketMinutes: { type: integer, example: 5 }
                          humidity: { $ref: "#/components/schemas/MetricForecast" }
                          temperature: { $ref: "#/components/schemas/MetricForecast" }
                          thresholds: { type: object }
                          predicted:
                            type: object
                            nullable: true
                            properties:
                              metric: { type: string, enum: [humidity, temperature] }
                              direction: { type: string, enum: [above, below] }
                              limit: { type: number }
                              value: { type: number }
                              minutesAhead: { type: integer }

  /analytics/control/suggestion:
    get:
      tags: [Analytics]
      summary: "Gợi ý hệ số logic mờ từ mô hình học trên dữ liệu thật (ANALYTICS-FR-010)"
      description: |
        Hồi quy Δh(10') = a·%phun + b·%quạt + c·(T−T̄) + d trên ≤ 14 ngày, mô phỏng 24 giờ gần nhất với
        120 bộ hệ số. CHỈ đề xuất, không ghi gì. `suggestion` null kèm `reason` khi < 3 ngày dữ liệu,
        R² < 0.3, phun sương không làm tăng ẩm, hoặc hệ số hiện tại đã gần tốt nhất.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          current: { $ref: "#/components/schemas/FuzzyTuning" }
                          suggestion: { allOf: [{ $ref: "#/components/schemas/FuzzyTuning" }], nullable: true }
                          reason: { type: string, nullable: true }
                          predicted:
                            type: object
                            properties:
                              inRangeNow: { type: number }
                              inRangeSuggested: { type: number }
                              mistingNow: { type: number }
                              mistingSuggested: { type: number }
                          model:
                            type: object
                            nullable: true
                            properties:
                              r2: { type: number }
                              samples: { type: integer }
                              days: { type: number }

  /analytics/env/compare:
    get:
      tags: [Analytics]
      summary: "So sánh môi trường nhiều Zone cùng lúc (ANALYTICS-FR-005, tối đa 6 zone)"
      parameters:
        - {
            name: zoneIds,
            in: query,
            required: true,
            schema: { type: string },
            description: "Danh sách zoneId phân tách bởi dấu phẩy, VD zoneId1,zoneId2",
          }
        - {
            name: range,
            in: query,
            schema:
              { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          zones:
                            type: array
                            items:
                              type: object
                              properties:
                                {
                                  zoneId: { type: string },
                                  zoneName: { type: string },
                                  thresholds:
                                    { $ref: "#/components/schemas/Thresholds" },
                                  metrics: { type: object, nullable: true },
                                }
        "400":
          {
            description: "Thiếu zoneId hoặc vượt quá 6 zone",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /analytics/bird-count/daily:
    get:
      tags: [Analytics]
      summary: "Thống kê đếm chim hàng ngày (VISION-FR-008/010)"
      description: |
        Mỗi ngày là 1 ngày theo giờ Việt Nam (`session_date` của bản ghi phiên — phiên sáng
        05:30 VN là 22:30 UTC hôm trước); `from`/`to` đổi sang ngày giờ VN, tính cả hai đầu.
        Số của cả nhà yến (cộng mọi camera của nhà), xem `BirdCountDay`. Ngày không có tin nào thì không có dòng.
        Trả `records: []` kèm `note` khi chưa có dữ liệu — không phải lỗi truy vấn.
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Nhà yến (SRS v2.1.8 — đếm chim theo House). Cần houseId hoặc zoneId" }
        - { name: zoneId, in: query, deprecated: true, schema: { type: string }, description: "Cách gửi cũ — quy ra House chứa Zone" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          records: { type: array, items: { $ref: "#/components/schemas/BirdCountDay" } }
                          note: { type: string, nullable: true }
        "422": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /analytics/bird-count/current:
    get:
      tags: [Analytics]
      summary: "Số đếm chim hôm nay của nhà yến khi mở trang (VISION-FR-012)"
      description: |
        Hôm nay theo giờ Việt Nam, cả hai phiên, cộng mọi camera của nhà. Frontend gọi khi mở trang, gửi socket
        `JOIN_HOUSE { houseId }` rồi cập nhật bằng `BIRD_COUNT_UPDATE` (room `house:<houseId>`), sự kiện mang
        **cùng con số**: `{ houseId, sessionDate, sessionType, entryCount, exitCount, netCount, returnRate (null được), timestamp }`
        với entry/exit/net là của phiên vừa có tin. Cùng room còn có `DEVICE_STATUS_CHANGE` của camera và `ALERT_NEW`
        của cảnh báo cả nhà (EDGE_AI_DEGRADED, LOW_RETURN_RATE). Nhà chưa có tin hôm nay → các số 0, `return_rate: null`,
        `updated_at: null`. Quyền như các API analytics khác (thành viên farm chứa nhà).
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Nhà yến (SRS v2.1.8 — đếm chim theo House). Cần houseId hoặc zoneId" }
        - { name: zoneId, in: query, deprecated: true, schema: { type: string }, description: "Cách gửi cũ — quy ra House chứa Zone" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/BirdCountDay"
                          - properties:
                              house_id: { type: string }
                              updated_at: { type: string, format: date-time, nullable: true, description: "Tin mới nhất trong ngày" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /analytics/bird-count/trends:
    get:
      tags: [Analytics]
      summary: "Xu hướng đàn chim + cảnh báo giảm > 20% (VISION-FR-009/011, ANALYTICS-FR-002)"
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Nhà yến (SRS v2.1.8 — đếm chim theo House). Cần houseId hoặc zoneId" }
        - { name: zoneId, in: query, deprecated: true, schema: { type: string }, description: "Cách gửi cũ — quy ra House chứa Zone" }
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          days: { type: integer }
                          records: { type: array, items: { $ref: "#/components/schemas/BirdCountDay" } }
                          avg_return_rate: { type: number, nullable: true }
                          latest_return_rate: { type: number, nullable: true }
                          drop_percent: { type: number, nullable: true }
                          drop_threshold_pct: { type: number, description: "return_rate_drop_pct của nhà yến (EXPERT-FR-008, PUT /farms/houses/{houseId}/bird-count-tuning), mặc định 20" }
                          is_significant_drop: { type: boolean }

  /analytics/bird-count/buckets:
    get:
      tags: [Analytics]
      summary: "Số chim ra/vào theo khoảng 5 phút (VISION-FR-017)"
      description: |
        Cộng dồn mọi camera của nhà yến theo `bucket_start`, cả ngoài 2 phiên sáng/chiều. Dùng cho
        biểu đồ theo giờ và bối cảnh ±30 phút khi Domain Expert kiểm chứng cảnh báo (EXPERT-FR-003).
        Mặc định 24 giờ gần nhất; khoảng tối đa 7 ngày. Dữ liệu giữ 90 ngày.
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Nhà yến (SRS v2.1.8 — đếm chim theo House). Cần houseId hoặc zoneId" }
        - { name: zoneId, in: query, deprecated: true, schema: { type: string }, description: "Cách gửi cũ — quy ra House chứa Zone" }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: "Mặc định `to` − 24 giờ" }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "Mặc định hiện tại (không gồm mốc này)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          buckets: { type: array, items: { $ref: "#/components/schemas/BirdCountBucket" } }
        "400": { description: "from không trước to, hoặc khoảng quá 7 ngày" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }   # from/to không đọc được thành ngày, thiếu houseId/zoneId

  /analytics/correlation:
    get:
      tags: [Analytics]
      summary: "Tương quan môi trường của Zone vs return rate của nhà yến chứa Zone, theo ngày (ANALYTICS-FR-003)"
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          days: { type: integer }
                          points:
                            type: array
                            items:
                              type: object
                              properties:
                                {
                                  date: { type: string },
                                  avg_temperature: { type: number },
                                  max_temperature: { type: number },
                                  avg_humidity: { type: number },
                                  return_rate: { type: number, nullable: true },
                                }
                          note: { type: string, nullable: true }

  # ── HARVESTS ──────────────────────────────────────────────────────────────
  /harvests:
    post:
      tags: [Harvests]
      summary: "Tạo Harvest Batch (HARVEST-FR-001..004) — FARM_OWNER (Domain Expert chỉ xem qua GET)"
      description: |
        Tự động gắn `env_snapshot` (trung bình môi trường 7 ngày trước thu
        hoạch — HARVEST-FR-002) và `flock_snapshot` (return rate 30 ngày —
        HARVEST-FR-003), sinh `trace_code` (UUID) làm mã định danh mẻ. Nếu
        Zone chưa đủ dữ liệu telemetry/bird-count, snapshot trả về
        `insufficient_data: true` thay vì số liệu sai lệch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [zone_id, harvest_date, nest_count, weight_grams, nest_type]
              properties:
                zone_id: { type: string }
                harvest_date: { type: string, format: date-time }
                nest_count: { type: integer, example: 50 }
                weight_grams: { type: number, example: 350.5 }
                nest_type:
                  {
                    type: string,
                    enum: [RAW, CLEANED, PREMIUM],
                    description: "thô/tinh",
                  }
                product_images: { type: array, items: { type: string } }
      responses:
        "201":
          {
            description: "Đã tạo (status=DRAFT)",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      $ref: "#/components/schemas/HarvestBatch",
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Harvests]
      summary: Danh sách Harvest Batch (farm mình sở hữu/thành viên, hoặc lọc theo farmId)
      parameters: [{ name: farmId, in: query, schema: { type: string } }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        {
                                          $ref: "#/components/schemas/HarvestBatch",
                                        },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }

  /harvests/{id}:
    parameters:
      [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Harvests]
      summary: Chi tiết Harvest Batch
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      $ref: "#/components/schemas/HarvestBatch",
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Harvests]
      summary: "Cập nhật Harvest Batch (HARVEST-FR-005)"
      description: "Sửa số liệu ghi nhận của mẻ; env/flock snapshot chỉ chụp một lần lúc tạo, không sửa qua đây."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nest_count: { type: integer }
                weight_grams: { type: number }
                nest_type: { type: string, enum: [RAW, CLEANED, PREMIUM] }
                product_images: { type: array, items: { type: string } }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      $ref: "#/components/schemas/HarvestBatch",
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Harvests]
      summary: "Xóa mềm Harvest Batch"
      responses:
        "200":
          {
            description: Đã xoá,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── HEALTH REPORTS ────────────────────────────────────────────────────────
  /health-reports:
    get:
      tags: [HealthReports]
      summary: "Danh sách báo cáo sức khỏe của Zone (EXPERT-FR-005) — FARM_OWNER/DOMAIN_EXPERT (mọi route /health-reports)"
      description: |
        Báo cáo do job tổng hợp theo chu kỳ (mặc định 06:00 thứ Hai, kỳ 7 ngày —
        `HEALTH_REPORT_CRON`, `HEALTH_REPORT_DAYS`), mới nhất trước. Zone không có mẫu
        telemetry nào trong kỳ thì không có báo cáo cho kỳ đó.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ZoneHealthReport" } }
                      meta:
                        type: object
                        properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /health-reports/preview:
    get:
      tags: [HealthReports]
      summary: "Số liệu sức khỏe Zone theo khoảng bất kỳ, không lưu (EXPERT-FR-005)"
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "Mặc định là hiện tại; khoảng tối đa 30 ngày" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ZoneHealthReport" }
        "400": { description: "from không trước to, hoặc khoảng quá 30 ngày", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /health-reports/days:
    get:
      tags: [HealthReports]
      summary: "Trạng thái sức khỏe các ngày của nhà yến (ANALYTICS-FR-012, BR-31) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        Mỗi nhà mỗi ngày (giờ VN) một bản ghi, do job đánh giá tạo sau kiểm tra tỷ lệ chim về (19:15,
        BR-21) và tính lại khi dữ liệu trễ hoặc kết luận cảnh báo đổi trong 7 ngày (SM-17). Mới nhất trước.
        **BR-31:** ngày người gọi còn `PENDING` (chưa chấm, chưa bỏ qua, còn trong hạn) chỉ có nhà, ngày,
        thời tiết, `my_rating_state`, `rating_deadline` — không có trạng thái, lý do, chỉ số, bằng chứng
        hay điểm của người khác. Khoảng tối đa 31 ngày (400). `myRatingState` lọc theo trạng thái chấm
        của chính người gọi (vd `PENDING`: các ngày còn phải chấm, cho màn "ngày cần chấm" và hàng đợi việc).
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Một trong houseId, farmId là bắt buộc (400 nếu thiếu cả hai)" }
        - { name: farmId, in: query, schema: { type: string }, description: "Mọi nhà của farm" }
        - { name: from, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định to − 6 ngày" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định hôm nay" }
        - { name: myRatingState, in: query, schema: { type: string, enum: [PENDING, RATED, SKIPPED, EXPIRED] }, description: "Chỉ các ngày người gọi đang ở trạng thái chấm này (SM-18)" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/HouseHealthDay" } }
        "400": { description: "Thiếu houseId và farmId / from sau to / quá 31 ngày", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /health-reports/days.csv:
    get:
      tags: [HealthReports]
      summary: "CSV chỉ số theo ngày (EXPERT-FR-013) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        1 dòng mỗi nhà × ngày: tên nhà, ngày, trạng thái chấm của người gọi, giá trị và mức của 4 chỉ số,
        tỷ lệ chim về, trạng thái, lý do, điểm của từng người chấm (tên, vai trò), thời tiết. Không có id
        nội bộ. Dòng người gọi còn `PENDING` để trống các cột bị che (BR-31). UTF-8 có BOM để Excel đọc
        đúng tiếng Việt. Tiêu đề cột, trạng thái, mức và lý do (in từ `HealthReason`) theo `lang`. Cùng
        tham số và giới hạn với `GET /health-reports/days`.
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Một trong houseId, farmId là bắt buộc (400 nếu thiếu cả hai)" }
        - { name: farmId, in: query, schema: { type: string }, description: "Mọi nhà của farm" }
        - { name: from, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định to − 6 ngày" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định hôm nay" }
        - { name: lang, in: query, schema: { type: string, enum: [vi, en], default: vi }, description: "Ngôn ngữ của file" }
      responses:
        "200":
          description: OK
          content:
            text/csv:
              schema: { type: string }
        "400": { description: "Thiếu houseId và farmId / from sau to / quá 31 ngày", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /health-reports/days/{dayId}:
    get:
      tags: [HealthReports]
      summary: "Chi tiết 1 ngày (ANALYTICS-FR-012) — che theo BR-31 như danh sách"
      parameters: [{ name: dayId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthDay" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health-reports/days/{dayId}/rating:
    post:
      tags: [HealthReports]
      summary: "Chấm trạng thái ngày theo quan sát của mình (EXPERT-FR-012) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        Điểm và ảnh chụp đánh giá (`current_status`, `current_reasons` và mức từng nguồn lúc ghi) được lưu
        trong một lệnh ghi, rồi mới trả ngày đầy đủ. Ảnh chụp không bao giờ đổi; NFR-14 chỉ dùng ảnh chụp.
        Mỗi người chấm riêng; chấm được tới hết 7 ngày sau ngày đó (Report 3 §4.5). Ghi audit
        `HEALTH_DAY_RATED`.
      parameters: [{ name: dayId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: string, enum: [GOOD, WATCH, ACTION] }
                note: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Đã lưu; trả ngày đầy đủ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthDay" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "RATING_CLOSED — người gọi đã chấm, đã bỏ qua, hoặc ngày đã quá 7 ngày (SM-18)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /health-reports/days/{dayId}/skip:
    post:
      tags: [HealthReports]
      summary: "Bỏ qua chấm ngày này (EXPERT-FR-012, BR-31) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        Hiện trạng thái cho người gọi; lần bỏ qua không tính vào NFR-14 (SM-18 `PENDING → SKIPPED`).
        Ghi audit `HEALTH_DAY_SKIPPED`.
      parameters: [{ name: dayId, in: path, required: true, schema: { type: string } }]
      responses:
        "201":
          description: Đã bỏ qua; trả ngày đầy đủ
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthDay" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "RATING_CLOSED — người gọi đã chấm, đã bỏ qua, hoặc ngày đã quá 7 ngày (SM-18)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /health-reports/days/{dayId}/rating/note:
    patch:
      tags: [HealthReports]
      summary: "Thêm ghi chú vào điểm đã chấm (SM-18 RATED → RATED) — điểm không đổi"
      parameters: [{ name: dayId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 1000, description: "Thay ghi chú cũ" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthDay" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "RATING_CLOSED — người gọi chưa chấm ngày này (bỏ qua hoặc hết hạn thì không có điểm để ghi chú)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /health-reports/evaluation:
    get:
      tags: [HealthReports]
      summary: "Độ khớp giữa hệ thống và người chấm (ANALYTICS-FR-014, NFR-14) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        So ảnh chụp lúc chấm với điểm của người chấm trên 3 mức có thứ tự GOOD < WATCH < ACTION: tỷ lệ
        khớp kèm khoảng tin cậy Wilson 95 %, kappa Cohen trọng số tuyến tính, AC1 của Gwet, ma trận nhầm
        lẫn, tỷ lệ báo động giả của trạng thái gộp và của từng nguồn riêng (mức NORMAL/SLIGHT/CLEAR quy ra
        GOOD/WATCH/ACTION). Ảnh chụp `INSUFFICIENT_DATA` đếm riêng, không vào độ khớp. Ngày người gọi còn
        `PENDING` bị bỏ ra (BR-31). `ratings` liệt kê từng cặp để mọi con số tính lại được. Khoảng tối đa
        366 ngày.
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Một trong houseId, farmId là bắt buộc (400 nếu thiếu cả hai)" }
        - { name: farmId, in: query, schema: { type: string }, description: "Mọi nhà của farm" }
        - { name: from, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định to − 6 ngày" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định hôm nay" }
        - { name: role, in: query, schema: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT] }, description: "Chỉ điểm của vai trò này" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HealthEvaluation" }
        "400": { description: "Thiếu houseId và farmId / from sau to / quá 366 ngày", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /health-reports/{id}:
    get:
      tags: [HealthReports]
      summary: "Chi tiết 1 báo cáo kèm kết luận của chuyên gia"
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ZoneHealthReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health-reports/{id}/conclusion:
    put:
      tags: [HealthReports]
      summary: "Domain Expert viết/sửa kết luận và khuyến nghị (EXPERT-FR-006) — DOMAIN_EXPERT"
      description: |
        Người viết sửa được kết luận của mình (cập nhật `at`); chuyên gia khác không ghi đè
        (403). Farm Owner của farm nhận thông báo. Ghi audit `HEALTH_REPORT_CONCLUDED`.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: Đã lưu kết luận
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ZoneHealthReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── EXPERT ACTIVITY (EXPERT-FR-009) ───────────────────────────────────────
  /expert-activity:
    get:
      tags: [ExpertActivity]
      summary: "Lịch sử hoạt động của chuyên gia trên một farm (EXPERT-FR-009) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        Đọc từ audit log theo `farm_id` (Report 4 §6.1). Gồm các quyết định của Domain Expert: sửa và
        reset ngưỡng zone (`THRESHOLD_UPDATED`), hệ số mờ (`FUZZY_TUNING_UPDATED`), tham số phát hiện
        (`DETECTION_TUNING_UPDATED`), mức giảm tỷ lệ chim về (`BIRD_COUNT_TUNING_UPDATED`), vòng đếm
        (`COUNTING_RING_UPDATED`), kết luận cảnh báo (`ALERT_VERDICT_SET`), kết luận báo cáo
        (`HEALTH_REPORT_CONCLUDED`), chấp nhận / hoàn lại thay đổi của Farm Owner (`REVIEW_ACCEPTED`,
        `REVIEW_REVERTED`), duyệt / từ chối đề xuất hệ số (`PROPOSAL_APPROVED`, `PROPOSAL_REJECTED`),
        mức chỉ số sức khỏe của nhà (`HEALTH_LEVELS_UPDATED`).
        Mỗi quyết định một dòng: hoàn lại hoặc duyệt đề xuất chỉ hiện `REVIEW_REVERTED` / `PROPOSAL_APPROVED`,
        không thêm dòng đổi ngưỡng / hệ số của chính thao tác đó.
        Quyết định mà Farm Owner làm thay khi farm chưa có chuyên gia
        (BR-22: kết luận cảnh báo, tham số phát hiện, mức giảm tỷ lệ chim về, vòng đếm, mức chỉ số sức khỏe) cũng được liệt kê,
        với `actor_role = FARM_OWNER`. Mới nhất trước. Technician, Administrator → 403.
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - name: type
          in: query
          schema:
            type: string
            enum: [THRESHOLD_UPDATED, FUZZY_TUNING_UPDATED, DETECTION_TUNING_UPDATED, BIRD_COUNT_TUNING_UPDATED, COUNTING_RING_UPDATED, ALERT_VERDICT_SET, HEALTH_REPORT_CONCLUDED, REVIEW_ACCEPTED, REVIEW_REVERTED, PROPOSAL_APPROVED, PROPOSAL_REJECTED, HEALTH_LEVELS_UPDATED]
        - { name: zoneId, in: query, schema: { type: string } }
        - { name: houseId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ExpertActivityEntry" } }
                      meta:
                        type: object
                        properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /expert-activity/reviews:
    get:
      tags: [ExpertActivity]
      summary: "Mục duyệt thay đổi của Farm Owner (EXPERT-FR-010) — FARM_OWNER, DOMAIN_EXPERT"
      description: "Mới nhất trước. Technician, Administrator → 403."
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: status, in: query, schema: { type: string, enum: [PENDING_REVIEW, ACCEPTED, REVERTED, ADJUSTED] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ParameterReview" } }
                      meta: { type: object, properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /expert-activity/reviews/{id}/accept:
    put:
      tags: [ExpertActivity]
      summary: "Chuyên gia chấp nhận thay đổi của Farm Owner (EXPERT-FR-010, SM-10) — DOMAIN_EXPERT"
      description: "PENDING_REVIEW → ACCEPTED; báo Farm Owner (EXPERT-FR-009), audit REVIEW_ACCEPTED. Farm Owner, Technician, Administrator → 403."
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ParameterReview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Mục duyệt đã đóng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /expert-activity/reviews/{id}/revert:
    put:
      tags: [ExpertActivity]
      summary: "Chuyên gia hoàn lại thay đổi của Farm Owner (EXPERT-FR-010, SM-10) — DOMAIN_EXPERT"
      description: |
        Khôi phục giá trị gốc (trước lần sửa đầu của Farm Owner) của nhóm `thresholds` hoặc `fuzzy`, gửi
        xuống mọi thiết bị của Zone, lịch sử ghi `source=EXPERT_REVERT`; `PENDING_REVIEW` → `REVERTED`;
        báo Farm Owner, audit `REVIEW_REVERTED`. Farm Owner, Technician, Administrator → 403.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ParameterReview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Mục duyệt đã đóng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /expert-activity/proposals:
    get:
      tags: [ExpertActivity]
      summary: "Đề xuất hệ số (EXPERT-FR-011) — FARM_OWNER, DOMAIN_EXPERT"
      description: "Mới nhất trước. Technician, Administrator → 403."
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: status, in: query, schema: { type: string, enum: [PROPOSED, APPROVED, REJECTED, SUPERSEDED] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/CoefficientProposal" } }
                      meta: { type: object, properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [ExpertActivity]
      summary: "Farm Owner gửi gợi ý hệ số của hệ thống cho chuyên gia (EXPERT-FR-011, SM-11) — FARM_OWNER"
      description: |
        Server tính gợi ý hiện tại của Zone (ANALYTICS-FR-010) và lưu cùng hệ số đang dùng; đề xuất
        `PROPOSED` cũ của Zone chuyển `SUPERSEDED`; báo Domain Expert trong ứng dụng. Không có gợi ý → 409
        kèm lý do. Farm chưa có chuyên gia → 409 (Farm Owner áp trực tiếp, `POST /farms/zones/{zoneId}/fuzzy-tuning/apply-suggestion`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [zoneId], properties: { zoneId: { type: string } } }
      responses:
        "201":
          description: Đã gửi đề xuất
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/CoefficientProposal" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Không có gợi ý, hoặc farm chưa có chuyên gia", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /expert-activity/proposals/{id}/approve:
    put:
      tags: [ExpertActivity]
      summary: "Chuyên gia duyệt đề xuất hệ số (EXPERT-FR-011, SM-11) — DOMAIN_EXPERT"
      description: |
        Áp `suggested_values` như ENV-FR-021 (lịch sử `source=SUGGESTION_APPROVED`, gửi xuống thiết bị);
        `PROPOSED` → `APPROVED`; báo Farm Owner, audit `PROPOSAL_APPROVED`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/CoefficientProposal" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Đề xuất đã đóng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /expert-activity/proposals/{id}/reject:
    put:
      tags: [ExpertActivity]
      summary: "Chuyên gia từ chối đề xuất hệ số (EXPERT-FR-011, SM-11) — DOMAIN_EXPERT"
      description: "PROPOSED → REJECTED; bắt buộc ghi chú (422); báo Farm Owner, audit PROPOSAL_REJECTED."
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: string, maxLength: 1000 } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/CoefficientProposal" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Đề xuất đã đóng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── NOTIFICATIONS (EXPERT-FR-006/007) ─────────────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: "Hộp thông báo trong ứng dụng của người gọi — mọi role đã đăng nhập"
      description: |
        Mới nhất trước, giữ 90 ngày. Nguồn: mọi thông báo nghiệp vụ (`notifyUser` — báo cáo sức
        khỏe mới, kết luận của chuyên gia, thiết bị bị gỡ…) và, cho Domain Expert, cảnh báo suy luận mới
        chờ kiểm chứng (`NOISE_ANOMALY`, `SENSOR_ANOMALY`, `FORECAST_BREACH`, `LOW_RETURN_RATE` —
        chỉ trong ứng dụng, không Telegram/push; ALERT-FR-005). Bản realtime: sự kiện Socket.io
        `NOTIFICATION_NEW` (payload là một `Notification`) tới room của chính người nhận.
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ["true", "false"] }, description: "`true` = chỉ thông báo chưa đọc" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                      meta:
                        type: object
                        properties:
                          page: { type: integer }
                          limit: { type: integer }
                          total: { type: integer }
                          unreadCount: { type: integer, description: "Số chưa đọc của người gọi (không phụ thuộc bộ lọc `unread`)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: "Đánh dấu mọi thông báo của người gọi là đã đọc"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: object, properties: { modified: { type: integer } } }

  /notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: "Đánh dấu 1 thông báo đã đọc (gọi lại giữ nguyên thời điểm đọc đầu tiên)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Notification" }
        "404": { description: "Không có, hoặc là thông báo của người khác" }
        "422": { $ref: "#/components/responses/ValidationError" }   # id không phải ObjectId

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Header: `Authorization: Bearer <accessToken>` — accessToken lấy từ /auth/login hoặc /auth/refresh"

  parameters:
    FarmId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string },
        description: Farm ObjectId,
      }
    HouseId:
      {
        name: houseId,
        in: path,
        required: true,
        schema: { type: string },
        description: House ObjectId,
      }
    ZoneId:
      {
        name: zoneId,
        in: path,
        required: true,
        schema: { type: string },
        description: Zone ObjectId,
      }
    ZoneIdPath:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string },
        description: Zone ObjectId,
      }
    NodeId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string },
        description: SensorNode ObjectId,
      }
    TrackId:
      { name: trackId, in: path, required: true, schema: { type: string }, description: AudioTrack ObjectId }
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    Page: { name: page, in: query, schema: { type: integer, default: 1 } }
    Limit:
      {
        name: limit,
        in: query,
        description: "Số bản ghi mỗi trang — mặc định 20, tối đa 100 (giá trị lớn hơn được kẹp về 100). Giá trị không phải số nguyên ≥ 1: các endpoint /admin/* trả 422, các danh sách khác dùng mặc định",
        schema: { type: integer, minimum: 1, default: 20, maximum: 100 },
      }
    TelemetryLimit:
      {
        name: limit,
        in: query,
        description: "Riêng lịch sử telemetry — mặc định 100, tối đa 1000",
        schema: { type: integer, minimum: 1, default: 100, maximum: 1000 },
      }

  responses:
    NotFound:
      description: Không tìm thấy
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    Forbidden:
      description: Không có quyền
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    Unauthorized:
      description: Chưa xác thực / token không hợp lệ
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    Conflict:
      description: Trùng lặp dữ liệu
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    RateLimited:
      description: "RATE_LIMITED — vượt giới hạn request (SEC-NFR-004); `error.details.retryAfterSec` = số giây phải chờ"
      headers:
        Retry-After: { schema: { type: integer }, description: "Số giây phải chờ" }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    PasswordChangeRequired:
      description: "PASSWORD_CHANGE_REQUIRED — tài khoản đang giữ mật khẩu tạm Admin cấp, phải gọi PUT /auth/password trước"
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }

  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
        meta:
          type: object
          properties:
            {
              page: { type: integer },
              limit: { type: integer },
              total: { type: integer },
            }

    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string, example: "Không tìm thấy farm" }
            details: { description: "Tuỳ mã lỗi, VD `{ retryAfterSec }` của RATE_LIMITED" }

    Role:
      type: string
      enum: [ADMIN, FARM_OWNER, DOMAIN_EXPERT, TECHNICIAN]
      description: "AUTH-FR-004 (v2.0.0). DOMAIN_EXPERT = chuyên gia nuôi yến do Primary Owner mời, phạm vi cả farm: chỉ đọc dữ liệu vận hành, kiểm chứng cảnh báo suy luận, chỉnh ngưỡng/hệ số/tham số phát hiện; không relay hay ghi thu hoạch (SRS mục 4.4)"

    DeviceStatusSummary:
      type: object
      description: "Đếm SensorNode + CameraNode theo trạng thái (OPS-NFR-004, SYSTEM-FR-003)"
      properties:
        total: { type: integer }
        online: { type: integer }
        offline: { type: integer }
        pending: { type: integer }
        error: { type: integer }
        degraded: { type: integer }

    AuditLog:
      type: object
      description: "AUTH-FR-007 — collection audit_logs (SRS §8.2)"
      properties:
        _id: { type: string }
        actor_id:
          nullable: true
          description: "Populate { _id, full_name, email, role }; null nếu hệ thống tự thực hiện hoặc đăng nhập bằng email không tồn tại"
          type: object
          properties:
            _id: { type: string }
            full_name: { type: string }
            email: { type: string }
            role: { $ref: "#/components/schemas/Role" }
        action: { type: string, example: ACCOUNT_LOCKED }
        target_type: { type: string, example: user }
        target_id: { type: string, nullable: true }
        target_name: { type: string, nullable: true, description: "Chỉ GET /system/audit-logs — tên tài khoản khi target_type=user (để UI không hiện ObjectId); null với loại khác hoặc tài khoản không còn" }
        metadata: { type: object, description: "Chi tiết thay đổi, thường có before/after" }
        ip_address: { type: string, nullable: true, description: "IP client của request; null khi hệ thống tự thực hiện ngoài request (job nền, MQTT). Đặt TRUST_PROXY khi chạy sau proxy để có IP thật" }
        created_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        _id: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        avatar_url: { type: string }
        is_active: { type: boolean }
        must_change_password:
          {
            type: boolean,
            description: "AUTH-FR-005c — đang giữ mật khẩu tạm do Admin cấp; mọi API trả 403 PASSWORD_CHANGE_REQUIRED trừ PUT /auth/password và đăng xuất",
          }
        deactivated_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: "AUTH-FR-011 — thời điểm Admin khoá tài khoản",
          }
        deactivated_reason:
          {
            type: string,
            nullable: true,
            description: "AUTH-FR-011 — lý do bắt buộc khi khoá tài khoản, ghi cùng audit_logs",
          }
        telegram_linked: { type: boolean, description: "ALERT-FR-013 — tài khoản đã liên kết bot Telegram (chat id không trả ra API)" }
        notification_preferences:
          type: object
          properties:
            push: { type: boolean }
            telegram: { type: boolean }
            quiet_hours:
              {
                type: object,
                properties: { start: { type: string }, end: { type: string } },
              }
        deletion_requested_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: "AUTH-FR-012 — đã yêu cầu xoá tài khoản, chờ Administrator xử lý",
          }
        deletion_reminder_sent_at:
          { type: string, format: date-time, nullable: true, description: "Đã nhắc Admin yêu cầu xoá sắp quá hạn 30 ngày (nhắc 1 lần)" }
        deleted_at:
          { type: string, format: date-time, nullable: true, description: "Đã xoá/ẩn danh hoá theo yêu cầu — không khoá/mở khoá lại được" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Coordinates:
      type: object
      description: "Tọa độ GPS của farm (FARM-FR-001, A-5) — một farm là một địa điểm"
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, example: 10.7769 }
        lng: { type: number, minimum: -180, maximum: 180, example: 106.7009 }

    Farm:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        address: { type: string }
        coordinates:
          allOf: [{ $ref: "#/components/schemas/Coordinates" }]
          description: "Bắt buộc khi tạo từ nay (A-5); farm tạo trước đó có thể chưa có — khi đó không có thời tiết"
        owner_id: { type: string, description: Primary Owner }
        owner:
          type: object
          description: "Chỉ có ở GET /farms/:id — tên/email Primary Owner (tra thêm từ users, không đổi owner_id)"
          properties: { full_name: { type: string }, email: { type: string, format: email } }
        members:
          type: array
          description: "GET /farms/:id với DOMAIN_EXPERT chỉ trả bản ghi của chính người đó (không lộ email thành viên khác)"
          items:
            type: object
            properties:
              user_id: { type: string }
              is_primary: { type: boolean }
              role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT], description: "FARM_OWNER = đồng sở hữu; DOMAIN_EXPERT = chuyên gia nuôi yến, cả farm (v2.0.0)" }
              joined_at: { type: string, format: date-time }
              full_name: { type: string, description: "Chỉ có ở GET /farms/:id" }
              email: { type: string, format: email, description: "Chỉ có ở GET /farms/:id" }
        is_deleted: { type: boolean }
        created_at: { type: string, format: date-time }

    Invitation:
      type: object
      description: AUTH-FR-010, Flow 12 — lời mời thành viên farm, hết hạn sau 7 ngày nếu không phản hồi
      properties:
        _id: { type: string }
        farm_id: { type: string }
        invited_email: { type: string, format: email }
        invited_role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT] }
        invited_by: { type: string }
        token: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED] }
        expires_at: { type: string, format: date-time }
        responded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    House:
      type: object
      properties:
        _id: { type: string }
        farm_id: { type: string }
        name: { type: string }
        floors: { type: integer }
        description: { type: string }
        bird_count_tuning: { $ref: "#/components/schemas/BirdCountTuning" }
        health_levels: { $ref: "#/components/schemas/HealthLevels" }
        created_at: { type: string, format: date-time }

    Thresholds:
      type: object
      properties:
        temp_min: { type: number, example: 26 }
        temp_max: { type: number, example: 31 }
        humidity_min: { type: number, example: 75 }
        humidity_max: { type: number, example: 95 }
        light_max: { type: number, example: 0.2 }
        nh3_max: { type: number, example: 25 }
        co2_max: { type: number, example: 1500 }

    FuzzyTuning:
      type: object
      description: "ENV-FR-021 — hệ số bộ điều khiển mờ trên ESP32; tên field = key MQTT config/update"
      properties:
        fuzzy_humidity_band: { type: number, minimum: 2, maximum: 20, example: 8, description: "%RH — độ rộng vùng chuyển tiếp độ ẩm" }
        fuzzy_temp_band: { type: number, minimum: 1, maximum: 10, example: 4, description: "°C — độ rộng vùng nóng" }
        fuzzy_fan_dry_level: { type: number, minimum: 0, maximum: 100, example: 40, description: "% — mức quạt khi nóng mà khô" }
        fuzzy_window_sec: { type: integer, minimum: 60, maximum: 600, example: 120, description: "giây — cửa sổ time-proportioning" }
        fuzzy_input_filter: { type: boolean, example: true, description: "ENV-FR-022 — lọc median+Kalman đầu vào bộ mờ (tắt để so sánh A/B)" }

    DetectionTuning:
      type: object
      description: "EXPERT-FR-008 — tham số phát hiện theo Zone, gửi xuống ESP32. Khoảng hợp lệ là giới hạn kỹ thuật, không phải khuyến nghị nuôi yến. Tên field = key MQTT config/update"
      properties:
        noise_margin_db: { type: number, minimum: 5, maximum: 30, example: 15, description: "dB — ồn cao hơn mức nền của giờ đó bao nhiêu thì tính (NOISE_ANOMALY)" }
        noise_min_sec: { type: integer, minimum: 5, maximum: 15, example: 10, description: "giây ồn trong cửa sổ 15 giây (NOISE_ANOMALY)" }
        pump_dry_on_sec: { type: integer, minimum: 120, maximum: 900, example: 300, description: "giây bơm BẬT cộng dồn trước khi xét (MISTING_INEFFECTIVE)" }
        pump_dry_min_rise_pct: { type: number, minimum: 0.5, maximum: 10, example: 2, description: "%RH — độ ẩm phải tăng tối thiểu (MISTING_INEFFECTIVE)" }
        speaker_drop_pct: { type: integer, minimum: 30, maximum: 90, example: 70, description: "% — mức âm giảm so với nền (SPEAKER_FAILURE)" }

    BirdCountTuning:
      type: object
      description: "EXPERT-FR-008 (SRS v2.1.8) — tham số đếm chim theo nhà yến (camera ở cửa ra vào của cả nhà); backend dùng, không gửi thiết bị"
      properties:
        return_rate_drop_pct: { type: number, minimum: 5, maximum: 50, example: 20, description: "% — tỷ lệ chim về giảm so với trung bình kỳ trước thì sinh LOW_RETURN_RATE" }

    MetricForecast:
      type: object
      nullable: true
      properties:
        history: { type: array, items: { type: object, properties: { timestamp: { type: string, format: date-time }, value: { type: number } } } }
        forecast: { type: array, items: { type: object, properties: { timestamp: { type: string, format: date-time }, value: { type: number } } } }
        alpha: { type: number }
        beta: { type: number }
        mae30: { type: number, nullable: true }
        mae60: { type: number, nullable: true }

    Zone:
      type: object
      properties:
        _id: { type: string }
        house_id: { type: string }
        farm_id: { type: string, readOnly: true, description: "Farm của House chứa Zone — server tự điền, không đổi được (SRS v1.23.0)" }
        name: { type: string }
        floor: { type: integer }
        thresholds: { $ref: "#/components/schemas/Thresholds" }
        threshold_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_at: { type: string, format: date-time }
              old_values: { type: object }
              new_values: { type: object }
        fuzzy_tuning: { $ref: "#/components/schemas/FuzzyTuning" }
        fuzzy_tuning_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_by_role: { $ref: "#/components/schemas/Role" }
              changed_at: { type: string, format: date-time }
              old_values: { type: object }
              new_values: { type: object }
        detection_tuning: { $ref: "#/components/schemas/DetectionTuning" }
        detection_tuning_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_by_role: { $ref: "#/components/schemas/Role" }
              changed_at: { type: string, format: date-time }
              old_values: { type: object }
              new_values: { type: object }
        created_at: { type: string, format: date-time }

    RelayUsage:
      type: object
      properties:
        on_hours: { type: number }
        switches: { type: integer }
        since_service_hours: { type: number }
        since_service_switches: { type: integer }

    BirdCountBucket:
      type: object
      description: "VISION-FR-017 — số chim qua vạch đếm trong 1 khoảng 5 phút, cộng các camera của Zone"
      properties:
        bucket_start: { type: string, format: date-time }
        entry_count: { type: integer }
        exit_count: { type: integer }

    BirdCountDay:
      type: object
      description: |
        VISION-FR-008/009 — số đếm 1 ngày (giờ Việt Nam) của **cả nhà yến** (SRS v2.1.8: chim ra vào ở cửa của
        nhà, không chia theo Zone). Nhà có 2 cửa thì cộng số thô mọi camera rồi mới lấy số ròng (chim có thể ra cửa
        này về cửa kia). Cùng nguồn cho /current, /daily, /trends, /correlation, socket BIRD_COUNT_UPDATE, cảnh báo
        LOW_RETURN_RATE, báo cáo sức khỏe Zone và ảnh chụp đàn khi thu hoạch (Zone lấy số của nhà chứa nó).
      properties:
        date: { type: string, example: "2026-10-20", description: "YYYY-MM-DD giờ Việt Nam" }
        morning_entry: { type: integer, description: Số thô phiên sáng }
        morning_exit: { type: integer, description: Số thô phiên sáng }
        evening_entry: { type: integer, description: Số thô phiên chiều }
        evening_exit: { type: integer, description: Số thô phiên chiều }
        net_exit: { type: integer, description: "Ra − vào của phiên sáng, không âm" }
        net_entry: { type: integer, description: "Vào − ra của phiên chiều, không âm" }
        return_rate:
          type: number
          nullable: true
          description: "net_entry / net_exit × 100, có thể > 100; null khi thiếu phiên sáng hoặc chiều, hoặc sáng không có chim ra"
        has_morning: { type: boolean }
        has_evening: { type: boolean }

    Notification:
      type: object
      description: "EXPERT-FR-006/007 — 1 thông báo trong ứng dụng"
      properties:
        _id: { type: string }
        title: { type: string }
        body: { type: string }
        ref:
          type: object
          nullable: true
          description: "Đối tượng để client mở tới"
          properties:
            kind: { type: string, enum: [alert, health_report, health_day, expert_decision, parameter_review, coefficient_proposal], description: "`health_day`: ngày đánh giá mới của nhà yến, mở `GET /health-reports/days/{dayId}` (thông báo không kèm trạng thái, BR-31); `expert_decision`: `id` là mục trong lịch sử hoạt động (EXPERT-FR-009); `parameter_review`, `coefficient_proposal`: mục duyệt / đề xuất mới cho chuyên gia (EXPERT-FR-007)" }
            id: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    HealthLevels:
      type: object
      description: "ANALYTICS-FR-012, BR-28 — mức chỉ số sức khỏe của nhà yến; mặc định là hằng số kỹ thuật (Report 3 §4.5) cho Domain Expert đặt lại sau khi người nuôi xác nhận"
      properties:
        in_range_slight_pct: { type: number, minimum: 50, maximum: 100, example: 90, description: "% thời gian nhiệt độ, độ ẩm trong ngưỡng — dưới mức này là SLIGHT" }
        in_range_clear_pct: { type: number, minimum: 50, maximum: 100, example: 75, description: "dưới mức này là CLEAR; không lớn hơn in_range_slight_pct" }
        air_slight_h: { type: number, minimum: 0.5, maximum: 12, example: 1, description: "giờ NH3 hoặc CO2 vượt ngưỡng của Zone — từ mức này là SLIGHT" }
        air_clear_h: { type: number, minimum: 0.5, maximum: 12, example: 4, description: "từ mức này là CLEAR; không nhỏ hơn air_slight_h" }
        noise_slight: { type: integer, minimum: 1, maximum: 10, example: 1, description: "số đợt NOISE_ANOMALY (không tính đợt bị bác bỏ) — từ mức này là SLIGHT" }
        noise_clear: { type: integer, minimum: 1, maximum: 10, example: 3, description: "từ mức này là CLEAR; không nhỏ hơn noise_slight" }

    HouseHealthLevels:
      type: object
      properties:
        house_id: { type: string }
        health_levels: { $ref: "#/components/schemas/HealthLevels" }
        defaults: { $ref: "#/components/schemas/HealthLevels" }

    HealthReason:
      type: object
      description: |
        ANALYTICS-FR-012 — 1 lý do của trạng thái ngày, dạng mã + số liệu để web, mobile tự dịch (VI/EN).
        Ảnh chụp lúc chấm lưu cùng dạng. `values` theo mã:
        - `ALL_NORMAL`: {} — mọi chỉ số đã đánh giá đều bình thường (ngày GOOD)
        - `MISSING_DATA` (environment): `{ no_zones: true }` hoặc `{ min_pct, zones: [{ zone_name, valid_pct }] }`
        - `MISSING_DATA` (flock): `{ missing: MORNING | EVENING | NO_DEPARTURES }`
        - `NOT_ASSESSED` (air, noise): {} — thiếu mẫu, nguồn không đánh giá
        - `ENV_IN_RANGE`: `{ zone_name, in_range_pct }`
        - `AIR_OVER_LIMIT`: `{ zone_name, hours }`
        - `FLOCK_DROP`: `{ return_rate, drop_pct, baseline_avg, baseline_days }`
        - `FLOCK_NO_BASELINE`: `{ min_days, baseline_days }`
        - `NOISE_EPISODES`: `{ episodes }`
        - `WEATHER_UNAVAILABLE`: {}
        - `RAIN_DOWNGRADE`: `{ mm_per_hour }` — ACTION hạ xuống WATCH (BR-30)
      required: [code, source, level, values]
      properties:
        code:
          type: string
          enum: [ALL_NORMAL, MISSING_DATA, NOT_ASSESSED, ENV_IN_RANGE, AIR_OVER_LIMIT, FLOCK_DROP, FLOCK_NO_BASELINE, NOISE_EPISODES, WEATHER_UNAVAILABLE, RAIN_DOWNGRADE]
        source: { type: string, enum: [environment, air, flock, noise], nullable: true }
        level: { type: string, enum: [SLIGHT, CLEAR], nullable: true, description: "Mức của nguồn khi lý do là một chỉ số lệch" }
        values: { type: object, additionalProperties: true }

    HealthIndicator:
      type: object
      properties:
        value: { type: number, nullable: true, description: "environment: % thời gian trong ngưỡng của Zone thấp nhất; air: giờ vượt ngưỡng của Zone cao nhất; flock: % tỷ lệ chim về giảm so với trung bình ≥ 3 ngày đủ phiên trước đó (null khi chưa đủ ngày nền); noise: số đợt" }
        level: { type: string, enum: [NORMAL, SLIGHT, CLEAR], nullable: true, description: "null khi nguồn không đủ dữ liệu (không đánh giá)" }
        details: { type: object, additionalProperties: true, description: "environment: từng Zone (in_range_pct, valid_pct); flock: return_rate, baseline_days" }

    HouseHealthDay:
      type: object
      description: |
        ANALYTICS-FR-012, SM-17 — trạng thái sức khỏe 1 ngày (giờ VN) của 1 nhà yến. Thứ tự BR-29:
        INSUFFICIENT_DATA khi môi trường hoặc đàn chim không đủ dữ liệu; ACTION khi đàn chim CLEAR và
        có nguồn khác SLIGHT/CLEAR; WATCH khi có chỉ số CLEAR hoặc ≥ 2 chỉ số SLIGHT; còn lại GOOD. BR-30:
        ACTION do đúng đàn chim + tiếng ồn hạ xuống WATCH khi mưa ≥ 1 mm/giờ trùng phiên đếm và trùng
        đợt ồn. Khi `my_rating_state = PENDING` chỉ có các trường không đánh dấu "(ẩn khi PENDING)" (BR-31).
      properties:
        _id: { type: string }
        house_id: { type: string }
        house_name: { type: string }
        farm_id: { type: string }
        date: { type: string, format: date, description: "'YYYY-MM-DD' giờ VN" }
        weather:
          type: object
          nullable: true
          description: "ANALYTICS-FR-013 — chỉ hiển thị; null khi không có dữ liệu thời tiết (farm không có toạ độ hoặc lấy lỗi)"
          properties:
            temperature_min: { type: number, nullable: true }
            temperature_max: { type: number, nullable: true }
            humidity_avg: { type: number, nullable: true }
            precipitation_mm: { type: number, nullable: true, description: "Tổng lượng mưa của ngày" }
            hours: { type: integer, description: "Số giờ có dữ liệu" }
        computed_at: { type: string, format: date-time, description: "Lần tính gần nhất của trạng thái hiện tại" }
        my_rating_state: { type: string, enum: [PENDING, RATED, SKIPPED, EXPIRED], description: "SM-18 của người gọi — suy ra từ ratings và ngày" }
        rating_deadline: { type: string, format: date-time, description: "Hết hạn chấm: đầu ngày thứ 8 sau ngày đó (giờ VN)" }
        indicators:
          type: object
          description: "(ẩn khi PENDING)"
          properties:
            environment: { $ref: "#/components/schemas/HealthIndicator" }
            air: { $ref: "#/components/schemas/HealthIndicator" }
            flock: { $ref: "#/components/schemas/HealthIndicator" }
            noise: { $ref: "#/components/schemas/HealthIndicator" }
        completeness:
          type: object
          description: "(ẩn khi PENDING) BR-28 — mỗi nguồn đủ khi ≥ 80 % số mẫu hợp lệ kỳ vọng (1 mẫu / 10 giây mỗi Zone); đàn chim đủ khi có cả 2 phiên"
          properties:
            environment: { type: boolean }
            air: { type: boolean }
            flock: { type: boolean }
            noise: { type: boolean }
        current_status: { type: string, enum: [GOOD, WATCH, ACTION, INSUFFICIENT_DATA], description: "(ẩn khi PENDING)" }
        current_reasons: { type: array, items: { $ref: "#/components/schemas/HealthReason" }, description: "(ẩn khi PENDING) Chỉ số quyết định kèm số liệu; nguồn tuỳ chọn không đánh giá; mưa; thiếu thời tiết" }
        evidence:
          type: object
          description: "(ẩn khi PENDING) ALERT-FR-014"
          properties:
            noise_alert_ids: { type: array, items: { type: string } }
        ratings:
          type: array
          description: "(ẩn khi PENDING) Điểm của mọi người chấm"
          items:
            type: object
            properties:
              _id: { type: string }
              by: { type: object, properties: { _id: { type: string }, full_name: { type: string, nullable: true } } }
              role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT] }
              outcome: { type: string, enum: [RATED, SKIPPED] }
              rating: { type: string, enum: [GOOD, WATCH, ACTION], nullable: true }
              note: { type: string, nullable: true }
              at: { type: string, format: date-time }
              snapshot:
                type: object
                description: "Ảnh chụp lúc chấm — không bao giờ đổi (BR-31, D16)"
                properties:
                  status: { type: string, enum: [GOOD, WATCH, ACTION, INSUFFICIENT_DATA] }
                  reasons: { type: array, items: { $ref: "#/components/schemas/HealthReason" } }

    HealthEvaluation:
      type: object
      description: "ANALYTICS-FR-014 — mọi tỷ lệ là số 0–1; null khi chưa đủ dữ liệu để tính"
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        role: { type: string, nullable: true }
        rated_count: { type: integer, description: "Số cặp (ngày × người chấm) đưa vào độ khớp" }
        insufficient_data_count: { type: integer, description: "Số cặp có ảnh chụp INSUFFICIENT_DATA — báo riêng" }
        agreement:
          type: object
          nullable: true
          properties:
            value: { type: number }
            ci_low: { type: number }
            ci_high: { type: number }
        weighted_kappa: { type: number, nullable: true, description: "null khi kỳ vọng ngẫu nhiên = 1 (mọi cặp cùng 1 mức)" }
        gwet_ac1: { type: number, nullable: true }
        confusion_matrix:
          type: object
          properties:
            labels: { type: array, items: { type: string }, example: [GOOD, WATCH, ACTION] }
            rows: { type: string, example: system }
            columns: { type: string, example: rater }
            counts: { type: array, items: { type: array, items: { type: integer } } }
        false_alarm_rate:
          type: object
          description: "Trong các lần người chấm cho GOOD, phần trạng thái gộp (combined) hoặc từng nguồn riêng báo khác GOOD"
          properties:
            combined: { type: number, nullable: true }
            environment: { type: number, nullable: true }
            air: { type: number, nullable: true }
            flock: { type: number, nullable: true }
            noise: { type: number, nullable: true }
        ratings:
          type: array
          items:
            type: object
            properties:
              house_name: { type: string }
              date: { type: string, format: date }
              assessor: { type: object, properties: { full_name: { type: string, nullable: true }, role: { type: string } } }
              snapshot_status: { type: string, enum: [GOOD, WATCH, ACTION, INSUFFICIENT_DATA] }
              rating: { type: string, enum: [GOOD, WATCH, ACTION] }
              counted: { type: boolean, description: "false khi ảnh chụp là INSUFFICIENT_DATA" }

    ZoneHealthReport:
      type: object
      description: "EXPERT-FR-005/006 — số liệu sức khỏe của 1 Zone trong 1 kỳ + kết luận của Domain Expert"
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        generated_at: { type: string, format: date-time }
        metrics:
          type: object
          properties:
            sample_count: { type: integer }
            temp_in_range_pct: { type: number, nullable: true }
            humidity_in_range_pct: { type: number, nullable: true }
            auto_mode_pct: { type: number, nullable: true, description: "ANALYTICS-FR-011" }
            misting_switches: { type: integer }
            ventilation_switches: { type: integer }
            alerts_by_type: { type: object, additionalProperties: { type: integer }, description: "{ <AlertType>: số cảnh báo phát sinh trong kỳ }" }
            avg_return_rate: { type: number, nullable: true, description: "Trung bình theo ngày của tỷ lệ chim về cả Zone (BirdCountDay.return_rate) trong kỳ; null khi chưa có dữ liệu đếm chim" }
            nh3_avg: { type: number, nullable: true }
            nh3_max: { type: number, nullable: true }
            co2_avg: { type: number, nullable: true }
            co2_max: { type: number, nullable: true }
        expert_conclusion:
          type: object
          nullable: true
          properties:
            text: { type: string }
            by: { type: object, properties: { _id: { type: string }, full_name: { type: string } } }
            at: { type: string, format: date-time, description: "Lúc viết kết luận lần đầu" }
            edited_at: { type: string, format: date-time, nullable: true, description: "Lần sửa gần nhất của tác giả (EXPERT-FR-006)" }

    RelayOverrideLog:
      type: object
      description: "ENV-FR-019 — một lần can thiệp tay 1 relay"
      properties:
        _id: { type: string }
        node_id: { type: string }
        zone_id: { type: string }
        farm_id: { type: string }
        relay: { type: string, enum: [misting, ventilation, speaker] }
        state: { type: boolean, description: "Trạng thái được ép" }
        started_by:
          type: object
          description: "Chỉ tên — không trả email (Domain Expert đọc được route này)"
          properties: { _id: { type: string }, full_name: { type: string } }
        started_by_role: { $ref: "#/components/schemas/Role" }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        end_reason: { type: string, enum: [EXPIRED, CLEARED_EARLY, REPLACED], nullable: true }
        alert_confirmed: { type: boolean, description: "ENV-FR-019 — bật bơm lúc Zone có cảnh báo cảm biến/phun sương và Farm Owner đã xác nhận" }

    RelayStates:
      type: object
      description: "Guide v3.3 §8-9: IN1=misting, IN2=speaker (loa ru), IN3=ventilation. IN4 để dự phòng (SRS v2.0.0 bỏ sưởi)"
      properties:
        misting: { type: boolean }
        speaker: { type: boolean }
        ventilation: { type: boolean }

    AudioTrack:
      type: object
      description: "ENV-FR-013c — bài trong danh mục web của 1 thiết bị (SRS §8.2 audio_tracks)"
      properties:
        _id: { type: string }
        node_id: { type: string }
        track_number: { type: integer, description: "Khớp file trên thẻ SD: 2 = 0002.mp3" }
        display_name: { type: string }
        file_url: { type: string, description: "URL MinIO ký tạm 1 giờ, chỉ để nghe trên web" }
        file_size_bytes: { type: integer }
        synced_to_sd: { type: boolean, description: "Technician tự đánh dấu sau khi chép tay vào thẻ SD" }
        uploaded_by: { type: string }
        uploaded_at: { type: string, format: date-time }

    SensorNode:
      type: object
      properties:
        relay_usage:
          type: object
          description: "ALERT-FR-016 — giờ chạy + số lần đóng cắt thật của bơm/quạt; `since_service_*` về 0 khi Farm Owner xác nhận MAINTENANCE_DUE"
          properties:
            misting: { $ref: "#/components/schemas/RelayUsage" }
            ventilation: { $ref: "#/components/schemas/RelayUsage" }
            counted_until: { type: string, format: date-time }
        _id: { type: string }
        device_id: { type: string, example: node_001 }
        zone_id: { type: string }
        firmware_version: { type: string }
        last_heartbeat: { type: string, format: date-time }
        status:
          {
            type: string,
            enum: [PENDING, ONLINE, OFFLINE],
            description: "PENDING = Technician đã khai báo qua Web Console nhưng thiết bị chưa gửi heartbeat đầu tiên (Flow 1)",
          }
        rssi: { type: number }
        booted_at: { type: string, format: date-time, description: "FARM-FR-006 — thời điểm khởi động, tính từ `uptime` của heartbeat" }
        free_heap: { type: number, description: "FARM-FR-006 — byte RAM còn trống lúc heartbeat gần nhất" }
        reset_reason: { type: string, example: BROWNOUT, description: "FARM-FR-006 — lý do lần khởi động gần nhất (esp_reset_reason: POWERON, SW, PANIC, INT_WDT, TASK_WDT, WDT, BROWNOUT…), firmware ≥ 1.4.0" }
        ip: { type: string, description: "FARM-FR-006 — IP trong LAN nhà yến (ElegantOTA tại http://<ip>/update), firmware ≥ 1.4.0" }
        relay_states: { $ref: "#/components/schemas/RelayStates" }
        control_mode: { type: string, enum: [AUTO, MANUAL] }
        override_expiry: { type: string, format: date-time }
        speaker_schedule:
          type: object
          properties:
            enabled: { type: boolean }
            windows:
              {
                type: array,
                items:
                  {
                    type: object,
                    properties:
                      { start: { type: string }, end: { type: string } },
                  },
              }
        audio:
          type: object
          properties:
            current_track: { type: integer }
            volume: { type: integer, minimum: 0, maximum: 30 }
            playing: { type: boolean }
            loop: { type: boolean }
        registered_at: { type: string, format: date-time }
        ota_pending:
          type: object
          nullable: true
          description: "FARM-FR-013 — OTA đã gửi, chờ heartbeat báo đúng version"
          properties:
            version: { type: string }
            url: { type: string }
            requested_at: { type: string, format: date-time }
            requested_by: { type: string }
        ota_failed:
          type: object
          nullable: true
          description: "OTA quá 30 phút chưa xác nhận — thiết bị vẫn chạy running_version (đã rollback)"
          properties:
            version: { type: string }
            failed_at: { type: string, format: date-time }
            running_version: { type: string }
        registered_by: { type: string, nullable: true }
        activation_overdue_at: { type: string, format: date-time, nullable: true, description: "Flow 1 case 8a — PENDING quá 15 phút chưa có heartbeat" }
        decommissioned_at: { type: string, format: date-time, nullable: true, description: "FARM-FR-008 — đã gỡ khỏi hệ thống; cảnh báo còn mở của nó được đóng theo" }
        decommission_reason: { type: string, nullable: true }
        replaced_by: { type: string, nullable: true, description: "Node mới lắp thay" }

    CameraNode:
      type: object
      properties:
        _id: { type: string }
        device_id: { type: string }
        house_id: { type: string, description: "SRS v2.1.8 — camera ở cửa ra vào của cả nhà yến, không gắn Zone" }
        rtsp_url: { type: string, description: "Chỉ có trong response đăng ký; `GET /devices/camera-nodes` không trả trường này" }
        status:
          {
            type: string,
            enum: [PENDING, ONLINE, OFFLINE],
            description: "PENDING = Technician đã khai báo qua Web Console nhưng thiết bị chưa gửi heartbeat đầu tiên (Flow 1)",
          }
        last_heartbeat: { type: string, format: date-time }
        model_version: { type: string }
        registered_at: { type: string, format: date-time }
        registered_by: { type: string, nullable: true }
        activation_overdue_at: { type: string, format: date-time, nullable: true, description: "Flow 1 case 8a — PENDING quá 15 phút chưa có heartbeat" }
        decommissioned_at: { type: string, format: date-time, nullable: true, description: "FARM-FR-008 — đã gỡ khỏi hệ thống" }
        decommission_reason: { type: string, nullable: true }
        replaced_by: { type: string, nullable: true, description: "Node mới lắp thay" }
        counting_ring:
          nullable: true
          description: "VISION-FR-018 — vòng đếm Domain Expert đã vẽ; không có thì nút AI dùng vòng trong config.yaml"
          allOf:
            - $ref: "#/components/schemas/CountingRing"
            - properties:
                updated_at: { type: string, format: date-time }
                updated_by: { type: string }
        counting_ring_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_by_role: { type: string }
              changed_at: { type: string, format: date-time }
              old_value: { $ref: "#/components/schemas/CountingRing" }
              new_value: { $ref: "#/components/schemas/CountingRing" }

    CountingRing:
      type: object
      required: [points, into_ring_is_exit]
      properties:
        points:
          type: array
          minItems: 3
          maxItems: 12
          items: { type: array, minItems: 2, maxItems: 2, items: { type: number, minimum: 0, maximum: 1 } }
          example: [[0.379, 0.228], [0.527, 0.136], [0.575, 0.277], [0.569, 0.374], [0.427, 0.477], [0.386, 0.334]]
        into_ring_is_exit: { type: boolean, description: "true = chim đi vào vòng là RA (camera trong nhà nhìn vào lỗ)" }

    Telemetry:
      type: object
      properties:
        _id: { type: string }
        node_id: { type: string }
        zone_id: { type: string }
        timestamp: { type: string, format: date-time }
        temperature:
          { type: number, nullable: true, description: "°C, từ ES35-SW" }
        humidity:
          { type: number, nullable: true, description: "%RH, từ ES35-SW" }
        light_lux:
          { type: number, nullable: true, description: "lux, từ ES-ALS-02" }
        nh3_ppm:
          { type: number, nullable: true, description: "ppm, từ ES-NH3-01" }
        co2_ppm:
          { type: number, nullable: true, description: "ppm, từ ES-CO2-01" }
        sound_db:
          { type: number, nullable: true, description: "dB, từ ES-NOISE-01" }
        misting_pct: { type: number, nullable: true, description: "% phun do bộ điều khiển mờ tính (firmware ≥ 1.1.0)" }
        ventilation_pct: { type: number, nullable: true, description: "% quạt do bộ điều khiển mờ tính (firmware ≥ 1.1.0)" }
        misting_on: { type: boolean, nullable: true, description: "Relay phun sương lúc lấy mẫu" }
        ventilation_on: { type: boolean, nullable: true, description: "Relay quạt lúc lấy mẫu" }
        is_anomaly: { type: boolean }

    AlertType:
      type: string
      description: |
        `THRESHOLD_BREACH` (ALERT-FR-012, BR-34): chỉ tạo khi 1 chỉ số ở ngoài ngưỡng của Zone liên tục,
        không có mẫu hợp lệ nằm trong ngưỡng xen giữa, trong 10 phút (nhiệt độ, độ ẩm) hoặc 5 phút (ánh
        sáng, NH3, CO2); số đo thiếu hoặc stale không tính; thiết bị im lặng quá 30 giây (BR-10) thì đếm
        lại từ mẫu tiếp theo. Tự đóng sau 5 phút các chỉ số của cảnh báo về trong ngưỡng (BR-16); chỉ số
        khác vừa vượt mà chưa đủ thời gian chờ không giữ cảnh báo mở.
      enum:
        - THRESHOLD_BREACH
        - NODE_OFFLINE
        - SPEAKER_FAILURE
        - MISTING_INEFFECTIVE
        - NOISE_ANOMALY
        - UNEXPECTED_RESTART
        - LOW_RETURN_RATE
        - EDGE_AI_DEGRADED
        - SENSOR_FAULT
        - RS485_BUS_FAILURE
        - SENSOR_ANOMALY
        - FORECAST_BREACH
        - MAINTENANCE_DUE
        - ACTUATOR_FAULT
        - CONFIG_MISMATCH

    Alert:
      type: object
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string, nullable: true }
        house_id: { type: string, nullable: true, description: "Cảnh báo của cả nhà yến (camera đếm chim: EDGE_AI_DEGRADED, LOW_RETURN_RATE) — SRS v2.1.8; khi đó không có zone_id" }
        node_id: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/AlertType" }
        severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        title: { type: string }
        message: { type: string }
        snapshot_url: { type: string, nullable: true }
        metadata: { type: object }
        details:
          type: object
          nullable: true
          description: |
            Report 4 §6.1 — chi tiết của sự cố. `THRESHOLD_BREACH` (ALERT-FR-012): chỉ số đã đủ thời gian
            chờ sớm nhất. `UNEXPECTED_RESTART` (THREAT-FR-012): `reset_reason`. `metadata` giữ nguyên cho
            client cũ (`metadata.breaches` có mọi chỉ số đang vượt); `metadata.metrics` là các chỉ số
            cảnh báo đang báo (đã đủ thời gian chờ).
          properties:
            metric: { type: string, enum: [temperature, humidity, light_lux, nh3_ppm, co2_ppm] }
            observed: { type: number, description: "Giá trị đo mới nhất" }
            threshold: { type: number, description: "Ngưỡng của Zone bị vượt" }
            direction: { type: string, enum: [above, below] }
            started_at: { type: string, format: date-time, description: "Mẫu đầu tiên của quãng vượt ngưỡng liên tục" }
            reset_reason: { type: string, description: "Firmware ≥ 1.5.0 gửi POWER_ON, WATCHDOG, BROWNOUT, CRASH; thiếu thì lấy lý do chi tiết của heartbeat gần nhất (VD TASK_WDT)" }
        status: { type: string, enum: [ACTIVE, ACKNOWLEDGED, DISMISSED, RESOLVED], description: "DISMISSED — cảnh báo suy luận bị bác bỏ, không còn hiệu lực (Report 3 §6.1, EXPERT-FR-003)" }
        previous_status: { type: string, enum: [ACTIVE, ACKNOWLEDGED], nullable: true, description: "Trạng thái trước khi bị bác bỏ; đổi kết luận sang CONFIRMED thì cảnh báo trở về trạng thái này" }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true, description: "Lần gần nhất sự cố còn được ghi nhận (cập nhật tối đa 1 lần/phút) — ALERT-FR-008" }
        occurrence_count: { type: integer, minimum: 1, description: "Số lần sự cố được ghi nhận lại trong khi alert còn mở (thay vì tạo alert trùng)" }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true, description: "Sự cố hết (THRESHOLD_BREACH tự đóng sau 5 phút không vượt ngưỡng, NODE_OFFLINE tự đóng khi thiết bị kết nối lại), hoặc thiết bị đã được gỡ khỏi hệ thống (FARM-FR-008). Alert đã đóng tự xoá sau 180 ngày." }
        acknowledged_by: { type: string, nullable: true }
        acknowledgement_note: { type: string, nullable: true }
        renotified_at: { type: string, format: date-time, nullable: true, description: "ALERT-FR-015 — lúc đã gửi lại cho Farm Owner vì chưa ai xác nhận (CRITICAL/HIGH sau 15 phút, NODE_OFFLINE sau 1 giờ); chỉ gửi lại 1 lần" }
        expert_verdict:
          type: object
          nullable: true
          description: "EXPERT-FR-003 — kết quả kiểm chứng; không có = chờ kiểm chứng. Farm Owner kết luận khi farm chưa có chuyên gia (BR-22)"
          properties:
            result: { type: string, enum: [CONFIRMED, REJECTED] }
            note: { type: string, nullable: true }
            by:
              type: object
              description: "Người kết luận (ALERT-FR-007: cảnh báo DISMISSED hiện ai bác bỏ)"
              properties: { _id: { type: string }, full_name: { type: string } }
            role: { type: string, enum: [DOMAIN_EXPERT, FARM_OWNER] }
            at: { type: string, format: date-time }

    AlertEvidence:
      type: object
      description: "ALERT-FR-014 — dữ liệu quanh một cảnh báo suy luận. Mỗi nguồn có `status: ok | missing`"
      properties:
        alert_id: { type: string }
        type: { $ref: "#/components/schemas/AlertType" }
        window:
          type: object
          properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } }
        telemetry:
          type: object
          nullable: true
          description: "Loại theo zone — mẫu của zone trong cửa sổ"
          properties:
            status: { type: string, enum: [ok, missing] }
            samples:
              type: array
              items:
                type: object
                properties:
                  timestamp: { type: string, format: date-time }
                  temperature: { type: number, nullable: true }
                  humidity: { type: number, nullable: true }
                  nh3_ppm: { type: number, nullable: true }
                  co2_ppm: { type: number, nullable: true }
                  sound_db: { type: number, nullable: true }
        bird_counts:
          type: object
          nullable: true
          description: "Loại theo zone — số đếm 5 phút của nhà chứa zone"
          properties:
            status: { type: string, enum: [ok, missing] }
            buckets:
              type: array
              items:
                type: object
                properties:
                  bucket_start: { type: string, format: date-time }
                  entry_count: { type: integer }
                  exit_count: { type: integer }
        zones_in_range:
          type: array
          nullable: true
          description: "LOW_RETURN_RATE — % thời gian trong ngưỡng của từng zone trong ngày"
          items:
            type: object
            properties:
              zone_id: { type: string }
              name: { type: string }
              status: { type: string, enum: [ok, missing] }
              temp_in_range_pct: { type: number, nullable: true }
              humidity_in_range_pct: { type: number, nullable: true }
        noise_alerts:
          type: array
          nullable: true
          description: "LOW_RETURN_RATE — NOISE_ANOMALY của nhà trong ngày"
          items: { $ref: "#/components/schemas/Alert" }
        device_alerts:
          type: array
          description: "Cảnh báo thiết bị: đang mở của zone (loại theo zone), hoặc của nhà trong ngày (LOW_RETURN_RATE)"
          items: { $ref: "#/components/schemas/Alert" }
        earlier_verdicts:
          type: array
          description: "EXPERT-FR-003 — tối đa 10 cảnh báo trước cùng loại, cùng zone/nhà, đã có kết luận"
          items: { $ref: "#/components/schemas/Alert" }

    ParameterReview:
      type: object
      description: "EXPERT-FR-010, Report 3 §6.10 — mục duyệt thay đổi của Farm Owner trên farm có chuyên gia; mỗi Zone, mỗi nhóm chỉ 1 mục PENDING_REVIEW"
      properties:
        _id: { type: string }
        zone_id: { type: string }
        farm_id: { type: string }
        group: { type: string, enum: [thresholds, fuzzy] }
        old_values: { type: object, description: "Giá trị trước lần sửa đầu tiên của Farm Owner — giữ nguyên khi Farm Owner sửa tiếp" }
        new_values: { type: object, description: "Giá trị sau lần sửa gần nhất" }
        status: { type: string, enum: [PENDING_REVIEW, ACCEPTED, REVERTED, ADJUSTED] }
        changed_by: { type: string }
        reviewed_by: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CoefficientProposal:
      type: object
      description: "EXPERT-FR-011, Report 3 §6.11 — gợi ý hệ số Farm Owner gửi chuyên gia"
      properties:
        _id: { type: string }
        zone_id: { type: string }
        farm_id: { type: string }
        submitted_by: { type: string }
        suggested_values: { type: object, description: "Hệ số gợi ý lúc gửi (fuzzy_humidity_band, fuzzy_temp_band, fuzzy_fan_dry_level)" }
        current_values: { type: object, description: "Hệ số đang dùng lúc gửi" }
        predicted: { type: object, nullable: true, description: "% thời gian trong ngưỡng và % phun dự kiến (hiện tại / gợi ý)" }
        status: { type: string, enum: [PROPOSED, APPROVED, REJECTED, SUPERSEDED] }
        note: { type: string, nullable: true, description: "Lý do từ chối" }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ExpertActivityEntry:
      type: object
      description: "EXPERT-FR-009 — một quyết định trong lịch sử hoạt động của farm"
      properties:
        _id: { type: string }
        action: { type: string }
        actor:
          type: object
          properties: { _id: { type: string }, full_name: { type: string } }
        actor_role: { type: string, enum: [DOMAIN_EXPERT, FARM_OWNER] }
        target_type: { type: string }
        target_id: { type: string }
        zone_id: { type: string, nullable: true }
        house_id: { type: string, nullable: true }
        metadata: { type: object, description: "Giá trị cũ/mới (`before`, `after`) hoặc kết quả kiểm chứng" }
        created_at: { type: string, format: date-time }

    ProvisionedDevice:
      type: object
      description: "FARM-FR-003 — thiết bị trong kho (không bao giờ trả secret_key/hash)"
      properties:
        _id: { type: string }
        device_id: { type: string }
        kind: { type: string, enum: [SENSOR, CAMERA] }
        claimed_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true, description: "Đã thu hồi — không kích hoạt được nữa" }
        revoke_reason: { type: string, nullable: true }
        created_by: { type: string }
        created_at: { type: string, format: date-time }

    HarvestStatus:
      type: string
      enum: [DRAFT]

    HarvestBatch:
      type: object
      description: HARVEST-FR-001..005 — Harvest Batch (đợt thu hoạch), tự gắn env/flock snapshot lúc tạo
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string }
        created_by: { type: string }
        trace_code:
          {
            type: string,
            description: "UUID dùng làm mã QR truy xuất nguồn gốc (HARVEST-FR-004)",
          }
        harvest_date: { type: string, format: date-time }
        nest_count: { type: integer }
        weight_grams: { type: number }
        nest_type: { type: string, enum: [RAW, CLEANED, PREMIUM] }
        product_images: { type: array, items: { type: string } }
        env_snapshot:
          type: object
          description: "HARVEST-FR-002 — trung bình môi trường 7 ngày trước thu hoạch"
          properties:
            avg_temperature: { type: number, nullable: true }
            avg_humidity: { type: number, nullable: true }
            avg_light_lux: { type: number, nullable: true }
            avg_nh3_ppm: { type: number, nullable: true }
            avg_co2_ppm: { type: number, nullable: true }
            telemetry_range:
              {
                type: object,
                properties:
                  {
                    from: { type: string, format: date-time },
                    to: { type: string, format: date-time },
                  },
              }
            insufficient_data:
              {
                type: boolean,
                description: "true khi Zone chưa đủ dữ liệu 7 ngày (Flow 7 case 3a)",
              }
        flock_snapshot:
          type: object
          description: "HARVEST-FR-003 — return rate trung bình 30 ngày (rỗng cho tới khi module VISION có dữ liệu thật)"
          properties:
            avg_return_rate_30d: { type: number, nullable: true, description: "Trung bình theo ngày của tỷ lệ chim về cả Zone (BirdCountDay.return_rate) trong 30 ngày trước mẻ" }
            estimated_population: { type: integer, nullable: true, description: "Số ròng về buổi chiều lớn nhất của Zone trong 30 ngày (BirdCountDay.net_entry)" }
        status: { $ref: "#/components/schemas/HarvestStatus" }
        is_deleted: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

