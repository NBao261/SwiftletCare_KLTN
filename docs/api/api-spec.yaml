components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Header: `Authorization: Bearer <accessToken>` — accessToken lấy từ /auth/login, /auth/refresh, hoặc /auth/otp/verify"

  parameters:
    FarmId:      { name: id,        in: path, required: true, schema: { type: string }, description: Farm ObjectId }
    HouseId:     { name: houseId,   in: path, required: true, schema: { type: string }, description: House ObjectId }
    ZoneId:      { name: zoneId,    in: path, required: true, schema: { type: string }, description: Zone ObjectId }
    ZoneIdPath:  { name: id,        in: path, required: true, schema: { type: string }, description: Zone ObjectId }
    NodeId:      { name: id,        in: path, required: true, schema: { type: string }, description: SensorNode ObjectId }
    From:        { name: from,      in: query, schema: { type: string, format: date-time } }
    To:          { name: to,        in: query, schema: { type: string, format: date-time } }
    Page:        { name: page,      in: query, schema: { type: integer, default: 1 } }
    Limit:       { name: limit,     in: query, schema: { type: integer, default: 100, maximum: 1000 } }

  responses:
    NotImplemented:
      description: Endpoint chưa được triển khai
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { success: false, error: { code: NOT_IMPLEMENTED, message: "Endpoint chưa được triển khai" } }
    NotFound:
      description: Không tìm thấy
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: Không có quyền
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unauthorized:
      description: Chưa xác thực / token không hợp lệ
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: Trùng lặp dữ liệu
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
        meta:
          type: object
          properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } }

    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string, example: "Không tìm thấy farm" }

    Role:
      type: string
      enum: [ADMIN, FARM_OWNER, TECHNICIAN, SALES_STAFF]
      description: "AUTH-FR-004. Buyer đăng ký qua OTP không mang role nào (role=null) vì không tham gia RBAC"

    User:
      type: object
      properties:
        _id: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        full_name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        assigned_regions: { type: array, items: { type: string }, description: "chỉ dùng khi role=TECHNICIAN" }
        avatar_url: { type: string }
        is_active: { type: boolean }
        notification_preferences:
          type: object
          properties:
            push: { type: boolean }
            zalo: { type: boolean }
            sms: { type: boolean }
            quiet_hours: { type: object, properties: { start: { type: string }, end: { type: string } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Farm:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        address: { type: string }
        region: { type: string, example: HCMC, description: "Khu vực địa lý — khớp users.assigned_regions để xác định Technician phụ trách (AUTH-FR-005c)" }
        coordinates: { type: object, properties: { lat: { type: number }, lng: { type: number } } }
        owner_id: { type: string, description: Primary Owner }
        members:
          type: array
          items:
            type: object
            properties:
              user_id: { type: string }
              is_primary: { type: boolean }
              joined_at: { type: string, format: date-time }
        is_deleted: { type: boolean }
        created_at: { type: string, format: date-time }

    House:
      type: object
      properties:
        _id: { type: string }
        farm_id: { type: string }
        name: { type: string }
        floors: { type: integer }
        description: { type: string }
        created_at: { type: string, format: date-time }

    Thresholds:
      type: object
      properties:
        temp_min: { type: number, example: 26 }
        temp_max: { type: number, example: 31 }
        humidity_min: { type: number, example: 75 }
        humidity_max: { type: number, example: 95 }
        light_max: { type: number, example: 0.2 }
        nh3_max: { type: number, example: 25 }
        co2_max: { type: number, example: 1500 }

    Zone:
      type: object
      properties:
        _id: { type: string }
        house_id: { type: string }
        name: { type: string }
        floor: { type: integer }
        thresholds: { $ref: '#/components/schemas/Thresholds' }
        threshold_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_at: { type: string, format: date-time }
              old_values: { type: object }
              new_values: { type: object }
        created_at: { type: string, format: date-time }

    RelayStates:
      type: object
      description: "Guide v3.3 §8-9: IN1=misting, IN2=speaker (loa ru), IN3=ventilation, IN4=heating"
      properties:
        misting: { type: boolean }
        speaker: { type: boolean }
        ventilation: { type: boolean }
        heating: { type: boolean }

    SensorNode:
      type: object
      properties:
        _id: { type: string }
        device_id: { type: string, example: node_001 }
        zone_id: { type: string }
        firmware_version: { type: string }
        last_heartbeat: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, ONLINE, OFFLINE, ERROR, DEGRADED], description: "PENDING = Technician đã khai báo qua Web Console nhưng thiết bị chưa gửi heartbeat đầu tiên (Flow 1)" }
        rssi: { type: number }
        relay_states: { $ref: '#/components/schemas/RelayStates' }
        control_mode: { type: string, enum: [AUTO, MANUAL] }
        override_expiry: { type: string, format: date-time }
        speaker_schedule:
          type: object
          properties:
            enabled: { type: boolean }
            windows: { type: array, items: { type: object, properties: { start: { type: string }, end: { type: string } } } }
        audio:
          type: object
          properties:
            current_track: { type: integer }
            volume: { type: integer, minimum: 0, maximum: 30 }
            playing: { type: boolean }
            loop: { type: boolean }
        registered_at: { type: string, format: date-time }

    CameraNode:
      type: object
      properties:
        _id: { type: string }
        device_id: { type: string }
        zone_id: { type: string }
        rtsp_url: { type: string }
        status: { type: string, enum: [PENDING, ONLINE, OFFLINE, ERROR, DEGRADED], description: "PENDING = Technician đã khai báo qua Web Console nhưng thiết bị chưa gửi heartbeat đầu tiên (Flow 1)" }
        last_heartbeat: { type: string, format: date-time }
        model_version: { type: string }
        registered_at: { type: string, format: date-time }

    Telemetry:
      type: object
      properties:
        _id: { type: string }
        node_id: { type: string }
        zone_id: { type: string }
        timestamp: { type: string, format: date-time }
        temperature: { type: number, nullable: true, description: "°C, từ ES35-SW" }
        humidity: { type: number, nullable: true, description: "%RH, từ ES35-SW" }
        light_lux: { type: number, nullable: true, description: "lux, từ ES-ALS-02" }
        nh3_ppm: { type: number, nullable: true, description: "ppm, từ ES-NH3-01" }
        co2_ppm: { type: number, nullable: true, description: "ppm, từ ES-CO2-01" }
        sound_db: { type: number, nullable: true, description: "dB, từ ES-NOISE-01" }
        is_anomaly: { type: boolean }

    AlertType:
      type: string
      enum:
        - THRESHOLD_BREACH
        - PREDATOR_DETECTED
        - NODE_OFFLINE
        - SPEAKER_FAILURE
        - PUMP_DRY
        - BIRD_PANIC
        - POWER_OUTAGE
        - LOW_RETURN_RATE
        - EDGE_AI_DEGRADED
        - SENSOR_FAULT
        - RS485_BUS_FAILURE

    Alert:
      type: object
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string, nullable: true }
        node_id: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/AlertType' }
        severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] }
        title: { type: string }
        message: { type: string }
        snapshot_url: { type: string, nullable: true }
        metadata: { type: object }
        status: { type: string, enum: [ACTIVE, ACKNOWLEDGED, RESOLVED] }
        created_at: { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        acknowledged_by: { type: string, nullable: true }
        acknowledgement_note: { type: string, nullable: true }

    TicketType:
      type: string
      enum: [SENSOR_FAULT, RS485_BUS_FAILURE, ACTUATOR_FAILURE, NODE_OFFLINE, EDGE_AI_DEGRADED, POWER_OUTAGE, SPEAKER_FAILURE, PREDATOR_DETECTED, INSTALLATION, MAINTENANCE, OTHER]
    TicketStatus:
      type: string
      enum: [NEW, IN_PROGRESS, AWAITING_FIELD_CONFIRMATION, CLOSED]

    Ticket:
      type: object
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string, nullable: true }
        alert_id: { type: string, nullable: true }
        type: { $ref: '#/components/schemas/TicketType' }
        priority: { type: string, enum: [P1, P2, P3] }
        status: { $ref: '#/components/schemas/TicketStatus' }
        assigned_to: { type: string, nullable: true }
        sla_response_due_at: { type: string, format: date-time, nullable: true }
        sla_resolve_due_at: { type: string, format: date-time, nullable: true }
        is_sla_breached: { type: boolean }
        notes:
          type: array
          items:
            type: object
            properties: { author_id: { type: string }, content: { type: string }, created_at: { type: string, format: date-time } }
        satisfaction_rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        created_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
