  # ── ALERTS ────────────────────────────────────────────────────────────────
  /alerts:
    get:
      tags: [Alerts]
      summary: "Danh sách cảnh báo (ALERT-FR-007) — phân trang, filter"
      description: |
        Farm Owner chỉ thấy cảnh báo của farm mình (owner/member); Technician
        thấy farm trong `assigned_regions`; Admin thấy tất cả. Domain Expert thấy
        cảnh báo của farm được mời (chỉ đọc + kiểm chứng).
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/AlertType" } }
        - name: verdict
          in: query
          description: "EXPERT-FR-003 — `pending` = cảnh báo suy luận (NOISE_ANOMALY, SENSOR_ANOMALY, FORECAST_BREACH, LOW_RETURN_RATE) chưa được kiểm chứng"
          schema: { type: string, enum: [pending, confirmed, rejected] }
        - {
            name: status,
            in: query,
            schema: { type: string, enum: [ACTIVE, ACKNOWLEDGED, RESOLVED] },
          }
        - {
            name: severity,
            in: query,
            schema: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW] },
          }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        {
                          type: array,
                          items: { $ref: "#/components/schemas/Alert" },
                        }
                      meta:
                        type: object
                        properties:
                          {
                            page: { type: integer },
                            limit: { type: integer },
                            total: { type: integer },
                            unreadCount:
                              {
                                type: integer,
                                description: "Số cảnh báo ACTIVE (ALERT-FR-007)",
                              },
                          }

  /alerts/verdict-stats:
    get:
      tags: [Alerts]
      summary: "Tỷ lệ cảnh báo suy luận được xác nhận theo từng loại (EXPERT-FR-003)"
      description: |
        Căn cứ để Domain Expert chỉnh tham số phát hiện (EXPERT-FR-008). `confirmedPct`
        tính trên số đã kiểm chứng; `null` khi chưa kiểm chứng cảnh báo nào của loại đó.
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            type: { $ref: "#/components/schemas/AlertType" }
                            confirmed: { type: integer }
                            rejected: { type: integer }
                            pending: { type: integer }
                            confirmedPct: { type: integer, nullable: true }
        "403": { $ref: "#/components/responses/Forbidden" }

  /alerts/{id}:
    get:
      tags: [Alerts]
      summary: Chi tiết cảnh báo
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Alert" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /alerts/{id}/acknowledge:
    put:
      tags: [Alerts]
      summary: "Xác nhận cảnh báo (ALERT-FR-009) — FARM_OWNER/TECHNICIAN/ADMIN (Domain Expert chỉ đọc và kiểm chứng)"
      description: Chỉ xác nhận được cảnh báo còn `status=ACTIVE`; ghi chú được giữ làm dữ liệu đánh giá chất lượng model AI (VD "Báo động giả").
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { note: { type: string } } }
      responses:
        "200":
          {
            description: Đã xác nhận,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Alert" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          {
            description: Cảnh báo này đã được xác nhận trước đó,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /alerts/{id}/verdict:
    put:
      tags: [Alerts]
      summary: "Domain Expert xác nhận/bác bỏ một cảnh báo suy luận (EXPERT-FR-003) — DOMAIN_EXPERT"
      description: |
        Chỉ áp cho `NOISE_ANOMALY`, `SENSOR_ANOMALY`, `FORECAST_BREACH`, `LOW_RETURN_RATE`
        (loại khác → 400). Ghi lại được. Không đổi `status` của cảnh báo — xác nhận đã
        xử lý vẫn là việc của Farm Owner. Ghi audit `ALERT_VERDICT_SET`.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [CONFIRMED, REJECTED] }
                note: { type: string, maxLength: 1000 }
      responses:
        "200":
          description: Đã ghi kết quả kiểm chứng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Alert" }
        "400": { description: "Cảnh báo không thuộc loại suy luận", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── ANALYTICS ─────────────────────────────────────────────────────────────
  /analytics/env/summary:
    get:
      tags: [Analytics]
      summary: "Biểu đồ lịch sử môi trường theo khoảng thời gian (ANALYTICS-FR-001)"
      description: Chuỗi thời gian đã gom nhóm theo bucket (tối đa 120 điểm) + min/max/avg từng chỉ số.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - {
            name: range,
            in: query,
            schema:
              { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          bucketMs: { type: integer }
                          series: { type: array, items: { type: object } }
                          stats: { type: object, nullable: true }
        "400":
          {
            description: "range không hợp lệ",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /analytics/autonomy:
    get:
      tags: [Analytics]
      summary: "Tỷ lệ thời gian tự động của Zone (ANALYTICS-FR-011)"
      description: |
        % thời gian trong khoảng mà không relay nào của Zone bị can thiệp tay, tính từ lịch
        sử override (ENV-FR-019): các khoảng chồng nhau chỉ tính một lần, override đang mở
        tính tới hiện tại. Override diễn ra trước khi có lịch sử không được tính.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          auto_mode_pct: { type: number, nullable: true, example: 94.8 }
                          manual_minutes: { type: integer }
                          override_count: { type: integer }
        "400": { description: "range không hợp lệ", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /analytics/control/performance:
    get:
      tags: [Analytics]
      summary: "Hiệu quả bộ điều khiển mờ của Zone (ANALYTICS-FR-008)"
      description: |
        Chỉ tính mẫu telemetry có `misting_pct` (firmware ≥ 1.1.0). `series`: độ ẩm, nhiệt độ,
        % phun, % quạt trung bình theo bucket (tối đa 120 điểm). `stats` (null khi chưa có dữ
        liệu): % mẫu nằm trong ngưỡng hiện tại của Zone, % phun/quạt trung bình, số lần relay
        đóng cắt/giờ (null khi dữ liệu < 15 phút). `tuning_changes`: các lần chỉnh hệ số trong khoảng.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: range, in: query, schema: { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          bucketMs: { type: integer }
                          thresholds:
                            type: object
                            properties:
                              humidity_min: { type: number }
                              humidity_max: { type: number }
                              temp_min: { type: number }
                              temp_max: { type: number }
                          fuzzy_tuning: { $ref: "#/components/schemas/FuzzyTuning" }
                          tuning_changes:
                            type: array
                            items:
                              type: object
                              properties:
                                changed_at: { type: string, format: date-time }
                                new_values: { $ref: "#/components/schemas/FuzzyTuning" }
                          series:
                            type: array
                            items:
                              type: object
                              properties:
                                timestamp: { type: string, format: date-time }
                                humidity: { type: number, nullable: true }
                                temperature: { type: number, nullable: true }
                                misting_pct: { type: number, nullable: true }
                                ventilation_pct: { type: number, nullable: true }
                          stats:
                            type: object
                            nullable: true
                            properties:
                              sampleCount: { type: integer }
                              humidityInRangePct: { type: number, nullable: true }
                              temperatureInRangePct: { type: number, nullable: true }
                              mistingAvgPct: { type: number, nullable: true }
                              ventilationAvgPct: { type: number, nullable: true }
                              mistingSwitchesPerHour: { type: number, nullable: true }
                              ventilationSwitchesPerHour: { type: number, nullable: true }
                          service_limits:
                            type: object
                            description: "TICKET-FR-018 — mốc bảo trì theo thời gian chạy"
                            properties:
                              misting: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
                              ventilation: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
                          relay_usage:
                            type: array
                            description: "Giờ chạy / số lần đóng cắt từ lần bảo trì trước, theo thiết bị"
                            items:
                              type: object
                              properties:
                                device_id: { type: string }
                                misting: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
                                ventilation: { type: object, properties: { hours: { type: number }, switches: { type: number } } }
        "400":
          description: "range không hợp lệ"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /analytics/forecast:
    get:
      tags: [Analytics]
      summary: "Dự báo độ ẩm/nhiệt độ 60 phút tới (ANALYTICS-FR-009)"
      description: |
        Holt trend tắt dần trên 6 giờ gần nhất gom 5 phút; α, β chọn bằng tìm lưới; `mae30`/`mae60`
        = sai số tuyệt đối trung bình đánh giá lùi. Mỗi chỉ số là null khi < 2 giờ dữ liệu hoặc mẫu mới
        nhất cũ hơn 15 phút. `predicted` = chỉ số hiện còn trong ngưỡng nhưng dự báo vượt trong 60 phút.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          horizonMinutes: { type: integer, example: 60 }
                          bucketMinutes: { type: integer, example: 5 }
                          humidity: { $ref: "#/components/schemas/MetricForecast" }
                          temperature: { $ref: "#/components/schemas/MetricForecast" }
                          thresholds: { type: object }
                          predicted:
                            type: object
                            nullable: true
                            properties:
                              metric: { type: string, enum: [humidity, temperature] }
                              direction: { type: string, enum: [above, below] }
                              limit: { type: number }
                              value: { type: number }
                              minutesAhead: { type: integer }

  /analytics/control/suggestion:
    get:
      tags: [Analytics]
      summary: "Gợi ý hệ số logic mờ từ mô hình học trên dữ liệu thật (ANALYTICS-FR-010)"
      description: |
        Hồi quy Δh(10') = a·%phun + b·%quạt + c·(T−T̄) + d trên ≤ 14 ngày, mô phỏng 24 giờ gần nhất với
        120 bộ hệ số. CHỈ đề xuất, không ghi gì. `suggestion` null kèm `reason` khi < 3 ngày dữ liệu,
        R² < 0.3, phun sương không làm tăng ẩm, hoặc hệ số hiện tại đã gần tốt nhất.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          current: { $ref: "#/components/schemas/FuzzyTuning" }
                          suggestion: { allOf: [{ $ref: "#/components/schemas/FuzzyTuning" }], nullable: true }
                          reason: { type: string, nullable: true }
                          predicted:
                            type: object
                            properties:
                              inRangeNow: { type: number }
                              inRangeSuggested: { type: number }
                              mistingNow: { type: number }
                              mistingSuggested: { type: number }
                          model:
                            type: object
                            nullable: true
                            properties:
                              r2: { type: number }
                              samples: { type: integer }
                              days: { type: number }

  /analytics/env/compare:
    get:
      tags: [Analytics]
      summary: "So sánh môi trường nhiều Zone cùng lúc (ANALYTICS-FR-005, tối đa 6 zone)"
      parameters:
        - {
            name: zoneIds,
            in: query,
            required: true,
            schema: { type: string },
            description: "Danh sách zoneId phân tách bởi dấu phẩy, VD zoneId1,zoneId2",
          }
        - {
            name: range,
            in: query,
            schema:
              { type: string, enum: [1h, 6h, 24h, 7d, 30d], default: 24h },
          }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          range: { type: string }
                          zones:
                            type: array
                            items:
                              type: object
                              properties:
                                {
                                  zoneId: { type: string },
                                  zoneName: { type: string },
                                  thresholds:
                                    { $ref: "#/components/schemas/Thresholds" },
                                  metrics: { type: object, nullable: true },
                                }
        "400":
          {
            description: "Thiếu zoneId hoặc vượt quá 6 zone",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /analytics/bird-count/daily:
    get:
      tags: [Analytics]
      summary: "Thống kê đếm chim hàng ngày (VISION-FR-008/010)"
      description: |
        Trả `records: []` kèm `note` cảnh báo khi chưa có dữ liệu — module
        VISION (Raspberry Pi + YOLO) chưa lắp phần cứng camera, KHÔNG phải lỗi truy vấn.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          from: { type: string, format: date-time }
                          to: { type: string, format: date-time }
                          records:
                            type: array
                            items:
                              type: object
                              properties:
                                {
                                  date: { type: string },
                                  morning_exit: { type: integer },
                                  evening_entry: { type: integer },
                                  return_rate: { type: number, nullable: true },
                                }
                          note: { type: string, nullable: true }

  /analytics/bird-count/trends:
    get:
      tags: [Analytics]
      summary: "Xu hướng đàn chim + cảnh báo giảm > 20% (VISION-FR-009/011, ANALYTICS-FR-002)"
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          days: { type: integer }
                          records: { type: array, items: { type: object } }
                          avg_return_rate: { type: number, nullable: true }
                          latest_return_rate: { type: number, nullable: true }
                          drop_percent: { type: number, nullable: true }
                          drop_threshold_pct: { type: number, description: "return_rate_drop_pct của Zone (EXPERT-FR-008), mặc định 20" }
                          is_significant_drop: { type: boolean }

  /analytics/correlation:
    get:
      tags: [Analytics]
      summary: "Tương quan môi trường vs return rate theo ngày (ANALYTICS-FR-003)"
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: days, in: query, schema: { type: integer, default: 30 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          days: { type: integer }
                          points:
                            type: array
                            items:
                              type: object
                              properties:
                                {
                                  date: { type: string },
                                  avg_temperature: { type: number },
                                  max_temperature: { type: number },
                                  avg_humidity: { type: number },
                                  return_rate: { type: number, nullable: true },
                                }
                          note: { type: string, nullable: true }

  # ── HARVESTS ──────────────────────────────────────────────────────────────
  /harvests:
    post:
      tags: [Harvests]
      summary: "Tạo Harvest Batch (MARKET-FR-001..004) — FARM_OWNER/ADMIN (Domain Expert chỉ xem qua GET)"
      description: |
        Tự động gắn `env_snapshot` (trung bình môi trường 7 ngày trước thu
        hoạch — MARKET-FR-002) và `flock_snapshot` (return rate 30 ngày —
        MARKET-FR-003), sinh `trace_code` (UUID) làm mã định danh mẻ. Nếu
        Zone chưa đủ dữ liệu telemetry/bird-count, snapshot trả về
        `insufficient_data: true` thay vì số liệu sai lệch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [zone_id, harvest_date, nest_count, weight_grams, nest_type]
              properties:
                zone_id: { type: string }
                harvest_date: { type: string, format: date-time }
                nest_count: { type: integer, example: 50 }
                weight_grams: { type: number, example: 350.5 }
                nest_type:
                  {
                    type: string,
                    enum: [RAW, CLEANED, PREMIUM],
                    description: "thô/tinh",
                  }
                product_images: { type: array, items: { type: string } }
      responses:
        "201":
          {
            description: "Đã tạo (status=DRAFT)",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      $ref: "#/components/schemas/HarvestBatch",
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Harvests]
      summary: Danh sách Harvest Batch (farm mình sở hữu/thành viên, hoặc lọc theo farmId)
      parameters: [{ name: farmId, in: query, schema: { type: string } }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        {
                                          $ref: "#/components/schemas/HarvestBatch",
                                        },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }

  /harvests/{id}:
    parameters:
      [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Harvests]
      summary: Chi tiết Harvest Batch
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      $ref: "#/components/schemas/HarvestBatch",
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Harvests]
      summary: "Cập nhật Harvest Batch (MARKET-FR-005)"
      description: "Sửa số liệu ghi nhận của mẻ; env/flock snapshot chỉ chụp một lần lúc tạo, không sửa qua đây."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                nest_count: { type: integer }
                weight_grams: { type: number }
                nest_type: { type: string, enum: [RAW, CLEANED, PREMIUM] }
                product_images: { type: array, items: { type: string } }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      $ref: "#/components/schemas/HarvestBatch",
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Harvests]
      summary: "Xóa mềm Harvest Batch"
      responses:
        "200":
          {
            description: Đã xoá,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── TICKETS ───────────────────────────────────────────────────────────────
  /health-reports:
    get:
      tags: [HealthReports]
      summary: "Danh sách báo cáo sức khỏe của Zone (EXPERT-FR-005) — FARM_OWNER/DOMAIN_EXPERT (mọi route /health-reports)"
      description: |
        Báo cáo do job tổng hợp theo chu kỳ (mặc định 06:00 thứ Hai, kỳ 7 ngày —
        `HEALTH_REPORT_CRON`, `HEALTH_REPORT_DAYS`), mới nhất trước. Zone không có mẫu
        telemetry nào trong kỳ thì không có báo cáo cho kỳ đó.
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ZoneHealthReport" } }
                      meta:
                        type: object
                        properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /health-reports/preview:
    get:
      tags: [HealthReports]
      summary: "Số liệu sức khỏe Zone theo khoảng bất kỳ, không lưu (EXPERT-FR-005)"
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "Mặc định là hiện tại; khoảng tối đa 30 ngày" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ZoneHealthReport" }
        "400": { description: "from không trước to, hoặc khoảng quá 30 ngày", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /health-reports/{id}:
    get:
      tags: [HealthReports]
      summary: "Chi tiết 1 báo cáo kèm kết luận của chuyên gia"
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ZoneHealthReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health-reports/{id}/conclusion:
    put:
      tags: [HealthReports]
      summary: "Domain Expert viết/sửa kết luận và khuyến nghị (EXPERT-FR-006) — DOMAIN_EXPERT"
      description: |
        Người viết sửa được kết luận của mình (cập nhật `at`); chuyên gia khác không ghi đè
        (403). Farm Owner của farm nhận thông báo. Ghi audit `HEALTH_REPORT_CONCLUDED`.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: Đã lưu kết luận
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ZoneHealthReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /maintenance-schedules:
    get:
      tags: [Tickets]
      summary: "Danh sách lịch bảo trì định kỳ (TICKET-FR-013) — FARM_OWNER/TECHNICIAN/ADMIN"
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/MaintenanceSchedule" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tickets]
      summary: "Tạo lịch bảo trì định kỳ (TICKET-FR-013) — TECHNICIAN trong vùng/ADMIN"
      description: |
        Kỳ trước chưa hoàn thành thì **vẫn** sinh ticket kỳ mới (mỗi chu kỳ là một nghĩa vụ
        riêng) nhưng cả hai ticket được ghi chú rõ và Admin nhận thông báo điều phối.
        Lịch trùng nội dung đang hoạt động trên cùng farm/zone bị từ chối 409.

        Job chạy đầu mỗi giờ, tạo ticket MAINTENANCE trước hạn `MAINTENANCE_LEAD_DAYS`
        ngày (mặc định 3) qua Ticket Router rồi dời hạn sang chu kỳ kế tiếp.
        `next_due_at` chính là giờ hẹn của ticket sinh ra nên phải trong khung 7:00–18:00 giờ Việt Nam (Asia/Ho_Chi_Minh), ở tương lai.
        Lịch trễ nhiều chu kỳ hẹn sớm nhất 1 giờ sau, rơi ngoài khung giờ thì dời lên
        07:00 kế tiếp, không hẹn về quá khứ; lịch của farm đã xoá mềm tự chuyển `is_active=false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farm_id, description, interval_days, next_due_at]
              properties:
                farm_id: { type: string }
                zone_id: { type: string, description: "Phải thuộc farm_id" }
                description: { type: string, example: "Vệ sinh đầu dò NH3/CO2" }
                interval_days: { type: integer, minimum: 1, maximum: 365, example: 30 }
                next_due_at: { type: string, format: date-time, description: "Giờ hẹn của ticket sinh ra — trong khung 7:00–18:00 giờ Việt Nam (Asia/Ho_Chi_Minh), ở tương lai" }
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/MaintenanceSchedule" } }
        "400": { description: "next_due_at không ở tương lai hoặc ngoài khung 7:00–18:00 / zone khác farm", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /maintenance-schedules/{id}:
    put:
      tags: [Tickets]
      summary: "Sửa / tạm dừng lịch bảo trì (TICKET-FR-013) — TECHNICIAN trong vùng/ADMIN"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                zone_id: { type: string }
                description: { type: string }
                interval_days: { type: integer, minimum: 1, maximum: 365 }
                next_due_at: { type: string, format: date-time, description: "trong khung 7:00–18:00 giờ Việt Nam (Asia/Ho_Chi_Minh), ở tương lai" }
                is_active: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/MaintenanceSchedule" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Đổi zone_id/description hoặc bật lại (is_active=true) làm lịch trùng một lịch đang chạy của farm (cùng zone + nội dung) — giống khi tạo" }
    delete:
      tags: [Tickets]
      summary: "Xoá lịch bảo trì (TICKET-FR-013) — TECHNICIAN trong vùng/ADMIN"
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Đã xoá, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tickets:
    post:
      tags: [Tickets]
      summary: "Farm Owner tạo ticket báo lỗi hoặc yêu cầu lắp đặt (TICKET-FR-001) — FARM_OWNER/ADMIN. Mọi route /tickets chỉ cho FARM_OWNER/TECHNICIAN/ADMIN"
      description: |
        Ticket Router tự động gán Technician ít việc nhất trong `region` của
        farm (TICKET-FR-004); priority/SLA gán tự động theo `type`
        (TICKET-FR-003/006); Technician được gán nhận thông báo (kèm giờ hẹn nếu có).
        - `type=INSTALLATION`: bắt buộc `scheduled_visit_at` ngay lúc tạo, trong khung 7:00–18:00 giờ Việt Nam (Asia/Ho_Chi_Minh), ở tương lai (TICKET-FR-004b).
        - Ticket sự cố/`OTHER`: **không** gửi `scheduled_visit_at` — Technician chẩn đoán từ xa
          trước, cần xuống hiện trường thì mới hẹn qua `PUT /tickets/:id/scheduled-date` (Flow 9 bước 6b).
        - `type=MAINTENANCE` không tạo tay — chỉ sinh từ `/maintenance-schedules` (TICKET-FR-013).
        - `zone_id` (nếu có) phải thuộc `farm_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [farm_id, type]
              properties:
                farm_id: { type: string }
                zone_id: { type: string, description: "Phải thuộc farm_id" }
                type:
                  type: string
                  enum: [SENSOR_FAULT, RS485_BUS_FAILURE, ACTUATOR_FAILURE, NODE_OFFLINE, EDGE_AI_DEGRADED, POWER_OUTAGE, SPEAKER_FAILURE, PREDATOR_DETECTED, INSTALLATION, OTHER]
                  description: "TicketType trừ MAINTENANCE"
                description: { type: string, maxLength: 1000, description: "Ghi thành note đầu tiên của ticket" }
                scheduled_visit_at:
                  {
                    type: string,
                    format: date-time,
                    description: "Chỉ và bắt buộc khi type=INSTALLATION — trong khung 7:00–18:00 giờ Việt Nam (Asia/Ho_Chi_Minh), ở tương lai",
                  }
                alert_id:
                  {
                    type: string,
                    description: "Gắn với Alert gốc nếu ticket phát sinh từ 1 cảnh báo",
                  }
      responses:
        "201":
          {
            description: "Đã tạo (status=NEW)",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Ticket" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          {
            description: "Yêu cầu lắp đặt thiếu/sai giờ hẹn (quá khứ, ngoài 7:00–18:00); ticket sự cố gửi kèm giờ hẹn; type=MAINTENANCE; zone khác farm",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Tickets]
      summary: "Danh sách ticket (filter farm/status/priority/assignee)"
      description: |
        Farm Owner chỉ thấy ticket farm mình; Technician thấy farm trong
        `assigned_regions`; Admin thấy tất cả. Lọc theo `farmId` được kiểm
        quyền riêng — farm không thuộc phạm vi của user thì trả 403, không
        trả về danh sách rỗng.
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - {
            name: status,
            in: query,
            schema: { $ref: "#/components/schemas/TicketStatus" },
          }
        - {
            name: priority,
            in: query,
            schema: { type: string, enum: [P1, P2, P3] },
          }
        - { name: assignedToMe, in: query, schema: { type: boolean } }
        - { name: unassigned, in: query, schema: { type: boolean }, description: "TICKET-FR-005 — hàng đợi chung: ticket chưa có Technician" }
        - {
            name: slaBreached,
            in: query,
            schema: { type: boolean },
            description: "TICKET-FR-009 — chỉ ticket vượt hạn xử lý: đã bị đánh dấu `is_sla_breached`, hoặc còn mở mà đã qua `sla_resolve_due_at` (job đánh dấu chạy 2 phút/lần). Ticket đã đóng chỉ tính theo cờ",
          }
        - {
            name: search,
            in: query,
            schema: { type: string, maxLength: 100 },
            description: "Tìm không phân biệt hoa thường trong ghi chú ticket (mô tả lúc tạo là ghi chú đầu tiên) và tên farm. Ký tự đặc biệt được hiểu là chữ thường, không phải regex",
          }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [created_at, sla, status, priority], default: created_at },
            description: "`sla` = hạn xử lý `sla_resolve_due_at`; `status` theo thứ tự nghiệp vụ NEW → IN_PROGRESS → AWAITING_FIELD_CONFIRMATION → CLOSED",
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        { $ref: "#/components/schemas/Ticket" },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "422": { description: "search dài quá 100 ký tự, sort/order/slaBreached không hợp lệ" }

  /tickets/kpi:
    get:
      tags: [Tickets]
      summary: "Dashboard KPI xử lý ticket theo Technician (TICKET-FR-012) — chỉ ADMIN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          byStatus:
                            {
                              type: array,
                              items:
                                {
                                  type: object,
                                  properties:
                                    {
                                      _id: { type: string },
                                      count: { type: integer },
                                    },
                                },
                            }
                          byTechnician:
                            type: array
                            items:
                              type: object
                              properties:
                                technician_id: { type: string }
                                full_name: { type: string, nullable: true }
                                email: { type: string, nullable: true }
                                total: { type: integer }
                                closed: { type: integer }
                                cancelled: { type: integer }
                                unaccepted:
                                  { type: integer, description: "Ticket được gán nhưng KTV chưa tiếp nhận (status NEW)" }
                                avgResolveHours: { type: number, nullable: true }
                                avgResponseHours: { type: number, nullable: true, description: "Giao ticket (assigned_at) → Technician xác nhận tiếp nhận (responded_at)" }
                                escalated: { type: integer, description: "Số ticket Technician chủ động escalate" }
                                slaComplianceRate: { type: number, nullable: true }
                          resolvedTickets:
                            { type: integer, description: "Ticket đã đóng, KHÔNG tính ticket bị huỷ" }
                          avgResolveHours:
                            { type: number, nullable: true, description: "Giờ, tính trên resolvedTickets" }
                          ticketsPastDue:
                            { type: integer, description: "Ticket đã qua hạn xử lý, kể cả còn đang mở" }
                          slaComplianceRate:
                            {
                              type: number,
                              nullable: true,
                              description: "% ticket đúng SLA trên tổng ticket đã tới hạn (gồm cả ticket quá hạn còn treo), bỏ qua ticket bị huỷ",
                            }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tickets/stats/me:
    get:
      tags: [Tickets]
      summary: "Thống kê ticket của Technician đang đăng nhập — chỉ TECHNICIAN"
      description: |
        Đếm trên toàn bộ DB (không giới hạn theo trang), cùng phạm vi với
        `GET /tickets?assignedToMe=true` nên `total` khớp `meta.total` của danh
        sách đó. Quá hạn SLA dùng cùng quy tắc với `slaBreached=true`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          total: { type: integer }
                          open: { type: integer, description: "Ticket chưa CLOSED" }
                          by_status:
                            type: object
                            properties:
                              NEW: { type: integer }
                              IN_PROGRESS: { type: integer }
                              AWAITING_FIELD_CONFIRMATION: { type: integer }
                              CLOSED: { type: integer }
                          sla_breached: { type: integer, description: "Vượt hạn xử lý, kể cả ticket đã đóng" }
                          sla_breached_open: { type: integer, description: "Vượt hạn xử lý và còn mở — việc cần làm ngay" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Chi tiết ticket + lịch sử ghi chú
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          {
            description: OK,
            content:
