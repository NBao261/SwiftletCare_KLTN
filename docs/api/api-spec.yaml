      responses:
        "200":
          {
            description: Đã gỡ,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          {
            description: Không thể gỡ Primary Owner,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          {
            description: Không phải thành viên farm này,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /farms/{id}/sales-staff:
    parameters: [{ $ref: "#/components/parameters/FarmId" }]
    post:
      tags: [Farms]
      summary: "Đề xuất Sales Staff cho farm (AUTH-FR-005b đổi v1.16.0, Flow 16 bước 1b) — chỉ Primary Owner"
      description: |
        Chỉ tạo đề xuất `PENDING`, KHÔNG tự kích hoạt — Administrator duyệt/từ
        chối ở `PUT /admin/sales-staff-requests/{id}/decision` (AUTH-FR-005d).
        Theo dõi kết quả ở `GET /farms/{id}/sales-staff-requests`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email],
                properties: { email: { type: string, format: email } },
              }
      responses:
        "201":
          description: Đã tạo đề xuất (status=PENDING)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SalesAssignmentRequest" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "Đã có đề xuất PENDING cho email này / email thuộc tài khoản không phải Sales Staff / đã được gán vào farm"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    get:
      tags: [Farms]
      summary: Danh sách Sales Staff của farm
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }

  /farms/{id}/sales-staff-requests:
    get:
      tags: [Farms]
      summary: "Farm Owner xem các đề xuất thêm / yêu cầu gỡ Sales Staff của farm và kết quả duyệt (Flow 16 bước 1b/1d/1e)"
      parameters: [{ $ref: "#/components/parameters/FarmId" }]
      responses:
        "200":
          description: OK (mới nhất trước; `type` phân biệt ADD/REMOVE; `review_note` là lý do nếu bị từ chối)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/SalesAssignmentRequest" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /farms/{id}/sales-staff/{salesStaffId}/removal-requests:
    post:
      tags: [Farms]
      summary: "Farm Owner yêu cầu gỡ Sales Staff khỏi farm (Flow 16 bước 1e) — chỉ Primary Owner"
      description: |
        Chỉ tạo yêu cầu `PENDING` với `type=REMOVE`, KHÔNG gỡ ngay — Administrator
        duyệt/từ chối ở `PUT /admin/sales-staff-requests/{id}/decision` (hoặc gỡ
        thẳng bằng `DELETE /admin/farms/{farmId}/sales-staff/{salesStaffId}`).
        Theo dõi kết quả ở `GET /farms/{id}/sales-staff-requests`. Admin không
        dùng endpoint này (403) vì đã có quyền gỡ trực tiếp.
      parameters:
        - { $ref: "#/components/parameters/FarmId" }
        - { name: salesStaffId, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Đã tạo yêu cầu gỡ (status=PENDING, type=REMOVE)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SalesAssignmentRequest" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Đã có yêu cầu gỡ Sales Staff này đang chờ Admin xử lý"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /invitations/{token}:
    parameters:
      [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Farms]
      summary: Xem trước lời mời qua token (AUTH-FR-010, Flow 12 bước 3) — không cần đăng nhập, dùng để hiển thị tên farm trước khi accept/decline
      responses:
        "200":
          {
            description: OK,
            content:
