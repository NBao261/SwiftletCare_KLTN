            description: Đã chấp nhận,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "403":
          {
            description: Đăng nhập sai email được mời,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          {
            description: Lời mời đã accept/decline/hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /invitations/{token}/decline:
    post:
      tags: [Farms]
      summary: Từ chối lời mời (Flow 12 case 3c) — link công khai, không cần đăng nhập
      parameters:
        [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          {
            description: Đã từ chối,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          {
            description: Lời mời đã accept/decline/hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /farms/{id}/houses:
