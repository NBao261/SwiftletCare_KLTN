                      data: { $ref: "#/components/schemas/HouseHealthDay" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "RATING_CLOSED — người gọi chưa chấm ngày này (bỏ qua hoặc hết hạn thì không có điểm để ghi chú)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /health-reports/evaluation:
    get:
      tags: [HealthReports]
      summary: "Độ khớp giữa hệ thống và người chấm (ANALYTICS-FR-014, NFR-14) — FARM_OWNER, DOMAIN_EXPERT xem"
      description: |
        So ảnh chụp lúc chấm với điểm của người chấm trên 3 mức có thứ tự GOOD < WATCH < ACTION: tỷ lệ
        khớp kèm khoảng tin cậy Wilson 95 %, kappa Cohen trọng số tuyến tính, AC1 của Gwet, ma trận nhầm
        lẫn, tỷ lệ báo động giả của trạng thái gộp và của từng nguồn riêng (mức NORMAL/SLIGHT/CLEAR quy ra
        GOOD/WATCH/ACTION). Ảnh chụp `INSUFFICIENT_DATA` đếm riêng, không vào độ khớp. Chỉ tính điểm của
        người chấm (BR-31: Farm Owner, Farm Technician);
        Farm Technician không xem độ khớp (403); điểm Domain Expert chấm trước Report 3 4.2.0 vẫn hiện trong ngày nhưng không tính.
        `ratings` liệt kê từng cặp để mọi con số tính lại được. Khoảng tối đa 366 ngày.
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Một trong houseId, farmId là bắt buộc (400 nếu thiếu cả hai)" }
        - { name: farmId, in: query, schema: { type: string }, description: "Mọi nhà của farm" }
        - { name: from, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định to − 6 ngày" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định hôm nay" }
        - { name: role, in: query, schema: { type: string, enum: [FARM_OWNER, FARM_TECHNICIAN] }, description: "Chỉ điểm của vai người chấm này; vai khác → 422" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HealthEvaluation" }
        "400": { description: "Thiếu houseId và farmId / from sau to / quá 366 ngày", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /health-reports/disagreements:
    get:
      tags: [HealthReports]
      summary: "Các ngày người chấm đánh giá khác hệ thống (EXPERT-FR-022) — DOMAIN_EXPERT, FARM_OWNER"
      description: |
        Để chuyên gia xem mức chỉ số của nhà có hợp không rồi chỉnh bằng `PUT /farms/houses/{houseId}/health-levels`
        (lưu audit `HEALTH_LEVELS_UPDATED` với giá trị trước và sau, áp từ lần đánh giá tiếp theo). Trả các ngày
        có ít nhất một điểm `RATED` của người chấm khác trạng thái trong ảnh chụp lúc chấm; ảnh chụp
        `INSUFFICIENT_DATA` và điểm Domain Expert chấm trước Report 3 4.2.0 không tính. Mới nhất trước. Người
        gọi không phải người chấm nên thấy đủ trạng thái, lý do, chỉ số. Farm Owner xem được dù farm có chuyên
        gia hay không (BR-22); Farm Technician nhận 403 (Report 3 §2.4). Khoảng tối đa 366 ngày.
      parameters:
        - { name: houseId, in: query, schema: { type: string }, description: "Một trong houseId, farmId là bắt buộc (400 nếu thiếu cả hai)" }
        - { name: farmId, in: query, schema: { type: string }, description: "Mọi nhà của farm" }
        - { name: from, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định to − 6 ngày" }
        - { name: to, in: query, schema: { type: string, format: date }, description: "'YYYY-MM-DD' giờ VN; mặc định hôm nay" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HealthDisagreements" }
        "400": { description: "Thiếu houseId và farmId / from sau to / quá 366 ngày", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /health-reports/{id}:
    get:
      tags: [HealthReports]
      summary: "Chi tiết 1 báo cáo theo nhà kèm các mục Zone, trạng thái ngày và kết luận (EXPERT-FR-005, 013) — FARM_OWNER, DOMAIN_EXPERT; FARM_TECHNICIAN ở nhà được giao"
      description: |
        Đủ số liệu để web dựng PDF bằng `jspdf` (EXPERT-FR-013: PDF có đúng số trong ứng dụng; không có id
        nội bộ trong file — client không in các trường `_id`). `days` dựng lúc đọc từ trạng thái
        ngày (`HouseHealthDay`) như `GET /health-reports/days`, đủ trạng thái kể cả ngày người gọi chưa chấm
        (BR-31); `status_counts` đếm mọi ngày của kỳ.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /health-reports/{id}/conclusion:
    put:
      tags: [HealthReports]
      summary: "Domain Expert viết/sửa kết luận và khuyến nghị (EXPERT-FR-006) — DOMAIN_EXPERT"
      description: |
        Người viết sửa được kết luận của mình (lưu `edited_at`); chuyên gia khác không ghi đè (403); Farm
        Owner → 403 (BR-22: không có kết luận khi farm chưa có chuyên gia). Mọi Farm Owner của farm nhận
        thông báo (và Telegram nếu đã liên kết). Ghi audit `HEALTH_REPORT_CONCLUDED` (`house_id`, `kind`).
        Trả cùng hình dạng với `GET /health-reports/{id}` (báo cáo theo Zone cũ vẫn viết kết luận được).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: Đã lưu kết luận
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── EXPERT ACTIVITY (EXPERT-FR-009) ───────────────────────────────────────
  /expert-activity:
    get:
      tags: [ExpertActivity]
      summary: "Lịch sử hoạt động của chuyên gia trên một farm (EXPERT-FR-009) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        Đọc từ audit log theo `farm_id` (Report 4 §6.1). Gồm các quyết định của Domain Expert: sửa và
        reset ngưỡng zone (`THRESHOLD_UPDATED`), hệ số mờ (`FUZZY_TUNING_UPDATED`), tham số phát hiện
        (`DETECTION_TUNING_UPDATED`), mức giảm tỷ lệ chim về (`BIRD_COUNT_TUNING_UPDATED`), vòng đếm
        (`COUNTING_RING_UPDATED`), kết luận cảnh báo (`ALERT_VERDICT_SET`), kết luận báo cáo
        (`HEALTH_REPORT_CONCLUDED`), chấp nhận / hoàn lại thay đổi của Farm Owner (`REVIEW_ACCEPTED`,
        `REVIEW_REVERTED`), duyệt / từ chối đề xuất hệ số (`PROPOSAL_APPROVED`, `PROPOSAL_REJECTED`),
        mức chỉ số sức khỏe của nhà (`HEALTH_LEVELS_UPDATED`), luật bù thời tiết (`WEATHER_RULES_UPDATED`), lịch đếm
        (`COUNTING_SCHEDULE_UPDATED`).
        Mỗi quyết định một dòng: hoàn lại hoặc duyệt đề xuất chỉ hiện `REVIEW_REVERTED` / `PROPOSAL_APPROVED`,
        không thêm dòng đổi ngưỡng / hệ số của chính thao tác đó.
        Quyết định Farm Owner cũng làm được (BR-22, Report 3 4.2.15: kết luận cảnh báo khi farm chưa có chuyên gia,
        tham số phát hiện, mức giảm tỷ lệ chim về, vòng đếm, lịch đếm, mức chỉ số sức khỏe, luật bù thời tiết) cũng được liệt kê,
        với `actor_role = FARM_OWNER`. Mới nhất trước. Technician, Administrator → 403.
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - name: type
          in: query
          schema:
            type: string
            enum: [THRESHOLD_UPDATED, FUZZY_TUNING_UPDATED, DETECTION_TUNING_UPDATED, BIRD_COUNT_TUNING_UPDATED, COUNTING_RING_UPDATED, ALERT_VERDICT_SET, HEALTH_REPORT_CONCLUDED, REVIEW_ACCEPTED, REVIEW_REVERTED, PROPOSAL_APPROVED, PROPOSAL_REJECTED, HEALTH_LEVELS_UPDATED, WEATHER_RULES_UPDATED, CONFIG_PROFILE_APPROVED, COUNTING_SCHEDULE_UPDATED, WEATHER_RULES_PROPOSAL_REJECTED]
        - { name: zoneId, in: query, schema: { type: string } }
        - { name: houseId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ExpertActivityEntry" } }
                      meta:
                        type: object
                        properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /expert-activity/reminders:
    post:
      tags: [ExpertActivity]
      summary: "Nhắc chuyên gia việc chỉ chuyên gia làm (BR-22) — FARM_OWNER"
      description: |
        Kết luận một cảnh báo suy luận (`alert`, EXPERT-FR-003), viết kết luận báo cáo sức khoẻ (`health_report`) hoặc
        mùa vụ đã đóng (`harvest_cycle`, EXPERT-FR-006): báo trong ứng dụng cho mọi Domain Expert của farm
        (`ref.kind` = `kind`), ghi `expert_reminded_at` lên bản ghi, audit `EXPERT_REMINDED`. Mỗi việc nhắc một lần.
        Không phải Farm Owner của farm → 403 (kiểm trước, không lộ việc của farm khác); cảnh báo đo trực tiếp → 400;
        việc đã xong, chu kỳ còn mở, farm chưa có chuyên gia, đã nhắc → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id]
              properties:
                kind: { type: string, enum: [alert, health_report, harvest_cycle] }
                id: { type: string }
      responses:
        "201":
          description: Đã nhắc
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          kind: { type: string, enum: [alert, health_report, harvest_cycle] }
                          id: { type: string }
                          expert_reminded_at: { type: string, format: date-time }
        "400": { description: "Cảnh báo đo trực tiếp, không cần chuyên gia kết luận", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Việc đã xong, chưa đến lúc, farm chưa có chuyên gia hoặc đã nhắc", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: "Chưa gửi được thông báo nào, lượt nhắc được trả lại", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
  /expert-activity/queue:
    get:
      tags: [ExpertActivity]
      summary: "Việc đang chờ chuyên gia của một trại (hàng đợi việc, Report 4 §5.4) — DOMAIN_EXPERT"
      description: |
        Một phạm vi cho mọi nhóm: cả trại. Mỗi nhóm có `total` và tối đa 5 việc đầu (việc Farm Owner đã nhắc lên đầu,
        rồi mới nhất trước): cảnh báo suy luận chưa kết luận (EXPERT-FR-003), mục duyệt thay đổi (EXPERT-FR-010), đề xuất
        hệ số (EXPERT-FR-011), ngày lệch đánh giá trong 14 ngày (EXPERT-FR-022), báo cáo chưa có kết luận (EXPERT-FR-006),
        đề xuất luật bù thời tiết, hồ sơ nháp, luật khuyến nghị chờ bật (BR-22), mùa vụ đã đóng chưa có kết luận.
        Farm Owner, Technician, Administrator, chuyên gia trại khác → 403.
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          farm_id: { type: string }
                          groups:
                            type: array
                            items:
                              type: object
                              properties:
                                kind:
                                  type: string
                                  enum: [alert_verdict, parameter_review, coefficient_proposal, disagreeing_day, report_conclusion, weather_proposal, profile_draft, recommendation_rule, season_conclusion]
                                total: { type: integer }
                                items:
                                  type: array
                                  maxItems: 5
                                  items:
                                    type: object
                                    properties:
                                      id: { type: string }
                                      title: { type: string }
                                      house_name: { type: string, nullable: true }
                                      at: { type: string, description: "Thời điểm (ISO) hoặc ngày YYYY-MM-DD của ngày lệch" }
                                      reminded: { type: boolean, description: "Farm Owner đã nhắc chuyên gia" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /expert-activity/reviews:
    get:
      tags: [ExpertActivity]
      summary: "Mục duyệt thay đổi của Farm Owner (EXPERT-FR-010) — FARM_OWNER, DOMAIN_EXPERT"
      description: "Mới nhất trước. Technician, Administrator → 403."
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: status, in: query, schema: { type: string, enum: [PENDING_REVIEW, ACCEPTED, REVERTED, ADJUSTED] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ParameterReview" } }
                      meta: { type: object, properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /expert-activity/reviews/{id}/accept:
    put:
      tags: [ExpertActivity]
      summary: "Chuyên gia chấp nhận thay đổi của Farm Owner (EXPERT-FR-010, SM-10) — DOMAIN_EXPERT"
      description: "PENDING_REVIEW → ACCEPTED; báo Farm Owner (EXPERT-FR-009), audit REVIEW_ACCEPTED. Farm Owner, Technician, Administrator → 403."
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ParameterReview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Mục duyệt đã đóng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /expert-activity/reviews/{id}/revert:
    put:
      tags: [ExpertActivity]
      summary: "Chuyên gia hoàn lại thay đổi của Farm Owner (EXPERT-FR-010, SM-10) — DOMAIN_EXPERT"
      description: |
        Khôi phục giá trị gốc (trước lần sửa đầu của Farm Owner) của nhóm, qua đúng hàm cập nhật của nhóm đó:
        `thresholds`, `fuzzy`, `detection` gửi lại mọi controller của Zone (ngưỡng và hệ số ghi `source=EXPERT_REVERT`);
        `return_rate_drop`, `health_levels`, `counting_schedule` ghi lại cho nhà (lịch đếm gửi lại nút AI của nhà);
        `counting_ring` gửi lại nút AI của camera (camera chưa có vòng cũ thì về vòng mặc định). `PENDING_REVIEW` → `REVERTED`; báo Farm Owner, audit `REVIEW_REVERTED`.
        Farm Owner, Technician, Administrator → 403.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ParameterReview" }
        "400": { description: "Giá trị gốc của ngưỡng hoặc hệ số không còn qua kiểm khoảng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Mục duyệt đã đóng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /expert-activity/proposals:
    get:
      tags: [ExpertActivity]
      summary: "Đề xuất hệ số (EXPERT-FR-011) — FARM_OWNER, DOMAIN_EXPERT"
      description: "Mới nhất trước. Technician, Administrator → 403."
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string } }
        - { name: zoneId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - { name: status, in: query, schema: { type: string, enum: [PROPOSED, APPROVED, REJECTED, SUPERSEDED] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/CoefficientProposal" } }
                      meta: { type: object, properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [ExpertActivity]
      summary: "Farm Owner gửi gợi ý hệ số của hệ thống cho chuyên gia (EXPERT-FR-011, SM-11) — FARM_OWNER"
      description: |
        Server tính gợi ý hiện tại của Zone (ANALYTICS-FR-010) và lưu cùng hệ số đang dùng; đề xuất
        `PROPOSED` cũ của Zone chuyển `SUPERSEDED`; báo Domain Expert trong ứng dụng. Không có gợi ý → 409
        kèm lý do. Farm chưa có chuyên gia → 409 (Farm Owner áp trực tiếp, `POST /farms/zones/{zoneId}/fuzzy-tuning/apply-suggestion`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [zoneId], properties: { zoneId: { type: string } } }
      responses:
        "201":
          description: Đã gửi đề xuất
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/CoefficientProposal" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Không có gợi ý, hoặc farm chưa có chuyên gia", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /expert-activity/proposals/{id}/approve:
    put:
      tags: [ExpertActivity]
      summary: "Chuyên gia duyệt đề xuất hệ số (EXPERT-FR-011, SM-11) — DOMAIN_EXPERT"
      description: |
        Áp `suggested_values` như ENV-FR-021 (lịch sử `source=SUGGESTION_APPROVED`, gửi xuống thiết bị);
        `PROPOSED` → `APPROVED`; báo Farm Owner, audit `PROPOSAL_APPROVED`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/CoefficientProposal" }
        "400": { description: "Giá trị không qua kiểm khoảng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Đề xuất đã đóng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /expert-activity/proposals/{id}/reject:
    put:
      tags: [ExpertActivity]
      summary: "Chuyên gia từ chối đề xuất hệ số (EXPERT-FR-011, SM-11) — DOMAIN_EXPERT"
      description: "PROPOSED → REJECTED; bắt buộc ghi chú (422); báo Farm Owner, audit PROPOSAL_REJECTED."
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [note], properties: { note: { type: string, maxLength: 1000 } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/CoefficientProposal" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Đề xuất đã đóng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── NOTIFICATIONS (EXPERT-FR-006/007) ─────────────────────────────────────
  /notifications:
    get:
      tags: [Notifications]
      summary: "Hộp thông báo trong ứng dụng của người gọi — mọi role đã đăng nhập"
      description: |
        Mới nhất trước, giữ 90 ngày. Nguồn: mọi thông báo nghiệp vụ (`notifyUser` — báo cáo sức
        khỏe mới, kết luận của chuyên gia, thiết bị bị gỡ…) và, cho Domain Expert, cảnh báo suy luận mới
        chờ kiểm chứng (`NOISE_ANOMALY`, `SENSOR_ANOMALY`, `FORECAST_BREACH`, `LOW_RETURN_RATE` —
        chỉ trong ứng dụng, không Telegram/push; ALERT-FR-005). Bản realtime: sự kiện Socket.io
        `NOTIFICATION_NEW` (payload là một `Notification`) tới room của chính người nhận.
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ["true", "false"] }, description: "`true` = chỉ thông báo chưa đọc" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                      meta:
                        type: object
                        properties:
                          page: { type: integer }
                          limit: { type: integer }
                          total: { type: integer }
                          unreadCount: { type: integer, description: "Số chưa đọc của người gọi (không phụ thuộc bộ lọc `unread`)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /notifications/read-all:
    put:
      tags: [Notifications]
      summary: "Đánh dấu mọi thông báo của người gọi là đã đọc"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: object, properties: { modified: { type: integer } } }

  /notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: "Đánh dấu 1 thông báo đã đọc (gọi lại giữ nguyên thời điểm đọc đầu tiên)"
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Notification" }
        "404": { description: "Không có, hoặc là thông báo của người khác" }
        "422": { $ref: "#/components/responses/ValidationError" }   # id không phải ObjectId

  /notifications/push-tokens:
    post:
      tags: [Notifications]
      summary: "Đăng ký FCM device token của máy đang đăng nhập (ALERT-FR-002) — mọi role đã đăng nhập"
      description: |
        App mobile gọi sau khi đăng nhập (SDD §5.4). Gọi lại với cùng token chỉ cập nhật `last_seen_at`.
        Token đang gắn với tài khoản khác (một máy đổi tài khoản) thì chuyển sang người gọi, để tài khoản
        cũ không nhận push trên máy này nữa. Phải là **FCM device token**: token Expo
        (`ExponentPushToken[...]`) bị từ chối 422. Token không bao giờ được trả lại hay ghi vào log.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushTokenInput" }
      responses:
        "200":
          description: Đã đăng ký
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { registered: { type: boolean, example: true } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }   # thiếu token, platform sai, token Expo
    delete:
      tags: [Notifications]
      summary: "Gỡ FCM device token khi đăng xuất (ALERT-FR-002)"
      description: |
        Chỉ gỡ token của chính người gọi. Token không có (đã gỡ, hoặc của người khác) vẫn trả 200 để app gọi
        lại an toàn lúc đăng xuất. Backend cũng tự xoá token mà FCM báo không còn hợp lệ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200":
          description: Đã gỡ (hoặc không có gì để gỡ)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { registered: { type: boolean, example: false } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Header: `Authorization: Bearer <accessToken>` — accessToken lấy từ /auth/login hoặc /auth/refresh"
    deviceBasicAuth:
      type: http
      scheme: basic
      description: "Nút AI: mã thiết bị và mật khẩu broker của chính nó"

  parameters:
    FarmId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string },
        description: Farm ObjectId,
      }
    HouseId:
      {
        name: houseId,
        in: path,
        required: true,
        schema: { type: string },
        description: House ObjectId,
      }
    ZoneId:
      {
        name: zoneId,
        in: path,
        required: true,
        schema: { type: string },
        description: Zone ObjectId,
      }
    ZoneIdPath:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string },
        description: Zone ObjectId,
      }
    NodeId:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string },
        description: SensorNode ObjectId,
      }
    TrackId:
      { name: trackId, in: path, required: true, schema: { type: string }, description: AudioTrack ObjectId }
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    Page: { name: page, in: query, schema: { type: integer, default: 1 } }
    Limit:
      {
        name: limit,
        in: query,
        description: "Số bản ghi mỗi trang — mặc định 20, tối đa 100 (giá trị lớn hơn được kẹp về 100). Giá trị không phải số nguyên ≥ 1: các endpoint /admin/* trả 422, các danh sách khác dùng mặc định",
        schema: { type: integer, minimum: 1, default: 20, maximum: 100 },
      }
    TelemetryLimit:
      {
        name: limit,
        in: query,
        description: "Riêng lịch sử telemetry — mặc định 100, tối đa 1000",
        schema: { type: integer, minimum: 1, default: 100, maximum: 1000 },
      }

  responses:
    NotFound:
      description: Không tìm thấy
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    Forbidden:
      description: Không có quyền
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    Unauthorized:
      description: Chưa xác thực / token không hợp lệ
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    Conflict:
      description: Trùng lặp dữ liệu
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    ValidationError:
      description: Dữ liệu gửi lên không hợp lệ
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    RateLimited:
      description: "RATE_LIMITED — vượt giới hạn request (SEC-NFR-004); `error.details.retryAfterSec` = số giây phải chờ"
      headers:
        Retry-After: { schema: { type: integer }, description: "Số giây phải chờ" }
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    PasswordChangeRequired:
      description: "PASSWORD_CHANGE_REQUIRED — tài khoản đang giữ mật khẩu tạm Admin cấp, phải gọi PUT /auth/password trước"
      content:
        {
          application/json:
            { schema: { $ref: "#/components/schemas/ApiError" } },
        }
    WorkOrderOk:
      description: Work Order sau khi đổi trạng thái
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ApiSuccess"
              - properties:
                  data: { $ref: "#/components/schemas/WorkOrder" }
    WorkOrderWrongState:
      description: "Work Order không ở trạng thái cho phép thao tác này (Report 3 §6.19)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: {}
        meta:
          type: object
          properties:
            {
              page: { type: integer },
              limit: { type: integer },
              total: { type: integer },
            }

    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string, example: "Không tìm thấy farm" }
            details: { description: "Tuỳ mã lỗi, VD `{ retryAfterSec }` của RATE_LIMITED" }

    Role:
      type: string
      enum: [ADMIN, FARM_OWNER, DOMAIN_EXPERT, FARM_TECHNICIAN]
      description: "FARM_TECHNICIAN (Report 3 4.0.0, AUTH-FR-004, 013) = thợ của chủ farm, thành viên farm, chỉ thao tác trên nhà được giao; thay role TECHNICIAN cũ (mọi farm, lệnh từ xa). AUTH-FR-004 (v2.0.0). DOMAIN_EXPERT = chuyên gia nuôi yến do Primary Owner mời, phạm vi cả farm: chỉ đọc dữ liệu vận hành, kiểm chứng cảnh báo suy luận, chỉnh ngưỡng/hệ số/tham số phát hiện; không relay hay ghi thu hoạch (SRS mục 4.4)"

    DeviceStatusSummary:
      type: object
      description: "Đếm SensorNode + CameraNode theo trạng thái (OPS-NFR-004, SYSTEM-FR-003)"
      properties:
        total: { type: integer }
        online: { type: integer }
        offline: { type: integer }
        pending: { type: integer }
        error: { type: integer }
        degraded: { type: integer }

    AuditLog:
      type: object
      description: "AUTH-FR-007 — collection audit_logs (SRS §8.2)"
      properties:
        _id: { type: string }
        actor_id:
          nullable: true
          description: "Populate { _id, full_name, email, role }; null nếu hệ thống tự thực hiện hoặc đăng nhập bằng email không tồn tại"
          type: object
          properties:
            _id: { type: string }
            full_name: { type: string }
            email: { type: string }
            role: { $ref: "#/components/schemas/Role" }
        action: { type: string, example: ACCOUNT_LOCKED }
        target_type: { type: string, example: user }
        target_id: { type: string, nullable: true }
        target_name: { type: string, nullable: true, description: "Chỉ GET /system/audit-logs — tên tài khoản khi target_type=user (để UI không hiện ObjectId); null với loại khác hoặc tài khoản không còn" }
        metadata: { type: object, description: "Chi tiết thay đổi, thường có before/after" }
        before: { nullable: true, description: "Report 4 §6.1 — giá trị trước thay đổi, chép từ `metadata.before` khi có" }
        after: { nullable: true, description: "Report 4 §6.1 — giá trị sau thay đổi, chép từ `metadata.after` khi có" }
        source_ip: { type: string, nullable: true, description: "IP client của request (trước G-14 tên là `ip_address`); null khi hệ thống tự thực hiện ngoài request (job nền, MQTT). Đặt TRUST_PROXY khi chạy sau proxy để có IP thật" }
        client: { type: string, nullable: true, description: "User-Agent của request (tối đa 200 ký tự)" }
        correlation_id: { type: string, nullable: true, description: "Mã request, cũng trả ở header `X-Request-Id` của response; client gửi `X-Request-Id` dạng `[A-Za-z0-9_-]{1,64}` thì dùng mã đó" }
        created_at: { type: string, format: date-time }

    User:
      type: object
      properties:
        _id: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        full_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        avatar_url: { type: string }
        status:
          {
            type: string,
            enum: [ACTIVE, LOCKED, DELETION_REQUESTED, DELETED],
            description: "Report 3 §6.14 (SM-14) — trạng thái tài khoản; đăng nhập được khi ACTIVE hoặc DELETION_REQUESTED",
          }
        locked_at: { type: string, format: date-time, nullable: true, description: "AUTH-FR-011 — thời điểm Admin khoá tài khoản" }
        locked_reason: { type: string, nullable: true, description: "AUTH-FR-011 — lý do bắt buộc khi khoá tài khoản" }
        is_active: { type: boolean, deprecated: true, description: "Tên cũ, suy ra từ `status` (ACTIVE hoặc DELETION_REQUESTED); đọc `status`" }
        must_change_password:
          {
            type: boolean,
            description: "AUTH-FR-005c — đang giữ mật khẩu tạm do Admin cấp; mọi API trả 403 PASSWORD_CHANGE_REQUIRED trừ PUT /auth/password và đăng xuất",
          }
        deactivated_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            deprecated: true,
            description: "Tên cũ của `locked_at`",
          }
        deactivated_reason:
          {
            type: string,
            nullable: true,
            deprecated: true,
            description: "Tên cũ của `locked_reason`",
          }
        telegram_linked: { type: boolean, description: "ALERT-FR-013 — tài khoản đã liên kết bot Telegram (chat id không trả ra API)" }
        notification_preferences:
          type: object
          properties:
            push: { type: boolean }
            telegram: { type: boolean }
            by_severity:
              type: object
              description: "ALERT-FR-005 — kênh riêng cho cảnh báo theo mức; mức không có thì dùng `push`/`telegram` chung"
              properties:
                CRITICAL: { $ref: "#/components/schemas/ChannelChoice" }
                HIGH: { $ref: "#/components/schemas/ChannelChoice" }
                MEDIUM: { $ref: "#/components/schemas/ChannelChoice" }
                LOW: { $ref: "#/components/schemas/ChannelChoice" }
            quiet_hours:
              {
                type: object,
                properties: { start: { type: string }, end: { type: string } },
              }
        deletion_requested_at:
          {
            type: string,
            format: date-time,
            nullable: true,
            description: "AUTH-FR-012 — đã yêu cầu xoá tài khoản, chờ Administrator xử lý",
          }
        deletion_reminder_sent_at:
          { type: string, format: date-time, nullable: true, description: "Đã nhắc Admin yêu cầu xoá sắp quá hạn 30 ngày (nhắc 1 lần)" }
        deleted_at:
          { type: string, format: date-time, nullable: true, description: "Đã xoá/ẩn danh hoá theo yêu cầu — không khoá/mở khoá lại được" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Coordinates:
      type: object
      description: "Tọa độ GPS của farm (FARM-FR-001, A-5) — một farm là một địa điểm"
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90, example: 10.7769 }
        lng: { type: number, minimum: -180, maximum: 180, example: 106.7009 }

    Farm:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        address: { type: string }
        coordinates:
          allOf: [{ $ref: "#/components/schemas/Coordinates" }]
          description: "Bắt buộc khi tạo từ nay (A-5); farm tạo trước đó có thể chưa có — khi đó không có thời tiết"
        owner_id: { type: string, description: Primary Owner }
        owner:
          type: object
          description: "Chỉ có ở GET /farms/:id — tên/email Primary Owner (tra thêm từ users, không đổi owner_id)"
          properties: { full_name: { type: string }, email: { type: string, format: email } }
        has_active_expert:
          type: boolean
          description: "Chỉ có ở GET /farms — farm có ít nhất một Domain Expert còn hoạt động (chuyên gia bị khoá không tính). true thì thay đổi của Farm Owner mở mục duyệt, luật thời tiết, hồ sơ, luật khuyến nghị chờ chuyên gia duyệt; false thì Farm Owner làm thay các quyết định của chuyên gia (BR-22)"
        members:
          type: array
          description: "GET /farms/:id với DOMAIN_EXPERT chỉ trả bản ghi của chính người đó (không lộ email thành viên khác)"
          items:
            type: object
            properties:
              user_id: { type: string }
              is_primary: { type: boolean }
              role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT, FARM_TECHNICIAN], description: "FARM_OWNER = đồng sở hữu; DOMAIN_EXPERT = chuyên gia nuôi yến, cả farm (v2.0.0); FARM_TECHNICIAN = thợ, chỉ các nhà được giao (AUTH-FR-013)" }
              joined_at: { type: string, format: date-time }
              full_name: { type: string, description: "Chỉ có ở GET /farms/:id" }
              email: { type: string, format: email, description: "Chỉ có ở GET /farms/:id" }
        is_deleted: { type: boolean }
        created_at: { type: string, format: date-time }

    Invitation:
      type: object
      description: AUTH-FR-010, Flow 12 — lời mời thành viên farm, hết hạn sau 7 ngày nếu không phản hồi
      properties:
        _id: { type: string }
        farm_id: { type: string }
        invited_email: { type: string, format: email }
        invited_role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT, FARM_TECHNICIAN] }
        invited_by: { type: string }
        token: { type: string }
        status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED] }
        expires_at: { type: string, format: date-time }
        responded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    House:
      type: object
      properties:
        _id: { type: string }
        farm_id: { type: string }
        name: { type: string }
        floors: { type: integer }
        description: { type: string }
        bird_count_tuning: { $ref: "#/components/schemas/BirdCountTuning" }
        health_levels: { $ref: "#/components/schemas/HealthLevels" }
        stage: { type: string, enum: [ATTRACTING, OCCUPIED], default: OCCUPIED, description: "FARM-FR-014, BR-46 — giai đoạn nhà" }
        stage_history:
          type: array
          items:
            type: object
            properties:
              stage: { type: string, enum: [ATTRACTING, OCCUPIED] }
              changed_by: { type: string }
              changed_by_role: { type: string }
              changed_at: { type: string, format: date-time }
        technicians:
          type: array
          description: "AUTH-FR-013 — Farm Technician được giao nhà này; tối đa 1 thợ chính"
          items:
            type: object
            properties:
              user_id: { type: string }
              primary: { type: boolean }
        roster:
          type: array
          description: "AUTH-FR-014 — lịch trực theo tuần của nhà (GET/PUT /farms/houses/{houseId}/roster). Mọi response trả House (GET /farms/{id}/houses, PUT …/stage, PUT …/bird-count-tuning): Farm Owner nhận cả lịch, Farm Technician chỉ ca của mình, Domain Expert và Administrator không có trường này."
          items: { $ref: "#/components/schemas/RosterShift" }
        created_at: { type: string, format: date-time }

    RosterShift:
      type: object
      description: "AUTH-FR-014 — một ca trực của nhà"
      required: [technician_id, role, weekdays, start, end]
      properties:
        technician_id: { type: string }
        role: { type: string, enum: [PRIMARY, BACKUP] }
        weekdays: { type: array, minItems: 1, maxItems: 7, items: { type: integer, minimum: 0, maximum: 6 }, description: "0 = Chủ nhật … 6 = thứ Bảy" }
        start: { type: string, example: "06:00", description: "HH:mm giờ VN" }
        end: { type: string, example: "18:00", description: "HH:mm giờ VN; end trước start là ca qua nửa đêm, tính cho ngày bắt đầu" }

    HouseOverview:
      type: object
      description: "Một nhà trong tổng quan trại (ANALYTICS-FR-015)"
      properties:
        house_id: { type: string }
        name: { type: string }
        stage: { type: string, enum: [ATTRACTING, OCCUPIED] }
        status: { type: string, enum: [GOOD, WATCH, ACTION], nullable: true }
        status_reason: { type: string, enum: [NOT_COMPUTED, INSUFFICIENT_DATA], nullable: true }
        open_alerts: { type: integer }
        open_work_orders: { type: integer }
        latest_return_rate:
          type: object
          nullable: true
          properties: { date: { type: string, example: "2026-11-13" }, value: { type: number } }
        simulated: { type: boolean, description: "Mọi thiết bị của nhà là thiết bị giả lập (SYSTEM-FR-004)" }
    HouseComparisonRow:
      type: object
      description: "Một hàng của bảng so sánh nhà (BR-44); không có điểm tổng hay xếp hạng"
      properties:
        house_id: { type: string }
        name: { type: string }
        time_in_range_pct: { type: number, nullable: true }
        good_days_pct: { type: number, nullable: true }
        return_rate_avg: { type: number, nullable: true }
        flock_trend_pct: { type: number, nullable: true }
        alerts_raised: { type: integer }
        alerts_open: { type: integer }
        mttr_min: { type: number, nullable: true }
        energy_kwh: { type: number, nullable: true, description: "Ước tính (BR-45); null = not available" }
        energy: { type: object, properties: { misting_kwh: { type: number, nullable: true }, ventilation_kwh: { type: number, nullable: true } } }
        last_cycle_yield_g: { type: number, nullable: true, description: "BR-44 — sản lượng (g) chu kỳ đã đóng gần nhất: tổng của chu kỳ CLOSED hoặc CONCLUDED mới nhất ở mỗi tầng của nhà (chu kỳ là của tầng, BR-43); null khi nhà chưa có chu kỳ đóng" }
        site_causes: { type: object, additionalProperties: { type: integer, minimum: 1 }, description: "ALERT-FR-018, BR-44 — số lần mỗi nguyên nhân tìm thấy tại chỗ (WATER, NOZZLE, PUMP, FAN, DOOR, SENSOR, SPEAKER, OTHER) trong kỳ, mỗi cảnh báo một lần, nguyên nhân của Work Order thắng nguyên nhân lúc xác nhận; chỉ có các nguyên nhân đã gặp; không dùng để sắp xếp" }
        simulated: { type: boolean, description: "Mọi thiết bị của nhà là thiết bị giả lập (SYSTEM-FR-004), cùng cách tính với tổng quan" }
    EnergyMonth:
      type: object
      properties:
        month: { type: string, example: "2026-10", description: "Tháng giờ VN" }
        misting_kwh: { type: number, nullable: true, description: "null = not available (không có dòng đo)" }
        ventilation_kwh: { type: number, nullable: true }
    FlockPeriod:
      type: object
      properties:
        period: { type: string, description: "Tuần: thứ Hai đầu tuần (YYYY-MM-DD); tháng: YYYY-MM" }
        days: { type: integer, description: "Số ngày đủ 2 phiên trong kỳ" }
        mean_morning_exit: { type: number }
        change_pct: { type: number, nullable: true, description: "% đổi so với kỳ liền trước; null khi kỳ trước không có số" }
    WeatherRule:
      type: object
      description: "ENV-FR-030, BR-38 — dự báo 2 giờ tới ≥ min thì cộng offset_pct vào nhu cầu phun, trong duration_min phút"
      required: [metric, min, offset_pct, duration_min]
      properties:
        _id: { type: string, description: "rule_id gửi kèm offset; gửi lại để giữ id" }
        metric: { type: string, enum: [temperature, humidity, rain], description: "temperature: °C cao nhất (0…50); humidity: % ngoài trời cao nhất (0…100); rain: tổng mm (0.1…50)" }
        min: { type: number, example: 33 }
        offset_pct: { type: number, minimum: -10, maximum: 10, example: 5, description: "Điểm % của nhu cầu phun, khác 0" }
        duration_min: { type: integer, minimum: 1, maximum: 120, example: 120 }
        active: { type: boolean, default: true }
    WeatherRulesProposal:
      type: object
      nullable: true
      description: "BR-22, BR-38 — bộ luật Farm Owner gửi trên farm có chuyên gia, chỉ chạy khi chuyên gia duyệt; null khi không có"
      properties:
        rules: { type: array, items: { $ref: "#/components/schemas/WeatherRule" } }
        proposed_by: { type: string }
        proposed_at: { type: string, format: date-time }
    DefaultThresholdsView:
      description: "Ngưỡng mặc định hệ thống kèm nguồn và lịch sử đổi (ENV-FR-007, SYSTEM-FR-002)"
      allOf:
        - $ref: "#/components/schemas/Thresholds"
        - type: object
          properties:
            source: { type: string, nullable: true, description: "Nguồn của lần đổi gần nhất (mã REF-5)" }
            updated_at: { type: string, format: date-time, nullable: true }
            updated_by: { type: string, nullable: true }
            history:
              type: array
              items:
                type: object
                properties:
                  at: { type: string, format: date-time }
                  by: { type: string, nullable: true }
                  source: { type: string, nullable: true, description: "Rỗng với lần đổi trước G-18" }
                  before: { $ref: "#/components/schemas/Thresholds" }
                  after: { $ref: "#/components/schemas/Thresholds" }
    Thresholds:
      type: object
      properties:
        temp_min: { type: number, example: 26 }
        temp_max: { type: number, example: 31 }
        humidity_min: { type: number, example: 75 }
        humidity_max: { type: number, example: 95 }
        light_max: { type: number, example: 0.2 }
        nh3_max: { type: number, example: 25 }
        co2_max: { type: number, example: 1500 }

    ConfigProfileInput:
      type: object
      description: "EXPERT-FR-014 — nội dung hồ sơ; nhóm có mặt phải đủ khoá"
      required: [name]
      properties:
        name: { type: string, maxLength: 50 }
        stage: { type: string, enum: [ATTRACTING, OCCUPIED], nullable: true }
        thresholds: { $ref: "#/components/schemas/Thresholds" }
        fuzzy_tuning: { $ref: "#/components/schemas/FuzzyTuning" }
        detection_tuning: { $ref: "#/components/schemas/DetectionTuning" }
        speaker_schedule:
          type: object
          properties:
            enabled: { type: boolean }
            windows:
              type: array
              minItems: 1
              maxItems: 2
              items:
                type: object
                properties:
                  start: { type: string, example: "05:00", description: "Giờ tròn HH:00" }
                  end: { type: string, example: "07:00", description: "Giờ tròn HH:00, tối đa 24:00, sau start" }

    ConfigProfile:
      allOf:
        - $ref: "#/components/schemas/ConfigProfileInput"
        - type: object
          properties:
            _id: { type: string }
            farm_id: { type: string }
            author_id: { type: string }
            status: { type: string, enum: [DRAFT, APPROVED, ARCHIVED] }
            approved_by: { type: string }
            approved_at: { type: string, format: date-time }
            archived_at: { type: string, format: date-time }
            applications:
              type: array
              items:
                type: object
                properties:
                  house_ids: { type: array, items: { type: string } }
                  zone_count: { type: integer }
                  applied_by: { type: string }
                  applied_at: { type: string, format: date-time }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    RecommendationRuleInput:
      type: object
      description: "EXPERT-FR-016 — luật khuyến nghị"
      required: [name, indicator, comparison, value, window_days, action, source]
      properties:
        name: { type: string, maxLength: 50 }
        indicator:
          type: string
          enum: [TIME_IN_RANGE, AIR_HOURS_OVER, RETURN_RATE, NOISE_EPISODES, MISTING_INEFFECTIVE]
          description: "Chỉ số theo ngày: % trong ngưỡng (0–100), giờ NH3 hoặc CO2 vượt ngưỡng (0–24), tỷ lệ chim về % (0–200), số đợt ồn bất thường, số cảnh báo phun không hiệu quả"
        comparison: { type: string, enum: [GTE, LTE] }
        value: { type: number }
        window_days: { type: integer, minimum: 1, maximum: 30 }
        action:
          type: object
          description: "`WORK_ORDER` cần `title`; `PARAMETER_CHANGE` cần `group` (thresholds, fuzzy), `key` có thật và `value` trong khoảng của khoá đó"
          required: [type]
          properties:
            type: { type: string, enum: [WORK_ORDER, PARAMETER_CHANGE] }
            title: { type: string }
            group: { type: string, enum: [thresholds, fuzzy] }
            key: { type: string, example: humidity_min }
            value: { type: number }
        source: { type: string, maxLength: 500, description: "Luật lấy từ đâu (phỏng vấn, tài liệu)" }
        active: { type: boolean, description: "POST bỏ trống → true; PUT bỏ trống → giữ trạng thái hiện tại" }

    RecommendationRule:
      allOf:
        - $ref: "#/components/schemas/RecommendationRuleInput"
        - type: object
          properties:
            _id: { type: string }
            farm_id: { type: string }
            author_id: { type: string }
            pending_approval: { type: boolean, description: "BR-22 — luật Farm Owner viết trên farm có chuyên gia: tắt, chờ chuyên gia bật" }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }

    Recommendation:
      type: object
      description: "EXPERT-FR-017…019, Report 3 §6.21"
      properties:
        _id: { type: string }
        farm_id: { type: string }
        house_id: { type: string }
        rule_id: { description: "id luật; ở danh sách là object có name và action" }
        rule_snapshot:
          type: object
          description: "Luật lúc khuyến nghị mở (tên, điều kiện, hành động); chấp nhận và đo hiệu quả dùng bản này. Không có ở khuyến nghị mở trước 17/11/2026"
          properties:
            name: { type: string }
            indicator: { type: string }
            comparison: { type: string }
            value: { type: number }
            window_days: { type: integer }
            action: { type: object }
        expired_at: { type: string, format: date-time, description: "Lúc chuyển EXPIRED" }
        status: { type: string, enum: [OPEN, ACCEPTED, REJECTED, EXPIRED, MEASURED] }
        evidence:
          type: object
          properties:
            indicator: { type: string }
            comparison: { type: string }
            value: { type: number }
            window_days: { type: integer }
            days:
              type: array
              items: { type: object, properties: { date: { type: string, example: "2026-11-16" }, value: { type: number, nullable: true } } }
        raised_at: { type: string, format: date-time }
        raised_for: { type: string, example: "2026-11-16", description: "Ngày (giờ VN) luật thoả" }
        decided_by: { type: string }
        decided_at: { type: string, format: date-time }
        reject_reason: { type: string }
        work_order_id: { type: string }
        review_ids: { type: array, items: { type: string } }
        effect:
          type: object
          description: "Trung bình 7 ngày sau trừ 7 ngày trước ngày chấp nhận; null khi thiếu số"
          properties:
            before: { type: number, nullable: true }
            after: { type: number, nullable: true }
            change: { type: number, nullable: true }
            improved: { type: boolean, nullable: true }
            measured_at: { type: string, format: date-time }

    FuzzyTuning:
      type: object
      description: "ENV-FR-021 — hệ số bộ điều khiển mờ trên ESP32; tên field = key MQTT config"
      properties:
        fuzzy_humidity_band: { type: number, minimum: 2, maximum: 20, example: 8, description: "%RH — độ rộng vùng chuyển tiếp độ ẩm" }
        fuzzy_temp_band: { type: number, minimum: 1, maximum: 10, example: 4, description: "°C — độ rộng vùng nóng" }
        fuzzy_fan_dry_level: { type: number, minimum: 0, maximum: 100, example: 40, description: "% — mức quạt khi nóng mà khô" }
        fuzzy_window_sec: { type: integer, minimum: 60, maximum: 600, example: 120, description: "giây — cửa sổ time-proportioning" }
        fuzzy_input_filter: { type: boolean, example: true, description: "ENV-FR-022 — lọc median+Kalman đầu vào bộ mờ (tắt để so sánh A/B)" }

    DetectionTuning:
      type: object
      description: "EXPERT-FR-008 — tham số phát hiện theo Zone, gửi xuống ESP32. Khoảng hợp lệ là giới hạn kỹ thuật, không phải khuyến nghị nuôi yến. Tên field = key MQTT config"
      properties:
        noise_margin_db: { type: number, minimum: 5, maximum: 30, example: 15, description: "dB — ồn cao hơn mức nền của giờ đó bao nhiêu thì tính (NOISE_ANOMALY)" }
        noise_min_sec: { type: integer, minimum: 5, maximum: 15, example: 10, description: "giây ồn trong cửa sổ 15 giây (NOISE_ANOMALY)" }
        pump_dry_on_sec: { type: integer, minimum: 120, maximum: 900, example: 300, description: "giây bơm BẬT cộng dồn trước khi xét (MISTING_INEFFECTIVE)" }
        pump_dry_min_rise_pct: { type: number, minimum: 0.5, maximum: 10, example: 2, description: "%RH — độ ẩm phải tăng tối thiểu (MISTING_INEFFECTIVE)" }
        speaker_drop_pct: { type: integer, minimum: 30, maximum: 90, example: 70, description: "% — mức âm giảm so với nền (SPEAKER_FAILURE)" }

    BirdCountTuning:
      type: object
      description: "EXPERT-FR-008 (SRS v2.1.8) — tham số đếm chim theo nhà yến (camera ở cửa ra vào của cả nhà); backend dùng, không gửi thiết bị"
      properties:
        return_rate_drop_pct: { type: number, minimum: 5, maximum: 50, example: 20, description: "% — tỷ lệ chim về giảm so với trung bình kỳ trước thì sinh LOW_RETURN_RATE" }

    MetricForecast:
      type: object
      nullable: true
      properties:
        history: { type: array, items: { type: object, properties: { timestamp: { type: string, format: date-time }, value: { type: number } } } }
        forecast: { type: array, items: { type: object, properties: { timestamp: { type: string, format: date-time }, value: { type: number } } } }
        alpha: { type: number }
        beta: { type: number }
        mae30: { type: number, nullable: true }
        mae60: { type: number, nullable: true }

    Zone:
      type: object
      properties:
        _id: { type: string }
        house_id: { type: string }
        farm_id: { type: string, readOnly: true, description: "Farm của House chứa Zone — server tự điền, không đổi được (SRS v1.23.0)" }
        name: { type: string }
        floor: { type: integer }
        config_version: { type: integer, readOnly: true, description: "ENV-FR-027 — tăng ở mỗi lần đổi ngưỡng, hệ số mờ hoặc tham số phát hiện (giây Unix, luôn lớn hơn bản trước); đi kèm `config` gửi xuống controller" }
        thresholds: { $ref: "#/components/schemas/Thresholds" }
        threshold_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_at: { type: string, format: date-time }
              old_values: { type: object }
              new_values: { type: object }
        fuzzy_tuning: { $ref: "#/components/schemas/FuzzyTuning" }
        fuzzy_tuning_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_by_role: { $ref: "#/components/schemas/Role" }
              changed_at: { type: string, format: date-time }
              old_values: { type: object }
              new_values: { type: object }
              source: { type: string, enum: [MANUAL, EXPERT_REVERT, SUGGESTION_APPROVED] }
        detection_tuning: { $ref: "#/components/schemas/DetectionTuning" }
        detection_tuning_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_by_role: { $ref: "#/components/schemas/Role" }
              changed_at: { type: string, format: date-time }
              old_values: { type: object }
              new_values: { type: object }
        created_at: { type: string, format: date-time }

    RelayUsage:
      type: object
      properties:
        on_hours: { type: number }
        switches: { type: integer }
        since_service_hours: { type: number }
        since_service_switches: { type: integer }

    BirdCountBucket:
      type: object
      description: "VISION-FR-017 — số chim qua vạch đếm trong 1 khoảng 5 phút, cộng các camera của Zone"
      properties:
        bucket_start: { type: string, format: date-time }
        entry_count: { type: integer }
        exit_count: { type: integer }

    BirdCountDay:
      type: object
      description: |
        VISION-FR-008/009 — số đếm 1 ngày (giờ Việt Nam) của **cả nhà yến** (SRS v2.1.8: chim ra vào ở cửa của
        nhà, không chia theo Zone). Nhà có 2 cửa thì cộng số mọi camera rồi mới tính tỷ lệ (chim có thể ra cửa
        này về cửa kia). Sáng chỉ tính chim ra, chiều chỉ tính chim về (BR-12); chiều ngược vẫn lưu để đối chiếu. Cùng nguồn cho /current, /daily, /trends, /correlation, socket BIRD_COUNT_UPDATE, cảnh báo
        LOW_RETURN_RATE, báo cáo sức khỏe Zone và ảnh chụp đàn khi thu hoạch (Zone lấy số của nhà chứa nó).
      properties:
        date: { type: string, example: "2026-10-20", description: "YYYY-MM-DD giờ Việt Nam" }
        morning_entry: { type: integer, description: Số thô phiên sáng }
        morning_exit: { type: integer, description: Số thô phiên sáng }
        evening_entry: { type: integer, description: Số thô phiên chiều }
        evening_exit: { type: integer, description: Số thô phiên chiều }
        net_exit: { type: integer, description: "Số chim ra của phiên sáng (= morning_exit, không trừ chiều vào); tên giữ cho app cũ" }
        net_entry: { type: integer, description: "Số chim về của phiên chiều (= evening_entry, không trừ chiều ra); tên giữ cho app cũ" }
        return_rate:
          type: number
          nullable: true
          description: "net_entry / net_exit × 100, có thể > 100; null khi thiếu phiên sáng hoặc chiều, hoặc sáng không có chim ra"
        has_morning: { type: boolean }
        has_evening: { type: boolean }
        incomplete:
          type: boolean
          description: "VISION-FR-020 — một phiên của ngày không đầy đủ (nút AI của nhà mất kết nối, `EDGE_AI_DEGRADED` mở trong khung): tỷ lệ vẫn trả nhưng ngày không được kiểm `LOW_RETURN_RATE` và không vào nền của ngày sau"

    TimeWindow:
      type: object
      required: [start, end]
      description: "Khung giờ VN, nửa mở [start, end); start trước end"
      properties:
        start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "05:30" }
        end: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "07:00" }

    CountingSchedule:
      type: object
      description: |
        VISION-FR-019 — lịch đếm của nhà. Khung tạm thắng hồ sơ theo mùa; ngày không thuộc hồ sơ nào dùng khung mặc
        định của nhà (`default_windows`), không đặt thì khung hệ thống (BR-13: sáng 05:30–07:00, chiều 17:30–19:00).
        Mỗi khung sáng phải kết thúc trước khi khung chiều bắt đầu.
      properties:
        default_windows:
          type: object
          nullable: true
          description: "Khung mặc định riêng của nhà, thay khung hệ thống; bỏ trống hoặc null = dùng lại khung hệ thống"
          properties:
            morning: { $ref: "#/components/schemas/TimeWindow" }
            evening: { $ref: "#/components/schemas/TimeWindow" }
        profiles:
          type: array
          maxItems: 12
          items:
            type: object
            required: [name, from, to, morning, evening]
            properties:
              name: { type: string, maxLength: 50 }
              from: { type: string, example: "09-01", description: "MM-DD, tính cả hai đầu; from sau to là khoảng vắt qua năm mới" }
              to: { type: string, example: "01-14" }
              morning: { $ref: "#/components/schemas/TimeWindow" }
              evening: { $ref: "#/components/schemas/TimeWindow" }
        temporary:
          type: array
          maxItems: 60
          items:
            type: object
            required: [from, to, morning, evening]
            properties:
              from: { type: string, format: date, example: "2026-11-20" }
              to: { type: string, format: date }
              morning: { $ref: "#/components/schemas/TimeWindow" }
              evening: { $ref: "#/components/schemas/TimeWindow" }

    CountingScheduleView:
      type: object
      properties:
        house_id: { type: string }
        schedule: { $ref: "#/components/schemas/CountingSchedule" }
        effective_from: { type: string, format: date, nullable: true, description: "Lần sửa gần nhất áp từ ngày này (ngày hôm sau lần sửa); null khi chưa đặt lịch" }
        default_windows:
          type: object
          description: "Khung áp cho ngày không thuộc hồ sơ hay khung tạm: khung riêng của nhà nếu đã đặt, không thì khung hệ thống"
          properties:
            morning: { $ref: "#/components/schemas/TimeWindow" }
            evening: { $ref: "#/components/schemas/TimeWindow" }
        system_default_windows:
          type: object
          description: "Khung hệ thống (BR-13), để quay về khi bỏ khung riêng của nhà"
          properties:
            morning: { $ref: "#/components/schemas/TimeWindow" }
            evening: { $ref: "#/components/schemas/TimeWindow" }
        today:
          type: object
          description: "Khung đang áp hôm nay (giờ VN)"
          properties:
            date: { type: string, format: date }
            morning: { $ref: "#/components/schemas/TimeWindow" }
            evening: { $ref: "#/components/schemas/TimeWindow" }
            source: { type: string, enum: [TEMPORARY, PROFILE, DEFAULT] }
        tomorrow:
          type: object
          description: "Khung sẽ áp ngày mai (giờ VN): lịch sửa hôm nay áp từ ngày mai"
          properties:
            date: { type: string, format: date }
            morning: { $ref: "#/components/schemas/TimeWindow" }
            evening: { $ref: "#/components/schemas/TimeWindow" }
            source: { type: string, enum: [TEMPORARY, PROFILE, DEFAULT] }
        history:
          type: array
          items:
            type: object
            properties:
              effective_from: { type: string, format: date }
              changed_by: { type: string }
              changed_by_role: { type: string }
              changed_at: { type: string, format: date-time }
              schedule: { $ref: "#/components/schemas/CountingSchedule" }

    PushTokenInput:
      type: object
      description: "ALERT-FR-002 — FCM device token của 1 máy (`expo-notifications` getDevicePushTokenAsync)"
      required: [token, platform]
      properties:
        token: { type: string, description: "FCM device token; không nhận token Expo" }
        platform: { type: string, enum: [android, ios] }

    Notification:
      type: object
      description: "EXPERT-FR-006/007 — 1 thông báo trong ứng dụng"
      properties:
        _id: { type: string }
        title: { type: string }
        body: { type: string }
        ref:
          type: object
          nullable: true
          description: "Đối tượng để client mở tới"
          properties:
            kind: { type: string, enum: [alert, health_report, health_day, expert_decision, parameter_review, coefficient_proposal, work_order, device_action, weather_rules, config_profile, recommendation_rule, harvest_cycle], description: "`weather_rules` (`id` là nhà), `config_profile`, `recommendation_rule`: việc Farm Owner gửi chuyên gia duyệt (BR-22); `alert`, `health_report`, `harvest_cycle` cũng dùng cho lời nhắc của Farm Owner (`POST /expert-activity/reminders`); `device_action`: Administrator hoặc Farm Technician vừa thao tác trên thiết bị của farm, `id` là thiết bị; `health_day`: ngày đánh giá mới của nhà yến, mở `GET /health-reports/days/{dayId}` để xem trạng thái và chấm; `expert_decision`: `id` là mục trong lịch sử hoạt động (EXPERT-FR-009); `parameter_review`, `coefficient_proposal`: mục duyệt / đề xuất mới cho chuyên gia (EXPERT-FR-007); `work_order`: Work Order được giao, cần duyệt, bị mở lại (OPS-FR-001…004); `alert` cũng dùng cho yêu cầu kiểm tra tại chỗ (EXPERT-FR-021)" }
            id: { type: string }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    HealthLevels:
      type: object
      description: "ANALYTICS-FR-012, BR-28 — mức chỉ số sức khỏe của nhà yến; mặc định là hằng số kỹ thuật (Report 3 §4.5) cho Domain Expert đặt lại sau khi người nuôi xác nhận"
      properties:
        in_range_slight_pct: { type: number, minimum: 50, maximum: 100, example: 90, description: "% thời gian nhiệt độ, độ ẩm trong ngưỡng — dưới mức này là SLIGHT" }
        in_range_clear_pct: { type: number, minimum: 50, maximum: 100, example: 75, description: "dưới mức này là CLEAR; không lớn hơn in_range_slight_pct" }
        air_slight_h: { type: number, minimum: 0.5, maximum: 12, example: 1, description: "giờ NH3 hoặc CO2 vượt ngưỡng của Zone — từ mức này là SLIGHT" }
        air_clear_h: { type: number, minimum: 0.5, maximum: 12, example: 4, description: "từ mức này là CLEAR; không nhỏ hơn air_slight_h" }
        noise_slight: { type: integer, minimum: 1, maximum: 10, example: 1, description: "số đợt NOISE_ANOMALY (không tính đợt bị bác bỏ) — từ mức này là SLIGHT" }
        noise_clear: { type: integer, minimum: 1, maximum: 10, example: 3, description: "từ mức này là CLEAR; không nhỏ hơn noise_slight" }

    HouseHealthLevels:
      type: object
      properties:
        house_id: { type: string }
        health_levels: { $ref: "#/components/schemas/HealthLevels" }
        defaults: { $ref: "#/components/schemas/HealthLevels" }
        can_edit: { type: boolean, description: "Người gọi sửa được mức không: Domain Expert và Farm Owner luôn true (BR-22, Report 3 4.2.15; farm có chuyên gia thì thay đổi của Farm Owner mở mục duyệt) — đúng điều kiện của PUT" }

    HealthReason:
      type: object
      description: |
        ANALYTICS-FR-012 — 1 lý do của trạng thái ngày, dạng mã + số liệu để web, mobile tự dịch (VI/EN).
        Ảnh chụp lúc chấm lưu cùng dạng. `values` theo mã:
        - `ALL_NORMAL`: {} — mọi chỉ số đã đánh giá đều bình thường (ngày GOOD)
        - `MISSING_DATA` (environment): `{ no_zones: true }` hoặc `{ min_pct, zones: [{ zone_name, valid_pct }] }`
        - `MISSING_DATA` (flock): `{ missing: MORNING | EVENING | NO_DEPARTURES | INCOMPLETE | NO_CAMERA }` (INCOMPLETE: nút AI mất kết nối trong khung phiên, VISION-FR-020; NO_CAMERA: ngày không có số đếm và nhà không có camera nào trong ngày đó)
        - `NOT_ASSESSED` (air, noise): {} — thiếu mẫu, nguồn không đánh giá
        - `ENV_IN_RANGE`: `{ zone_name, in_range_pct }`
        - `AIR_OVER_LIMIT`: `{ zone_name, hours }`
        - `FLOCK_DROP`: `{ return_rate, drop_pct, baseline_avg, baseline_days }`
        - `FLOCK_NO_BASELINE`: `{ min_days, baseline_days }`
        - `NOISE_EPISODES`: `{ episodes }`
        - `WEATHER_UNAVAILABLE`: {}
        - `RAIN_DOWNGRADE`: `{ mm_per_hour }` — ACTION hạ xuống WATCH (BR-30)
        - `ATTRACTING_STAGE`: {} — nhà giai đoạn dẫn dụ, không đánh giá đàn chim (BR-46)
      required: [code, source, level, values]
      properties:
        code:
          type: string
          enum: [ALL_NORMAL, MISSING_DATA, NOT_ASSESSED, ENV_IN_RANGE, AIR_OVER_LIMIT, FLOCK_DROP, FLOCK_NO_BASELINE, NOISE_EPISODES, WEATHER_UNAVAILABLE, RAIN_DOWNGRADE, ATTRACTING_STAGE]
        source: { type: string, enum: [environment, air, flock, noise], nullable: true }
        level: { type: string, enum: [SLIGHT, CLEAR], nullable: true, description: "Mức của nguồn khi lý do là một chỉ số lệch" }
        values: { type: object, additionalProperties: true }

    HealthIndicator:
      type: object
      properties:
        value: { type: number, nullable: true, description: "environment: % thời gian trong ngưỡng của Zone thấp nhất; air: giờ vượt ngưỡng của Zone cao nhất; flock: % tỷ lệ chim về giảm so với trung bình ≥ 3 ngày đủ phiên trước đó (null khi chưa đủ ngày nền); noise: số đợt" }
        level: { type: string, enum: [NORMAL, SLIGHT, CLEAR], nullable: true, description: "null khi nguồn không đủ dữ liệu (không đánh giá)" }
        details: { type: object, additionalProperties: true, description: "environment: từng Zone (in_range_pct, valid_pct); flock: return_rate, baseline_days" }

    HouseHealthDay:
      type: object
      description: |
        ANALYTICS-FR-012, SM-17 — trạng thái sức khỏe 1 ngày (giờ VN) của 1 nhà yến. Thứ tự BR-29:
        INSUFFICIENT_DATA khi môi trường hoặc đàn chim không đủ dữ liệu; ACTION khi đàn chim CLEAR và
        có nguồn khác SLIGHT/CLEAR; WATCH khi có chỉ số CLEAR hoặc ≥ 2 chỉ số SLIGHT; còn lại GOOD. BR-30:
        ACTION do đúng đàn chim + tiếng ồn hạ xuống WATCH khi mưa ≥ 1 mm/giờ trùng phiên đếm và trùng
        đợt ồn. Mọi trường có cả khi `my_rating_state = PENDING` (BR-31, Report 3 4.2.14).
        Người gọi không phải người chấm (Domain Expert) có `my_rating_state = null` và thấy đủ các trường.
      properties:
        _id: { type: string }
        house_id: { type: string }
        house_name: { type: string }
        farm_id: { type: string }
        date: { type: string, format: date, description: "'YYYY-MM-DD' giờ VN" }
        weather:
          type: object
          nullable: true
          description: "ANALYTICS-FR-013 — chỉ hiển thị; null khi không có dữ liệu thời tiết (farm không có toạ độ hoặc lấy lỗi)"
          properties:
            temperature_min: { type: number, nullable: true }
            temperature_max: { type: number, nullable: true }
            humidity_avg: { type: number, nullable: true }
            precipitation_mm: { type: number, nullable: true, description: "Tổng lượng mưa của ngày" }
            hours: { type: integer, description: "Số giờ có dữ liệu" }
        computed_at: { type: string, format: date-time, description: "Lần tính gần nhất của trạng thái hiện tại" }
        my_rating_state: { type: string, enum: [PENDING, RATED, SKIPPED, EXPIRED], nullable: true, description: "SM-18 của người gọi — suy ra từ ratings và ngày; null khi người gọi không phải người chấm (BR-31)" }
        rating_deadline: { type: string, format: date-time, description: "Hết hạn chấm: đầu ngày thứ 8 sau ngày đó (giờ VN)" }
        indicators:
          type: object
          description: "Có cả khi PENDING"
          properties:
            environment: { $ref: "#/components/schemas/HealthIndicator" }
            air: { $ref: "#/components/schemas/HealthIndicator" }
            flock: { $ref: "#/components/schemas/HealthIndicator" }
            noise: { $ref: "#/components/schemas/HealthIndicator" }
        completeness:
          type: object
          description: "BR-28 — mỗi nguồn đủ khi ≥ 80 % số mẫu hợp lệ kỳ vọng (1 mẫu / 10 giây mỗi Zone); đàn chim đủ khi có cả 2 phiên"
          properties:
            environment: { type: boolean }
            air: { type: boolean }
            flock: { type: boolean }
            noise: { type: boolean }
        current_status: { type: string, enum: [GOOD, WATCH, ACTION, INSUFFICIENT_DATA], description: "Có cả khi PENDING" }
        current_reasons: { type: array, items: { $ref: "#/components/schemas/HealthReason" }, description: "Chỉ số quyết định kèm số liệu; nguồn tuỳ chọn không đánh giá; mưa; thiếu thời tiết" }
        evidence:
          type: object
          description: "ALERT-FR-014"
          properties:
            noise_alert_ids: { type: array, items: { type: string } }
        ratings:
          type: array
          description: "Điểm của mọi người chấm"
          items:
            type: object
            properties:
              _id: { type: string }
              by: { type: object, properties: { _id: { type: string }, full_name: { type: string, nullable: true } } }
              role: { type: string, enum: [FARM_OWNER, FARM_TECHNICIAN, DOMAIN_EXPERT], description: "Vai người chấm (BR-31); DOMAIN_EXPERT chỉ còn ở điểm chấm trước Report 3 4.2.0" }
              outcome: { type: string, enum: [RATED, SKIPPED] }
              rating: { type: string, enum: [GOOD, WATCH, ACTION], nullable: true }
              note: { type: string, nullable: true }
              at: { type: string, format: date-time }
              snapshot:
                type: object
                description: "Ảnh chụp lúc chấm — không bao giờ đổi (BR-31, D16)"
                properties:
                  status: { type: string, enum: [GOOD, WATCH, ACTION, INSUFFICIENT_DATA] }
                  reasons: { type: array, items: { $ref: "#/components/schemas/HealthReason" } }

    HealthDisagreements:
      type: object
      description: "EXPERT-FR-022 — ngày người chấm đánh giá khác hệ thống, kèm mức chỉ số hiện tại của từng nhà"
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        houses:
          type: array
          items:
            type: object
            properties:
              house_id: { type: string }
              house_name: { type: string }
              health_levels: { $ref: "#/components/schemas/HealthLevels" }
        days:
          type: array
          items:
            type: object
            properties:
              day_id: { type: string }
              house_id: { type: string }
              house_name: { type: string }
              date: { type: string, format: date }
              current_status: { type: string, enum: [GOOD, WATCH, ACTION, INSUFFICIENT_DATA] }
              current_reasons: { type: array, items: { $ref: "#/components/schemas/HealthReason" } }
              indicators:
                type: object
                properties:
                  environment: { $ref: "#/components/schemas/HealthIndicator" }
                  air: { $ref: "#/components/schemas/HealthIndicator" }
                  flock: { $ref: "#/components/schemas/HealthIndicator" }
                  noise: { $ref: "#/components/schemas/HealthIndicator" }
              disagreements:
                type: array
                description: "Mỗi điểm khác ảnh chụp"
                items:
                  type: object
                  properties:
                    assessor: { type: object, properties: { full_name: { type: string, nullable: true }, role: { type: string, enum: [FARM_OWNER] } } }
                    rating: { type: string, enum: [GOOD, WATCH, ACTION] }
                    snapshot_status: { type: string, enum: [GOOD, WATCH, ACTION] }
                    snapshot_reasons: { type: array, items: { $ref: "#/components/schemas/HealthReason" } }
                    snapshot_levels: { type: object, additionalProperties: { type: string, enum: [NORMAL, SLIGHT, CLEAR], nullable: true }, description: "Mức từng nguồn lúc chấm" }
                    note: { type: string, nullable: true }
                    at: { type: string, format: date-time }

    HealthEvaluation:
      type: object
      description: "ANALYTICS-FR-014 — mọi tỷ lệ là số 0–1; null khi chưa đủ dữ liệu để tính"
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        role: { type: string, nullable: true }
        rated_count: { type: integer, description: "Số cặp (ngày × người chấm) đưa vào độ khớp" }
        insufficient_data_count: { type: integer, description: "Số cặp có ảnh chụp INSUFFICIENT_DATA — báo riêng" }
        agreement:
          type: object
          nullable: true
          properties:
            value: { type: number }
            ci_low: { type: number }
            ci_high: { type: number }
        weighted_kappa: { type: number, nullable: true, description: "null khi kỳ vọng ngẫu nhiên = 1 (mọi cặp cùng 1 mức)" }
        gwet_ac1: { type: number, nullable: true }
        confusion_matrix:
          type: object
          properties:
            labels: { type: array, items: { type: string }, example: [GOOD, WATCH, ACTION] }
            rows: { type: string, example: system }
            columns: { type: string, example: rater }
            counts: { type: array, items: { type: array, items: { type: integer } } }
        false_alarm_rate:
          type: object
          description: "Trong các lần người chấm cho GOOD, phần trạng thái gộp (combined) hoặc từng nguồn riêng báo khác GOOD"
          properties:
            combined: { type: number, nullable: true }
            environment: { type: number, nullable: true }
            air: { type: number, nullable: true }
            flock: { type: number, nullable: true }
            noise: { type: number, nullable: true }
        ratings:
          type: array
          items:
            type: object
            properties:
              house_name: { type: string }
              date: { type: string, format: date }
              assessor: { type: object, properties: { full_name: { type: string, nullable: true }, role: { type: string } } }
              snapshot_status: { type: string, enum: [GOOD, WATCH, ACTION, INSUFFICIENT_DATA] }
              rating: { type: string, enum: [GOOD, WATCH, ACTION] }
              counted: { type: boolean, description: "false khi ảnh chụp là INSUFFICIENT_DATA" }

    HouseHealthReportSummary:
      type: object
      description: "Phần tóm tắt của 1 báo cáo theo nhà (danh sách)"
      properties:
        _id: { type: string }
        farm_id: { type: string }
        house_id: { type: string }
        house_name: { type: string }
        kind: { type: string, enum: [DAILY, WEEKLY, MONTHLY, CUSTOM], description: "BR-33; CUSTOM do người dùng tạo" }
        period_start: { type: string, format: date, description: "'YYYY-MM-DD' giờ VN, ngày đầu kỳ" }
        period_end: { type: string, format: date, description: "'YYYY-MM-DD' giờ VN, ngày cuối kỳ (tính cả ngày này)" }
        generated_at: { type: string, format: date-time }
        has_conclusion: { type: boolean }

    HouseHealthReport:
      description: "EXPERT-FR-005, 006 — báo cáo sức khỏe 1 nhà yến trong 1 kỳ, mỗi Zone một mục, kèm kết luận"
      allOf:
        - $ref: "#/components/schemas/HouseHealthReportSummary"
        - type: object
          properties:
            house_metrics:
              type: object
              properties:
                return_rate_trend:
                  type: array
                  description: "Tỷ lệ chim về từng ngày của kỳ; ngày thiếu phiên đánh dấu `complete: false` (VISION-FR-020)"
                  items:
                    type: object
                    properties:
                      date: { type: string, format: date }
                      return_rate: { type: number, nullable: true, description: "null khi chưa đếm đủ" }
                      complete: { type: boolean }
                avg_return_rate: { type: number, nullable: true, description: "Trung bình các ngày đủ phiên" }
                weather:
                  type: object
                  nullable: true
                  description: "Tóm tắt thời tiết ngoài trời của kỳ (ANALYTICS-FR-013); null khi không có dữ liệu"
                  properties:
                    temperature_min: { type: number, nullable: true }
                    temperature_max: { type: number, nullable: true }
                    humidity_avg: { type: number, nullable: true }
                    precipitation_mm: { type: number, nullable: true }
                    rain_days: { type: integer, description: "Số ngày có ít nhất 1 giờ mưa ≥ 1 mm (BR-30)" }
            zone_sections:
              type: array
              items:
                type: object
                properties:
                  zone_id: { type: string }
                  zone_name: { type: string }
                  sample_count: { type: integer }
                  temp_in_range_pct: { type: number, nullable: true }
                  humidity_in_range_pct: { type: number, nullable: true }
                  auto_mode_pct: { type: number, nullable: true, description: "ANALYTICS-FR-011" }
                  misting_switches: { type: integer }
                  ventilation_switches: { type: integer }
                  alerts_by_type: { type: object, additionalProperties: { type: integer }, description: "{ <AlertType>: số cảnh báo phát sinh trong kỳ }" }
                  inferred_alerts:
                    type: object
                    description: "Cảnh báo suy luận (SENSOR_ANOMALY, FORECAST_BREACH, NOISE_ANOMALY) theo kết luận của chuyên gia (EXPERT-FR-003)"
                    properties:
                      confirmed: { type: integer }
                      dismissed: { type: integer }
                      pending: { type: integer }
                  device_faults: { type: object, additionalProperties: { type: integer }, description: "Cảnh báo thiết bị và tải theo loại (SENSOR_FAULT, RS485_BUS_FAILURE, ACTUATOR_FAULT, NODE_OFFLINE…)" }
                  nh3_avg: { type: number, nullable: true }
                  nh3_max: { type: number, nullable: true }
                  co2_avg: { type: number, nullable: true }
                  co2_max: { type: number, nullable: true }
            days:
              type: array
              description: "Trạng thái từng ngày của kỳ — cùng hình dạng với GET /health-reports/days"
              items: { $ref: "#/components/schemas/HouseHealthDay" }
            status_counts:
              type: object
              description: "Số ngày theo trạng thái, chỉ tính các ngày người gọi đã thấy"
              properties:
                GOOD: { type: integer }
                WATCH: { type: integer }
                ACTION: { type: integer }
                INSUFFICIENT_DATA: { type: integer }
            expert_reminded_at: { type: string, format: date-time, nullable: true, description: "BR-22 — lần Farm Owner nhắc chuyên gia (POST /expert-activity/reminders); mỗi việc một lần" }
            expert_conclusion:
              type: object
              nullable: true
              properties:
                text: { type: string }
                by: { type: object, properties: { _id: { type: string }, full_name: { type: string } } }
                at: { type: string, format: date-time, description: "Lúc viết kết luận lần đầu" }
                edited_at: { type: string, format: date-time, nullable: true, description: "Lần sửa gần nhất của tác giả (EXPERT-FR-006)" }

    RelayOverrideLog:
      type: object
      description: "ENV-FR-019 — một lần can thiệp tay 1 relay"
      properties:
        _id: { type: string }
        node_id: { type: string }
        zone_id: { type: string }
        farm_id: { type: string }
        relay: { type: string, enum: [misting, ventilation, speaker] }
        state: { type: boolean, description: "Trạng thái được ép" }
        started_by:
          type: object
          description: "Chỉ tên — không trả email (Domain Expert đọc được route này)"
          properties: { _id: { type: string }, full_name: { type: string } }
        started_by_role: { $ref: "#/components/schemas/Role" }
        started_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time, nullable: true }
        end_reason: { type: string, enum: [EXPIRED, CLEARED_EARLY, REPLACED], nullable: true }
        alert_confirmed: { type: boolean, description: "ENV-FR-019 — bật bơm lúc Zone có cảnh báo cảm biến/phun sương và Farm Owner đã xác nhận" }

    RelayOverride:
      type: object
      properties:
        mode: { type: string, enum: [AUTO, MANUAL] }
        override_expiry: { type: string, format: date-time, description: "Chỉ có khi `mode=MANUAL`" }
        override_by: { type: string, description: "ID người bật tay; thiết bị tự báo MANUAL thì không có" }
    RelayStates:
      type: object
      description: "Guide v3.3 §8-9: IN1=misting, IN2=speaker (loa ru), IN3=ventilation. IN4 để dự phòng (SRS v2.0.0 bỏ sưởi)"
      properties:
        misting: { type: boolean }
        speaker: { type: boolean }
        ventilation: { type: boolean }

    AudioTrack:
      type: object
      description: "ENV-FR-013c — bài trong danh mục web của 1 thiết bị (SRS §8.2 audio_tracks)"
      properties:
        _id: { type: string }
        node_id: { type: string }
        track_number: { type: integer, description: "Khớp file trên thẻ SD: 2 = 0002.mp3" }
        display_name: { type: string }
        file_url: { type: string, description: "URL MinIO ký tạm 1 giờ, chỉ để nghe trên web" }
        file_size_bytes: { type: integer }
        synced_to_sd: { type: boolean, description: "Farm Owner tự đánh dấu sau khi chép tay vào thẻ SD" }
        uploaded_by: { type: string }
        uploaded_at: { type: string, format: date-time }

    SensorNode:
      type: object
      properties:
        relay_usage:
          type: object
          description: "ALERT-FR-016 — giờ chạy + số lần đóng cắt thật của bơm/quạt; `since_service_*` về 0 khi Farm Owner xác nhận MAINTENANCE_DUE theo mốc mặc định, hoặc duyệt Work Order phòng ngừa của kế hoạch bảo trì (OPS-FR-008)"
          properties:
            misting: { $ref: "#/components/schemas/RelayUsage" }
            ventilation: { $ref: "#/components/schemas/RelayUsage" }
            counted_until: { type: string, format: date-time }
        actuator_baseline:
          type: object
          description: "BR-32, BR-45 — dòng bình thường controller đã học của bơm và quạt (A), heartbeat firmware ≥ 2.3.1 báo. Có mức và có số đo dòng thì giờ chạy chỉ cộng khi dòng trên 50 % mức này; thiếu thì theo thời gian relay BẬT"
          properties:
            misting_a: { type: number }
            ventilation_a: { type: number }
        _id: { type: string }
        device_id: { type: string, example: node_001 }
        zone_id: { type: string }
        firmware_version: { type: string }
        last_heartbeat: { type: string, format: date-time }
        status:
          {
            type: string,
            enum: [PENDING, ONLINE, OFFLINE],
            description: "PENDING = Technician đã khai báo qua Web Console nhưng thiết bị chưa gửi heartbeat đầu tiên (Flow 1)",
          }
        config_sync:
          type: string
          enum: [PENDING, APPLIED, MISMATCH, UNKNOWN]
          description: "ENV-FR-027, Report 3 §6.12 — controller mới hoặc vừa có cấu hình mới: PENDING; heartbeat báo đúng `config_version` của Zone: APPLIED (FARM-FR-012 \"đã áp cấu hình\"); online mà 3 heartbeat liên tiếp vẫn báo bản cũ: MISMATCH kèm cảnh báo CONFIG_MISMATCH (BR-24); firmware trước 2.1.0 không báo phiên bản: UNKNOWN"
        applied_config_version: { type: integer, nullable: true, description: "ENV-FR-027 — phiên bản cấu hình heartbeat gần nhất báo; null khi firmware không báo" }
        rssi: { type: number }
        booted_at: { type: string, format: date-time, description: "FARM-FR-006 — thời điểm khởi động, tính từ `uptime` của heartbeat" }
        free_heap: { type: number, description: "FARM-FR-006 — byte RAM còn trống lúc heartbeat gần nhất" }
        reset_reason: { type: string, example: BROWNOUT, description: "FARM-FR-006 — lý do lần khởi động gần nhất (esp_reset_reason: POWERON, SW, PANIC, INT_WDT, TASK_WDT, WDT, BROWNOUT…), firmware ≥ 1.4.0" }
        ip: { type: string, description: "FARM-FR-006 — IP trong LAN nhà yến (ElegantOTA tại http://<ip>/update), firmware ≥ 1.4.0" }
        relay_states: { $ref: "#/components/schemas/RelayStates" }
        control_mode: { type: string, enum: [AUTO, MANUAL], description: "Tóm tắt của `relays`: MANUAL khi có relay MANUAL" }
        override_expiry: { type: string, format: date-time, description: "Tóm tắt của `relays`: hạn muộn nhất của các relay MANUAL" }
        relays:
          type: object
          description: "BR-20 — chế độ và hạn của từng relay"
          properties:
            misting: { $ref: "#/components/schemas/RelayOverride" }
            speaker: { $ref: "#/components/schemas/RelayOverride" }
            ventilation: { $ref: "#/components/schemas/RelayOverride" }
        speaker_schedule:
          type: object
          properties:
            enabled: { type: boolean }
            windows:
              {
                type: array,
                items:
                  {
                    type: object,
                    properties:
                      { start: { type: string }, end: { type: string } },
                  },
              }
        audio:
          type: object
          properties:
            current_track: { type: integer }
            volume: { type: integer, minimum: 0, maximum: 30 }
            playing: { type: boolean }
            loop: { type: boolean }
        registered_at: { type: string, format: date-time }
        simulated: { type: boolean, description: "SYSTEM-FR-004 — thiết bị của bộ giả lập (`simulator/`), chép từ kho lúc đăng ký; mọi màn hình phải ghi rõ là giả lập" }
        ota_pending:
          type: object
          nullable: true
          description: "FARM-FR-013 — OTA đã gửi, chờ heartbeat báo đúng version"
          properties:
            version: { type: string }
            url: { type: string }
            requested_at: { type: string, format: date-time }
            requested_by: { type: string }
        ota_failed:
          type: object
          nullable: true
          description: "OTA quá 30 phút chưa xác nhận — thiết bị vẫn chạy running_version (đã rollback)"
          properties:
            version: { type: string }
            failed_at: { type: string, format: date-time }
            running_version: { type: string }
        registered_by: { type: string, nullable: true }
        activation_overdue_at: { type: string, format: date-time, nullable: true, description: "Flow 1 case 8a — PENDING quá 15 phút chưa có heartbeat" }
        decommissioned_at: { type: string, format: date-time, nullable: true, description: "FARM-FR-008 — đã gỡ khỏi hệ thống; cảnh báo còn mở của nó được đóng theo" }
        decommission_reason: { type: string, nullable: true }
        replaced_by: { type: string, nullable: true, description: "Node mới lắp thay" }

    CameraSourceView:
      type: object
      description: "Địa chỉ camera IP của nút AI, không có mật khẩu (FARM-FR-004b)"
      properties:
        camera_status: { type: string, nullable: true, enum: [OK, NO_SOURCE, AUTH_FAILED, UNREACHABLE, NO_FRAMES] }
        camera_status_at: { type: string, format: date-time, nullable: true }
        source:
          type: object
          nullable: true
          properties:
            host: { type: string }
            port: { type: integer }
            username: { type: string }
            path: { type: string }
            has_password: { type: boolean }
            version: { type: integer }
            updated_at: { type: string, format: date-time }
    CameraNode:
      type: object
      properties:
        _id: { type: string }
        device_id: { type: string }
        house_id: { type: string, description: "SRS v2.1.8 — camera ở cửa ra vào của cả nhà yến, không gắn Zone" }
        camera_status:
          type: string
          nullable: true
          enum: [OK, NO_SOURCE, AUTH_FAILED, UNREACHABLE, NO_FRAMES]
          description: "FARM-FR-004b — tình trạng camera IP do nút AI báo trong heartbeat (`cameraStatus`)"
        camera_status_at: { type: string, format: date-time, nullable: true }
        status:
          {
            type: string,
            enum: [PENDING, ONLINE, OFFLINE],
            description: "PENDING = Technician đã khai báo qua Web Console nhưng thiết bị chưa gửi heartbeat đầu tiên (Flow 1)",
          }
        last_heartbeat: { type: string, format: date-time }
        model_version: { type: string }
        fps: { type: number, description: "Số khung hình xử lý mỗi giây ở heartbeat gần nhất. Dưới 10 thì nhà có `EDGE_AI_DEGRADED` (`metadata.cause: LOW_FPS`), heartbeat đủ 10 trở lên thì đóng (THREAT-FR-010, Report 3 §4.5). `0` là chưa đo (heartbeat đầu ngay sau khi nút AI khởi động): không xét, không mở cảnh báo" }
        registered_at: { type: string, format: date-time }
        simulated: { type: boolean, description: "SYSTEM-FR-004 — thiết bị của bộ giả lập (`simulator/`), chép từ kho lúc đăng ký; mọi màn hình phải ghi rõ là giả lập" }
        registered_by: { type: string, nullable: true }
        activation_overdue_at: { type: string, format: date-time, nullable: true, description: "Flow 1 case 8a — PENDING quá 15 phút chưa có heartbeat" }
        decommissioned_at: { type: string, format: date-time, nullable: true, description: "FARM-FR-008 — đã gỡ khỏi hệ thống" }
        decommission_reason: { type: string, nullable: true }
        replaced_by: { type: string, nullable: true, description: "Node mới lắp thay" }
        counting_rings:
          type: array
          maxItems: 4
          description: "VISION-FR-018 — các vòng đã vẽ, mỗi vòng đếm cả vào lẫn ra; [] hoặc không có = nút AI dùng vòng trong config.yaml. Bản ghi cũ chỉ có counting_ring"
          items: { $ref: "#/components/schemas/CountingRing" }
        default_rings:
          type: array
          maxItems: 4
          description: "Vòng trong config.yaml của nút AI, báo qua heartbeat (`defaultRings`); web hiện như một vòng thường khi chưa vẽ vòng nào. Không có khi nút AI chưa báo hoặc báo danh sách rỗng"
          items: { $ref: "#/components/schemas/CountingRing" }
        counting_ring:
          nullable: true
          description: "Vòng đầu tiên kèm người sửa và lúc sửa; không có khi chưa vẽ hoặc đã xoá vòng"
          allOf:
            - $ref: "#/components/schemas/CountingRing"
            - properties:
                updated_at: { type: string, format: date-time }
                updated_by: { type: string }
        counting_ring_history:
          type: array
          items:
            type: object
            properties:
              changed_by: { type: string }
              changed_by_role: { type: string }
              changed_at: { type: string, format: date-time }
              old_value:
                description: "Bản ghi cũ là 1 vòng, bản ghi mới là danh sách vòng"
                oneOf:
                  - { $ref: "#/components/schemas/CountingRing" }
                  - { type: array, items: { $ref: "#/components/schemas/CountingRing" } }
              new_value:
                oneOf:
                  - { $ref: "#/components/schemas/CountingRing" }
                  - { type: array, items: { $ref: "#/components/schemas/CountingRing" } }

    CountingRing:
      type: object
      required: [points, into_ring_is_exit]
      properties:
        points:
          type: array
          minItems: 3
          maxItems: 12
          items: { type: array, minItems: 2, maxItems: 2, items: { type: number, minimum: 0, maximum: 1 } }
          example: [[0.379, 0.228], [0.527, 0.136], [0.575, 0.277], [0.569, 0.374], [0.427, 0.477], [0.386, 0.334]]
        into_ring_is_exit: { type: boolean, description: "true = chim đi vào vòng là RA (camera trong nhà nhìn vào lỗ)" }

    Telemetry:
      type: object
      properties:
        _id: { type: string }
        node_id: { type: string }
        zone_id: { type: string }
        timestamp: { type: string, format: date-time }
        temperature:
          { type: number, nullable: true, description: "°C, từ ES35-SW" }
        humidity:
          { type: number, nullable: true, description: "%RH, từ ES35-SW" }
        light_lux:
          { type: number, nullable: true, description: "lux, từ ES-ALS-02" }
        nh3_ppm:
          { type: number, nullable: true, description: "ppm, từ ES-NH3-01" }
        co2_ppm:
          { type: number, nullable: true, description: "ppm, từ ES-CO2-01" }
        sound_db:
          { type: number, nullable: true, description: "dB, từ ES-NOISE-01" }
        misting_pct: { type: number, nullable: true, description: "% phun do bộ điều khiển mờ tính (firmware ≥ 1.1.0)" }
        ventilation_pct: { type: number, nullable: true, description: "% quạt do bộ điều khiển mờ tính (firmware ≥ 1.1.0)" }
        misting_on: { type: boolean, nullable: true, description: "Relay phun sương lúc lấy mẫu" }
        ventilation_on: { type: boolean, nullable: true, description: "Relay quạt lúc lấy mẫu" }
        pump_current_a: { type: number, nullable: true, minimum: 0, description: "THREAT-FR-014 — dòng đo của bơm phun sương (A); chỉ controller có đo dòng (board của nhóm, G-13) gửi; số âm không được lưu" }
        fan_current_a: { type: number, nullable: true, minimum: 0, description: "THREAT-FR-014 — dòng đo của quạt (A), như `pump_current_a`" }
        is_anomaly: { type: boolean }
        stale_fields: { type: array, items: { type: string }, description: "ENV-FR-004 — cảm biến controller báo cũ hoặc lỗi (gửi null); số đo đó lưu là thiếu" }
        anomaly_fields: { type: array, items: { type: string }, description: "ENV-FR-004 — chỉ số ngoài ngưỡng của Zone làm mẫu thành bất thường" }
        buffered: { type: boolean, description: "ENV-FR-024 — mẫu từ bộ đệm offline (`telemetry/buffered`)" }

    AlertType:
      type: string
      description: |
        `THRESHOLD_BREACH` (ALERT-FR-012, BR-34): chỉ tạo khi 1 chỉ số ở ngoài ngưỡng của Zone liên tục,
        không có mẫu hợp lệ nằm trong ngưỡng xen giữa, trong 10 phút (nhiệt độ, độ ẩm) hoặc 5 phút (ánh
        sáng, NH3, CO2); số đo thiếu hoặc stale không tính; thiết bị im lặng quá 30 giây (BR-10) thì đếm
        lại từ mẫu tiếp theo. Tự đóng sau 5 phút các chỉ số của cảnh báo về trong ngưỡng (BR-16); chỉ số
        khác vừa vượt mà chưa đủ thời gian chờ không giữ cảnh báo mở.
      enum:
        - THRESHOLD_BREACH
        - NODE_OFFLINE
        - SPEAKER_FAILURE
        - MISTING_INEFFECTIVE
        - NOISE_ANOMALY
        - UNEXPECTED_RESTART
        - LOW_RETURN_RATE
        - EDGE_AI_DEGRADED
        - SENSOR_FAULT
        - RS485_BUS_FAILURE
        - SENSOR_ANOMALY
        - FORECAST_BREACH
        - MAINTENANCE_DUE
        - ACTUATOR_FAULT
        - CONFIG_MISMATCH

    Alert:
      type: object
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string, nullable: true }
        house_id: { type: string, nullable: true, description: "Cảnh báo của cả nhà yến (camera đếm chim: EDGE_AI_DEGRADED, LOW_RETURN_RATE) — SRS v2.1.8; khi đó không có zone_id" }
        node_id: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/AlertType" }
        severity: { type: string, enum: [CRITICAL, HIGH, MEDIUM, LOW], description: "Mức theo loại cảnh báo (BR-15, ALERT-FR-001); backend đặt, bỏ qua mức thiết bị gửi kèm" }
        incident_key: { type: string, readOnly: true, description: "Khoá sự cố (loại, farm, Zone hoặc nhà, thiết bị; tải với ACTUATOR_FAULT; kế hoạch với MAINTENANCE_DUE). Mỗi khoá chỉ một cảnh báo còn mở (ALERT-FR-008)" }
        title: { type: string }
        message: { type: string }
        snapshot_url: { type: string, nullable: true }
        metadata: { type: object, description: "`EDGE_AI_DEGRADED` do nút AI xử lý chậm: `{ cause: LOW_FPS, fps, min_fps }`" }
        details:
          type: object
          nullable: true
          description: |
            Report 4 §6.1 — chi tiết của sự cố. `THRESHOLD_BREACH` (ALERT-FR-012): chỉ số đã đủ thời gian
            chờ sớm nhất. `UNEXPECTED_RESTART` (THREAT-FR-012): `reset_reason`. `ACTUATOR_FAULT` (THREAT-FR-014,
            BR-32): `load`, `fault`, `normal_current_a`, `current_a`; mỗi tải một cảnh báo, firmware gửi lại khi lỗi còn
            và cảnh báo tự đóng 60 phút sau lần gửi cuối. `metadata` giữ nguyên cho
            client cũ (`metadata.breaches` có mọi chỉ số đang vượt); `metadata.metrics` là các chỉ số
            cảnh báo đang báo (đã đủ thời gian chờ).
          properties:
            metric: { type: string, enum: [temperature, humidity, light_lux, nh3_ppm, co2_ppm] }
            observed: { type: number, description: "Giá trị đo mới nhất" }
            threshold: { type: number, description: "Ngưỡng của Zone bị vượt" }
            direction: { type: string, enum: [above, below] }
            started_at: { type: string, format: date-time, description: "Mẫu đầu tiên của quãng vượt ngưỡng liên tục" }
            reset_reason: { type: string, description: "Firmware ≥ 1.5.0 gửi POWER_ON, WATCHDOG, BROWNOUT, CRASH; thiếu thì lấy lý do chi tiết của heartbeat gần nhất (VD TASK_WDT)" }
            load: { type: string, enum: [misting, ventilation], description: "ACTUATOR_FAULT — tải không theo relay: bơm phun sương hoặc quạt" }
            fault: { type: string, enum: [NO_CURRENT_WHILE_ON, CURRENT_WHILE_OFF], description: "ACTUATOR_FAULT — relay BẬT mà dòng dưới 50 % mức đã học (motor cháy, aptomat nhảy, đứt dây, công tắc của nhà bị tắt), hoặc relay TẮT mà dòng trên 20 % (relay dính, tải được bật bằng công tắc khác)" }
            normal_current_a: { type: number, description: "ACTUATOR_FAULT — dòng bình thường đã học của tải (A)" }
            current_a: { type: number, description: "ACTUATOR_FAULT — dòng đo lúc báo (A)" }
        status: { type: string, enum: [ACTIVE, ACKNOWLEDGED, DISMISSED, RESOLVED], description: "DISMISSED — cảnh báo suy luận bị bác bỏ, không còn hiệu lực (Report 3 §6.1, EXPERT-FR-003)" }
        previous_status: { type: string, enum: [ACTIVE, ACKNOWLEDGED], nullable: true, description: "Trạng thái trước khi bị bác bỏ; đổi kết luận sang CONFIRMED thì cảnh báo trở về trạng thái này" }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true, description: "Lần gần nhất sự cố còn được ghi nhận (cập nhật tối đa 1 lần/phút) — ALERT-FR-008" }
        occurrence_count: { type: integer, minimum: 1, description: "Số lần sự cố được ghi nhận lại trong khi alert còn mở (thay vì tạo alert trùng)" }
        acknowledged_at: { type: string, format: date-time, nullable: true }
        resolved_at: { type: string, format: date-time, nullable: true, description: "Sự cố hết (THRESHOLD_BREACH tự đóng sau 5 phút không vượt ngưỡng, NODE_OFFLINE tự đóng khi thiết bị kết nối lại), hoặc thiết bị đã được gỡ khỏi hệ thống (FARM-FR-008). Alert đã đóng tự xoá sau 180 ngày." }
        acknowledged_by: { type: string, nullable: true }
        acknowledgement_note: { type: string, nullable: true }
        renotified_at: { type: string, format: date-time, nullable: true, description: "ALERT-FR-015 — lúc đã gửi lại cho người nhận vì chưa ai xác nhận (CRITICAL/HIGH sau 15 phút, NODE_OFFLINE sau 1 giờ); chỉ gửi lại 1 lần" }
        routing:
          type: object
          nullable: true
          description: |
            ALERT-FR-017 — người nhận lúc tạo: thợ đang trực của nhà (`technician_id`), Farm Owner có được
            báo ngay không (`owners_notified`: CRITICAL, hoặc nhà không có thợ). Thiếu = cảnh báo trước G-21.
          properties:
            technician_id: { type: string, nullable: true }
            owners_notified: { type: boolean }
        escalated_at: { type: string, format: date-time, nullable: true, description: "BR-40 — lúc báo Farm Owner vì thợ chưa xác nhận sau `escalation_min` (15 phút); chỉ 1 lần" }
        site_cause:
          type: object
          nullable: true
          description: "ALERT-FR-018 — nguyên nhân tìm thấy tại chỗ (khi xác nhận hoặc khi Work Order làm xong)"
          properties:
            cause: { $ref: "#/components/schemas/SiteCause" }
            photo_urls: { type: array, items: { type: string } }
            by: { type: string }
            at: { type: string, format: date-time }
        onsite_checks:
          type: array
          description: "EXPERT-FR-021 — yêu cầu kiểm tra tại chỗ (chỉ cảnh báo suy luận ở nhà có thợ)"
          items: { $ref: "#/components/schemas/OnsiteCheck" }
        expert_reminded_at: { type: string, format: date-time, nullable: true, description: "BR-22 — lần Farm Owner nhắc chuyên gia (POST /expert-activity/reminders); mỗi việc một lần" }
        expert_verdict:
          type: object
          nullable: true
          description: "EXPERT-FR-003 — kết quả kiểm chứng; không có = chờ kiểm chứng. Farm Owner kết luận khi farm chưa có chuyên gia (BR-22)"
          properties:
            result: { type: string, enum: [CONFIRMED, REJECTED] }
            note: { type: string, nullable: true }
            by:
              type: object
              description: "Người kết luận (ALERT-FR-007: cảnh báo DISMISSED hiện ai bác bỏ)"
              properties: { _id: { type: string }, full_name: { type: string } }
            role: { type: string, enum: [DOMAIN_EXPERT, FARM_OWNER] }
            at: { type: string, format: date-time }

    AlertEvidence:
      type: object
      description: "ALERT-FR-014 — dữ liệu quanh một cảnh báo suy luận. Mỗi nguồn có `status: ok | missing`"
      properties:
        alert_id: { type: string }
        type: { $ref: "#/components/schemas/AlertType" }
        window:
          type: object
          properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time } }
        telemetry:
          type: object
          nullable: true
          description: "Loại theo zone — mẫu của zone trong cửa sổ"
          properties:
            status: { type: string, enum: [ok, missing] }
            samples:
              type: array
              items:
                type: object
                properties:
                  timestamp: { type: string, format: date-time }
                  temperature: { type: number, nullable: true }
                  humidity: { type: number, nullable: true }
                  nh3_ppm: { type: number, nullable: true }
                  co2_ppm: { type: number, nullable: true }
                  sound_db: { type: number, nullable: true }
        bird_counts:
          type: object
          nullable: true
          description: "Loại theo zone — số đếm 5 phút của nhà chứa zone"
          properties:
            status: { type: string, enum: [ok, missing] }
            buckets:
              type: array
              items:
                type: object
                properties:
                  bucket_start: { type: string, format: date-time }
                  entry_count: { type: integer }
                  exit_count: { type: integer }
        zones_in_range:
          type: array
          nullable: true
          description: "LOW_RETURN_RATE — % thời gian trong ngưỡng của từng zone trong ngày"
          items:
            type: object
            properties:
              zone_id: { type: string }
              name: { type: string }
              status: { type: string, enum: [ok, missing] }
              temp_in_range_pct: { type: number, nullable: true }
              humidity_in_range_pct: { type: number, nullable: true }
        noise_alerts:
          type: array
          nullable: true
          description: "LOW_RETURN_RATE — NOISE_ANOMALY của nhà trong ngày"
          items: { $ref: "#/components/schemas/Alert" }
        device_alerts:
          type: array
          description: "Cảnh báo thiết bị: đang mở của zone (loại theo zone), hoặc của nhà trong ngày (LOW_RETURN_RATE)"
          items: { $ref: "#/components/schemas/Alert" }
        earlier_verdicts:
          type: array
          description: "EXPERT-FR-003 — tối đa 10 cảnh báo trước cùng loại, cùng zone/nhà, đã có kết luận"
          items: { $ref: "#/components/schemas/Alert" }
        onsite_checks:
          type: array
          description: "EXPERT-FR-021 — yêu cầu kiểm tra tại chỗ và quan sát của thợ (rỗng khi nhà không có thợ)"
          items: { $ref: "#/components/schemas/OnsiteCheck" }

    ChannelChoice:
      type: object
      nullable: true
      description: "ALERT-FR-005 — kênh ngoài ứng dụng cho một mức cảnh báo; trường không có thì dùng cài đặt chung"
      properties:
        push: { type: boolean }
        telegram: { type: boolean }

    SiteCause:
      type: string
      description: "ALERT-FR-018 — nguyên nhân tìm thấy tại chỗ"
      enum: [WATER, NOZZLE, PUMP, FAN, DOOR, SENSOR, SPEAKER, OTHER]

    OnsiteObservation:
      type: string
      description: "EXPERT-FR-021 — chim bị động, có người hoặc công việc gần đó, mưa, cảm biến bẩn hoặc hỏng, không có gì lạ, khác"
      enum: [BIRDS_DISTURBED, WORK_OR_PEOPLE_NEARBY, RAIN, SENSOR_DIRTY_OR_FAULTY, NOTHING_UNUSUAL, OTHER]

    OnsiteCheck:
      type: object
      properties:
        technician_id: { type: object, description: "Thợ được yêu cầu", properties: { _id: { type: string }, full_name: { type: string } } }
        requested_at: { type: string, format: date-time }
        observation: { allOf: [{ $ref: "#/components/schemas/OnsiteObservation" }], nullable: true, description: "null = chưa trả lời" }
        note: { type: string, nullable: true }
        photo_url: { type: string, nullable: true, description: "URL tạm (1 giờ)" }
        answered_by: { type: object, nullable: true, properties: { _id: { type: string }, full_name: { type: string } } }
        answered_at: { type: string, format: date-time, nullable: true }

    WorkOrderStatus:
      type: string
      description: "Report 3 §6.19 (SM-19)"
      enum: [OPEN, IN_PROGRESS, VERIFYING, AWAITING_APPROVAL, CLOSED, CANCELLED]

    WorkOrder:
      type: object
      description: "OPS-FR-001…004, 006…008 — Work Order sửa chữa hoặc phòng ngừa; mỗi cảnh báo chỉ có 1 Work Order chưa đóng (BR-39)"
      properties:
        _id: { type: string }
        farm_id: { type: string }
        house_id: { type: string }
        zone_id: { type: string, nullable: true }
        node_id: { type: string, nullable: true }
        alert_id: { type: string, nullable: true }
        alert_type: { allOf: [{ $ref: "#/components/schemas/AlertType" }], nullable: true }
        kind: { type: string, enum: [REPAIR, PREVENTIVE], description: "PREVENTIVE: bảo trì phòng ngừa theo kế hoạch (OPS-FR-006)" }
        origin:
          type: string
          enum: [ALERT, OUTAGE, EXPERT, ONSITE_CHECK, MANUAL, PLAN, CHECKLIST, RECOMMENDATION]
          description: "ALERT: cảnh báo thiết bị của BR-39; OUTAGE: NODE_OFFLINE / EDGE_AI_DEGRADED còn mở sau 30 phút; EXPERT: chuyên gia xác nhận cần tới nhà; ONSITE_CHECK: thợ thấy cảm biến hỏng (EXPERT-FR-021); MANUAL: Farm Owner mở; PLAN: kế hoạch bảo trì đến hạn (OPS-FR-006); CHECKLIST: mục checklist ghi DEFECT (OPS-FR-007); RECOMMENDATION: Farm Owner chấp nhận khuyến nghị (EXPERT-FR-018)"
        plan_id: { type: string, nullable: true, description: "Kế hoạch bảo trì của Work Order phòng ngừa" }
        recommendation_id: { type: string, nullable: true, description: "Khuyến nghị đã chấp nhận thành Work Order này (EXPERT-FR-018)" }
        checklist:
          type: array
          description: "Work Order phòng ngừa: checklist chép từ mẫu của kế hoạch (OPS-FR-007)"
          items: { $ref: "#/components/schemas/ChecklistItem" }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/WorkOrderStatus" }
        assignee: { type: object, nullable: true, description: "Thợ được giao; null = nhà không có thợ, Farm Owner xử lý", properties: { _id: { type: string }, full_name: { type: string } } }
        opened_by: { type: object, nullable: true, description: "null = hệ thống mở", properties: { _id: { type: string }, full_name: { type: string } } }
        cause: { allOf: [{ $ref: "#/components/schemas/SiteCause" }], nullable: true }
        work_note: { type: string, nullable: true }
        photo_urls: { type: array, items: { type: string }, description: "URL tạm (1 giờ); danh sách không kèm" }
        result: { type: string, enum: [REPAIRED, SELF_RECOVERED, DONE], nullable: true, description: "DONE: Work Order phòng ngừa đã duyệt (một lần ghi bảo trì, OPS-FR-008)" }
        cancel_reason: { type: string, nullable: true }
        opened_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        done_at: { type: string, format: date-time, nullable: true }
        verified_at: { type: string, format: date-time, nullable: true, description: "Lúc dữ liệu đã phục hồi đủ `recovery_verify_min` (BR-41)" }
        closed_at: { type: string, format: date-time, nullable: true }
        assigned_at: { type: string, format: date-time, nullable: true, description: "Lúc giao cho thợ hiện tại; quá hạn \"chưa ai bắt đầu\" tính từ đây (BR-40)" }
        escalated_at: { type: string, format: date-time, nullable: true, description: "Lúc báo Farm Owner vì chưa ai bắt đầu sau `escalation_min` kể từ lúc giao (BR-40)" }
        history:
          type: array
          items:
            type: object
            properties:
              from: { allOf: [{ $ref: "#/components/schemas/WorkOrderStatus" }], nullable: true }
              to: { $ref: "#/components/schemas/WorkOrderStatus" }
              by: { type: string, nullable: true, description: "null = hệ thống" }
              by_name: { type: string, nullable: true, description: "Tên người thao tác; null = hệ thống hoặc tài khoản không còn. Thợ không đọc được thành viên farm nên tên đi kèm phiếu" }
              note: { type: string, nullable: true }
              at: { type: string, format: date-time }

    ChecklistItem:
      type: object
      properties:
        item: { type: string }
        result: { type: string, enum: [OK, DEFECT], nullable: true, description: "null = chưa làm" }
        note: { type: string, nullable: true }
        photo_url: { type: string, nullable: true, description: "URL tạm (1 giờ)" }
        by: { type: string, nullable: true }
        by_name: { type: string, nullable: true, description: "Tên người ghi mục; null khi chưa ghi" }
        at: { type: string, format: date-time, nullable: true }
        repair_work_order_id: { type: string, nullable: true, description: "Work Order sửa chữa mở từ mục DEFECT" }

    MaintenancePlanState:
      type: string
      description: "Report 3 §6.20 (SM-20)"
      enum: [SCHEDULED, DUE, OVERDUE, RETIRED]

    MaintenancePlanInput:
      type: object
      required: [house_id, equipment, basis, interval, checklist_template, source]
      properties:
        house_id: { type: string }
        equipment: { type: string, enum: [PUMP, FAN, SENSOR, NOZZLE, CALIBRATION] }
        basis: { type: string, enum: [RUN_HOURS, SWITCHES, CALENDAR], description: "PUMP, FAN: RUN_HOURS hoặc SWITCHES; SENSOR, NOZZLE, CALIBRATION: CALENDAR" }
        interval: { type: number, exclusiveMinimum: true, minimum: 0, description: "Giờ chạy, số lần đóng cắt, hoặc số ngày (CALENDAR)" }
        checklist_template: { type: array, minItems: 1, maxItems: 30, items: { type: string, maxLength: 200 }, example: ["Bồn nước", "Béc phun", "Quạt", "Cửa", "Dấu vết chuột hoặc rắn"] }
        source: { type: string, maxLength: 300, description: "Nguồn của chu kỳ: khuyến cáo nhà sản xuất hoặc người nuôi" }
        note: { type: string, maxLength: 1000 }

    MaintenancePlan:
      type: object
      description: "OPS-FR-005 — kế hoạch bảo trì của một nhà cho một loại thiết bị; bộ đếm giờ chạy và số lần đóng cắt nằm ở từng controller (`relay_usage`)"
      properties:
        _id: { type: string }
        farm_id: { type: string }
        house_id: { type: string }
        equipment: { type: string, enum: [PUMP, FAN, SENSOR, NOZZLE, CALIBRATION] }
        basis: { type: string, enum: [RUN_HOURS, SWITCHES, CALENDAR] }
        interval: { type: number }
        checklist_template: { type: array, items: { type: string } }
        state: { $ref: "#/components/schemas/MaintenancePlanState" }
        next_due_at: { type: string, format: date-time, nullable: true, description: "Kế hoạch theo lịch: điểm đến hạn kế tiếp; CALIBRATION: ngày hiệu chuẩn kế tiếp" }
        due_since: { type: string, format: date-time, nullable: true }
        overdue_notified_at: { type: string, format: date-time, nullable: true }
        last_done_at: { type: string, format: date-time, nullable: true }
        source: { type: string }
        note: { type: string, nullable: true }
        comments:
          type: array
          items:
            type: object
            properties: { by: { type: string }, text: { type: string }, at: { type: string, format: date-time } }
        records:
          type: array
          description: "OPS-FR-008 — lịch sử bảo trì: mỗi Work Order phòng ngừa được duyệt là một lần ghi"
          items:
            type: object
            properties:
              work_order_id: { type: string }
              node_id: { type: string, nullable: true }
              kind: { type: string, enum: [MAINTENANCE, CALIBRATION] }
              by: { type: string }
              at: { type: string, format: date-time }
              next_due_at: { type: string, format: date-time, nullable: true }
        open_work_orders: { type: array, items: { type: string }, description: "Chỉ ở `GET /maintenance/due`: Work Order phòng ngừa đang mở" }

    OpsMetrics:
      type: object
      description: "OPS-FR-009, BR-40 — phút; null khi không có mẫu"
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        target_ack_min: { type: number, example: 15, description: "Mục tiêu nội bộ = escalation_min" }
        overall: { $ref: "#/components/schemas/OpsMetricRow" }
        by_house: { type: array, items: { allOf: [{ $ref: "#/components/schemas/OpsMetricRow" }, { properties: { house_id: { type: string }, name: { type: string } } }] } }
        by_technician: { type: array, items: { allOf: [{ $ref: "#/components/schemas/OpsMetricRow" }, { properties: { technician_id: { type: string }, full_name: { type: string } } }] } }
        on_time_maintenance_rate: { type: number, nullable: true, description: "BR-40 — % Work Order phòng ngừa đóng đúng hạn, trên các Work Order đã đóng hoặc đã quá hạn chót (không tính CANCELLED); null khi không có" }

    OpsMetricRow:
      type: object
      properties:
        alerts: { type: integer }
        mtta_min: { type: number, nullable: true }
        mttr_min: { type: number, nullable: true }
        acknowledged_within_target_pct: { type: number, nullable: true }

    PageMeta:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }

    ParameterReview:
      type: object
      description: "EXPERT-FR-010, BR-22, Report 3 §6.10 — mục duyệt thay đổi của Farm Owner trên farm có chuyên gia; mỗi đối tượng (Zone, nhà hoặc camera), mỗi nhóm chỉ 1 mục PENDING_REVIEW"
      properties:
        _id: { type: string }
        target_id: { type: string, description: "Zone (thresholds, fuzzy, detection), nhà (return_rate_drop, health_levels, counting_schedule) hoặc camera (counting_ring)" }
        zone_id: { type: string, description: "Chỉ nhóm theo Zone" }
        house_id: { type: string, description: "Nhà của đối tượng (mục tạo trước Report 3 4.2.15 có sau npm run migrate:review-targets)" }
        camera_node_id: { type: string, description: "Chỉ nhóm counting_ring" }
        farm_id: { type: string }
        group: { type: string, enum: [thresholds, fuzzy, detection, return_rate_drop, health_levels, counting_schedule, counting_ring] }
        old_values: { type: object, description: "Giá trị trước lần sửa đầu tiên của Farm Owner — giữ nguyên khi Farm Owner sửa tiếp" }
        new_values: { type: object, description: "Giá trị sau lần sửa gần nhất" }
        status: { type: string, enum: [PENDING_REVIEW, ACCEPTED, REVERTED, ADJUSTED] }
        changed_by: { type: string }
        reviewed_by: { type: string, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CoefficientProposal:
      type: object
      description: "EXPERT-FR-011, Report 3 §6.11 — gợi ý hệ số Farm Owner gửi chuyên gia"
      properties:
        _id: { type: string }
        zone_id: { type: string }
        farm_id: { type: string }
        submitted_by: { type: string }
        suggested_values: { type: object, description: "Hệ số gợi ý lúc gửi (fuzzy_humidity_band, fuzzy_temp_band, fuzzy_fan_dry_level)" }
        current_values: { type: object, description: "Hệ số đang dùng lúc gửi" }
        predicted: { type: object, nullable: true, description: "% thời gian trong ngưỡng và % phun dự kiến (hiện tại / gợi ý)" }
        status: { type: string, enum: [PROPOSED, APPROVED, REJECTED, SUPERSEDED] }
        note: { type: string, nullable: true, description: "Lý do từ chối" }
        decided_by: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ExpertActivityEntry:
      type: object
      description: "EXPERT-FR-009 — một quyết định trong lịch sử hoạt động của farm"
      properties:
        _id: { type: string }
        action: { type: string }
        actor:
          type: object
          properties: { _id: { type: string }, full_name: { type: string } }
        actor_role: { type: string, enum: [DOMAIN_EXPERT, FARM_OWNER] }
        target_type: { type: string }
        target_id: { type: string }
        zone_id: { type: string, nullable: true }
        house_id: { type: string, nullable: true }
        metadata: { type: object, description: "Giá trị cũ/mới (`before`, `after`) hoặc kết quả kiểm chứng" }
        created_at: { type: string, format: date-time }

    FirmwareImage:
      type: object
      description: "Ảnh cài đặt firmware trong kho (không bao giờ trả khoá file)"
      properties:
        _id: { type: string }
        version: { type: string, example: "2.4.0" }
        size: { type: integer }
        sha256: { type: string }
        note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    FirmwareRollout:
      type: object
      description: "Đợt cập nhật firmware từ xa (FARM-FR-013b); không bao giờ trả token tải"
      properties:
        _id: { type: string }
        image_id: { type: string }
        version: { type: string, example: "2.5.0" }
        status: { type: string, enum: [ACTIVE, PAUSED, COMPLETED, CANCELLED] }
        stage: { type: string, enum: [CANARY, ALL], description: "CANARY = mới gửi cho máy thử trước" }
        paused_reason: { type: string, enum: [FAILURE, ADMIN], nullable: true }
        note: { type: string, nullable: true }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        targets:
          type: array
          items:
            type: object
            properties:
              node_id: { type: string }
              device_id: { type: string }
              from_version: { type: string }
              canary: { type: boolean }
              state: { type: string, enum: [QUEUED, SENT, SUCCEEDED, FAILED, CANCELLED, SKIPPED] }
              attempts: { type: integer }
              sent_at: { type: string, format: date-time, nullable: true }
              finished_at: { type: string, format: date-time, nullable: true }
              reason: { type: string, enum: [TIMEOUT, NOT_IN_SERVICE], nullable: true }
              token_expires_at: { type: string, format: date-time, nullable: true }
    ProvisionedDevice:
      type: object
      description: "FARM-FR-003 — thiết bị trong kho (không bao giờ trả secret_key/hash)"
      properties:
        _id: { type: string }
        device_id: { type: string }
        kind: { type: string, enum: [SENSOR, CAMERA] }
        claimed_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true, description: "Đã thu hồi — không kích hoạt được nữa" }
        revoke_reason: { type: string, nullable: true }
        simulated: { type: boolean, description: "SYSTEM-FR-004 — thiết bị của bộ giả lập" }
        chip_mac: { type: string, nullable: true, description: "MAC của chip khi nạp từ màn Kho thiết bị qua USB" }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        stock_status:
          type: string
          enum: [IN_STOCK, IN_SERVICE, RELEASED, REVOKED]
          description: |
            Trạng thái nhãn (Report 3 §6.16), suy ra mỗi lần đọc, không lưu: `REVOKED` khi đã thu hồi;
            `IN_SERVICE` khi đang dùng ở một farm; `RELEASED` khi đã từng kích hoạt rồi gỡ; còn lại
            `IN_STOCK`. Cấp lại key được ở `IN_STOCK` và `RELEASED`.

    HarvestStatus:
      type: string
      enum: [DRAFT, CONFIRMED]
      description: "HARVEST-FR-001, 006 — lô của Farm Technician chờ Farm Owner xác nhận (DRAFT); lô của Farm Owner xác nhận ngay"

    HarvestCycle:
      type: object
      description: "Chu kỳ thu hoạch của một zone (BR-43, Report 3 §6.22)"
      properties:
        _id: { type: string }
        farm_id: { type: string }
        house_id: { type: string }
        zone_id: { type: string }
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time, nullable: true, description: "Ngày thu hoạch đóng chu kỳ; null khi OPEN" }
        status: { type: string, enum: [OPEN, CLOSED, CONCLUDED] }
        closing_harvest:
          type: object
          nullable: true
          properties:
            date: { type: string, example: "2026-11-10", description: "Ngày giờ VN" }
            batch_ids: { type: array, items: { type: string } }
            nest_count: { type: integer }
            weight_grams: { type: number }
        comparison:
          type: object
          nullable: true
          properties:
            previous: { $ref: "#/components/schemas/HarvestCycleComparison" }
            same_period_last_year: { $ref: "#/components/schemas/HarvestCycleComparison" }
        health:
          type: object
          nullable: true
          properties:
            good_days_pct: { type: number, nullable: true }
            return_rate_avg: { type: number, nullable: true }
            time_in_range_pct: { type: number, nullable: true }
        completeness_pct: { type: number, nullable: true, description: "% số ngày của chu kỳ đã được đánh giá" }
        incomplete: { type: boolean, description: "Dưới 80 % số ngày được đánh giá (BR-43)" }
        expert_reminded_at: { type: string, format: date-time, nullable: true, description: "BR-22 — lần Farm Owner nhắc chuyên gia (POST /expert-activity/reminders); mỗi việc một lần" }
        conclusion:
          type: object
          nullable: true
          properties:
            text: { type: string }
            recommendations: { type: string, nullable: true }
            by: { type: string }
            role: { type: string, enum: [DOMAIN_EXPERT, FARM_OWNER] }
            at: { type: string, format: date-time }
    HarvestCycleComparison:
      type: object
      properties:
        cycle_id: { type: string, nullable: true }
        nest_count: { type: integer, nullable: true }
        weight_grams: { type: number, nullable: true }
        nest_count_change_pct: { type: number, nullable: true }
        weight_change_pct: { type: number, nullable: true }
        reason: { type: string, nullable: true, description: "Vì sao không so sánh được (không có chu kỳ trước, không có chu kỳ năm trước)" }
    HarvestBatch:
      type: object
      description: HARVEST-FR-001..005 — Harvest Batch (đợt thu hoạch), tự gắn env/flock snapshot lúc tạo
      properties:
        _id: { type: string }
        farm_id: { type: string }
        zone_id: { type: string }
        created_by: { type: string }
        trace_code:
          {
            type: string,
            description: "UUID dùng làm mã QR truy xuất nguồn gốc (HARVEST-FR-004)",
          }
        harvest_date: { type: string, format: date-time }
        nest_count: { type: integer }
        weight_grams: { type: number }
        nest_type: { type: string, enum: [RAW, CLEANED, PREMIUM] }
        product_images: { type: array, items: { type: string } }
        photo_url: { type: string, nullable: true, description: "HARVEST-FR-001 — link ký sẵn tới ảnh của lô (chỉ ở GET /harvests/{id} và PUT /harvests/{id}/photo); khoá ảnh không trả ra" }
        env_snapshot:
          type: object
          description: "HARVEST-FR-002 — trung bình môi trường 7 ngày trước thu hoạch"
          properties:
            avg_temperature: { type: number, nullable: true }
            avg_humidity: { type: number, nullable: true }
            avg_light_lux: { type: number, nullable: true }
            avg_nh3_ppm: { type: number, nullable: true }
            avg_co2_ppm: { type: number, nullable: true }
            telemetry_range:
              {
                type: object,
                properties:
                  {
                    from: { type: string, format: date-time },
                    to: { type: string, format: date-time },
                  },
              }
            insufficient_data:
              {
                type: boolean,
                description: "true khi Zone chưa đủ dữ liệu 7 ngày (Flow 7 case 3a)",
              }
        flock_snapshot:
          type: object
          description: "HARVEST-FR-003 — return rate trung bình 30 ngày (rỗng cho tới khi module VISION có dữ liệu thật)"
          properties:
            avg_return_rate_30d: { type: number, nullable: true, description: "Trung bình theo ngày của tỷ lệ chim về cả Zone (BirdCountDay.return_rate) trong 30 ngày trước mẻ" }
            estimated_population: { type: integer, nullable: true, description: "Số chim về buổi chiều lớn nhất của Zone trong 30 ngày (BirdCountDay.net_entry)" }
        status: { $ref: "#/components/schemas/HarvestStatus" }
        confirmed_by: { type: string, nullable: true, description: "Farm Owner xác nhận lô (HARVEST-FR-006)" }
        confirmed_at: { type: string, format: date-time, nullable: true }
        is_deleted: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

