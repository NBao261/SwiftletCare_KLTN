openapi: 3.0.3

info:
  title: SwiftletCare API
  version: 1.0.0
  description: |
    REST API cho hệ thống SwiftletCare (giám sát/điều khiển môi trường nhà yến,
    đếm chim, cảnh báo, kiểm chứng của chuyên gia, ghi nhận thu hoạch).
    Yêu cầu: Report 3 (`docs/reports/report3-srs.md`); thiết kế: Report 4 §7.1.

    **Lưu ý:** route mount trực tiếp ở root (vd `/auth/login`), không có
    tiền tố `/api/v1` (`backend/src/config/app.ts`).

    **Response envelope** dùng chung cho mọi endpoint:
    `{ success: boolean, data?, meta?: {page,limit,total}, error?: {code,message} }`.

    **Mã lỗi dùng chung cho mọi endpoint đã đăng nhập (SRS v2.1.3–2.1.4):**
    - `429 RATE_LIMITED` (SEC-NFR-004) — API đã đăng nhập: 300 request/phút **mỗi tài
      khoản** (chưa đăng nhập: theo IP). `POST /auth/login`, `/auth/reset-password`,
      `PUT /auth/password`, `POST /invitations/{token}/create-account`: 10 lần **sai**/15 phút
      theo IP; `/auth/forgot-password`: 10 lần/15 phút theo IP; `/auth/refresh`: 30/phút theo IP. Kèm header `Retry-After` và
      `error.details.retryAfterSec`; response có `X-RateLimit-Limit` / `X-RateLimit-Remaining`.
    - `403 PASSWORD_CHANGE_REQUIRED` (AUTH-FR-005c) — tài khoản đang giữ mật khẩu tạm do
      Admin cấp (`must_change_password`): mọi route trả mã này, trừ `PUT /auth/password` và
      `POST /auth/logout`. Client nên chuyển sang màn đổi mật khẩu.

    **Trạng thái triển khai (cập nhật sau khi hoàn thành các module nghiệp vụ
    Farm Owner — yêu cầu ở Report 3 `docs/reports/report3-srs.md`, chỗ còn thiếu ở `docs/reports/README.md`):**
    Auth, Farms, Devices, Telemetry, Alerts, Analytics, Harvests, HealthReports
    đều có logic thật phía sau. Module ticket (ticket, chat, SLA, gán ticket, lịch
    bảo trì định kỳ) đã gỡ theo Report 3 §8: cảnh báo chưa ai xác nhận được gửi lại
    (ALERT-FR-015), bảo trì bơm/quạt là cảnh báo `MAINTENANCE_DUE` (ALERT-FR-016).

    **Phạm vi SRS v2 (sau Review 1) — file này đã theo phạm vi mới:**
    - Role `DOMAIN_EXPERT` thay `FARM_OPERATOR`: chuyên gia nuôi yến do Primary Owner
      mời, phạm vi cả farm (không còn `zone_ids`, không còn
      `PUT /farms/{id}/members/{userId}`). Chỉ đọc dữ liệu vận hành; sửa ngưỡng, hệ số
      mờ và tham số phát hiện; kiểm chứng cảnh báo suy luận; viết kết luận. Không
      relay/loa, ghi thu hoạch hay xác nhận cảnh báo.
    - Không còn `/marketplace/*`; chỉ ghi nhận thu hoạch (`/harvests`).
    - Relay chỉ còn `misting`, `speaker`, `ventilation` (bỏ `heating`).
    - NH3/CO2 chỉ cảnh báo (`THRESHOLD_BREACH` mức MEDIUM, không gửi lại);
      loại cảnh báo `NOISE_ANOMALY` thay `BIRD_PANIC`.
    - Mới: `PUT /alerts/{id}/verdict`, `GET /alerts/verdict-stats`,
      `PUT /farms/zones/{zoneId}/detection-tuning`,
      `GET /devices/sensor-nodes/{id}/relay-overrides`, `GET /analytics/autonomy`,
      `/health-reports`, `/auth/telegram/link`.
    - Đếm chim phía backend: `GET /analytics/bird-count/buckets` (số đếm 5 phút); nút AI
      gửi heartbeat như ESP32, `vision/alert` nhận `EDGE_AI_DEGRADED`; danh sách camera
      không còn trả `rtsp_url`.
    - Hộp thông báo trong ứng dụng: `/notifications` (+ sự kiện Socket.io
      `NOTIFICATION_NEW` tới chính người nhận).
    - Live stream: `GET /devices/camera-nodes/{id}/stream-token`, `POST /internal/stream-auth` (MediaMTX).
    - SRS v2.1.8 — camera đếm chim gắn **nhà yến (House)**, không gắn Zone: đăng ký bằng `house_id`,
      `/analytics/bird-count/*?houseId=` (`zoneId` cũ vẫn nhận, quy ra House chứa Zone), mới
      `GET /analytics/bird-count/current`, `PUT /farms/houses/{houseId}/bird-count-tuning`,
      `GET /alerts?houseId=`; Socket.io `JOIN_HOUSE` → room `house:<id>` nhận `BIRD_COUNT_UPDATE`,
      trạng thái camera, cảnh báo của cả nhà. MQTT của nút AI: `swiftletcare/dev/{deviceId}/heartbeat|vision/bird-count|vision/alert` (G-07, Report 4 §7.2).

servers:
  - url: http://localhost:3000
    description: Local dev (docker-compose mongodb + emqx)

tags:
  - name: Auth
    description: "AUTH-FR-002..004/009/012 (đăng nhập/JWT/quên-đặt lại mật khẩu/yêu cầu xoá tài khoản). Không có đăng ký công khai và không đăng nhập bằng OTP (Report 3 §1.2, §8): Admin tạo tài khoản Farm Owner và Technician (AUTH-FR-005c), co-owner và Domain Expert tạo tài khoản từ link lời mời (`POST /invitations/{token}/create-account`, AUTH-FR-010)"
  - name: Admin
    description: AUTH-FR-005c/007/011/012, OPS-NFR-004 (quản lý tài khoản, khoá/mở khoá, xử lý yêu cầu xoá, dashboard trạng thái node toàn hệ thống) — mọi endpoint chỉ ADMIN
  - name: System
    description: SYSTEM-FR-001..003 (Module SYSTEM §5.11 — xem audit log, ngưỡng mặc định hệ thống, tổng quan sức khỏe hệ thống) — mọi endpoint chỉ ADMIN
  - name: Farms
    description: FARM-FR-001..002/007, AUTH-FR-005/010 (farm/house/zone/member/invitation)
  - name: Devices
    description: FARM-FR-003..007, ENV-FR-006/015..018, VISION-FR-013 (sensor/camera node, relay control, token xem live stream)
  - name: Agent
    description: "Nút AI gọi, không có tài khoản người dùng: mã cài đặt dùng một lần (`/agent/enroll`) hoặc Basic bằng mã thiết bị và mật khẩu broker (FARM-FR-004b, 010)"
  - name: Internal
    description: Dịch vụ nội bộ gọi backend (MediaMTX hỏi quyền stream) — không mở ra Internet
  - name: Telemetry
    description: "ENV-FR-001..005 — Farm Owner, Domain Expert của farm; Farm Technician chỉ ở nhà được giao (AUTH-FR-004, 013); Administrator → 403 (Report 3 §2.4, FARM-FR-009)"
  - name: Alerts
    description: "ALERT-FR-001/002/005/006/007/008/009/014/017/018, EXPERT-FR-003/021 (Alert Engine — dedup, định tuyến tới thợ đang trực và leo thang lên Farm Owner, quiet hours, danh sách, xác nhận kèm nguyên nhân tại chỗ, kiểm chứng, bằng chứng và kiểm tra tại chỗ của cảnh báo suy luận)"
  - name: WorkOrders
    description: "OPS-FR-001..004, 009, ALERT-FR-018, BR-39..41 (Work Order sửa chữa: mở tự động theo cảnh báo hoặc Farm Owner mở tay, thợ của nhà thực hiện, hệ thống kiểm dữ liệu phục hồi, Farm Owner duyệt; MTTA, MTTR). Farm Owner mở, duyệt, mở lại, huỷ, giao lại; Farm Technician thực hiện ở nhà được giao; Domain Expert chỉ đọc; Administrator → 403 (Report 3 §2.4)"
  - name: Maintenance
    description: "OPS-FR-005…008, ALERT-FR-016, BR-45 (bảo trì phòng ngừa: kế hoạch theo giờ chạy, số lần đóng cắt hoặc theo lịch, kèm checklist; đến hạn thì có `MAINTENANCE_DUE` và Work Order phòng ngừa; Farm Owner duyệt Work Order là một lần ghi bảo trì). Farm Owner tạo, sửa, xoá kế hoạch; Domain Expert đọc và góp ý; Farm Technician đọc kế hoạch của nhà được giao; Administrator → 403 (Report 3 §2.4)"
  - name: ExpertActivity
    description: "EXPERT-FR-009 — lịch sử quyết định của Domain Expert trên một farm (và các quyết định Farm Owner cũng làm được, BR-22); mục duyệt, đề xuất, lời nhắc chuyên gia; chỉ Farm Owner và Domain Expert của farm"
  - name: Analytics
    description: "ANALYTICS-FR-001..005, VISION-FR-008..011 (biểu đồ môi trường, so sánh đa Zone, đếm chim/return-rate — chờ dữ liệu thật từ module VISION) — Farm Owner, Domain Expert của farm; Farm Technician chỉ ở nhà được giao (AUTH-FR-004, 013), trừ `/analytics/control/suggestion`; Administrator → 403 (Report 3 §2.4, FARM-FR-009)"
  - name: Harvests
    description: "HARVEST-FR-001..005 (ghi nhận thu hoạch — tự gắn env/flock snapshot + trace code; Marketplace đã bỏ ở SRS v2.0.0) — ghi: Farm Owner; đọc: Farm Owner, Domain Expert; Technician, Administrator → 403 (Report 3 §2.4)"
  - name: HealthReports
    description: "EXPERT-FR-005/006/013 (báo cáo sức khỏe theo nhà yến ngày/tuần/tháng/theo yêu cầu, mỗi Zone một mục, kết luận của Domain Expert); ANALYTICS-FR-012…014, EXPERT-FR-012/013 (trạng thái sức khỏe ngày theo nhà yến, chấm sau khi xem trạng thái BR-31, CSV, độ khớp) — FARM_OWNER, DOMAIN_EXPERT; Technician, Administrator → 403"
  - name: Notifications
    description: EXPERT-FR-006/007 (hộp thông báo trong ứng dụng của chính người gọi — mọi role đã đăng nhập)
  - name: Profiles
    description: "EXPERT-FR-014, 015 (hồ sơ cấu hình: Domain Expert và Farm Owner soạn bản nháp, chỉ Domain Expert duyệt và lưu trữ — BR-22; Farm Owner áp cho các nhà) — Farm Technician, Administrator → 403"
  - name: Recommendations
    description: "EXPERT-FR-016…019 (luật khuyến nghị: Domain Expert viết và bật; Farm Owner viết thì luật chờ chuyên gia bật, BR-22; khuyến nghị: Farm Owner chấp nhận hoặc từ chối, chuyên gia và thợ của nhà chỉ đọc) — Administrator → 403"


security:
  - bearerAuth: []

paths:
  # ── AUTH ──────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập (email/password)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Đăng nhập thành công — refreshToken trả qua httpOnly cookie
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            Tài khoản bị Admin khoá (AUTH-FR-011, Flow 19 bước 4). Chỉ trả sau
            khi mật khẩu đúng — sai mật khẩu vẫn là 401, không lộ trạng thái khoá.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                success: false
                error:
                  code: ACCOUNT_DISABLED
                  message: "Tài khoản đã bị khoá. Lý do: Vi phạm điều khoản sử dụng"
                  details: { reason: "Vi phạm điều khoản sử dụng" }

  /auth/me:
    get:
      tags: [Auth]
      summary: "Tài khoản đang đăng nhập (ALERT-FR-013, AUTH-FR-012)"
      description: |
        Trả cùng dạng `user` của `POST /auth/login`: `telegram_linked`, `notification_preferences`,
        `deletion_requested_at`, `must_change_password`, `status` (và `is_active` suy ra). Không bao giờ trả
        hash mật khẩu, refresh token, mã đặt lại hay mã liên kết Telegram. Client gọi lại sau khi liên kết
        Telegram qua bot, gửi hoặc huỷ yêu cầu xoá tài khoản.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới Access Token bằng refreshToken cookie
      security: []
      responses:
        "200":
          description: Access token mới
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      {
                        data:
                          {
                            type: object,
                            properties: { accessToken: { type: string } },
                          },
                      }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Đăng xuất — thu hồi refreshToken hiện tại
      responses:
        "200":
          {
            description: Đã đăng xuất,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: "Quên mật khẩu — gửi mã đặt lại (AUTH-FR-009, Flow 11 bước 6)"
      security: []
      description: |
        Luôn trả 200 kể cả khi email không tồn tại, để không lộ thông tin tài
        khoản (Flow 11 case 1a). Mã 6 chữ số có TTL 15 phút, dùng 1 lần, gửi qua
        e-mail (SMTP, Report 4 §2.1); mã không bao giờ được ghi log. Response trả về
        trước khi thư đi (không chờ SMTP), để thời gian phản hồi giống nhau dù email có
        tài khoản hay không. Máy chủ chưa cấu hình SMTP thì không gửi được thư (chỉ ghi
        một cảnh báo không kèm mã). SMTP chờ tối đa 10 giây mỗi bước (Report 3 §4.5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email],
                properties: { email: { type: string, format: email } },
              }
      responses:
        "200":
          {
            description: "Nếu email tồn tại, mã đặt lại đã được gửi",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: "Đặt mật khẩu mới bằng mã đã nhận (AUTH-FR-009, Flow 11 bước 7)"
      security: []
      description: |
        Đổi mật khẩu thành công sẽ thu hồi TOÀN BỘ refresh token cũ của user
        (đá khỏi mọi thiết bị khác đang đăng nhập), không chỉ chặn đăng nhập mới.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, newPassword]
              properties:
                email: { type: string, format: email }
                token:
                  {
                    type: string,
                    description: "Mã 6 số nhận được từ /auth/forgot-password",
                  }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          {
            description: Đã đổi mật khẩu,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "400":
          {
            description: Mã đặt lại không đúng hoặc đã hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/password:
    put:
      tags: [Auth]
      summary: "Đổi mật khẩu khi đang đăng nhập — mọi role (AUTH-FR-005c)"
      description: |
        Cách duy nhất để bỏ mật khẩu tạm do Admin cấp (`must_change_password` → `false`);
        route này vẫn gọi được khi các route khác đang trả 403 `PASSWORD_CHANGE_REQUIRED`.
        Thu hồi refresh token của mọi thiết bị khác, **giữ** phiên hiện tại (refresh token
        đọc từ cookie, hoặc `refreshToken` trong body cho mobile). Sai mật khẩu hiện tại
        trả 400 (không phải 401, để client không tưởng token hết hạn). Tính vào giới hạn
        10 lần sai/15 phút theo IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, description: "Phải khác mật khẩu hiện tại" }
                refreshToken: { type: string, description: "Chỉ mobile — phiên cần giữ lại" }
      responses:
        "200": { description: Đã đổi mật khẩu, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "400":
          description: "INVALID_CURRENT_PASSWORD — mật khẩu hiện tại sai; PASSWORD_UNCHANGED — mật khẩu mới trùng mật khẩu cũ"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/notification-preferences:
    put:
      tags: [Auth]
      summary: "Cấu hình kênh nhận thông báo + giờ im lặng (ALERT-FR-005/006/013) — mọi role"
      description: |
        `telegram` chỉ có tác dụng khi tài khoản đã liên kết bot (`POST /auth/telegram/link`).
        Zalo/SMS nằm ngoài phạm vi (Report 3 §8): trường lạ gửi lên bị bỏ qua.

        ALERT-FR-005 — kênh theo loại sự kiện: `by_severity` ghi đè `push`/`telegram` cho cảnh báo
        mức đó; mức không ghi thì dùng `push`/`telegram` chung. Cảnh báo luôn có trong ứng dụng dù
        tắt mọi kênh. Cấu hình làm cảnh báo CRITICAL không còn kênh ngoài ứng dụng nào (cả push lẫn
        Telegram đều tắt) → 400. Gửi `by_severity.<mức>: null` để bỏ ghi đè của mức đó.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                push: { type: boolean }
                telegram: { type: boolean }
                by_severity:
                  type: object
                  properties:
                    CRITICAL: { $ref: "#/components/schemas/ChannelChoice" }
                    HIGH: { $ref: "#/components/schemas/ChannelChoice" }
                    MEDIUM: { $ref: "#/components/schemas/ChannelChoice" }
                    LOW: { $ref: "#/components/schemas/ChannelChoice" }
                quiet_hours:
                  type: object
                  description: "Giờ `HH:mm` theo giờ VN; chuỗi rỗng ở `start` hoặc `end` = tắt giờ im lặng"
                  properties:
                    {
                      start: { type: string, example: "22:00", description: "HH:mm hoặc chuỗi rỗng" },
                      end: { type: string, example: "06:00", description: "HH:mm hoặc chuỗi rỗng" },
                    }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/User" } },
                            },
                          ],
                      },
                  },
              },
          }
        "400": { description: "Cảnh báo CRITICAL không còn kênh ngoài ứng dụng nào (ALERT-FR-005)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Report 3 §2.4: Domain Expert và Administrator chỉ nhận thông báo trong ứng dụng nên không chọn kênh; Farm Technician chọn kênh nhưng không đặt giờ im lặng (chỉ Farm Owner, ALERT-FR-006)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/telegram/link:
    post:
      tags: [Auth]
      summary: "Tạo mã liên kết bot Telegram (ALERT-FR-013)"
      description: |
        Trả deep link `https://t.me/<bot>?start=<mã>`; mã dùng một lần, sống 10 phút. Người
        dùng mở link, Telegram gửi `/start <mã>` cho bot, backend lưu chat id và từ đó gửi
        cảnh báo qua Telegram theo cùng luật với push (người nhận, mức độ, giờ im lặng).
        Chỉ liên kết được trong chat riêng với bot (gửi mã trong nhóm bị từ chối); một chat chỉ
        gắn với một tài khoản.
        503 khi máy chủ chưa cấu hình `TELEGRAM_BOT_TOKEN`/`TELEGRAM_BOT_USERNAME`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          deep_link: { type: string, example: "https://t.me/swiftletcare_bot?start=4f1c…" }
                          expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "Chưa cấu hình bot Telegram", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
    delete:
      tags: [Auth]
      summary: "Hủy liên kết Telegram (ALERT-FR-013)"
      description: |
        Telegram đang là kênh ngoài ứng dụng duy nhất của cảnh báo CRITICAL (push của CRITICAL tắt) thì 400: bật push
        cho CRITICAL trước (ALERT-FR-005).
      responses:
        "200": { description: Đã hủy liên kết, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "400": { description: "CRITICAL sẽ không còn kênh ngoài ứng dụng nào", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/delete-request:
    post:
      tags: [Auth]
      summary: "Yêu cầu xoá tài khoản/dữ liệu cá nhân (AUTH-FR-012, PRIV-NFR-003)"
      description: |
        Chỉ ĐÁNH DẤU `deletion_requested_at` — việc xoá thật (kèm quy tắc
        cascade chuyển Primary Owner / xoá mềm Farm) do Administrator xử lý
        trong ≤ 30 ngày (Flow 19): `PUT /admin/delete-requests/{id}/complete` hoặc
        `.../reject`. Admin được báo ngay, và được nhắc lại một lần khi yêu cầu đã
        chờ ≥ 23 ngày.
      responses:
        "200":
          {
            description: Đã ghi nhận yêu cầu,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          {
            description: Đã có yêu cầu xoá trước đó đang chờ xử lý,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
    delete:
      tags: [Auth]
      summary: "Huỷ yêu cầu xoá tài khoản đang chờ (AUTH-FR-012)"
      description: "User đổi ý trước khi Admin xử lý. Audit `DELETION_CANCELLED`, Admin được báo."
      responses:
        "200": { description: Đã huỷ yêu cầu, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "Chưa có yêu cầu xoá nào để huỷ"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  # ── ADMIN ─────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      tags: [Admin]
      summary: "Danh sách tài khoản, lọc theo role/trạng thái, tìm theo tên/email/SĐT (AUTH-FR-011) — chỉ ADMIN"
      parameters:
        - { name: role, in: query, schema: { $ref: "#/components/schemas/Role" } }
        - name: status
          in: query
          description: "`inactive` = đang bị khoá; `deleted` = đã xoá theo yêu cầu (AUTH-FR-012, cũng `is_active=false` nhưng không mở khoá được)"
          schema: { type: string, enum: [active, inactive, deleted] }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: "Tìm trong full_name, email, phone — không phân biệt hoa/thường" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/farm-owners:
    post:
      tags: [Admin]
      summary: "Tạo tài khoản Farm Owner với mật khẩu tạm (AUTH-FR-005c) — chỉ ADMIN"
      description: |
        Không có đăng ký công khai (Report 3 §1.2): Administrator tạo tài khoản Farm Owner. Hệ thống sinh mật khẩu tạm
        12 ký tự ngẫu nhiên (Report 3 §4.5), bật `must_change_password` và gửi mật khẩu tạm qua e-mail tới `email`;
        mật khẩu tạm không bao giờ có trong response hay log. Tới khi đổi mật khẩu (`PUT /auth/password`), mọi request
        khác ngoài đổi mật khẩu và đăng xuất trả 403 `PASSWORD_CHANGE_REQUIRED`. Email đã có tài khoản (mọi role) → 409.
        Ghi audit `FARM_OWNER_CREATED`. Máy chủ chưa cấu hình SMTP thì tài khoản vẫn được tạo nhưng thư không đi:
        `temporary_password_emailed: false`; khi đã có SMTP, Farm Owner đặt mật khẩu bằng "quên mật khẩu".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, full_name]
              properties:
                email: { type: string, format: email }
                full_name: { type: string }
                phone: { type: string }
      responses:
        "201":
          description: Đã tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/User"
                          - type: object
                            properties:
                              temporary_password_emailed: { type: boolean, description: "Thư mật khẩu tạm đã được máy chủ SMTP nhận" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Email đã có tài khoản", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/users/{id}/status:
    put:
      tags: [Admin]
      summary: "Khoá/mở khoá tài khoản (AUTH-FR-011, Flow 19) — chỉ ADMIN"
      description: |
        Bắt buộc `reason` khi khoá (`is_active=false`); không bắt buộc khi mở
        khoá. Middleware `authenticate` chặn ngay request kế tiếp của user này
        dù access token còn hạn — không cần đợi token hết hạn tự nhiên.
        Admin không tự khoá được chính mình, nhờ vậy hệ thống luôn còn ít nhất
        1 Admin đang hoạt động (Flow 19 case 2a).

        Khi khoá: thu hồi mọi refresh token và ngắt các kết nối Socket.io đang
        mở của user (kết nối mới bằng access token còn hạn cũng bị từ chối).

        Trạng thái theo SM-14 (Report 3 §6.14): khoá ACTIVE → LOCKED, mở khoá LOCKED → ACTIVE; tài khoản
        DELETION_REQUESTED không khoá được (409, xử lý hoặc từ chối yêu cầu xoá trước), tài khoản DELETED
        không khoá hay mở khoá được (409).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
                  description: "Chuỗi \"true\"/\"false\"/\"1\"/\"0\" cũng được chấp nhận và ép về boolean trước khi xử lý"
                reason: { type: string, description: "Bắt buộc khi is_active=false" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/User" }
        "400":
          description: "Thiếu reason khi khoá tài khoản, hoặc Admin tự khoá chính mình"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Tài khoản đã xoá, hoặc đang chờ xoá mà bị khoá", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/delete-requests:
    get:
      tags: [Admin]
      summary: "Danh sách yêu cầu xoá tài khoản đang chờ xử lý (AUTH-FR-012) — chỉ ADMIN; web đọc `meta.total` làm badge mục Người dùng"
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/User" } }
                      meta: { $ref: "#/components/schemas/PageMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/delete-requests/{id}/complete:
    put:
      tags: [Admin]
      summary: "Xác nhận hoàn tất xử lý xoá tài khoản (AUTH-FR-012, Flow 19 bước 7-8) — chỉ ADMIN"
      description: |
        Cascade: Farm mà user là Primary Owner còn thành viên khác → chuyển
        `owner_id` cho người có `joined_at` sớm nhất; hết thành viên → xoá mềm
        Farm. Gỡ user khỏi `members` của các Farm khác nếu chỉ là thành viên
        thường. Anonymize email/phone/full_name, không xoá document (giữ FK
        cho lịch sử farm/audit). Xử lý xong thì gỡ `deletion_requested_at` —
        tài khoản rời khỏi `GET /admin/delete-requests` và không xử lý lại được.

        Mỗi Farm được chuyển chủ/xoá mềm có 1 bản ghi audit riêng
        (`FARM_OWNERSHIP_TRANSFERRED`, `FARM_SOFT_DELETED`) và chủ mới cùng người bị
        xoá nhận thông báo; kết nối Socket.io của user bị ngắt. Cũng dọn các liên
        kết trỏ tới user: cho hết hạn (`EXPIRED`) các lời mời đang chờ user đã gửi, đặt `deleted_at`
        (tài khoản đã xoá không khoá/mở khoá lại được, 409). Audit `ACCOUNT_DELETED`
        ghi `farmsTransferred`, `farmsDeleted`. Nếu lỗi giữa chừng
        (Mongo standalone, không transaction) thì gọi lại được: farm đã xử lý xong
        không bị xử lý lần nữa.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: "Đã xử lý xong (anonymized)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "400":
          description: "Người dùng chưa gửi yêu cầu xoá / yêu cầu đã được xử lý / Admin tự xử lý tài khoản của chính mình"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/delete-requests/{id}/reject:
    put:
      tags: [Admin]
      summary: "Từ chối yêu cầu xoá tài khoản (AUTH-FR-012) — chỉ ADMIN"
      description: |
        VD còn nghĩa vụ lưu hồ sơ. Tài khoản giữ nguyên, rời hàng đợi
        `GET /admin/delete-requests`; người yêu cầu được báo kèm lý do. Audit
        `DELETION_REJECTED`. Admin không tự xử lý yêu cầu của chính mình.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, description: "Bắt buộc, gửi lại cho người yêu cầu" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "400":
          description: "Người dùng chưa gửi yêu cầu xoá, hoặc Admin tự xử lý yêu cầu của chính mình"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ── SYSTEM ────────────────────────────────────────────────────────────────
  /admin/provisioned-devices:
    post:
      tags: [Admin]
      summary: "Nhập thiết bị vào kho, cấp secretKey để in nhãn (FARM-FR-003) — chỉ ADMIN"
      description: |
        `secret_key` (dạng XXXX-XXXX-XXXX) chỉ trả về **đúng 1 lần** trong response
        này — backend chỉ lưu SHA-256, không xem lại được. Technician nhập cặp
        `{device_id, secret_key}` khi onboarding.

        `broker_secret` (FARM-FR-010) là mật khẩu broker của thiết bị, cũng chỉ trả **đúng 1 lần**:
        nạp vào thiết bị lúc flash cùng `device_id` (`firmware/tools/flash_identity.py`), không in lên nhãn.

        Nạp từ màn Kho thiết bị qua USB (Web Serial, firmware ≥ 2.4.0): trang gửi `chip_mac` đọc từ chip để biết bo mạch
        nào mang mã nào (một chip một mã, trùng → 409), rồi ghi `device_id`, `broker_secret` và `broker_host` vào chip.
        `broker_host` lấy từ `DEVICE_BROKER_HOST`; `null` thì thiết bị dùng địa chỉ biên dịch sẵn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, kind]
              properties:
                device_id: { type: string, pattern: "^[A-Za-z0-9_-]+$", maxLength: 40, example: node_101, description: "Chỉ chữ, số, `_`, `-` (NFR-10 d): device ID là username và một đoạn topic trên broker, nên `+`, `#`, `/` hay khoảng trắng → 422; tối đa 40 ký tự như firmware nhận khi nạp qua USB" }
                kind: { type: string, enum: [SENSOR, CAMERA] }
                simulated: { type: boolean, default: false, description: "SYSTEM-FR-004 — thiết bị của bộ giả lập; controller/camera đăng ký từ mục kho này mang cờ simulated" }
                chip_mac: { type: string, pattern: "^[0-9A-Fa-f]{12}$", example: A1B2C3D4E5F6, description: "MAC của chip khi nạp qua USB; lưu chữ hoa; chip đã có trong kho → 409, trừ khi mục đó đã thu hồi (mục cũ nhả MAC)" }
      responses:
        "201":
          description: Đã cấp
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { device_id: { type: string }, kind: { type: string }, simulated: { type: boolean }, broker_secret: { type: string, description: "Mật khẩu broker, chỉ trả 1 lần" }, secret_key: { type: string, example: "K7QM-3XPA-9RTD" }, broker_host: { type: string, nullable: true, description: "DEVICE_BROKER_HOST, nạp cùng danh tính" }, chip_mac: { type: string, nullable: true } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Admin]
      summary: "Danh sách kho thiết bị (FARM-FR-003) — chỉ ADMIN"
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [SENSOR, CAMERA] } }
        - { name: claimed, in: query, schema: { type: string, enum: ["true", "false"] }, description: "Đã/chưa kích hoạt" }
        - { name: revoked, in: query, schema: { type: string, enum: ["true", "false"] }, description: "Đã/chưa bị thu hồi" }
        - { name: deviceId, in: query, schema: { type: string, pattern: "^[A-Za-z0-9_-]+$" }, description: "Đúng một mã: màn nạp tìm mục kho của bo mạch đang cắm" }
        - { name: chipMac, in: query, schema: { type: string, pattern: "^[0-9A-Fa-f]{12}$" }, description: "MAC của chip: bo đã nạp mà mất mã (nạp lại toàn bộ chip) vẫn tìm được mục kho" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/ProvisionedDevice" } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/firmware-images:
    post:
      tags: [Admin]
      summary: "Tải lên ảnh cài đặt firmware cho trạm nạp (FARM-FR-010, Report 4 D9) — chỉ ADMIN"
      description: |
        Ảnh gộp bootloader, bảng phân vùng, boot_app0 và firmware, ghi từ 0x0 (`pio run -e esp32prod -t factory`).
        File chứa giá trị `Secrets.h` nên chỉ nằm trong kho file của backend (khoá `firmware/…`) và chỉ tải về qua route có đăng nhập; `/files` của chế độ local từ chối mọi đường dẫn vào `firmware/`.
        Backend kiểm: dài hơn 0x10000 và không quá 0x10000 + 0x1E0000 byte (phân vùng app0), byte `0xE9` ở 0x1000 và 0x10000,
        trong file có `Firmware v<version>` (dòng chào khi khởi động). Audit `FIRMWARE_IMAGE_UPLOADED`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [version, file]
              properties:
                version: { type: string, pattern: "^\\d+\\.\\d+\\.\\d+$", example: "2.4.0" }
                note: { type: string, maxLength: 200 }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Đã lưu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/FirmwareImage" } }
        "400": { description: "Chưa chọn file, hoặc file không phải ảnh cài đặt của đúng phiên bản", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Kho đã có phiên bản này", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Admin]
      summary: "Danh sách firmware trong kho, mới nhất trước theo số phiên bản — chỉ ADMIN"
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/FirmwareImage" } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/firmware-images/{id}/file:
    get:
      tags: [Admin]
      summary: "Tải ảnh cài đặt về để trang nạp qua USB — chỉ ADMIN"
      description: File nhị phân (không bọc envelope); header `X-Firmware-Sha256` để trang kiểm trước khi ghi vào chip.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Ảnh cài đặt
          headers: { X-Firmware-Sha256: { schema: { type: string } } }
          content: { application/octet-stream: { schema: { type: string, format: binary } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/firmware-images/{id}:
    delete:
      tags: [Admin]
      summary: "Xoá một firmware khỏi kho — chỉ ADMIN"
      description: Audit `FIRMWARE_IMAGE_DELETED`. Bản đang dùng trong một đợt cập nhật chưa xong (`ACTIVE`, `PAUSED`) → 409.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: Đã xoá, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/firmware-rollouts:
    get:
      tags: [Admin]
      summary: "Các đợt cập nhật firmware từ xa, mới nhất trước — chỉ ADMIN (FARM-FR-013b)"
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Danh sách đợt, mỗi đợt kèm từng bộ điều khiển và trạng thái của nó
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: array, items: { $ref: "#/components/schemas/FirmwareRollout" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: "Tạo đợt cập nhật firmware từ xa — chỉ ADMIN (FARM-FR-013b)"
      description: |
        Một bản trong kho firmware cho các bộ điều khiển chọn. Máy online nhận lệnh `OTA` ngay (máy thử trước nếu
        có `canary_node_ids`, các máy còn lại khi mọi máy thử đã lên bản mới); máy offline chờ trong đợt và nhận lệnh
        ở heartbeat đầu tiên khi online lại. Lệnh mang `{ version, url, sha256 }` như lệnh OTA gửi tay: `url` là link
        tải dùng riêng cho máy đó (`GET /firmware/ota/{token}`, hết hạn sau 30 phút), `sha256` là của phần firmware
        (từ 0x10000 của ảnh cài đặt). Một máy quá 30 phút chưa xác nhận → máy `FAILED`, đợt tự `PAUSED`
        (`paused_reason: FAILURE`) và người tạo được báo. Audit `FIRMWARE_ROLLOUT_CREATED`, mỗi lần gửi
        `DEVICE_COMMAND_SENT`, Farm Owner của trang trại được báo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_id, node_ids]
              properties:
                image_id: { type: string, description: "_id trong kho firmware" }
                node_ids: { type: array, minItems: 1, maxItems: 500, items: { type: string }, description: "_id bộ điều khiển đang dùng" }
                canary_node_ids: { type: array, maxItems: 500, items: { type: string }, description: "Máy thử trước, phải nằm trong node_ids; trống = gửi tất cả ngay" }
                note: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Đã tạo; máy online tới lượt đã được gửi lệnh
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/FirmwareRollout" } }
        "400": { description: "Máy thử trước không nằm trong máy chọn, hoặc có bộ điều khiển không còn dùng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Có máy chạy firmware trước 1.4.0, đã chạy đúng bản, hoặc đang có một lần cập nhật chưa xong (đợt khác hoặc lệnh gửi tay); câu báo liệt kê từng máy", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: "Chưa cấu hình `OTA_DOWNLOAD_BASE_URL` (HTTPS)", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /admin/firmware-rollouts/{id}/pause:
    post:
      tags: [Admin]
      summary: "Tạm dừng đợt cập nhật (máy đang tải vẫn ghi kết quả) — chỉ ADMIN"
      description: Audit `FIRMWARE_ROLLOUT_PAUSE`. Đợt không ở `ACTIVE` → 409.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: &rolloutActionResponses
        "200":
          description: Đợt sau khi đổi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/FirmwareRollout" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/firmware-rollouts/{id}/resume:
    post:
      tags: [Admin]
      summary: "Tiếp tục đợt đang dừng và gửi cho máy online tới lượt — chỉ ADMIN"
      description: Audit `FIRMWARE_ROLLOUT_RESUME`. Đợt không ở `PAUSED` → 409; đợt còn ở lượt máy thử mà máy thử đã lỗi → 409 (thử lại máy thử hoặc gửi tất cả trước).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: *rolloutActionResponses

  /admin/firmware-rollouts/{id}/promote:
    post:
      tags: [Admin]
      summary: "Gửi cho mọi máy ngay, không chờ máy thử trước — chỉ ADMIN"
      description: Audit `FIRMWARE_ROLLOUT_PROMOTE`. Đợt đã ở lượt tất cả máy, hoặc đã kết thúc → 409.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: *rolloutActionResponses

  /admin/firmware-rollouts/{id}/cancel:
    post:
      tags: [Admin]
      summary: "Huỷ đợt: máy còn chờ thành CANCELLED, máy đang tải vẫn ghi kết quả — chỉ ADMIN"
      description: Audit `FIRMWARE_ROLLOUT_CANCEL`. Đợt đã kết thúc → 409.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: *rolloutActionResponses

  /admin/firmware-rollouts/{id}/targets/{nodeId}/retry:
    post:
      tags: [Admin]
      summary: "Thử lại một máy cập nhật lỗi — chỉ ADMIN"
      description: |
        Máy `FAILED` về `QUEUED`. Đợt đã xong hoặc tự dừng vì lỗi thì chạy tiếp; đợt Administrator tự dừng vẫn dừng.
        Máy không ở `FAILED` hoặc đợt đã huỷ → 409. Audit `FIRMWARE_ROLLOUT_RETRY`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: nodeId, in: path, required: true, schema: { type: string } }
      responses: *rolloutActionResponses

  /firmware/ota/{token}:
    get:
      tags: [Devices]
      summary: "Bộ điều khiển tải firmware của đợt cập nhật (không đăng nhập, link dùng riêng cho máy)"
      description: |
        `token` nằm trong `url` của lệnh `OTA` mà đợt cập nhật gửi; chỉ SHA-256 của nó được lưu. Dùng được khi máy
        đang chờ xác nhận và chưa quá 30 phút kể từ lúc gửi. Trả phần firmware (từ 0x10000 của ảnh cài đặt) kèm
        `Content-Length`. Backend và Nginx staging không ghi URL này vào log.
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string, pattern: "^[0-9a-fA-F]{64}$" } }]
      responses:
        "200": { description: Firmware, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/provisioned-devices/{id}/revoke:
    put:
      tags: [Admin]
      summary: "Thu hồi thiết bị trong kho (FARM-FR-003) — chỉ ADMIN"
      description: |
        Mất/lộ nhãn, hàng lỗi. Từ đó kích hoạt bị từ chối: nhập đúng secretKey thì 409 "đã
        bị thu hồi", sai key vẫn chỉ là 400 "mã không đúng" (không lộ thiết bị nào bị thu
        hồi). Thiết bị đang chạy ở một farm phải gỡ trước (`.../decommission`) — thu hồi
        không tắt được thiết bị đang hoạt động. Thu hồi là trạng thái cuối. Audit
        `DEVICE_PROVISION_REVOKED`.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string }, description: "_id trong kho (không phải device_id)" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/ProvisionedDevice" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Thiết bị đang hoạt động ở một farm, hoặc đã bị thu hồi"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /admin/provisioned-devices/{id}/rotate-key:
    post:
      tags: [Admin]
      summary: "Cấp secretKey mới để in lại nhãn khi nhãn bị mất hoặc lộ (FARM-FR-010, BR-26) — chỉ ADMIN"
      description: |
        Cấp được khi thiết bị không đang dùng ở farm nào: còn trong kho (`IN_STOCK`) hoặc đã gỡ
        khỏi farm (`RELEASED`, Report 3 §6.16). Thiết bị không lưu secretKey (BR-26) nên đổi ở
        backend không làm thiết bị lệch. Nhãn cũ bị từ chối (400) ngay; key mới trả **đúng 1 lần**.
        Audit `DEVICE_PROVISION_KEY_ROTATED` (`released: true` khi thiết bị đã gỡ).
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { device_id: { type: string }, kind: { type: string }, secret_key: { type: string, example: "K7QM-3XPA-9RTD" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Thiết bị đang dùng ở một farm (gỡ trước rồi mới cấp lại), hoặc đã bị thu hồi"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /admin/provisioned-devices/{id}/setup-code:
    post:
      tags: [Admin]
      summary: "Mã cài đặt nút AI (FARM-FR-010) — chỉ ADMIN"
      description: |
        Chỉ cho mục kho loại CAMERA chưa thu hồi (loại khác 400, đã thu hồi 409). Mã 8 ký tự `XXXX-XXXX`, dùng một lần,
        hết hạn sau 30 phút, backend chỉ giữ SHA-256; tạo mã mới thì mã cũ chưa dùng mất hiệu lực. Nút AI đổi mã ở
        `POST /agent/enroll` (`tools/setup_node.py`). Audit `AI_NODE_SETUP_CODE_ISSUED`.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "201":
          description: Mã chỉ trả một lần
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { device_id: { type: string }, setup_code: { type: string, example: 7KQ2-M9XA }, expires_at: { type: string, format: date-time } } } }
        "400": { description: "Mục kho không phải camera đếm chim", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /agent/enroll:
    post:
      tags: [Agent]
      summary: "Nút AI đổi mã cài đặt lấy danh tính (FARM-FR-010) — không đăng nhập"
      description: |
        Mã đúng, chưa dùng, chưa hết hạn, mục kho chưa thu hồi: xoá mã và cấp mật khẩu broker mới trong một lần ghi (máy
        cũ dùng mật khẩu cũ bị ngắt). Mật khẩu chỉ trả một lần. Mã gõ thường hay hoa, có hay không có `-` đều nhận.
        Giới hạn số lần sai theo IP như đăng nhập. Audit `AI_NODE_ENROLLED`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [setup_code], properties: { setup_code: { type: string, minLength: 8, maxLength: 20 } } }
      responses:
        "200":
          description: Danh tính của nút AI
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          device_id: { type: string }
                          broker_secret: { type: string }
                          broker:
                            type: object
                            nullable: true
                            description: "Từ DEVICE_BROKER_HOST, cổng 8883 TLS; null = nút AI giữ cấu hình trong config.yaml (máy dev)"
                            properties: { host: { type: string }, port: { type: integer }, tls: { type: boolean } }
                          stream_publish_url: { type: string, nullable: true, description: "STREAM_PUBLISH_BASE/cam-<mã> kèm tài khoản riêng của nút AI; null khi chưa cấu hình" }
        "400": { description: "Mã không đúng hoặc đã hết hạn", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: "Quá nhiều lần sai từ một IP", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /agent/camera-source:
    get:
      tags: [Agent]
      summary: "Nút AI lấy địa chỉ camera IP của nó (FARM-FR-004b)"
      description: |
        Xác thực `Authorization: Basic base64(<mã thiết bị>:<mật khẩu broker>)`, kiểm như `/internal/mqtt-auth`. Nút AI gọi
        khi khởi động và khi `camera_source_version` trong `config` retained đổi. Trả URL RTSP đã giải mã (có mật khẩu
        camera), `Cache-Control: no-store`; nút AI chỉ giữ trong bộ nhớ.
      security: [{ deviceBasicAuth: [] }]
      responses:
        "200":
          description: "`rtsp_url` null và `version` 0 khi Farm Owner chưa nhập địa chỉ"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { version: { type: integer }, rtsp_url: { type: string, nullable: true } } } }
        "401": { description: "Sai tài khoản thiết bị hoặc mục kho đã thu hồi", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { description: "Nút AI chưa được gắn vào nhà yến nào", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "503": { description: "Chưa cấu hình CAMERA_SOURCE_KEY", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /admin/provisioned-devices/{id}/rotate-broker-secret:
    post:
      tags: [Admin]
      summary: "Cấp mật khẩu broker mới cho thiết bị (FARM-FR-010) — chỉ ADMIN"
      description: |
        Dùng khi mật khẩu bị lộ, hoặc thiết bị nhập kho trước G-07 chưa có mật khẩu. Mật khẩu cũ hết
        dùng được ở lần kết nối sau; mật khẩu mới trả **đúng 1 lần** và phải flash lại vào thiết bị.
        Audit `DEVICE_BROKER_SECRET_ROTATED`.
      parameters:
        [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { type: object, properties: { device_id: { type: string }, kind: { type: string }, broker_secret: { type: string }, broker_host: { type: string, nullable: true } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "Thiết bị đã bị thu hồi"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /system/audit-logs:
    get:
      tags: [System]
      summary: "Xem/lọc Audit Log toàn hệ thống (SYSTEM-FR-001) — chỉ ADMIN"
      description: |
        Các action đang được ghi: LOGIN, LOGIN_FAILED, PASSWORD_RESET,
        ACCOUNT_LOCKED, ACCOUNT_UNLOCKED, DELETION_REQUESTED, ACCOUNT_DELETED,
        FARM_OWNERSHIP_TRANSFERRED, FARM_SOFT_DELETED, USER_CREATED,
        THRESHOLD_UPDATED, DEFAULT_THRESHOLDS_UPDATED,
        RELAY_OVERRIDE, RELAY_OVERRIDE_CLEARED, SPEAKER_SCHEDULE_UPDATED,
        AUDIO_TRACK_UPLOADED/SYNC_UPDATED/SELECTED/DELETED, DEVICE_REGISTERED, DEVICE_REASSIGNED, DEVICE_COMMAND_SENT.
        Mỗi bản ghi có `source_ip`, `client`, `correlation_id` của request gây ra hành động (rỗng nếu do hệ
        thống tự thực hiện).
      parameters:
        - { name: actorId, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string, example: LOGIN_FAILED } }
        - { name: targetType, in: query, schema: { type: string, example: user } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK (mới nhất trước)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/settings/default-thresholds:
    get:
      tags: [System]
      summary: "Xem ngưỡng mặc định hệ thống kèm nguồn và lịch sử (SYSTEM-FR-002, ENV-FR-007) — chỉ ADMIN"
      description: |
        Chưa từng cấu hình thì trả giá trị gốc (khớp firmware Config.h), không có `source`.
        Ngoài 7 trường ngưỡng còn có nguồn của lần đổi gần nhất và `history`: mọi lần đổi (mới nhất
        trước; audit log giữ vĩnh viễn, BR-36), mỗi lần có người đổi, thời điểm, nguồn, giá trị cũ và mới.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/DefaultThresholdsView" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [System]
      summary: "Chỉnh ngưỡng mặc định hệ thống, bắt buộc có nguồn (ENV-FR-007, 026) — chỉ ADMIN"
      description: |
        Gửi 1 phần hoặc cả 7 trường, phần còn lại giữ nguyên, kèm `source` (bắt buộc):
        nguồn của giá trị mới, phải chứa mã một mục của evidence register REF-5
        (`docs/evidence-register.md`, dạng `TL-xxx` hoặc `MC-xxx`, ví dụ `"TL-012 §3.2"`).
        Thiếu `source`, `source` không có mã REF-5, dài quá 500 ký tự (Report 3 §4.5), hoặc không có
        trường ngưỡng nào → 422. Chỉ kiểm định dạng mã (`TL-xxx`, `MC-xxx`), không kiểm mã có trong sổ.
        Đây là nguồn Zone mới lấy và nguồn Farm Owner dùng khi "Reset về mặc định" 1 Zone
        (ENV-FR-020): ngưỡng của mọi Zone đang có giữ nguyên và không gửi cấu hình nào
        xuống controller. Audit log `DEFAULT_THRESHOLDS_UPDATED` ghi giá trị cũ, mới và nguồn.
        Mỗi giá trị phải nằm trong khoảng đo của cảm biến tương ứng (nhiệt −40..125°C,
        ẩm 0..100%, ánh sáng ≤ 200.000 lux, NH3 ≤ 500 ppm, CO2 ≤ 5000 ppm), nếu không 422.
        ENV-FR-026: sau khi lưu, Domain Expert của mỗi farm có zone khác mặc định mới ở một
        trường vừa đổi (farm chưa có chuyên gia: các Farm Owner, BR-22) nhận một thông báo
        trong ứng dụng liệt kê các zone đó; không áp gì vào zone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Thresholds"
                - type: object
                  required: [source]
                  properties:
                    source:
                      type: string
                      maxLength: 500
                      pattern: "\\b(TL|MC)-\\d{3}\\b"
                      example: "TL-012 §3.2"
      responses:
        "200":
          description: Giá trị sau khi cập nhật
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Thresholds" } }
        "400":
          description: "min >= max, giá trị âm, hoặc kết quả sau khi gộp với giá trị hiện tại vượt khoảng đo cảm biến"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /system/health-overview:
    get:
      tags: [System]
      summary: "Tổng quan sức khỏe hệ thống (SYSTEM-FR-003) — chỉ ADMIN"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          farms:
                            type: object
                            properties:
                              total: { type: integer }
                          zones: { type: object, properties: { total: { type: integer } } }
                          devices: { $ref: "#/components/schemas/DeviceStatusSummary" }
                          users:
                            type: object
                            properties:
                              total: { type: integer }
                              active: { type: integer }
                              inactive: { type: integer, description: "Đang bị khoá (không gồm tài khoản đã xoá)" }
                              deleted: { type: integer, description: "Đã xoá theo yêu cầu (AUTH-FR-012)" }
                              byRole:
                                type: object
                                additionalProperties:
                                  type: object
                                  properties:
                                    active: { type: integer }
                                    inactive: { type: integer }
                                    deleted: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ── FARMS ─────────────────────────────────────────────────────────────────
  /farms:
    get:
      tags: [Farms]
      summary: Danh sách farm của user hiện tại
      description: |
        - FARM_OWNER, DOMAIN_EXPERT: các farm mình sở hữu hoặc là thành viên (Domain Expert chỉ thấy bản ghi thành viên của chính mình)
        - FARM_TECHNICIAN: các farm mình là thành viên, chỉ bản ghi thành viên của chính mình (AUTH-FR-005, 013)
        - ADMIN: rỗng — Administrator không thấy farm nào (Report 3 §2.4)
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        { $ref: "#/components/schemas/Farm" },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
    post:
      tags: [Farms]
      summary: Tạo farm mới — FARM_OWNER
      description: |
        - Người tạo là Primary Owner (FARM-FR-001). Role khác → 403: Administrator không
          quản lý farm (Report 3 §2.4).
        - `coordinates` **bắt buộc** (FARM-FR-001, A-5): một farm là một địa điểm, có thời tiết
          của tọa độ đó. Nhà yến ở nơi khác thì tạo farm khác. Thiếu hoặc ngoài khoảng → 422.
          Chỉ lưu `lat`, `lng` (số); trường khác trong `coordinates` bị bỏ.
        - `name` tối đa 50 ký tự (Report 3 §4.5), dài hơn → 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, address, coordinates]
              properties:
                name: { type: string, maxLength: 50 }
                address: { type: string }
                coordinates: { $ref: "#/components/schemas/Coordinates" }
      responses:
        "201":
          {
            description: Đã tạo,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /farms/{id}:
    parameters: [{ $ref: "#/components/parameters/FarmId" }]
    get:
      tags: [Farms]
      summary: Chi tiết farm
      description: |
        Farm Owner của farm: đủ `members` và `owner`. Domain Expert: chỉ bản ghi thành viên của mình.
        Farm Technician (thành viên farm): chỉ bản ghi thành viên của mình. Administrator → 403.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Farms]
      summary: Cập nhật farm — FARM_OWNER của farm
      description: |
        Role khác FARM_OWNER → 403 (Report 3 §2.4: Administrator không quản lý farm).
        `coordinates` không bắt buộc gửi; gửi thì cùng kiểm tra như lúc tạo (422 nếu thiếu
        `lat`/`lng` hoặc ngoài khoảng). `name` gửi thì không rỗng, tối đa 50 ký tự (422).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 50 }
                address: { type: string }
                coordinates: { $ref: "#/components/schemas/Coordinates" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Farms]
      summary: Xóa mềm farm — chỉ Primary Owner
      description: |
        Role khác FARM_OWNER → 403; Farm Owner không phải Primary Owner → 403 (FARM-FR-001).
        Còn bộ điều khiển hoặc camera chưa gỡ ở bất kỳ nhà nào → 409 `HAS_ACTIVE_DEVICES`: gỡ thiết bị trước
        (như xoá nhà, FARM-FR-002), kẻo thiết bị kẹt ở farm không ai mở được.
        Farm chỉ bị ẩn (`is_deleted`), dữ liệu lịch sử giữ nguyên. Kéo theo, như xoá từng nhà:
        nhà và Zone xoá mềm, kế hoạch bảo trì thôi (`RETIRED`), khuyến nghị đang mở hết hạn, phiếu công việc
        đang mở bị huỷ, mọi cảnh báo đang mở được đóng (`RESOLVED`) để không bị gửi lại (ALERT-FR-015),
        và lời mời còn chờ hết hạn.
      responses:
        "200":
          {
            description: Đã xóa,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "HAS_ACTIVE_DEVICES — farm còn thiết bị đang dùng"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }

  /farms/{id}/members:
    post:
      tags: [Farms]
      summary: "Mời đồng sở hữu (FARM_OWNER), Domain Expert hoặc Farm Technician (AUTH-FR-005/010, EXPERT-FR-001, Flow 12) — chỉ Primary Owner"
      description: |
        Tạo một Invitation PENDING (hết hạn sau 7 ngày); email chưa có tài khoản thì
        đăng ký xong tự động accept và tài khoản mang đúng `role` được mời.
        - `role` mặc định `FARM_OWNER`. `DOMAIN_EXPERT` là chuyên gia nuôi yến, phạm vi luôn là cả farm
          (SRS v2.0.0 bỏ `zone_ids`).
        - `FARM_TECHNICIAN`: thợ của chủ farm, sau khi nhận lời mời chưa làm được gì cho tới khi Farm Owner
          gán vào nhà (`PUT /farms/houses/{houseId}/technicians/{userId}`, AUTH-FR-013).
        - 1 email = 1 role: email đã là tài khoản role khác (Admin, hoặc khác role được mời) → 409, cần dùng email khác.
        - Gửi e-mail lời mời tới `email`, kèm link `{APP_PUBLIC_URL}/invitations/{token}` (trang nhận lời mời hoặc tạo
          tài khoản, AUTH-FR-010) và hạn 7 ngày; token không ghi log. Thư không gửi được thì lời mời vẫn được tạo.
        - Ghi audit `FARM_MEMBER_INVITED`.
      parameters: [{ $ref: "#/components/parameters/FarmId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [email],
                properties:
                  {
                    email: { type: string, format: email },
                    role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT, FARM_TECHNICIAN], default: FARM_OWNER },
                  },
              }
      responses:
        "201":
          {
            description: Đã tạo lời mời,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/Invitation" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          {
            description: "Đã là thành viên, đã có lời mời PENDING gửi tới email này, hoặc email đã là tài khoản role khác",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /farms/{id}/members/{userId}:
    delete:
      tags: [Farms]
      summary: Gỡ thành viên khỏi farm (Flow 12 bước 5) — chỉ Primary Owner, không thể tự gỡ chính mình
      description: "Gỡ Farm Technician thì bỏ luôn mọi lần gán của người đó vào các nhà của farm, và Work Order đang mở của người đó chuyển cho Farm Owner (bỏ người nhận, Farm Owner được báo; AUTH-FR-005)."
      parameters:
        - { $ref: "#/components/parameters/FarmId" }
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          {
            description: Đã gỡ,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          {
            description: Không thể gỡ Primary Owner,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          {
            description: Không phải thành viên farm này,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /farms/{id}/invitations:
    get:
      tags: [Farms]
      summary: "Danh sách lời mời của farm (AUTH-FR-005, 010) — chỉ Primary Owner"
      description: |
        Để màn Thành viên hiện các lời mời đang chờ. Mặc định `status=PENDING`: chỉ lời mời còn hạn.
        Lời mời PENDING đã quá 7 ngày được trả với `status: EXPIRED` (cùng luật khi chấp nhận) và nằm
        trong `status=EXPIRED`. Không trả `token`: token là khoá của link mời. Mới nhất trước.
        Đồng sở hữu không phải Primary Owner, Domain Expert, farm khác → 403. Phân trang như mọi danh sách
        (`page`, `limit` mặc định 20, tối đa 100; `meta.total` là tổng số lời mời khớp bộ lọc).
      parameters:
        - { $ref: "#/components/parameters/FarmId" }
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED], default: PENDING }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            _id: { type: string }
                            invited_email: { type: string, format: email }
                            invited_role: { type: string, enum: [FARM_OWNER, DOMAIN_EXPERT, FARM_TECHNICIAN] }
                            status: { type: string, enum: [PENDING, ACCEPTED, DECLINED, EXPIRED] }
                            expires_at: { type: string, format: date-time }
                            responded_at: { type: string, format: date-time }
                            created_at: { type: string, format: date-time }
                      meta:
                        type: object
                        properties:
                          page: { type: integer }
                          limit: { type: integer }
                          total: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /invitations/{token}:
    parameters:
      [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Farms]
      summary: Xem trước lời mời qua token (AUTH-FR-010, Flow 12 bước 3) — không cần đăng nhập, dùng để hiển thị tên farm trước khi accept/decline
      security: []
      responses:
        "200":
          description: OK — thông tin xem trước lời mời
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          invitation: { $ref: "#/components/schemas/Invitation" }
                          farm:
                            type: object
                            nullable: true
                            description: "null khi farm của lời mời đã bị xoá"
                            properties:
                              _id: { type: string }
                              name: { type: string }
                              address: { type: string }
                          userExists:
                            type: boolean
                            description: "Email được mời đã có tài khoản chưa. true: đăng nhập rồi gọi /invitations/{token}/accept; false: hiện form tên + mật khẩu gọi /invitations/{token}/create-account"
        "404":
          {
            description: Lời mời không tồn tại,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /invitations/{token}/accept:
    post:
      tags: [Farms]
      summary: Chấp nhận lời mời (Flow 12 bước 3a) — yêu cầu đăng nhập bằng đúng email được mời
      parameters:
        [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          {
            description: Đã chấp nhận,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "403":
          {
            description: Đăng nhập sai email được mời,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          {
            description: Lời mời đã accept/decline/hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /invitations/{token}/create-account:
    post:
      tags: [Farms]
      summary: "Tạo tài khoản từ link lời mời (AUTH-FR-010) — người được mời chưa có tài khoản; công khai"
      description: |
        Thay cho đăng ký công khai (đã bỏ, Report 3 §1.2). E-mail và role lấy từ lời mời, người
        nhận chỉ đặt tên và mật khẩu; tài khoản mới vào ngay farm của lời mời và lời mời chuyển
        sang `ACCEPTED`. Email đã có tài khoản thì đăng nhập rồi gọi `/invitations/{token}/accept`
        (`GET /invitations/{token}` trả `userExists` để client chọn đúng luồng). Giới hạn 10 lần
        **sai**/15 phút theo IP.
      security: []
      parameters:
        [{ name: token, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, password]
              properties:
                full_name: { type: string, minLength: 1 }
                password: { type: string, minLength: 8 }
      responses:
        "201":
          description: Đã tạo tài khoản và tham gia farm — đăng nhập bằng `POST /auth/login`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/User" } }
        "404":
          {
            description: Token sai, hoặc farm của lời mời đã bị xoá,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "409":
          {
            description: "Lời mời đã accept/decline/hết hạn, hoặc email đã có tài khoản (đăng nhập rồi accept)",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { description: "Quá nhiều lần sai (RATE_LIMITED)" }

  /invitations/{token}/decline:
    post:
      tags: [Farms]
      summary: Từ chối lời mời (Flow 12 case 3c) — link công khai, không cần đăng nhập
      parameters:
        [{ name: token, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          {
            description: Đã từ chối,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          {
            description: Lời mời đã accept/decline/hết hạn,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }

  /farms/{id}/overview:
    parameters: [{ $ref: "#/components/parameters/FarmId" }]
    get:
      tags: [Farms]
      summary: "Tổng quan trại (ANALYTICS-FR-015) — FARM_OWNER, DOMAIN_EXPERT (đọc); thợ và Admin → 403"
      description: |
        Mỗi nhà (sắp theo tên): giai đoạn, trạng thái hôm nay (ngày giờ VN), số cảnh báo đang mở (`ACTIVE`,
        `ACKNOWLEDGED`; cảnh báo bị bác bỏ không tính), số Work Order chưa đóng, tỷ lệ chim về gần nhất kèm ngày.
        Nhà chưa có trạng thái hôm nay có `status: null` và `status_reason`: `NOT_COMPUTED` (chưa đánh giá
        ngày) hoặc `INSUFFICIENT_DATA` (đã đánh giá nhưng không đủ dữ liệu). Tỷ lệ chim về gần nhất tìm trong 30
        ngày gần nhất (Report 3 §4.5); không có ngày nào có tỷ lệ thì `null`. Nhà sắp theo tên tiếng Việt.
        `simulated: true` khi mọi thiết bị của nhà đều là thiết bị giả lập (SYSTEM-FR-004).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          farm_id: { type: string }
                          date: { type: string, example: "2026-11-14", description: "Ngày hôm nay giờ VN" }
                          houses: { type: array, items: { $ref: "#/components/schemas/HouseOverview" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /farms/{id}/comparison:
    parameters: [{ $ref: "#/components/parameters/FarmId" }]
    get:
      tags: [Farms]
      summary: "So sánh các nhà của trại (ANALYTICS-FR-016, BR-44) — FARM_OWNER, DOMAIN_EXPERT (đọc); thợ và Admin → 403"
      description: |
        Một hàng mỗi nhà trong khoảng [from, to): thời gian trong ngưỡng (trung bình chỉ số môi trường BR-28),
        % ngày `GOOD` trên số ngày đã đánh giá đủ dữ liệu, tỷ lệ chim về trung bình (ngày đủ 2 phiên), xu hướng đàn
        (% đổi của trung bình chim ra buổi sáng so với kỳ liền trước cùng độ dài), số cảnh báo đã có trong kỳ (không
        tính báo động giả) và đang mở, MTTR (BR-40), điện năng ước tính (BR-45; `null` = not available), sản lượng
        chu kỳ gần nhất (`null` tới khi có chu kỳ thu hoạch, G-26). Sắp theo `sort`/`order`, ô trống luôn xuống cuối,
        bằng nhau thì theo `house_id`. **Không có điểm tổng hay xếp hạng.** Khoảng được đưa về trọn ngày giờ VN mà
        giữ đúng số ngày yêu cầu (`to` − `from`, làm tròn lên): kết thúc ở hết ngày VN chứa mốc ngay trước `to`, bắt
        đầu lùi đúng `days` ngày, để mọi cột cùng một khoảng (mặc định 30 ngày là 30 ngày gồm cả hôm nay); tối đa 366
        ngày (Report 3 §4.5), quá thì 400.
      parameters:
        - { name: from, in: query, schema: { type: string, anyOf: [{ format: date }, { format: date-time }] }, description: "Mặc định `to` − 30 ngày; chỉ có ngày (`YYYY-MM-DD`) là đầu ngày giờ VN" }
        - { name: to, in: query, schema: { type: string, anyOf: [{ format: date }, { format: date-time }] }, description: "Mặc định hiện tại (không gồm mốc này); chỉ có ngày (`YYYY-MM-DD`) là đầu ngày giờ VN; ngày giờ phải có `Z` hoặc offset, khác → 422" }
        - name: sort
          in: query
          schema:
            type: string
            default: name
            enum: [name, time_in_range_pct, good_days_pct, return_rate_avg, flock_trend_pct, alerts_raised, alerts_open, mttr_min, energy_kwh, last_cycle_yield_g]
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          farm_id: { type: string }
                          from: { type: string, format: date-time, description: "Đầu ngày giờ VN: `to` lùi `days` ngày" }
                          to: { type: string, format: date-time, description: "Hết ngày giờ VN chứa mốc ngay trước `to` gửi lên (không gồm mốc này)" }
                          days: { type: integer }
                          sort: { type: string }
                          order: { type: string, enum: [asc, desc] }
                          rows: { type: array, items: { $ref: "#/components/schemas/HouseComparisonRow" } }
        "400": { description: "from không trước to, hoặc khoảng quá 366 ngày" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /farms/{id}/houses:
    parameters: [{ $ref: "#/components/parameters/FarmId" }]
    post:
      tags: [Farms]
      summary: Tạo House trong farm — FARM_OWNER (FARM-FR-002)
      description: |
        Technician, Administrator, Domain Expert → 403 (Report 3 §2.4).
        `name` tối đa 50 ký tự, `floors` là số nguyên 1–10, mặc định 1 (Report 3 §4.5); sai → 422.
        Tên trùng một nhà khác của farm (không phân biệt hoa thường) → 409 `DUPLICATE_NAME`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                {
                  name: { type: string, maxLength: 50 },
                  floors: { type: integer, minimum: 1, maximum: 10, default: 1 },
                  description: { type: string },
                }
      responses:
        "201":
          {
            description: Đã tạo,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/House" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          {
            description: "DUPLICATE_NAME — trùng tên một nhà khác của farm (không phân biệt hoa thường, có phân biệt dấu)",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Farms]
      summary: Danh sách House của farm
      description: "Farm Technician chỉ nhận các nhà được giao (AUTH-FR-013)."
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        { $ref: "#/components/schemas/House" },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }

  /farms/houses/{houseId}:
    parameters: [{ $ref: "#/components/parameters/HouseId" }]
    put:
      tags: [Farms]
      summary: Sửa nhà yến — FARM_OWNER (FARM-FR-002)
      description: |
        Đổi tên, số tầng, mô tả; gửi trường nào đổi trường đó, có audit cũ → mới. Domain Expert, Farm Technician,
        Administrator → 403 (Report 3 §2.4). `name` tối đa 50 ký tự, `floors` 1–10 (422). Số tầng thấp hơn tầng cao
        nhất của các Zone → 400. Tên trùng một nhà khác của farm (không phân biệt hoa thường) → 409 `DUPLICATE_NAME`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                floors: { type: integer, minimum: 1, maximum: 10 }
                description: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/House" }
        "400":
          description: "`floors` thấp hơn tầng cao nhất của các Zone của nhà"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "DUPLICATE_NAME — trùng tên một nhà khác của farm"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Farms]
      summary: Xoá mềm nhà yến cùng các Zone — FARM_OWNER (FARM-FR-002)
      description: |
        Còn bộ điều khiển hoặc camera chưa gỡ (`DECOMMISSIONED`) → 409 `HAS_ACTIVE_DEVICES`: gỡ thiết bị trước
        (FARM-FR-008). Xoá mềm nhà và các Zone (`is_deleted`): rời mọi danh sách, job, tổng quan và so sánh nhà; cảnh báo
        đang mở → `RESOLVED`; Work Order chưa đóng → `CANCELLED`; kế hoạch bảo trì → `RETIRED`; khuyến nghị đang mở →
        `EXPIRED`; telemetry, lượt đếm, báo cáo và thu hoạch giữ nguyên trong cơ sở dữ liệu. Mã tầng của Zone đã xoá
        không chọn được Zone nữa (404, FARM-FR-011). Tên của nhà đã xoá dùng lại được.
      responses:
        "200": { description: Đã xoá, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "HAS_ACTIVE_DEVICES — nhà còn thiết bị đang dùng"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /farms/houses/{houseId}/technicians/{userId}:
    parameters:
      - { $ref: "#/components/parameters/HouseId" }
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      tags: [Farms]
      summary: "Gán Farm Technician vào nhà (AUTH-FR-013) — FARM_OWNER của farm"
      description: |
        Người được gán phải là thành viên farm với role `FARM_TECHNICIAN`, không thì 409. Một thợ phục vụ
        được nhiều nhà; mỗi nhà có tối đa 1 thợ chính: gán `primary: true` thì thợ chính cũ của nhà thành thợ
        phụ. Gọi lại với người đã gán chỉ đổi `primary`. Sau khi gán, thợ thấy và thao tác được trên nhà này
        (dashboard, relay, restart, vòng đếm); nhà khác → 403 (AUTH-FR-004). Audit `HOUSE_TECHNICIAN_ASSIGNED`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                primary: { type: boolean, default: false, description: "Thợ chính của nhà" }
      responses:
        "200":
          description: Nhà sau khi gán
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/House" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Người này không phải Farm Technician của farm", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Farms]
      summary: "Bỏ gán Farm Technician khỏi nhà (AUTH-FR-013) — FARM_OWNER của farm"
      description: "Không có lần gán nào thì vẫn 200. Work Order đang mở của thợ ở nhà này chuyển cho Farm Owner (AUTH-FR-005). Audit `HOUSE_TECHNICIAN_UNASSIGNED`."
      responses:
        "200":
          description: Nhà sau khi bỏ gán
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/House" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /farms/houses/{houseId}/roster:
    parameters:
      - { $ref: "#/components/parameters/HouseId" }
    get:
      tags: [Farms]
      summary: "Lịch trực của nhà (AUTH-FR-014) — FARM_OWNER của farm; FARM_TECHNICIAN được giao chỉ thấy ca của mình"
      description: |
        Farm Technician được giao nhà chỉ nhận các ca của chính mình (Report 3 §2.4 "read own roster").
        Nhà không có lịch thì cảnh báo dùng thợ chính (G-21 gọi `technicianOnDuty`); không có thợ chính còn hiệu lực (chưa
        đặt, bị khoá hay bị gỡ) thì dùng thợ hợp lệ đầu tiên trong danh sách gán, để nhà có thợ thì cảnh báo luôn tới thợ
        (ALERT-FR-017). Domain Expert, Administrator → 403
        (Report 3 §2.4: lịch trực là của Farm Owner).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          roster: { type: array, items: { $ref: "#/components/schemas/RosterShift" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Farms]
      summary: "Đặt lịch trực của nhà (AUTH-FR-014) — FARM_OWNER của farm"
      description: |
        Thay toàn bộ lịch bằng `shifts` (mảng rỗng = bỏ lịch). Mỗi ca: Farm Technician đang được giao nhà
        (không thì 409), vai thợ chính `PRIMARY` hoặc thợ phụ `BACKUP`, các ngày trong tuần và giờ bắt đầu,
        kết thúc theo giờ VN do Farm Owner tự nhập. Hai ca cùng vai chồng giờ, giờ sai dạng, `start` bằng
        `end` → 400. Ngoài ca của thợ chính, cảnh báo của nhà tới thợ đang trực (ALERT-FR-017, G-21).
        Bỏ gán hoặc gỡ thợ khỏi farm thì bỏ luôn các ca của người đó. Audit `HOUSE_ROSTER_UPDATED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shifts]
              properties:
                shifts: { type: array, items: { $ref: "#/components/schemas/RosterShift" } }
      responses:
        "200":
          description: Lịch sau khi đặt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          roster: { type: array, items: { $ref: "#/components/schemas/RosterShift" } }
        "400": { description: "Ca chồng giờ cùng vai, giờ sai dạng hoặc start bằng end", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Người trong ca không phải Farm Technician đang được giao nhà", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /farms/houses/{houseId}/weather-rules:
    parameters:
      - { $ref: "#/components/parameters/HouseId" }
    get:
      tags: [Farms]
      summary: "Luật bù phun sương theo thời tiết của nhà (ENV-FR-030) — FARM_OWNER, DOMAIN_EXPERT, FARM_TECHNICIAN của nhà"
      description: |
        Các luật của nhà và lần bù khác 0 gần nhất (`last_compensation`, null khi chưa từng bù). Farm Technician
        chỉ xem nhà được giao (Report 3 §2.4); Administrator → 403.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          rules: { type: array, items: { $ref: "#/components/schemas/WeatherRule" } }
                          proposal: { $ref: "#/components/schemas/WeatherRulesProposal" }
                          last_compensation:
                            type: object
                            nullable: true
                            properties:
                              rule_id: { type: string }
                              offset_pct: { type: number }
                              sent_at: { type: string, format: date-time }
                              expires_at: { type: string, format: date-time }
                              forecast:
                                type: object
                                properties:
                                  temperature_max: { type: number, nullable: true }
                                  humidity_max: { type: number, nullable: true }
                                  rain_mm: { type: number, nullable: true }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Farms]
      summary: "Đặt luật bù phun sương theo thời tiết của nhà (ENV-FR-030, BR-38) — DOMAIN_EXPERT; FARM_OWNER khi farm chưa có chuyên gia"
      description: |
        Thay toàn bộ luật bằng `rules` (mảng rỗng = bỏ hết, tối đa 10). Luật gửi kèm `_id` giữ id cũ. Mỗi luật:
        dự báo 2 giờ tới (nhiệt độ cao nhất °C, độ ẩm ngoài trời cao nhất %, tổng mưa mm) ≥ `min` thì cộng
        `offset_pct` (−10…+10, khác 0) vào nhu cầu phun của mọi controller trong nhà, hạn `duration_min` (1…120 phút).
        Job mỗi giờ (phút 10) chọn luật có |offset| lớn nhất trong các luật thoả và gửi retained trên
        `swiftletcare/dev/{deviceId}/compensation` (`offset_pct`, `expires_at` epoch ms, `rule_id`); không luật
        nào thoả hoặc không có dự báo thì gửi 0 (ENV-FR-028). Offset ngoài ±10, thời hạn trên 2 giờ, ngưỡng ngoài
        khoảng → 400. Farm Owner trên farm có chuyên gia (BR-22, BR-38: gửi đề xuất bằng
        `POST …/weather-rules/proposal`), Farm Technician → 403. Lưu lịch sử, audit `WEATHER_RULES_UPDATED`, chuyên gia
        đổi thì báo Farm Owner (EXPERT-FR-009); đề xuất đang chờ của nhà bị bỏ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/WeatherRule" } }
      responses:
        "200":
          description: Luật sau khi đặt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          rules: { type: array, items: { $ref: "#/components/schemas/WeatherRule" } }
        "400": { description: "Offset ngoài ±10 hoặc bằng 0, thời hạn ngoài 1…120 phút, ngưỡng ngoài khoảng", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /farms/houses/{houseId}/zones:
    parameters: [{ $ref: "#/components/parameters/HouseId" }]
    post:
      tags: [Farms]
      summary: Tạo Zone trong house — FARM_OWNER (FARM-FR-002)
      description: |
        Technician, Administrator, Domain Expert → 403 (Report 3 §2.4).
        `name` tối đa 50 ký tự, `floor` là số nguyên ≥ 1, mặc định 1; sai → 422. Zone là một tầng
        của nhà nên `floor` không vượt `floors` của House (400). Tên trùng một Zone khác của
        cùng nhà (không phân biệt hoa thường) → 409 `DUPLICATE_NAME`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [name],
                properties:
                  {
                    name: { type: string, maxLength: 50 },
                    floor: { type: integer, minimum: 1, default: 1 },
                  },
              }
      responses:
        "201":
          {
            description: Đã tạo,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Zone" } },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          {
            description: "`floor` vượt số tầng (`floors`) của House",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          {
            description: "DUPLICATE_NAME — trùng tên một Zone khác của nhà (không phân biệt hoa thường, có phân biệt dấu)",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Farms]
      summary: Danh sách Zone của house
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        { $ref: "#/components/schemas/Zone" },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }

  /farms/zones/{zoneId}:
    get:
      tags: [Farms]
      summary: "Chi tiết một Zone — ngưỡng, hệ số mờ, tham số phát hiện (ENV-FR-006)"
      description: |
        Trả về Zone kèm `thresholds`, `fuzzy_tuning`, `detection_tuning` hiện tại.
        Dùng trước khi mở form chỉnh tham số (mobile tuning screen).
        Yêu cầu FARM_OWNER, DOMAIN_EXPERT hoặc FARM_TECHNICIAN với quyền trên house chứa zone.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      responses:
        "200":
          description: Zone detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      _id: { type: string }
                      name: { type: string }
                      thresholds: { $ref: "#/components/schemas/Thresholds" }
                      fuzzy_tuning: { $ref: "#/components/schemas/FuzzyTuning" }
                      detection_tuning: { $ref: "#/components/schemas/DetectionTuning" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [Farms]
      summary: Sửa Zone — FARM_OWNER (FARM-FR-002)
      description: |
        Đổi tên, tầng; có audit cũ → mới. Domain Expert, Farm Technician, Administrator → 403. `name` tối đa 50 ký tự,
        `floor` số nguyên ≥ 1 (422); `floor` vượt số tầng của nhà → 400; tên trùng một Zone khác của nhà → 409.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 50 }
                floor: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Zone" }
        "400":
          description: "`floor` vượt số tầng (`floors`) của House"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "DUPLICATE_NAME — trùng tên một Zone khác của nhà"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Farms]
      summary: Xoá mềm Zone — FARM_OWNER (FARM-FR-002)
      description: |
        Còn bộ điều khiển chưa gỡ → 409 `HAS_ACTIVE_DEVICES`. Xoá mềm: Zone rời mọi danh sách và job, cảnh báo đang
        mở → `RESOLVED`, Work Order chưa đóng → `CANCELLED`; lịch sử giữ nguyên; mã tầng không chọn được Zone nữa (404).
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      responses:
        "200": { description: Đã xoá, content: { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "HAS_ACTIVE_DEVICES — Zone còn bộ điều khiển đang dùng"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /farms/zones/{zoneId}/fuzzy-tuning:
    put:
      tags: [Farms]
      summary: "Chỉnh hệ số bộ điều khiển mờ của Zone (ENV-FR-021) — FARM_OWNER/DOMAIN_EXPERT"
      description: |
        Gửi 1 hoặc nhiều trong 4 hệ số; server gộp với giá trị hiện tại, kiểm tra khoảng
        (400 nếu vi phạm hoặc không có khoá hợp lệ nào), lưu `fuzzy_tuning_history`, ghi audit
        `FUZZY_TUNING_UPDATED` rồi publish MQTT `config` (4 key `fuzzy_*`) để mọi ESP32
        trong Zone áp dụng ngay — không cần nạp lại firmware. Khoá lạ bị bỏ qua.
        Technician, Administrator → 403 (Report 3 §2.4). Lịch sử ghi `source=MANUAL`.
        EXPERT-FR-010 — farm có Domain Expert mà Farm Owner sửa: thay đổi vẫn áp dụng ngay và mở
        (hoặc cập nhật, giữ giá trị gốc) 1 mục duyệt `PENDING_REVIEW` cho chuyên gia; chuyên gia sửa
        cùng nhóm thì mục đang chờ đóng `ADJUSTED`. Farm chưa có chuyên gia: không mở mục duyệt.
        Mọi lần sửa hệ số (Farm Owner hay Domain Expert) đều chuyển đề xuất `PROPOSED` của Zone sang
        `SUPERSEDED` (EXPERT-FR-011), để duyệt đề xuất cũ không ghi đè chỉnh sửa vừa làm.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FuzzyTuning" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Zone" }
        "400":
          description: "Hệ số ngoài khoảng hợp lệ / không phải số / body không có hệ số nào"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "Role không được sửa hệ số (FARM_TECHNICIAN, ADMIN) hoặc không có quyền trên Zone này"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /farms/houses/{houseId}/stage:
    put:
      tags: [Farms]
      summary: "Đặt giai đoạn nhà yến (FARM-FR-014, BR-46) — FARM_OWNER, DOMAIN_EXPERT của farm"
      description: |
        `ATTRACTING`: chim chưa về ở — đánh giá ngày không xét đàn chim (lý do `ATTRACTING_STAGE`, không thành
        `INSUFFICIENT_DATA` vì thiếu số đếm) và không tạo `LOW_RETURN_RATE`. `OCCUPIED` (mặc định): nhà đã có chim
        ở; chuyển sang `OCCUPIED` thì nền so sánh tỷ lệ chim về (BR-21) chỉ gồm các ngày sau lần chuyển. Mỗi lần đổi
        lưu vào `stage_history` (người đổi, vai trò, thời điểm) và audit `HOUSE_STAGE_UPDATED`; thay đổi của Domain
        Expert báo cho Farm Owner (EXPERT-FR-009). Đặt lại đúng giai đoạn đang có thì không ghi gì.
        Administrator, Farm Technician, người farm khác → 403.
      parameters: [{ name: houseId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              properties:
                stage: { type: string, enum: [ATTRACTING, OCCUPIED] }
      responses:
        "200":
          description: Nhà sau khi đặt
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/House" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /farms/houses/{houseId}/weather-rules/proposal:
    parameters:
      - { $ref: "#/components/parameters/HouseId" }
    post:
      tags: [Farms]
      summary: "Đề xuất luật bù phun sương để chuyên gia duyệt (ENV-FR-030, BR-22, BR-38) — FARM_OWNER trên farm có chuyên gia"
      description: |
        Cùng `rules` như `PUT …/weather-rules` (kiểm khoảng BR-38 như PUT, 400). Lưu đề xuất của nhà (mỗi nhà một
        đề xuất, gửi lại thì thay), luật đang chạy không đổi; báo trong ứng dụng cho chuyên gia của farm
        (`ref.kind = weather_rules`, id là nhà). Audit `WEATHER_RULES_PROPOSED`. Farm chưa có chuyên gia → 409
        (đặt trực tiếp bằng PUT); Domain Expert, Farm Technician → 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules]
              properties:
                rules: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/WeatherRule" } }
      responses:
        "201":
          description: Đã lưu đề xuất
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/WeatherRulesProposal" } }
        "400": { description: "Luật ngoài khoảng BR-38", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Farm chưa có chuyên gia", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /farms/houses/{houseId}/weather-rules/proposal/approve:
    parameters:
      - { $ref: "#/components/parameters/HouseId" }
    post:
      tags: [Farms]
      summary: "Duyệt đề xuất luật bù phun sương (ENV-FR-030, BR-22) — DOMAIN_EXPERT"
      description: |
        Áp bộ luật đề xuất như khi chuyên gia tự đặt (`PUT …/weather-rules`: lịch sử, audit `WEATHER_RULES_UPDATED`,
        báo Farm Owner "duyệt đề xuất") và bỏ đề xuất. `proposed_at` là của bản chuyên gia đã xem: đề xuất bị gửi lại,
        đã được duyệt hay từ chối trong lúc đó → 409, không áp bản chưa xem. Farm Owner, Farm Technician → 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposed_at]
              properties:
                proposed_at: { type: string, format: date-time, description: "`proposal.proposed_at` của GET …/weather-rules" }
      responses:
        "200":
          description: Luật mới của nhà
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          rules: { type: array, items: { $ref: "#/components/schemas/WeatherRule" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Đề xuất đã đổi hoặc đã được xử lý", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /farms/houses/{houseId}/weather-rules/proposal/reject:
    parameters:
      - { $ref: "#/components/parameters/HouseId" }
    post:
      tags: [Farms]
      summary: "Từ chối đề xuất luật bù phun sương (ENV-FR-030, BR-22) — DOMAIN_EXPERT"
      description: |
        Bỏ đề xuất, luật đang chạy giữ nguyên; audit `WEATHER_RULES_PROPOSAL_REJECTED` (vào lịch sử hoạt động
        chuyên gia), báo Farm Owner kèm lý do (EXPERT-FR-009). Lý do bắt buộc (422); `proposed_at` của bản đã xem như
        `…/approve`, đề xuất đổi hoặc đã được xử lý → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, proposed_at]
              properties:
                note: { type: string, maxLength: 1000 }
                proposed_at: { type: string, format: date-time }
      responses:
        "200":
          description: Luật đang chạy của nhà
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          house_id: { type: string }
                          rules: { type: array, items: { $ref: "#/components/schemas/WeatherRule" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Đề xuất đã đổi hoặc đã được xử lý", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /farms/houses/{houseId}/bird-count-tuning:
    put:
      tags: [Farms]
      summary: "Chỉnh mức giảm tỷ lệ chim về của nhà yến (EXPERT-FR-008, SRS v2.1.8) — DOMAIN_EXPERT, FARM_OWNER (farm có chuyên gia thì mở mục duyệt, BR-22)"
      description: |
        Farm Owner trên farm có Domain Expert: áp ngay và mở mục duyệt cho chuyên gia (EXPERT-FR-010, BR-22). Thay đổi của Domain Expert báo trong app cho mọi
        Farm Owner và vào lịch sử hoạt động (EXPERT-FR-009).
        Chim ra vào ở cửa của cả nhà yến nên số đếm, tỷ lệ chim về và cảnh báo `LOW_RETURN_RATE` tính theo
        House; mức giảm cho phép đặt ở đây (mặc định 20%, khoảng 5–50%). Lưu `bird_count_tuning_history`,
        ghi audit `BIRD_COUNT_TUNING_UPDATED`. Backend dùng, không gửi xuống thiết bị. Khoá khác
        `return_rate_drop_pct` → 400. "Về mặc định": `PUT /farms/houses/{houseId}/bird-count-tuning/reset`.
      parameters: [{ name: houseId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BirdCountTuning" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/House" }
        "400": { description: "Ngoài khoảng 5–50 / không phải số / body không có tham số nào / có khoá lạ" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /farms/houses/{houseId}/bird-count-tuning/reset:
    put:
      tags: [Farms]
      summary: "Đưa mức giảm tỷ lệ chim về của nhà về mặc định 20 % (EXPERT-FR-008) — DOMAIN_EXPERT, FARM_OWNER (farm có chuyên gia thì mở mục duyệt, BR-22)"
      description: |
        Như `PUT /farms/houses/{houseId}/bird-count-tuning` với mức mặc định cố định của backend (20 %): thêm một dòng
        `bird_count_tuning_history`, audit `BIRD_COUNT_TUNING_UPDATED`, báo Farm Owner khi chuyên gia làm
        (EXPERT-FR-009). Không có body.
      parameters: [{ name: houseId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/House" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /farms/houses/{houseId}/counting-schedule:
    parameters: [{ name: houseId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [Farms]
      summary: "Lịch đếm của nhà (VISION-FR-019) — FARM_OWNER, DOMAIN_EXPERT; FARM_TECHNICIAN chỉ nhà được giao"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/CountingScheduleView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Farms]
      summary: "Đặt lịch đếm của nhà (VISION-FR-019) — DOMAIN_EXPERT, FARM_OWNER (farm có chuyên gia thì mở mục duyệt, BR-22)"
      description: |
        Thay cả lịch (khung mặc định của nhà, hồ sơ theo mùa và khung tạm). Lịch mới áp từ ngày hôm sau (giờ VN) và lưu vào lịch sử; ngày đã
        tính phiên giữ khung cũ. Hằng ngày, 15 phút sau khung chiều của ngày, backend tính hai phiên từ số đếm 5 phút
        trong khung (VISION-FR-008) rồi kiểm tỷ lệ chim về (BR-21). Audit `COUNTING_SCHEDULE_UPDATED`; thay đổi của
        Domain Expert báo trong app cho mọi Farm Owner (EXPERT-FR-009). Farm Technician → 403. Farm Owner trên farm có Domain Expert: áp ngay và mở mục duyệt cho chuyên gia (EXPERT-FR-010, BR-22).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CountingSchedule" }
      responses:
        "200":
          description: Lịch đã lưu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/CountingScheduleView" }
        "400": { description: "Giờ không có dạng HH:mm; khung có giờ bắt đầu không trước giờ kết thúc; khung sáng không kết thúc trước khung chiều; tên hồ sơ rỗng hoặc quá 50 ký tự; ngày hồ sơ không có dạng MM-DD hoặc không có thật; ngày khung tạm không có dạng YYYY-MM-DD hoặc `from` sau `to`; hồ sơ chồng ngày; khung tạm chồng ngày; quá 12 hồ sơ hoặc 60 khung tạm", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { description: "profiles hoặc temporary không phải danh sách", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /farms/houses/{houseId}/health-levels:
    get:
      tags: [Farms]
      summary: "Mức chỉ số sức khỏe của nhà yến (ANALYTICS-FR-012, BR-28) — FARM_OWNER, DOMAIN_EXPERT"
      description: |
        `can_edit` cho biết người gọi có sửa được mức không, theo đúng điều kiện của `PUT` (BR-22): Domain
        Expert và Farm Owner đều được (farm có chuyên gia thì thay đổi của Farm Owner mở mục duyệt). Client dùng trường này
        thay vì tự đoán từ danh sách thành viên.
      parameters: [{ name: houseId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: "Mức đang dùng (thiếu trường nào thì là mặc định) kèm mặc định"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthLevels" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Farms]
      summary: "Đặt mức chỉ số sức khỏe của nhà yến (ANALYTICS-FR-012, BR-28) — DOMAIN_EXPERT, FARM_OWNER (farm có chuyên gia thì mở mục duyệt, BR-22)"
      description: |
        Farm Owner trên farm có Domain Expert: áp ngay và mở mục duyệt cho chuyên gia (EXPERT-FR-010, BR-22). Gửi 1 hoặc nhiều mức; server gộp với giá trị
        hiện tại rồi kiểm khoảng BR-28 (50–100 %, 0,5–12 giờ, 1–10 đợt) và thứ tự (mức CLEAR không được
        nhẹ hơn mức SLIGHT) — vi phạm hoặc không có khoá hợp lệ nào → 400. Mức đàn chim là
        `return_rate_drop_pct` (`PUT /farms/houses/{houseId}/bird-count-tuning`): SLIGHT từ một nửa,
        CLEAR từ đúng mức đó. Ghi audit `HEALTH_LEVELS_UPDATED`; thay đổi của Domain Expert báo trong app
        cho mọi Farm Owner và vào lịch sử hoạt động (EXPERT-FR-009). Áp từ lần đánh giá kế tiếp.
      parameters: [{ name: houseId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HealthLevels" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/HouseHealthLevels" }
        "400": { description: "Ngoài khoảng / CLEAR nhẹ hơn SLIGHT / không phải số / body không có mức nào", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /farms/zones/{zoneId}/detection-tuning:
    put:
      tags: [Farms]
      summary: "Chỉnh tham số phát hiện của Zone (EXPERT-FR-008) — DOMAIN_EXPERT, FARM_OWNER (farm có chuyên gia thì mở mục duyệt, BR-22)"
      description: |
        Farm Owner trên farm có Domain Expert: áp ngay và mở mục duyệt cho chuyên gia (EXPERT-FR-010, BR-22). Thay đổi của Domain Expert báo trong app cho mọi
        Farm Owner và vào lịch sử hoạt động (EXPERT-FR-009).
        Gửi 1 hoặc nhiều trong 5 tham số; server gộp với giá trị hiện tại, kiểm tra khoảng
        (400 nếu vi phạm hoặc không có khoá hợp lệ nào), lưu `detection_tuning_history`
        (người sửa, role, thời điểm, cũ/mới), ghi audit `DETECTION_TUNING_UPDATED` rồi publish
        MQTT `config` với 5 tham số chạy trên ESP32 (firmware ≥ 1.3.0 kẹp lại và lưu
        NVS). "Về mặc định": `PUT /farms/zones/{zoneId}/detection-tuning/reset`. Farm Owner xem qua
        `GET /farms/zones/{zoneId}`. Khoá ngoài 5 tham số → 400 nêu tên khoá; riêng mức giảm tỷ lệ chim về
        (`return_rate_drop_pct`) thuộc House (SRS v2.1.8) — `PUT /farms/houses/{houseId}/bird-count-tuning`.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DetectionTuning" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Zone" }
        "400":
          description: "Tham số ngoài khoảng hợp lệ / không phải số / body không có tham số nào / có khoá lạ"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /farms/zones/{zoneId}/detection-tuning/reset:
    put:
      tags: [Farms]
      summary: "Đưa 5 tham số phát hiện của Zone về mặc định (EXPERT-FR-008) — DOMAIN_EXPERT, FARM_OWNER (farm có chuyên gia thì mở mục duyệt, BR-22)"
      description: |
        Như `PUT /farms/zones/{zoneId}/detection-tuning` với bộ mặc định cố định của backend
        (`DEFAULT_DETECTION_TUNING`: `noise_margin_db` 15, `noise_min_sec` 10, `pump_dry_on_sec` 300,
        `pump_dry_min_rise_pct` 2, `speaker_drop_pct` 70; không phải ngưỡng mặc định của Administrator): thêm một dòng
        `detection_tuning_history`, audit `DETECTION_TUNING_UPDATED`, báo Farm Owner khi chuyên gia làm
        (EXPERT-FR-009), tăng `config_version` và publish `config`. Không có body.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Zone" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /farms/zones/{zoneId}/fuzzy-tuning/apply-suggestion:
    post:
      tags: [Farms]
      summary: "Áp gợi ý hệ số của hệ thống (ANALYTICS-FR-010, EXPERT-FR-011) — DOMAIN_EXPERT; FARM_OWNER khi farm chưa có chuyên gia (BR-22)"
      description: |
        Server tính gợi ý hiện tại (như `GET /analytics/control/suggestion`) rồi áp ngay như ENV-FR-021,
        lịch sử ghi `source=SUGGESTION_APPROVED`. Farm Owner trên farm đã có Domain Expert → 403, hệ số
        giữ nguyên — phải gửi đề xuất (`POST /expert-activity/proposals`). Không có gợi ý (dữ liệu ít, mô
        hình kém, hệ số hiện tại đã tốt) → 409 kèm lý do. Đề xuất `PROPOSED` của Zone chuyển `SUPERSEDED`.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      responses:
        "200":
          description: Zone sau khi áp gợi ý
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Zone" }
        "403": { description: "Không có quyền trên Zone, hoặc Farm Owner trên farm đã có Domain Expert", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Hiện không có gợi ý — message nêu lý do", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /farms/zones/{zoneId}/thresholds:
    put:
      tags: [Farms]
      summary: "Cập nhật ngưỡng cảnh báo/điều khiển của Zone (ENV-FR-006, lưu lịch sử ENV-FR-009) — FARM_OWNER/DOMAIN_EXPERT"
      description: |
        Kiểm tra từng cặp min<max và khoảng đo của từng cảm biến (nhiệt −40..125°C,
        ẩm 0..100%, ánh sáng ≤ 200.000 lux, NH3 ≤ 500 ppm, CO2 ≤ 5000 ppm) — 400 nếu vi phạm.
        Technician, Administrator → 403 (Report 3 §2.4).
        EXPERT-FR-010 — farm có Domain Expert mà Farm Owner sửa: thay đổi vẫn áp dụng ngay và mở
        (hoặc cập nhật, giữ giá trị gốc) 1 mục duyệt `PENDING_REVIEW` cho chuyên gia; chuyên gia sửa
        cùng nhóm thì mục đang chờ đóng `ADJUSTED`. Farm chưa có chuyên gia: không mở mục duyệt.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Thresholds" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Zone" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }

  /farms/zones/{zoneId}/thresholds/reset:
    put:
      tags: [Farms]
      summary: "Reset ngưỡng của Zone về mặc định hệ thống (ENV-FR-020, Flow 22 nhánh B) — FARM_OWNER/DOMAIN_EXPERT"
      description: |
        Technician, Administrator → 403 (Report 3 §2.4).
        Ghi đè cả 7 ngưỡng của Zone bằng `system_settings.default_thresholds` hiện
        hành (chưa cấu hình thì dùng giá trị gốc khớp firmware), thêm 1 bản ghi
        `threshold_history` với `source=RESET_TO_DEFAULT`, publish `config`
        xuống thiết bị và ghi audit log `THRESHOLD_UPDATED`.
        EXPERT-FR-010 — farm có Domain Expert mà Farm Owner sửa: thay đổi vẫn áp dụng ngay và mở
        (hoặc cập nhật, giữ giá trị gốc) 1 mục duyệt `PENDING_REVIEW` cho chuyên gia; chuyên gia sửa
        cùng nhóm thì mục đang chờ đóng `ADJUSTED`. Farm chưa có chuyên gia: không mở mục duyệt.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      responses:
        "200":
          description: Zone sau khi reset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Zone" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── DEVICES ───────────────────────────────────────────────────────────────
  /devices/sensor-nodes/register:
    post:
      tags: [Devices]
      summary: "Đăng ký ESP32 Sensor Node vào 1 Zone — FARM_OWNER (FARM-FR-003, SF-01)"
      description: |
        Farm Owner tự setup thiết bị ở farm của mình (SF-01): Zone thuộc farm khác → 403
        (FARM-FR-007). Farm Technician, Administrator, Domain Expert → 403 (Report 3 §2.4).
        Phải nhập đúng cặp `{device_id, secret_key}` in trên nhãn thiết bị (do Admin
        cấp qua `POST /admin/provisioned-devices`, không phân biệt hoa/thường).
        Node tạo ra ở trạng thái `PENDING`, chỉ chuyển `ONLINE` khi thiết bị gửi
        heartbeat đầu tiên (Flow 1 bước 8). Quá 15 phút chưa có heartbeat thì node
        được gắn `activation_overdue_at` và người đăng ký nhận thông báo (case 8a).
        Thiết bị đã gỡ (FARM-FR-008) đăng ký lại được — bản ghi cũ đổi tên, giữ lịch sử.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, zone_id, secret_key]
              properties:
                {
                  device_id: { type: string, example: node_002 },
                  zone_id: { type: string },
                  secret_key: { type: string, example: DEMO-NODE-0002, description: "In trên nhãn thiết bị (seed dev: node_002 / DEMO-NODE-0002)" },
                }
      responses:
        "201":
          {
            description: "Đã đăng ký (status=PENDING)",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/SensorNode" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          description: "Mã kích hoạt không đúng (sai secret_key hoặc device_id không có trong kho) — Flow 1 case 3a"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "\"Thiết bị đã thuộc về Farm khác\" hoặc \"device_id đã được đăng ký\" trong cùng Farm"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes:
    get:
      tags: [Devices]
      summary: Danh sách ESP32 Sensor Node
      description: "Thiết bị của các farm user là thành viên; Farm Technician: chỉ nhà được giao (AUTH-FR-013); Administrator: mọi farm (FARM-FR-009)."
      parameters:
        - name: zoneId
          in: query
          schema: { type: string }
          description: Lọc theo Zone
        - name: removed
          in: query
          schema: { type: string, enum: [recent] }
          description: >-
            Chỉ Farm Owner (role khác → 403): thay vì thiết bị đang dùng, trả thiết bị đã gỡ còn khôi phục được
            (FARM-FR-008) — gỡ trong 24 giờ, `device_id` chưa đăng ký lại, chưa có thiết bị khác đang chạy thế chỗ;
            mỗi dòng kèm `restorable_until` (date-time). Cùng điều kiện với `POST …/{id}/restore`.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        {
                                          allOf:
                                            [
                                              { $ref: "#/components/schemas/SensorNode" },
                                              {
                                                properties:
                                                  {
                                                    restorable_until:
                                                      {
                                                        type: string,
                                                        format: date-time,
                                                        description: "Chỉ có khi removed=recent: hạn chót khôi phục (gỡ lúc + 24 giờ)",
                                                      },
                                                  },
                                              },
                                            ],
                                        },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403":
          description: "removed=recent khi không phải Farm Owner"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes/{id}:
    get:
      tags: [Devices]
      summary: Chi tiết Sensor Node (FARM-FR-006 — firmware version, uptime, RSSI)
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/SensorNode" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/sensor-nodes/{id}/speaker-schedule:
    put:
      tags: [Devices]
      summary: "Lịch loa ru của thiết bị (ENV-FR-013b, BR-07), chỉ FARM_OWNER — publish MQTT config"
      description: |
        Cập nhật từng phần `speaker_schedule` / `audio.volume` / `audio.current_track`
        rồi publish ngay `config` (kèm ngưỡng hiện hành của Zone) xuống ESP32;
        thiết bị lưu NVS. Thiết bị offline lúc này sẽ nhận lại khi reconnect
        (heartbeat `justConnected`).

        Giới hạn firmware: tối đa **2 khung giờ, theo giờ tròn** (`HH:00`, `end` tối
        đa `24:00`). Gửi 1 khung thì khung thứ 2 bị xoá. Tắt lịch dùng
        `enabled: false`. Đổi `volume`/`track` giữa lúc đang phát áp dụng từ khung
        giờ kế tiếp. Ghi audit `SPEAKER_SCHEDULE_UPDATED`.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                windows:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start: { type: string, pattern: "^([01][0-9]|2[0-3]):00$", example: "05:00" }
                      end: { type: string, pattern: "^(([01][0-9]|2[0-3]):00|24:00)$", example: "07:00" }
                volume: { type: integer, minimum: 0, maximum: 30 }
                track: { type: integer, minimum: 1, description: "Số file trên thẻ SD (1 = 0001.mp3)" }
      responses:
        "200":
          {
            description: "OK — trả SensorNode đã cập nhật",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiSuccess" } },
              },
          }
        "400": { description: "Khung giờ có giờ bắt đầu không trước giờ kết thúc" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị đã được gỡ bỏ khỏi hệ thống (FARM-FR-008) — không nhận lệnh nữa" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes/{id}/relay-override:
    delete:
      tags: [Devices]
      summary: "Tắt Manual Override sớm của 1 relay hoặc mọi relay (ENV-FR-018, BR-20) — FARM_OWNER, FARM_TECHNICIAN (nhà được giao)"
      description: |
        Không có `relayName`: đặt mọi mục của `relays` về `AUTO`, publish lệnh `CLEAR_OVERRIDE` lên `cmd`
        để ESP32 trả mọi relay về điều khiển tự động; đóng mọi lịch sử còn mở.
        Có `relayName`: chỉ đóng lịch sử của relay đó và publish `CLEAR_OVERRIDE` với `payload.relayName`;
        thiết bị còn relay khác đang can thiệp tay thì vẫn `MANUAL`. Gọi khi thiết bị đang AUTO, hoặc relay
        được chọn không đang can thiệp tay, thì không làm gì (200, không publish, không ghi audit).
        Ghi audit `RELAY_OVERRIDE_CLEARED`.
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - { name: relayName, in: query, schema: { type: string, enum: [misting, speaker, ventilation] }, description: "Chỉ huỷ relay này; bỏ trống = huỷ mọi relay" }
      responses:
        "200":
          {
            description: OK,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị đã được gỡ bỏ khỏi hệ thống (FARM-FR-008) — không nhận lệnh nữa" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes/{id}/audio-tracks:
    get:
      tags: [Devices]
      summary: "Danh mục file loa ru của thiết bị (ENV-FR-013c(b)) — mọi role có quyền Zone"
      description: "`file_url` là URL MinIO ký tạm 1 giờ, chỉ để nghe bản gốc trên web — DFPlayer phát file trên thẻ SD."
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            { properties: { data: { type: array, items: { $ref: "#/components/schemas/AudioTrack" } } } },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Devices]
      summary: "Upload file .mp3 vào danh mục loa ru (ENV-FR-013c) — FARM_OWNER"
      description: |
        Lưu bản gốc lên MinIO + tạo bản ghi `synced_to_sd=false`. Web KHÔNG ghi được
        file xuống thẻ SD (DFPlayer không có lệnh ghi) — Farm Owner tự chép file với
        tên `000N.mp3` (N = `track_number`) rồi đánh dấu qua `sync-status`.
        Chỉ nhận `.mp3` (`audio/mpeg`), tối đa 10MB (SRS §12.4). Ghi audit `AUDIO_TRACK_UPLOADED`.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, track_number, display_name]
              properties:
                file: { type: string, format: binary }
                track_number: { type: integer, minimum: 1, maximum: 255, description: "2 = 0002.mp3 trên thẻ SD" }
                display_name: { type: string, maxLength: 100 }
      responses:
        "201":
          {
            description: Đã upload,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            { properties: { data: { $ref: "#/components/schemas/AudioTrack" } } },
                          ],
                      },
                  },
              },
          }
        "400": { description: "Không phải .mp3, thiếu file, hoặc vượt 10MB" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Trùng `track_number` trên thiết bị, hoặc thiết bị đã gỡ (không còn ở hiện trường để chép file)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes/{id}/audio-tracks/{trackId}:
    delete:
      tags: [Devices]
      summary: "Xoá bài khỏi danh mục web (không xoá file trên thẻ SD) — FARM_OWNER"
      description: |
        Bài đã chép vào thẻ SD và đang là `speaker_track` của thiết bị (còn hoạt động) thì
        trả 409 — thiết bị vẫn phát số đó mà web mất dấu là bài nào; chọn bài khác hoặc
        đánh dấu chưa chép trước. Thiết bị đã gỡ thì xoá tự do (dọn danh mục).
      parameters: [{ $ref: "#/components/parameters/NodeId" }, { $ref: "#/components/parameters/TrackId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Bài đang được phát theo lịch (đã chép SD và là bài được chọn)" }

  /devices/sensor-nodes/{id}/audio-tracks/{trackId}/sync-status:
    put:
      tags: [Devices]
      summary: "Đánh dấu đã/chưa chép file vào thẻ SD (ENV-FR-013c) — FARM_OWNER"
      parameters: [{ $ref: "#/components/parameters/NodeId" }, { $ref: "#/components/parameters/TrackId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [synced_to_sd], properties: { synced_to_sd: { type: boolean } } }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            { properties: { data: { $ref: "#/components/schemas/AudioTrack" } } },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị đã gỡ khỏi hệ thống" }

  /devices/sensor-nodes/{id}/audio-tracks/{trackId}/select:
    put:
      tags: [Devices]
      summary: "Đặt bài làm speaker_track mặc định cho lịch phát (ENV-FR-013c(b)) — FARM_OWNER"
      description: "Chặn (400) nếu `synced_to_sd=false`. Publish MQTT `config` (kèm ngưỡng + lịch hiện hành). Ghi audit `AUDIO_TRACK_SELECTED`."
      parameters: [{ $ref: "#/components/parameters/NodeId" }, { $ref: "#/components/parameters/TrackId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } },
          }
        "400": { description: "Bài chưa được chép vào thẻ SD" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị đã được gỡ bỏ khỏi hệ thống (FARM-FR-008) — không nhận lệnh nữa" }

  /devices/sensor-nodes/{id}/audio-tracks/{trackId}/play-now:
    post:
      tags: [Devices]
      summary: "Phát thử bài ngay trên loa, bỏ qua lịch (ENV-FR-013c(c)) — FARM_OWNER"
      description: |
        Publish lệnh `AUDIO` lên `cmd`, `payload: {action:"play", track}`. Firmware bật nguồn amply,
        phát 1 lần, tự dừng sau tối đa 5 phút (`FORCE_PLAY_MAX_MS`) rồi quay về lịch.
        Manual Override relay loa (ENV-FR-016) vẫn được ưu tiên cho nguồn amply.
      parameters: [{ $ref: "#/components/parameters/NodeId" }, { $ref: "#/components/parameters/TrackId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } },
          }
        "400": { description: "Bài chưa được chép vào thẻ SD" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Thiết bị không ONLINE, hoặc đã được gỡ bỏ khỏi hệ thống (FARM-FR-008)" }

  /devices/sensor-nodes/{id}/audio/stop:
    post:
      tags: [Devices]
      summary: "Dừng phát thử (ENV-FR-013c(c)) — FARM_OWNER"
      description: "Publish lệnh `AUDIO` lên `cmd`, `payload: {action:'stop'}`; nếu đang trong khung giờ thì thiết bị phát lại bài theo lịch."
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      responses:
        "200":
          {
            description: OK,
            content:
              { application/json: { schema: { $ref: "#/components/schemas/ApiSuccess" } } },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Thiết bị không ONLINE, hoặc đã được gỡ bỏ khỏi hệ thống (FARM-FR-008)" }

  /devices/sensor-nodes/{id}/relay-overrides:
    get:
      tags: [Devices]
      summary: "Lịch sử can thiệp tay của thiết bị (ENV-FR-019) — FARM_OWNER/DOMAIN_EXPERT, FARM_TECHNICIAN (nhà được giao); Admin → 403"
      description: |
        Mỗi lần ép 1 relay là 1 bản ghi, mới nhất trước. `ended_at = null` là đang override.
        `end_reason`: `EXPIRED` (hết hạn), `CLEARED_EARLY` (tắt sớm, gỡ thiết bị, hoặc thiết
        bị khởi động lại), `REPLACED` (bấm lại cùng relay trước khi hết hạn).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/RelayOverrideLog" } }
                      meta:
                        type: object
                        properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /devices/sensor-nodes/{id}/relay:
    post:
      tags: [Devices]
      summary: "Điều khiển relay — Manual Override (ENV-FR-016..018) — FARM_OWNER, FARM_TECHNICIAN (nhà được giao)"
      description: |
        Publish lệnh `RELAY` lên `swiftletcare/dev/{deviceId}/cmd` (phong bì `commandId`, `type`, `issuedAt`, `payload`, BR-35), đặt relay đó trong
        `relays` thành `MANUAL` với hạn `now + durationMs`; các relay khác giữ hạn của chúng (BR-20).
        Farm Technician chỉ ở nhà được giao, nhà khác → 403 (ENV-FR-016, AUTH-FR-004). Administrator,
        Domain Expert → 403 (Report 3 §2.4). Gọi lại cùng trạng thái
        để gia hạn override (Flow 13 case 4a).

        BR-08: bật bơm (`relayName=misting`, `state=true`) 1–30 phút — quá 30 phút → 422; tắt bơm, quạt,
        loa 1 phút – 24 giờ. ENV-FR-016: bật bơm khi Zone đang có `SENSOR_FAULT`, `RS485_BUS_FAILURE` hoặc
        `MISTING_INEFFECTIVE` còn hiệu lực (`ACTIVE`, `ACKNOWLEDGED`) phải gửi `confirmed: true`, thiếu thì
        409 `CONFIRMATION_REQUIRED`, `error.details` là danh sách các cảnh báo đó để app hiện cho người dùng;
        lịch sử can thiệp ghi `alert_confirmed` (ENV-FR-019).
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [relayName, state]
              properties:
                relayName:
                  {
                    type: string,
                    enum: [misting, speaker, ventilation],
                  }
                state: { type: boolean }
                durationMs:
                  {
                    type: integer,
                    minimum: 60000,
                    maximum: 86400000,
                    default: 1800000,
                    description: "Thời gian override trước khi tự trả về AUTO (mặc định 30 phút, từ 1 phút tới 24 giờ; bật bơm tối đa 30 phút — BR-08)",
                  }
                confirmed:
                  {
                    type: boolean,
                    description: "ENV-FR-016 — Farm Owner xác nhận bật bơm dù Zone đang có cảnh báo cảm biến/phun sương",
                  }
      responses:
        "200":
          {
            description: Đã publish lệnh,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/SensorNode" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          {
            description: relayName không hợp lệ,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "CONFIRMATION_REQUIRED — bật bơm khi Zone có cảnh báo cảm biến/phun sương mà chưa xác nhận; hoặc thiết bị đã gỡ"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiError"
                  - properties:
                      error:
                        type: object
                        properties:
                          code: { type: string, example: CONFIRMATION_REQUIRED }
                          message: { type: string }
                          details:
                            type: array
                            items:
                              type: object
                              properties:
                                _id: { type: string }
                                type: { type: string, enum: [SENSOR_FAULT, RS485_BUS_FAILURE, MISTING_INEFFECTIVE] }
                                title: { type: string }
                                created_at: { type: string, format: date-time }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/camera-nodes/register:
    post:
      tags: [Devices]
      summary: "Đăng ký camera đếm chim (nút AI) vào nhà yến — FARM_OWNER (farm của mình) (FARM-FR-004, SF-01)"
      description: |
        Giống sensor node: bắt buộc `secret_key` của thiết bị loại CAMERA trong kho. SRS v2.1.8: camera lắp ở
        cửa ra vào của cả nhà yến nên gắn House (`house_id`). `zone_id` là cách gửi cũ (trước v2.1.8), được quy
        ra House chứa Zone; cần một trong hai. Farm Technician, Administrator → 403 (Report 3 §2.4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, secret_key]
              properties:
                {
                  device_id: { type: string, example: cam_001 },
                  secret_key: { type: string, example: DEMO-CAM-0001 },
                  house_id: { type: string },
                  zone_id: { type: string, deprecated: true, description: "Cách gửi cũ — quy ra House chứa Zone" },
                }
      responses:
        "201":
          {
            description: Đã đăng ký,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/CameraNode" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/camera-nodes:
    get:
      tags: [Devices]
      summary: Danh sách camera đếm chim
      description: "Camera của 1 nhà yến (`houseId`; `zoneId` cũ được quy ra House chứa Zone), không truyền thì mọi nhà user được xem. Không trả `rtsp_url` (chứa mật khẩu camera — chỉ nút AI cần)."
      parameters:
        - { name: houseId, in: query, schema: { type: string } }
        - name: zoneId
          in: query
          deprecated: true
          schema: { type: string }
        - name: removed
          in: query
          schema: { type: string, enum: [recent] }
          description: >-
            Chỉ Farm Owner (role khác → 403): thay vì thiết bị đang dùng, trả thiết bị đã gỡ còn khôi phục được
            (FARM-FR-008) — gỡ trong 24 giờ, `device_id` chưa đăng ký lại, chưa có thiết bị khác đang chạy thế chỗ;
            mỗi dòng kèm `restorable_until` (date-time). Cùng điều kiện với `POST …/{id}/restore`.
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        {
                                          allOf:
                                            [
                                              { $ref: "#/components/schemas/CameraNode" },
                                              {
                                                properties:
                                                  {
                                                    restorable_until:
                                                      {
                                                        type: string,
                                                        format: date-time,
                                                        description: "Chỉ có khi removed=recent: hạn chót khôi phục (gỡ lúc + 24 giờ)",
                                                      },
                                                  },
                                              },
                                            ],
                                        },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "403":
          description: "removed=recent khi không phải Farm Owner"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes/{id}/decommission:
    post:
      tags: [Devices]
      summary: "Gỡ bỏ thiết bị, giữ lịch sử dữ liệu (FARM-FR-008) — FARM_OWNER (farm của mình)"
      description: |
        Không xoá document: telemetry/alert cũ tham chiếu `node_id` nên vẫn truy
        vấn được. Thiết bị bị ẩn khỏi danh sách/thống kê, heartbeat/telemetry từ
        `device_id` này bị bỏ qua, lệnh relay/ngưỡng/dời zone trả 409.

        Thiết bị **đang ONLINE** phải gửi kèm `force: true` (409 nếu
        thiếu) — gỡ một thiết bị còn sống là mất giám sát cả Zone. Cảnh báo còn mở
        của nó được đóng theo, và trong **24 giờ** vẫn
        khôi phục lại được qua `/restore`.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: "Hỏng nguồn, thu hồi về kho" }
                force: { type: boolean, description: "Bắt buộc khi thiết bị đang ONLINE — xác nhận chấp nhận mất giám sát của Zone" }
      responses:
        "200":
          description: "Đã gỡ (decommissioned_at được gán)"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SensorNode" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /devices/sensor-nodes/{id}/restore:
    post:
      tags: [Devices]
      summary: "Khôi phục thiết bị vừa gỡ nhầm, trong 24 giờ (FARM-FR-008) — FARM_OWNER (farm của mình)"
      description: |
        Xoá `decommissioned_at` và cờ `activation_overdue_at`, đưa thiết bị về
        `OFFLINE` — hoặc `PENDING` nếu nó chưa từng gửi heartbeat lần nào (vẫn
        đang chờ kích hoạt, để job kích hoạt quá hạn tiếp tục theo dõi) và cho nó xuất hiện lại trong danh sách/thống kê. Cảnh báo đã đóng
        lúc gỡ **không** mở lại — nếu sự cố còn, `deviceOffline.job` sẽ sinh cảnh báo mới.

        Từ chối 409 khi: thiết bị chưa bị gỡ, đã quá 24 giờ, `device_id` đã được đăng
        ký lại cho bản ghi khác, hoặc thiết bị thay thế vẫn đang hoạt động.
      parameters: [{ $ref: "#/components/parameters/NodeId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: { reason: { type: string, example: "Gỡ nhầm thiết bị" } }
      responses:
        "200":
          description: Đã khôi phục
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/SensorNode" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/camera-nodes/{id}/counting-ring:
    put:
      tags: [Devices]
      summary: "Vẽ, sửa hoặc xoá vòng đếm chim của 1 camera, tối đa 4 vòng (VISION-FR-018) — DOMAIN_EXPERT, FARM_OWNER của farm (farm có chuyên gia thì mở mục duyệt, BR-22); FARM_TECHNICIAN ở nhà được giao"
      description: |
        Farm Technician vẽ hoặc chỉnh được vòng của camera ở nhà được giao (VISION-FR-018, Report 3 §2.4);
        nhà khác → 403. Farm Owner trên farm có Domain Expert: áp ngay và mở mục duyệt cho chuyên gia (EXPERT-FR-010, BR-22). Thay đổi của Domain Expert báo trong app cho mọi
        Farm Owner và vào lịch sử hoạt động (EXPERT-FR-009).
        Vòng khép kín quanh miệng lỗ ra vào (`docs/bird-counting-plan.md` 3.3 ý 7, 19.8), các đỉnh
        `[x, y]` theo tỉ lệ khung hình 0–1, theo thứ tự quanh vòng; 3–12 đỉnh (12 là giới hạn kỹ thuật
        chống nhập nhầm). `into_ring_is_exit`: true khi trong vòng là phía ngoài trời (camera trong nhà).
        Body `{ rings: [...] }`: 0–4 vòng, mỗi vòng đếm cả chim vào lẫn ra, số đếm của các vòng cộng chung vào camera;
        `rings: []` xoá vòng, nút AI dùng lại vòng trong `config.yaml`. Hai vòng trùng nhau bị từ chối 422 (một con chim
        bị đếm hai lần). Body cũ một vòng `{ points, into_ring_is_exit }` (app mobile) vẫn nhận và chỉ thay vòng đầu, giữ
        các vòng còn lại. Danh sách vòng không đổi (vd xoá khi chưa vẽ) thì không ghi lịch sử, audit hay mục duyệt.
        Lưu `counting_rings` (vòng đầu kèm người sửa còn ở `counting_ring` cho app cũ), `counting_ring_history`
        (người sửa, role, danh sách vòng cũ/mới) và audit `COUNTING_RING_UPDATED`, rồi publish MQTT
        `swiftletcare/dev/{deviceId}/config` (retained) `{ deviceId, counting_rings: [{ points, into_ring_is_exit }] }`
        cho nút AI (luôn có `counting_rings`, `[]` khi đã xoá); nút AI kết nối lại sẽ nhận lại từ broker. Broker chưa
        kết nối thì vẫn lưu, `ring_delivered=false`. Đổi vòng thì số đếm trước và sau không so được với nhau. Mục duyệt
        của Farm Owner ghi `old_values.rings`, `new_values.rings`; hoàn tác về `[]` là về vòng mặc định.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [rings]
                  properties:
                    rings:
                      type: array
                      maxItems: 4
                      items: { $ref: "#/components/schemas/CountingRing" }
                - $ref: "#/components/schemas/CountingRing"
      responses:
        "200":
          description: Đã lưu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        allOf:
                          - $ref: "#/components/schemas/CameraNode"
                          - properties:
                              ring_delivered: { type: boolean, description: "Lệnh đã tới broker; false = nút AI nhận khi kết nối lại" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Camera đã gỡ khỏi hệ thống", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/camera-nodes/{id}/source:
    get:
      tags: [Devices]
      summary: "Địa chỉ camera IP và tình trạng camera của một nút AI (FARM-FR-004b) — FARM_OWNER của farm"
      description: Không bao giờ trả mật khẩu camera, chỉ `has_password`. `source` null khi chưa nhập.
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/CameraSourceView" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Devices]
      summary: "Nhập hoặc sửa địa chỉ camera IP của nút AI (FARM-FR-004b) — FARM_OWNER của farm"
      description: |
        Mật khẩu lưu bằng AES-256-GCM với `CAMERA_SOURCE_KEY` (thiếu khoá thì 503). Không gửi `password` = giữ mật khẩu
        cũ; chuỗi rỗng = bỏ mật khẩu. Mỗi lần sửa tăng `version` và gửi lại `config` retained của nút AI kèm
        `camera_source_version` (không có mật khẩu); nút AI lấy địa chỉ mới qua `GET /agent/camera-source`.
        Audit `CAMERA_SOURCE_UPDATED` (không ghi mật khẩu).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host, port, username, path]
              properties:
                host: { type: string, example: 203.0.113.7, description: "IPv4 hoặc tên miền, không có scheme hay cổng" }
                port: { type: integer, minimum: 1, maximum: 65535, example: 554 }
                username: { type: string, maxLength: 64, example: admin }
                password: { type: string, maxLength: 128, description: "Không gửi = giữ mật khẩu cũ; rỗng = bỏ mật khẩu" }
                path: { type: string, maxLength: 200, example: /stream1, description: "Bắt đầu bằng /, không khoảng trắng; có thể có query" }
      responses:
        "200":
          description: Đã lưu
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/CameraSourceView" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { description: "Chưa cấu hình CAMERA_SOURCE_KEY", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }

  /devices/camera-nodes/{id}/stream-token:
    get:
      tags: [Devices]
      summary: "Token xem live stream của 1 camera (VISION-FR-013) — FARM_OWNER/DOMAIN_EXPERT của farm, FARM_TECHNICIAN ở nhà được giao"
      description: |
        Video không đi qua backend: trình duyệt mở WebRTC (WHEP) tới MediaMTX ở đường `path`,
        gửi `token` trong header `Authorization: Bearer <token>` (hoặc `?token=`). MediaMTX hỏi
        `POST /internal/stream-auth`, token chỉ hợp lệ cho đúng `path` đó và hết hạn sau `expires_in`
        giây (chỉ cần còn hạn lúc mở kết nối; kết nối lại thì xin token mới). Token này không dùng
        được làm access token. Administrator không xem live stream (Report 3 §2.4).
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data:
                        type: object
                        properties:
                          path: { type: string, example: cam-cam-zone1-01, description: "cam-<device_id>" }
                          token: { type: string }
                          expires_in: { type: integer, example: 60 }
        "400": { description: "device_id của camera không dùng được làm tên stream (ký tự lạ hoặc kết thúc bằng -raw)" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: "Máy chủ video chưa được cấu hình (STREAM_TOKEN_SECRET trống); chỉ trả sau khi đã kiểm quyền, người không có quyền luôn nhận 403" }

  /profiles:
    get:
      tags: [Profiles]
      summary: "Hồ sơ cấu hình của farm (EXPERT-FR-014) — FARM_OWNER, DOMAIN_EXPERT của farm"
      parameters:
        - { name: farmId, in: query, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, APPROVED, ARCHIVED] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Mới sửa trước
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { type: array, items: { $ref: "#/components/schemas/ConfigProfile" } }
                      meta: { $ref: "#/components/schemas/PageMeta" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [Profiles]
      summary: "Soạn hồ sơ cấu hình, trạng thái DRAFT (EXPERT-FR-014, SM-23) — DOMAIN_EXPERT, FARM_OWNER (chỉ chuyên gia duyệt, BR-22)"
      description: |
        Mỗi nhóm (`thresholds`, `fuzzy_tuning`, `detection_tuning`, `speaker_schedule`) có thể bỏ trống — áp hồ sơ thì
        nhóm đó không đổi — nhưng đã gửi thì phải đủ mọi khoá và trong khoảng như khi sửa một zone (400). Cần ít nhất
        một nhóm. `stage` (tuỳ chọn) chỉ ghi giai đoạn nhà mà hồ sơ dành cho; khi áp không so với giai đoạn của nhà.
        Farm Technician → 403. Audit `CONFIG_PROFILE_CREATED`. Farm Owner soạn thì báo trong ứng dụng cho chuyên gia của farm
        (`ref.kind = config_profile`, BR-22); duyệt và lưu trữ vẫn chỉ Domain Expert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [farm_id]
                  properties:
                    farm_id: { type: string }
                - $ref: "#/components/schemas/ConfigProfileInput"
      responses:
        "201":
          description: Hồ sơ DRAFT
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ConfigProfile" }
        "400": { description: "Giá trị ngoài khoảng, nhóm thiếu khoá hoặc hồ sơ không có nhóm nào", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Profiles]
      summary: "Một hồ sơ cấu hình (EXPERT-FR-014) — FARM_OWNER, DOMAIN_EXPERT của farm"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ConfigProfile" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      tags: [Profiles]
      summary: "Sửa hồ sơ DRAFT (EXPERT-FR-014) — DOMAIN_EXPERT, FARM_OWNER (BR-22)"
      description: "Thay toàn bộ nội dung (nhóm không gửi thì bỏ khỏi hồ sơ). Hồ sơ APPROVED hoặc ARCHIVED → 409. Audit `CONFIG_PROFILE_UPDATED`."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigProfileInput" }
      responses:
        "200":
          description: Hồ sơ sau khi sửa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/ConfigProfile" }
        "400": { description: "Giá trị ngoài khoảng, nhóm thiếu khoá hoặc hồ sơ không có nhóm nào", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Hồ sơ không còn là DRAFT", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /profiles/{id}/approve:
