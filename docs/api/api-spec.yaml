  /farms/zones/{zoneId}/fuzzy-tuning:
    put:
      tags: [Farms]
      summary: "Chỉnh hệ số bộ điều khiển mờ của Zone (ENV-FR-021) — FARM_OWNER/DOMAIN_EXPERT/TECHNICIAN/ADMIN"
      description: |
        Gửi 1 hoặc nhiều trong 4 hệ số; server gộp với giá trị hiện tại, kiểm tra khoảng
        (400 nếu vi phạm hoặc không có khoá hợp lệ nào), lưu `fuzzy_tuning_history`, ghi audit
        `FUZZY_TUNING_UPDATED` rồi publish MQTT `config/update` (4 key `fuzzy_*`) để mọi ESP32
        trong Zone áp dụng ngay — không cần nạp lại firmware. Khoá lạ bị bỏ qua.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FuzzyTuning" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Zone" }
        "400":
          description: "Hệ số ngoài khoảng hợp lệ / không phải số / body không có hệ số nào"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "Không có quyền trên Zone này"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /farms/zones/{zoneId}/detection-tuning:
    put:
      tags: [Farms]
      summary: "Chỉnh tham số phát hiện của Zone (EXPERT-FR-008) — DOMAIN_EXPERT"
      description: |
        Gửi 1 hoặc nhiều trong 6 tham số; server gộp với giá trị hiện tại, kiểm tra khoảng
        (400 nếu vi phạm hoặc không có khoá hợp lệ nào), lưu `detection_tuning_history`
        (người sửa, role, thời điểm, cũ/mới), ghi audit `DETECTION_TUNING_UPDATED` rồi publish
        MQTT `config/update` với 5 tham số chạy trên ESP32 (firmware ≥ 1.3.0 kẹp lại và lưu
        NVS). `return_rate_drop_pct` do backend dùng, không gửi xuống thiết bị. "Về mặc định"
        = gửi lại bộ giá trị mặc định. Farm Owner xem qua `GET /farms/zones/{zoneId}`.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DetectionTuning" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/Zone" }
        "400":
          description: "Tham số ngoài khoảng hợp lệ / không phải số / body không có tham số nào"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /farms/zones/{zoneId}/thresholds:
    put:
      tags: [Farms]
      summary: "Cập nhật ngưỡng cảnh báo/điều khiển của Zone (ENV-FR-006, lưu lịch sử ENV-FR-009) — FARM_OWNER/DOMAIN_EXPERT/TECHNICIAN/ADMIN"
      description: |
        Kiểm tra từng cặp min<max và khoảng đo của từng cảm biến (nhiệt −40..125°C,
        ẩm 0..100%, ánh sáng ≤ 200.000 lux, NH3 ≤ 500 ppm, CO2 ≤ 5000 ppm) — 400 nếu vi phạm.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Thresholds" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Zone" } },
                            },
                          ],
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }

  /farms/zones/{zoneId}/thresholds/reset:
    put:
      tags: [Farms]
      summary: "Reset ngưỡng của Zone về mặc định hệ thống (ENV-FR-020, Flow 22 nhánh B) — FARM_OWNER/DOMAIN_EXPERT/TECHNICIAN/ADMIN"
      description: |
        Ghi đè cả 7 ngưỡng của Zone bằng `system_settings.default_thresholds` hiện
        hành (chưa cấu hình thì dùng giá trị gốc khớp firmware), thêm 1 bản ghi
        `threshold_history` với `source=RESET_TO_DEFAULT`, publish `config/update`
        xuống thiết bị và ghi audit log `THRESHOLD_UPDATED`.
      parameters: [{ $ref: "#/components/parameters/ZoneId" }]
      responses:
        "200":
          description: Zone sau khi reset
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties: { data: { $ref: "#/components/schemas/Zone" } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── DEVICES ───────────────────────────────────────────────────────────────
  /devices/sensor-nodes/register:
    post:
      tags: [Devices]
      summary: "Đăng ký ESP32 Sensor Node vào 1 Zone — chỉ TECHNICIAN/ADMIN (FARM-FR-003)"
      description: |
        Bước 3-4 của Flow 1 (Web Console Onboarding). **Farm Owner không gọi được
        endpoint này** (403) — theo mô hình "công ty vận hành, khách hàng chỉ dùng",
        việc lắp đặt/kích hoạt thiết bị do Technician thực hiện tại hiện trường.

        Technician chỉ đăng ký được cho Farm thuộc `assigned_regions` của mình.
        Phải nhập đúng cặp `{device_id, secret_key}` in trên nhãn thiết bị (do Admin
        cấp qua `POST /admin/provisioned-devices`, không phân biệt hoa/thường).
        Node tạo ra ở trạng thái `PENDING`, chỉ chuyển `ONLINE` khi thiết bị gửi
        heartbeat đầu tiên (Flow 1 bước 8). Quá 15 phút chưa có heartbeat thì node
        được gắn `activation_overdue_at` và người đăng ký nhận thông báo (case 8a).
        Thiết bị đã gỡ (FARM-FR-008) đăng ký lại được — bản ghi cũ đổi tên, giữ lịch sử.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, zone_id, secret_key]
              properties:
                {
                  device_id: { type: string, example: node_002 },
                  zone_id: { type: string },
                  secret_key: { type: string, example: DEMO-NODE-0002, description: "In trên nhãn thiết bị (seed dev: node_002 / DEMO-NODE-0002)" },
                }
      responses:
        "201":
          {
            description: "Đã đăng ký (status=PENDING)",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    { $ref: "#/components/schemas/SensorNode" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          description: "Mã kích hoạt không đúng (sai secret_key hoặc device_id không có trong kho) — Flow 1 case 3a"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "\"Thiết bị đã thuộc về Farm khác\" hoặc \"device_id đã được đăng ký\" trong cùng Farm"
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /devices/sensor-nodes:
    get:
