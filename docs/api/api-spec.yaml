  # ── TICKETS ───────────────────────────────────────────────────────────────
  /tickets:
    post:
      tags: [Tickets]
      summary: "Farm Owner tạo ticket báo lỗi hoặc yêu cầu lắp đặt/bảo trì (TICKET-FR-001) — FARM_OWNER/ADMIN"
      description: |
        Ticket Router tự động gán Technician ít việc nhất trong `region` của
        farm (TICKET-FR-004); priority/SLA gán tự động theo `type`
        (TICKET-FR-003/006). Với `type=INSTALLATION`/`MAINTENANCE`, bắt buộc
        `scheduled_visit_at` ngay lúc tạo (TICKET-FR-004b).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                farm_id: { type: string }
                zone_id: { type: string }
                type: { $ref: "#/components/schemas/TicketType" }
                description: { type: string }
                scheduled_visit_at:
                  {
                    type: string,
                    format: date-time,
                    description: "Bắt buộc khi type=INSTALLATION/MAINTENANCE",
                  }
                alert_id:
                  {
                    type: string,
                    description: "Gắn với Alert gốc nếu ticket phát sinh từ 1 cảnh báo",
                  }
      responses:
        "201":
          {
            description: "Đã tạo (status=NEW)",
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data: { $ref: "#/components/schemas/Ticket" },
                                },
                            },
                          ],
                      },
                  },
              },
          }
        "400":
          {
            description: "Thiếu scheduled_visit_at cho ticket lắp đặt/bảo trì",
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/ApiError" } },
              },
          }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Tickets]
      summary: "Danh sách ticket (filter farm/status/priority/assignee)"
      description: |
        Farm Owner chỉ thấy ticket farm mình; Technician thấy farm trong
        `assigned_regions`; Admin thấy tất cả. Lọc theo `farmId` được kiểm
        quyền riêng — farm không thuộc phạm vi của user thì trả 403, không
        trả về danh sách rỗng.
      parameters:
        - { name: farmId, in: query, schema: { type: string } }
        - {
            name: status,
            in: query,
            schema: { $ref: "#/components/schemas/TicketStatus" },
          }
        - {
            name: priority,
            in: query,
            schema: { type: string, enum: [P1, P2, P3] },
          }
        - { name: assignedToMe, in: query, schema: { type: boolean } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                {
                                  data:
                                    {
                                      type: array,
                                      items:
                                        { $ref: "#/components/schemas/Ticket" },
                                    },
                                },
                            },
                          ],
                      },
                  },
              },
          }

