                      { lat: { type: number }, lng: { type: number } },
                  }
      responses:
        "201":
          {
            description: Đã tạo,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        allOf:
                          [
                            { $ref: "#/components/schemas/ApiSuccess" },
                            {
                              properties:
                                { data: { $ref: "#/components/schemas/Farm" } },
                            },
                          ],
                      },
                  },
              },
          }
        "422": { $ref: "#/components/responses/ValidationError" }

