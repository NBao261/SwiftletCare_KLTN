                  - $ref: "#/components/schemas/ApiSuccess"
                  - properties:
                      data: { $ref: "#/components/schemas/RecommendationRule" }
        "400": { description: "Như khi tạo luật", content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /recommendations:
    get:
      tags: [Recommendations]
      summary: "Khuyến nghị của nhà hoặc farm (EXPERT-FR-017) — FARM_OWNER, DOMAIN_EXPERT; FARM_TECHNICIAN chỉ nhà được giao (theo houseId, hoặc theo farmId thì chỉ các nhà được giao của farm đó)"
      parameters:
