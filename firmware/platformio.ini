; SwiftletCare ESP32 Firmware
; PlatformIO Configuration (Wokwi-compatible)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor speed
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; Chỉ build main.cpp + các module thật — loại tool quét Modbus rời (xem env:modbus_scan)
build_src_filter = +<*> -<test_noise_rs485.cpp>

; Build flags
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_FREERTOS_UNICORE=0
  -DELEGANTOTA_USE_ASYNC_WEBSERVER=1   ; ElegantOTA chạy trên AsyncWebServer (main.cpp)

; Libraries
lib_deps =
  knolleary/PubSubClient@^2.8          ; MQTT client
  bblanchon/ArduinoJson@^7.0           ; JSON serialization
  ayushsharma82/ElegantOTA@^3.1        ; OTA update over WiFi
  4-20ma/ModbusMaster@^2.0.1           ; RS485 Modbus RTU master (5-sensor bus)
  dfrobot/DFRobotDFPlayerMini@^1.0.6   ; DFPlayer Mini (loa ru, ENV-FR-013b)

; Partition scheme for SPIFFS
board_build.partitions = min_spiffs.csv

; Tool quét Slave ID/baudrate RS485 độc lập (test_noise_rs485.cpp) — chạy với:
;   pio run -e modbus_scan -t upload && pio device monitor
[env:modbus_scan]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = -<*> +<test_noise_rs485.cpp>
lib_deps =
  4-20ma/ModbusMaster@^2.0.1

; Test environment (requires g++ on host)
[env:native]
platform = native
lib_deps =
  bblanchon/ArduinoJson@^7.0
