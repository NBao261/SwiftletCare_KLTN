; SwiftletCare ESP32 Firmware
; PlatformIO Configuration (Wokwi-compatible)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor speed
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; Build flags
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DCONFIG_FREERTOS_UNICORE=0

; Libraries
lib_deps =
  knolleary/PubSubClient@^2.8          ; MQTT client
  bblanchon/ArduinoJson@^7.0           ; JSON serialization
  ayushsharma82/ElegantOTA@^3.1        ; OTA update over WiFi
  4-20ma/ModbusMaster@^2.0.1           ; RS485 Modbus RTU master (5-sensor bus)
  dfrobot/DFRobotDFPlayerMini@^1.0.6   ; DFPlayer Mini (loa ru, ENV-FR-013b)

; Partition scheme for SPIFFS
board_build.partitions = min_spiffs.csv

; Test environment (requires g++ on host)
[env:native]
platform = native
lib_deps =
  bblanchon/ArduinoJson@^7.0
