# SwiftletCare AI Pipeline Configuration
# SRS: §9.2, §11.2, §11.3

camera:
  rtsp_url: "rtsp://admin:password@192.168.1.64:554/stream1"
  target_fps: 30
  resolution: [2560, 1440]   # 2K
  # Vùng đưa vào model, x1,y1,x2,y2 theo tỉ lệ khung hình. Lấy bằng tools/pick_roi.py (plan §6.8).
  # Đo 21/10/2026 trên khung 1920x1080 của VIGI C320I ở nhà yến thử nghiệm (plan §19.8): bao vòng đếm
  # thêm 150–340 px, bỏ dòng ngày giờ góc trái. Chọn tay, chốt lại khi có clip có chim.
  roi: [0.25, 0.00, 0.75, 0.70]

model:
  path: "models/swiftletcare_v1.onnx"
  input_size: 640            # YOLO input resolution
  confidence_threshold: 0.5
  nms_iou_threshold: 0.45
  classes:
    0: swiftlet
    1: rat
    2: snake
    3: owl
  predator_classes: [1, 2, 3]
  predator_confidence_min: 0.70    # THREAT-FR-001

tracking:
  algorithm: bytetrack           # primary (§11.3)
  track_confirmation_frames: 3   # min frames to confirm (THREAT-FR-003)
  max_active_tracks: 50
  # Vòng đếm khép kín quanh miệng lỗ ra vào, các điểm (x, y) theo tỉ lệ khung hình (plan §3.3 mục 6).
  # = viền ngoài hộp gỗ đo 21/10/2026 (±3 px) nới đều 60 px. 60 px là số chọn tay, phải ≥ max(cỡ chim,
  # 1,5 × quãng bay mỗi frame) — đo trên clip có chim rồi chạy lại tools/pick_roi.py --margin.
  ring:
    - [0.379, 0.228]
    - [0.527, 0.136]
    - [0.575, 0.277]
    - [0.569, 0.374]
    - [0.427, 0.477]
    - [0.386, 0.334]
  # Camera trong nhà nhìn vào lỗ: trong vòng là phía ngoài trời, nên chim đi vào vòng = RA (EXIT).
  # Camera đặt ngoài nhà nhìn vào lỗ thì đổi thành false.
  into_ring_is_exit: true

mqtt:
  broker: "localhost"
  port: 8883                     # TLS (SEC-NFR-001)
  username: "rpi-node-01"
  password: ""                   # loaded from env
  tls_ca_cert: "config/ca.crt"
  farm_id: ""                    # loaded from env
  house_id: ""
  zone_id: ""
  publish_interval_sec: 30       # VISION-FR-006

sessions:
  morning_exit:
    start: "05:30"
    end:   "07:00"
  evening_entry:
    start: "17:30"
    end:   "19:00"

storage:
  minio_endpoint: "localhost:9000"
  minio_bucket: "swiftletcare-snapshots"
  snapshot_dir: "/tmp/snapshots"

alerts:
  predator_temporal_filter_frames: 2   # THREAT-FR-003
  return_rate_drop_threshold: 0.20     # 20% drop triggers alert (VISION-FR-011)
  return_rate_window_days: 7

logging:
  level: INFO
  file: "logs/pipeline.log"
  rotation: "10 MB"
