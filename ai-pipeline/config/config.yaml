# SwiftletCare AI pipeline — cấu hình dev (docs/bird-counting-plan.md mục 6.2).
# Bí mật (RTSP URL có mật khẩu camera, MQTT, ID farm/house/zone/device) nằm trong .env, không ghi ở đây.
# Chạy từ thư mục ai-pipeline: mọi đường dẫn tương đối tính từ đó.

camera:
  source: "clips/sample.mp4"                # bị --source hoặc CAMERA_RTSP_URL trong .env ghi đè
  fps: 25                                   # phải bằng tốc độ thật của luồng: VIGI C320I đặt 25 fps (plan 19.3). ByteTrack dùng số này
  # TẠM, CHƯA CHỐT: cả khung hình. Chốt quanh miệng lỗ sau khi có clip phiên chiều (plan 19.7).
  roi: [0.0, 0.0, 1.0, 1.0]                 # x1,y1,x2,y2 theo tỉ lệ khung hình

model:
  path: "models/yolo26n.onnx"               # đổi thành models/swiftlet_v1.onnx sau GĐ2
  version: "yolo26n-coco"                   # gửi lên backend làm firmwareVersion trong heartbeat
  input_size: 640                           # phải bằng imgsz lúc export; hạ 480/416 nếu thiếu FPS (plan 18.4)
  confidence_threshold: 0.30                # hạ nếu sót nhiều, tăng nếu bắt nhầm (plan 6.8)
  nms_iou_threshold: 0.45                   # chỉ dùng với đầu ra kiểu YOLOv8n/YOLO11n; YOLO26n export nms=False không cần NMS
  providers: ["CPUExecutionProvider"]       # CPU Intel + onnxruntime-openvino: ["OpenVINOExecutionProvider", "CPUExecutionProvider"]
  classes:
    14: swiftlet                            # COCO bird. Model tự train: đổi thành  0: swiftlet

tracking:
  # TẠM, CHƯA CHỐT: chốt cùng ROI. Vạch cắt ngang đường bay, sát miệng lỗ (plan 3.3).
  line: [0.20, 0.45, 0.85, 0.45]            # 2 điểm của vạch đếm, theo tỉ lệ khung hình
  in_is_entry: true                         # chim bay ra mà số VAO tăng thì đổi thành false
  box_pad: 2.5                              # nới box trước khi track (chim nhỏ bay nhanh); camera 20 fps thì 3.0 (plan 19.3)
  lost_track_buffer: 15                     # số frame giữ dấu một con đã mất
  minimum_matching_threshold: 0.8

sessions:
  # Giờ Việt Nam cố định UTC+7 (không đổi giờ mùa hè), không dùng giờ máy: VPS thường chạy UTC.
  utc_offset_hours: 7
  windows:                                  # giờ chim bay đổi theo mùa: xem lại bằng biểu đồ số đếm 5 phút
    MORNING_EXIT:  ["05:30", "07:00"]
    EVENING_ENTRY: ["17:30", "19:00"]

mqtt:
  broker: "localhost"                       # cloud: tên miền của VPS; trong Docker trên VPS: emqx
  port: 1883                                # cloud: 8883
  tls: false                                # cloud: true
  publish_interval_sec: 30                  # số đếm của phiên + heartbeat (VISION-FR-006); backend coi im 90 giây là mất kết nối
  bucket_minutes: 5                         # số đếm theo khoảng, gửi cả ngoài phiên (VISION-FR-017)

push:                                       # đẩy hình đã vẽ khung lên MediaMTX; chỉ chạy khi có STREAM_PUSH_URL trong .env (plan 6.2, 15.6)
  width: 1280                               # thu từ 1080p để nén nhẹ CPU và băng thông người xem
  height: 720
  fps: 15                                   # chỉ là tốc độ phát cho người xem; việc đếm vẫn chạy đủ camera.fps
  bitrate: "1500k"

stream:                                     # MJPEG để hiệu chỉnh ROI/vạch đếm; chỉ nén ảnh khi có người đang xem
  host: "127.0.0.1"                         # chỉ máy này xem được; người xem từ xa đi qua MediaMTX
  port: 8090
  jpeg_quality: 70

logging:
  file: "logs/pipeline.log"
  rotation: "10 MB"
