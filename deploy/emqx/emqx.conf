# EMQX cho SwiftletCare (Report 4 D3, §7.2; NFR-10 d). Dev và staging dùng chung file này.
# Compose đặt địa chỉ xác thực kèm khoá bằng EMQX_AUTHENTICATION__1__URL, ghi đè giá trị `url` bên dưới
node {
  name = "emqx@127.0.0.1"
  cookie = "swiftletcare_secret"
  data_dir = "data"
}

cluster {
  name = swiftletcare
  discovery_strategy = manual
}

dashboard {
  listeners.http.bind = 18083
}

# Không khai báo nguồn nào cho phép ẩn danh: mọi kết nối phải qua backend
authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://backend:3000/internal/mqtt-auth"
    headers { "content-type" = "application/json" }
    body {
      username = "${username}"
      password = "${password}"
    }
    connect_timeout = 5s
    request_timeout = 5s
  }
]

authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    { type = file, enable = true, path = "etc/acl.conf" }
  ]
}
