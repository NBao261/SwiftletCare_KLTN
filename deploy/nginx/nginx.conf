# Nginx của staging (docs/deploy/staging.md §2.2). Site HTTPS ở conf.d/*.conf, TLS cho MQTT và RTSP ở conf.d/stream/,
# cả hai sinh từ templates/ với ${DOMAIN}.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    # Ảnh hiện trường của Work Order (tối đa 5 ảnh) và file âm thanh đi qua /api
    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Socket.io và WHEP cần nâng kết nối
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}

stream {
    include /etc/nginx/conf.d/stream/*.conf;
}
